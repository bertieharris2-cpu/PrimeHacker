<!DOCTYPE html>
<html lang="en" class="phase-build">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">

<meta charset="UTF-8" />
<title>Bank Blueprint Assembled</title>
<style>
  :root{
    --fill1: rgba(var(--accent-rgb), 0.65);
    --fill2: rgba(var(--accent-rgb), 0.45);
    --flow1: rgba(var(--accent-rgb), 0.55);
    --flow2: rgba(var(--accent-rgb), 0.30);
    --laser: rgba(var(--accent-rgb), 0.85);
    --lock: rgba(var(--accent-rgb), 0.80);
    --frame: rgba(var(--accent-rgb), 0.70);
    --text: rgba(235, 255, 248, 0.85);
    --text-muted: rgba(235, 255, 248, 0.55);
    --border: rgba(17, 75, 95, 0.40);
    --transition-fast: 120ms ease;
    --cell-border: 0.5px;
    --grid-gap: 1px;
  }

  body{
    margin:0;
    padding: 20px;
    background:
      radial-gradient(1200px 800px at 50% 40%, rgba(var(--accent-rgb), 0.06), transparent 50%),
      radial-gradient(900px 650px at 70% 75%, rgba(var(--accent-rgb), 0.04), transparent 60%),
      var(--bg-primary);
    color: var(--text);
    font-family: "Courier Prime", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    min-height: 100vh;
    overflow-y: auto;
  }

  body::before{
    content:"";
    position:fixed;
    inset:-40px;
    background:
      radial-gradient(600px 450px at 30% 25%, rgba(var(--accent-rgb), 0.08), transparent 65%),
      radial-gradient(700px 500px at 70% 75%, rgba(var(--accent-rgb), 0.06), transparent 70%);
    pointer-events:none;
    opacity:.85;
    filter: blur(8px);
    z-index: 0;
  }

  .container{
    position: relative;
    z-index: 1;
    max-width: 1000px;
    margin: 0 auto;
  }

  .blueprint-header{
    text-align: center;
    margin-bottom: 40px;
    padding: 20px;
    border: 1px solid var(--border);
    background: rgba(7, 20, 24, 0.55);
    box-shadow: 0 0 0 1px rgba(17, 75, 95, 0.20) inset;
  }

  .blueprint-header h1{
    margin: 0 0 10px 0;
    font-size: 24px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--laser);
    text-shadow: 0 0 12px rgba(var(--accent-rgb), 0.5);
  }

  .blueprint-header p{
    margin: 0;
    font-size: 12px;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .floors-container{
    display: flex;
    flex-direction: column;
    gap: 32px;
    perspective: 1200px;
    transform-style: preserve-3d;
    align-items: center;
  }

  .blueprint-wrapper{
    display: flex;
    gap: 32px;
    align-items: flex-start;
    justify-content: center;
    opacity: 0;
    animation: slideInFloor 0.8s ease-out 0.3s forwards;
  }

  .blueprint-labels{
    display: flex;
    flex-direction: column;
    gap: 54px;
    justify-content: flex-start;
  }

  .floor-label{
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 4px 0 4px 8px;
    border-left: 2px solid var(--laser);
    white-space: nowrap;
    line-height: 1.4;
  }

  .floor-label{ transition: opacity .3s ease, color .3s ease, border-color .3s ease; }
  .floor-label.waiting{ opacity:.35; }
  .floor-label.docking{ opacity:1; color:#ffe14d !important; border-color:rgba(255,225,77,.6) !important; }
  .floor-label .reinforced{ display:block; font-size:11px; letter-spacing:.14em; color:#ffc94d; margin-top:2px; }
  .assembly-status{ font-family:var(--font-mono); font-size:14px; letter-spacing:.08em; color:var(--text-muted); min-height:1.4em; text-align:center; margin-top:8px; }
  .floor-label .n-value{
    display: block;
    color: var(--laser);
    font-weight: bold;
    margin-top: 4px;
  }

  .blueprint-viewer-canvas{
    width: 600px;
    height: 600px;
    flex-shrink: 0;
    border: 1px solid var(--border);
    background: rgba(7, 20, 24, 0.55);
    box-shadow: inset 0 0 20px rgba(var(--accent-rgb), 0.05);
  }

  @keyframes slideInFloor{
    from{
      opacity: 0;
      transform: translateY(30px) scale(0.95);
    }
    to{
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .completion-section{
    margin-top: 40px;
    padding: 20px;
    text-align: center;
    border: 1px solid var(--border);
    background: rgba(7, 20, 24, 0.55);
    box-shadow: 0 0 0 1px rgba(17, 75, 95, 0.20) inset;
  }

  .completion-text{
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 0 0 16px 0;
  }

  .proceed-btn{
    padding: 10px 24px;
    background: rgba(var(--accent-rgb), 0.15);
    border: 1px solid var(--fill1);
    color: var(--fill1);
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 200ms ease;
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.2);
  }

  .proceed-btn:hover{
    background: rgba(var(--accent-rgb), 0.25);
    box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.4);
  }

  .error-message{
    text-align: center;
    padding: 40px 20px;
    color: rgba(255, 100, 100, 0.8);
    font-size: 12px;
    letter-spacing: 0.08em;
  }


.pn-powerup{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(4,14,17,.72); font-family:var(--font-ui); }
.pn-powerup div{ border:1px solid rgba(var(--accent-rgb),.6); background:rgba(9,32,38,.92); padding:22px 30px; text-align:center; letter-spacing:.16em; font-weight:700; color:var(--accent); animation:pnPulse 1.4s ease-in-out infinite; }
.pn-powerup small{ display:block; margin-top:8px; letter-spacing:.06em; font-weight:400; color:var(--text-muted); }
@keyframes pnPulse{ 50%{ box-shadow:0 0 24px rgba(var(--accent-rgb),.35); } }

/* ===== PRIMENET shared style (docs/STYLE.md). Keep this block last. ===== */
html, body{ background: var(--bg-primary) !important; }
body{ color: var(--text-primary); }
body::before{
  content: "" !important; position: fixed !important; inset: -60px !important; pointer-events: none !important;
  z-index: 0; filter: none !important; opacity: 1 !important; mix-blend-mode: normal !important; transform: none;
  animation: pnDrift 16s linear infinite alternate !important;
  background:
    radial-gradient(1100px 700px at 30% 15%, rgba(var(--accent-rgb), .08), transparent 60%),
    radial-gradient(1400px 900px at 75% 85%, rgba(20,120,130,.18), transparent 65%),
    repeating-linear-gradient(120deg, rgba(var(--accent-rgb), .06) 0 1px, transparent 2px 44px) !important;
}
button, h1, h2, h3, th, label, .pill, .hudPill, .hudBtn, [class*="title"], [class*="Title"]{ font-family: var(--font-ui); }
.proceed-btn{ color: var(--accent-hack) !important; border-color: rgba(var(--accent-hack-rgb),.7) !important; background: rgba(var(--accent-hack-rgb),.12) !important; }
</style>
</head>
<body>
  <div class="container">
    <div class="blueprint-header">
      <h1>Bank Blueprint Complete</h1>
      <p>Facility reconstruction successful — 3-floor structure assembled</p>
    </div>

    <div class="floors-container" id="floorsContainer">
      <!-- Floors will be populated by JavaScript -->
    </div>

    <div class="completion-section">
      <p class="completion-text">All vault structures decoded. Ready for access protocol initiation?</p>
      <button class="proceed-btn" id="proceedToHackBtn">Initiate Prime Hack Protocol</button>
    </div>
  </div>

  <!-- Three.js is included with the game so the 3D view works without internet -->
  <script src="../shared/vendor/three.min.js"></script>
  <script src="../shared/primenet.js"></script>
  <script src="../shared/testtools.js"></script>
  <script src="../shared/handler.js"></script>
  <script src="../shared/glitch.js"></script>
  <script src="../shared/sound.js"></script>
  <script>
    const PN = window.Primenet;
    const SND = (name, arg) => { if(window.PNSound) PNSound.play(name, arg); };
// Browsers only play sound after a key press on the page. If it isn't allowed yet, ask for one before the animation.
function powerUpPrompt(title){
  const ov = document.createElement("div");
  ov.className = "pn-powerup";
  ov.innerHTML = `<div>${title}<small>Press any key or click to continue</small></div>`;
  document.body.appendChild(ov);
  return () => ov.remove();
}

    // Load completed levels from localStorage
    let completed = JSON.parse(localStorage.getItem('blueprintProgress') || '[]');
    
    // Sample numbers are a teacher preview only. Students always see the floors they built.
    const DEMO_MODE = completed.length < 3 && !!(PN && PN.isTeacher());
    if(DEMO_MODE){
      completed = [12, 30, 60];  // Demo N values - change these to test different numbers
      console.log('🎯 Blueprint Viewer DEMO MODE - Using hardcoded N values:', completed);
    }
    
    if(completed.length < 3){
      // Not enough levels completed - show error
      document.getElementById('floorsContainer').innerHTML =
        `<div class="error-message">INSUFFICIENT VAULT DATA // ${completed.length} OF 3 FLOORS RECONSTRUCTED</div>`;
      const btn = document.getElementById('proceedToHackBtn');
      btn.textContent = 'Return to Factor Vault';
      btn.addEventListener('click', () => { window.location.href = 'factor_vault.html'; });
    } else {
      // Sort the completed N values: smallest to largest
      const sorted = [...completed].sort((a, b) => a - b);
      
      // Assign to floors: Floor 1 (ground/largest), Floor 2 (medium), Floor 3 (top/smallest)
      const floor1N = sorted[sorted.length - 1];  // Largest - Ground floor
      const floor2N = sorted[Math.floor(sorted.length / 2)] || sorted[1];  // Medium
      const floor3N = sorted[0];  // Smallest - Top floor
      
      const floors = [
        { label: 'FLOOR 3 — ROOF ACCESS', n: floor3N, yOffset: 36 },
        { label: 'FLOOR 2 — VAULT CHAMBER', n: floor2N, yOffset: 18 },
        { label: 'FLOOR 1 — SECURITY CORE (GROUND)', n: floor1N, yOffset: 0 }
      ];
      
      const container = document.getElementById('floorsContainer');
      
      // Create wrapper for labels + canvas side-by-side
      const wrapper = document.createElement('div');
      wrapper.className = 'blueprint-wrapper';
      
      // Create labels column (left side)
      const labelsCol = document.createElement('div');
      labelsCol.className = 'blueprint-labels';
      floors.forEach((floor) => {
        const labelEl = document.createElement('div');
        labelEl.className = 'floor-label';
        const sq = Number.isInteger(Math.sqrt(floor.n));
        labelEl.className = 'floor-label waiting';
        labelEl.dataset.n = floor.n;
        labelEl.innerHTML = `${floor.label}<span class="n-value">N=${floor.n}</span>${sq ? `<span class="reinforced">REINFORCED · ${Math.sqrt(floor.n)} × ${Math.sqrt(floor.n)}</span>` : ""}`;
        labelsCol.appendChild(labelEl);
      });
      wrapper.appendChild(labelsCol);
      
      // Create single shared 3D canvas container (right side)
      const canvasContainer = document.createElement('div');
      canvasContainer.className = 'blueprint-viewer-canvas';
      wrapper.appendChild(canvasContainer);
      
      container.appendChild(wrapper);
      const status = document.createElement('div');
      status.className = 'assembly-status'; status.id = 'assemblyStatus';
      container.appendChild(status);
      
      if(PN && !DEMO_MODE) PN.log("blueprint", { floors: sorted });

      // Initialize shared Three.js scene with all floors
      // Wait for sound to be allowed, then build: a pop per box, and a chord when the bank is complete
      (window.PNSound ? PNSound.whenUnlocked(() => powerUpPrompt("ASSEMBLE THE BLUEPRINT")) : Promise.resolve()).then(() => {
        const t = document.querySelector("h1"); if(t && PN) t.textContent = `${PN.mission().target}: assembling`;
        initializeSharedScene(floors, canvasContainer).then(() => {
          SND("success");
          if(t && PN) t.textContent = `${PN.mission().target}: blueprint complete`;
          if(window.PNHandler) PNHandler.once("blueprint", "There it is: {target}, all three floors in one building. The vault is sealed with prime locks. Time to crack them.", { delay: 900 });
        });
      });
      
      // Proceed button handler
      if(window.PNTest) PNTest.add("Continue to Prime Hack", () => { window.location.href = "prime_hack.html"; });
      document.getElementById('proceedToHackBtn').addEventListener('click', () => {
        // Clear blueprint progress
        localStorage.removeItem('blueprintProgress');
        // Navigate to prime_hack game
        (window.PNGlitch ? PNGlitch.go('prime_hack.html') : (location.href = 'prime_hack.html'));
      });
    }

    // ---------- Assembly animation ----------
    // The three floors appear side by side as separate blueprints, then fly in one at a time,
    // ground floor first, and lock together into one building. The outer shell rises last.
    const speedUp = () => (window.PNTest ? PNTest.speed() : 1);
    const easeInOut = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const easeOutBack = p => { const c = 1.4; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
    function tween(ms, fn, ease = easeInOut){
      ms = ms / speedUp();
      return new Promise(done => {
        const start = performance.now();
        (function step(now){
          const p = Math.min(1, (now - start) / ms);
          fn(ease(p), p);
          if(p < 1) requestAnimationFrame(step); else done();
        })(start);
      });
    }
    const wait = ms => new Promise(r => setTimeout(r, ms / speedUp()));
    const reduced = () => !!(PN && PN.reducedMotion && PN.reducedMotion());
    function say(text){ const el = document.getElementById('assemblyStatus'); if(el) el.textContent = text; }

    function initializeSharedScene(floors, container){
      const width = container.clientWidth;
      const height = container.clientHeight;
      const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio || 1);
      renderer.setSize(width, height);
      renderer.domElement.style.width = '100%';
      renderer.domElement.style.height = '100%';
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, width / height, 1, 4000);
      const CAM_FINAL = { pos: new THREE.Vector3(150, 75, 350), look: new THREE.Vector3(0, 18, 0) };
      const CAM_WIDE  = { pos: new THREE.Vector3(120, 150, 520), look: new THREE.Vector3(0, 55, 0) };
      const camLook = CAM_WIDE.look.clone();
      camera.position.copy(CAM_WIDE.pos); camera.lookAt(camLook);

      scene.add(new THREE.AmbientLight(0xaaffee, 0.45));
      const dir = new THREE.DirectionalLight(0xaaffee, 0.6);
      dir.position.set(0.5, 1, 0.2);
      scene.add(dir);

      const mainGroup = new THREE.Group();
      scene.add(mainGroup);

      // Normalise all floors to the same visual size: larger N means smaller boxes
      const maxN = Math.max(...floors.map(f => f.n));
      const scales = {};
      floors.forEach(f => { scales[f.n] = Math.sqrt(maxN / f.n); });

      let maxExtentX = 0, maxExtentZ = 0;
      floors.forEach(floor => {
        layoutFor(floor.n, scales[floor.n]).forEach(b => {
          maxExtentX = Math.max(maxExtentX, Math.abs(b.x) + b.w / 2);
          maxExtentZ = Math.max(maxExtentZ, Math.abs(b.z) + b.d / 2);
        });
      });

      // One group per floor. Boxes sit at their final height; the group moves.
      const floorGroups = floors.map(floor => {
        const g = buildFloor(floor.n, floor.yOffset, scales[floor.n], maxExtentX, maxExtentZ);
        mainGroup.add(g.group);
        return { ...floor, ...g };
      });

      // The outer shell and the dividing grids, hidden until the floors are in
      const boxHeight = 18;
      const cuboidBottomY = floors[2].yOffset, cuboidTopY = floors[0].yOffset + boxHeight;
      const totalHeight = cuboidTopY - cuboidBottomY, centerY = (cuboidBottomY + cuboidTopY) / 2;
      const shell = new THREE.Group();
      const edgeMat = new THREE.LineBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.2 });
      const wire = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(maxExtentX * 2, totalHeight, maxExtentZ * 2)), edgeMat);
      wire.position.y = totalHeight / 2;
      shell.add(wire);
      shell.position.y = centerY + 9 - totalHeight / 2;
      shell.scale.y = 0.001; shell.visible = false;
      mainGroup.add(shell);

      const gridReferences = [];
      const cw = maxExtentX * 2, cd = maxExtentZ * 2, big = Math.max(cw, cd), bottomY = (centerY + 9) - totalHeight / 2;
      [0, 1, 2].forEach(k => {
        const grid = new THREE.GridHelper(big, 16, 0x00ffcc, 0x003844);
        grid.position.y = bottomY + totalHeight / 3 * k;
        grid.scale.set(cw / big, 1, cd / big);
        grid.material.transparent = true; grid.material.opacity = 0;
        grid.visible = false;
        mainGroup.add(grid); gridReferences.push(grid);
      });

      // A beacon on the roof, and a ring that flashes when a floor locks in
      const beacon = new THREE.Mesh(new THREE.SphereGeometry(2.2, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff4f6d }));
      beacon.position.y = cuboidTopY + 12; beacon.visible = false;
      mainGroup.add(beacon);
      function ring(y, color = 0x00ffcc){
        const m = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 64), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, side: THREE.DoubleSide }));
        m.rotation.x = -Math.PI / 2; m.position.y = y; mainGroup.add(m);
        const r0 = Math.max(maxExtentX, maxExtentZ);
        tween(700, (e) => { m.scale.setScalar(r0 * (0.6 + e * 1.1)); m.material.opacity = 0.9 * (1 - e); }).then(() => mainGroup.remove(m));
      }

      // ---- render loop ----
      let spinning = false, rotationY = 0, scanTime = 0, t0 = performance.now();
      function animate(now){
        if(spinning){ rotationY += 0.0012; mainGroup.rotation.y = rotationY; }
        scanTime += 0.008;
        const scanY = ((Math.sin(scanTime) + 1) / 2) * 54;
        if(shell.visible) gridReferences.forEach(grid => {
          grid.material.opacity = (Math.max(0, 1 - Math.abs(grid.position.y - scanY) / 12) * 0.8 + 0.05) * grid.userData.fade;
        });
        if(beacon.visible) beacon.material.opacity = beacon.scale.x = beacon.scale.y = beacon.scale.z = 0.8 + 0.4 * Math.abs(Math.sin((now - t0) / 350));
        camera.lookAt(camLook);
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      gridReferences.forEach(g => g.userData.fade = 0);
      requestAnimationFrame(animate);

      function onResize(){
        const w = container.clientWidth, h = container.clientHeight;
        renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
      }
      window.addEventListener('resize', onResize);

      const labelFor = n => document.querySelector(`.floor-label[data-n="${n}"]`);
      const order = [floorGroups[2], floorGroups[1], floorGroups[0]];   // ground floor first

      // Final positions straight away when motion is reduced
      if(reduced()){
        floorGroups.forEach(f => { f.boxes.forEach(b => b.scale.set(1, 1, 1)); labelFor(f.n)?.classList.remove('waiting'); });
        shell.visible = true; shell.scale.y = 1; gridReferences.forEach(g => { g.visible = true; g.userData.fade = 1; }); beacon.visible = true;
        camera.position.copy(CAM_FINAL.pos); camLook.copy(CAM_FINAL.look); spinning = true;
        say('Blueprint assembled.');
        return Promise.resolve();
      }

      return (async () => {
        // 1. An exploded view: each floor slides in at its own height, well apart, and fills with rooms
        const GAP = 50;
        say('Decrypting floor plans…');
        for(const [k, f] of order.entries()){
          labelFor(f.n)?.classList.remove('waiting');
          f.group.position.set(-420, k * GAP, 0);
          SND("laser");
          tween(600, e => { f.group.position.x = -420 * (1 - e); });
          f.boxes.forEach((mesh, i) => setTimeout(() => {
            SND("pop", i);
            tween(420, e => mesh.scale.set(Math.max(.01, e), Math.max(.01, e), Math.max(.01, e)), easeOutBack);
          }, (300 + i * 70) / speedUp()));
          await wait(300 + f.boxes.length * 70 + 250);
        }
        await wait(500);

        // 2. The ground floor powers up, then each floor above drops and locks onto the one below
        for(const [k, f] of order.entries()){
          const label = labelFor(f.n);
          label?.classList.add('docking');
          say(k === 0 ? `Ground floor locked · N=${f.n}` : `Docking ${f.label.split('—')[0].trim().toLowerCase()} · N=${f.n}`);
          if(k > 0){
            const top = f.group.position.y;
            await tween(560, e => { f.group.position.y = top * (1 - e); }, p => p * p);
          }
          f.group.position.set(0, 0, 0);
          SND("dock"); ring(f.yOffset + 0.5, f.square ? 0xffc94d : 0x00ffcc);
          label?.classList.remove('docking');
          await wait(320);
        }

        // 3. The shell rises around the building, the camera swings round, the beacon lights
        say('Sealing the structure…');
        shell.visible = true; gridReferences.forEach(g => g.visible = true);
        const camFrom = camera.position.clone(), lookFrom = camLook.clone();
        await Promise.all([
          tween(900, e => { shell.scale.y = Math.max(0.001, e); edgeMat.opacity = 0.2 + 0.3 * (1 - e); gridReferences.forEach(g => g.userData.fade = e); }),
          tween(1400, e => { camera.position.lerpVectors(camFrom, CAM_FINAL.pos, e); camLook.lerpVectors(lookFrom, CAM_FINAL.look, e); }),
        ]);
        beacon.visible = true; beacon.material.transparent = true;
        spinning = true;
        say(`${PN ? PN.mission().target.toUpperCase() : 'TARGET'} // STRUCTURE ASSEMBLED`);
      })();
    }

    // Where each factor-pair room sits on its floor (shared by the sizing pass and the build)
    function layoutFor(n, scale){
      const pairs = getFactorPairs(n);
      const cols = Math.min(6, Math.max(1, Math.ceil(Math.sqrt(pairs.length))));
      const rows = Math.ceil(pairs.length / cols);
      const spacing = (36 + 8) * scale;
      return pairs.map(([a, b], i) => {
        let w = Math.max(12, b * 4) * scale, d = Math.max(6, a * 4) * scale;
        if(a === 1 && b > 1) w = Math.min(w, d * 2.5);
        const col = i % cols, row = Math.floor(i / cols);
        return { a, b, w, d, x: (col - (cols - 1) / 2) * spacing, z: -(row - (rows - 1) / 2) * spacing };
      });
    }

    function buildFloor(n, yOffset, scale, maxExtentX, maxExtentZ){
      const group = new THREE.Group();
      const boxHeight = 18, boxes = [];
      const square = Number.isInteger(Math.sqrt(n));
      // The floor plate: a faint slab under the rooms so each floor reads as one level
      const plate = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(maxExtentX * 2, 0.6, maxExtentZ * 2)),
        new THREE.LineBasicMaterial({ color: square ? 0xffc94d : 0x4aa3ff, transparent: true, opacity: 0.5 }));
      plate.position.y = yOffset + 0.3;
      group.add(plate);

      layoutFor(n, scale).forEach(r => {
        // A square pair (6 × 6) is the reinforced strongroom: gold edges
        const strong = r.a === r.b;
        const color = 0x00ff99;
        const geom = new THREE.BoxGeometry(r.w, boxHeight, r.d);
        const mesh = new THREE.Mesh(geom, new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.25, transparent: true, opacity: strong ? 0.24 : 0.16 }));
        mesh.add(new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: strong ? 0xffc94d : 0x00ffcc })));
        mesh.position.set(r.x, yOffset + boxHeight / 2, r.z);
        mesh.scale.set(0.01, 0.01, 0.01);
        group.add(mesh); boxes.push(mesh);
      });
      return { group, boxes, square };
    }

    function getFactorPairs(n){
      const pairs = [];
      for(let a = 1; a * a <= n; a++){
        if(n % a === 0){
          pairs.push([a, n / a]);
        }
      }
      return pairs;
    }
  </script>
