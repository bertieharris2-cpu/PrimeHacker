
<!DOCTYPE html>
<html lang="en" class="phase-build">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">

<meta charset="UTF-8" />
<title>Vault Laser Grid Demo — N=18 (v2 random layout + staggered concurrency)</title>
<style>
  :root{
    /* Original mix: green power fill, blue lasers and flow, teal locked borders */
    --fill1: rgba(var(--accent-hack-rgb), 0.65);
    --fill2: rgba(var(--accent-hack-rgb), 0.45);
    --flow1: rgba(var(--accent-rgb), 0.55);
    --flow2: rgba(var(--accent-rgb), 0.30);
    --laser: rgba(var(--accent-rgb), 0.85);
    --lock: rgba(0, 215, 184, 0.80);
    --frame: rgba(var(--accent-hack-rgb), 0.70);
    --text: rgba(235, 255, 248, 0.85);
    --text-muted: rgba(235, 255, 248, 0.55);
    --border: rgba(17, 75, 95, 0.40);
    --transition-fast: 120ms ease;
    --cell-border: 0.5px;
    --grid-gap: 1px;
  }

  body{
    margin:0;
    background:
      radial-gradient(1200px 800px at 50% 40%, rgba(var(--accent-rgb), 0.06), transparent 50%),
      radial-gradient(900px 650px at 70% 75%, rgba(var(--accent-rgb), 0.04), transparent 60%),
      var(--bg-primary);
    color: var(--text);
    font-family: "Courier Prime", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    overflow:hidden;
  }

  body::before{
    content:"";
    position:fixed;
    inset:-40px;
    background:
      radial-gradient(600px 450px at 30% 25%, rgba(var(--accent-rgb), 0.08), transparent 65%),
      radial-gradient(700px 500px at 70% 75%, rgba(var(--accent-rgb), 0.06), transparent 70%);
    pointer-events:none;
    opacity:.85;
    filter: blur(8px);
  }

  .wrap{ width:min(1180px, 98vw); position:relative; z-index:1; }
  .title{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin:0 0 10px 0;
    letter-spacing:.12em;
    text-transform:uppercase;
    font-size:12px;
    opacity:.85;
    color: var(--text-muted);
  }

  .stage{
    position:relative;
    padding:68px;
    border: 0.5px solid var(--border);
    background: rgba(7, 20, 24, 0.55);
    box-shadow: 0 0 0 1px rgba(17, 75, 95, 0.20) inset;
    perspective:50000px;
  }

  .vault{
    position:relative;
    width:min(610px, 90vw);
    aspect-ratio:1/1;
    margin:0 auto;
    border: 1.5px solid rgba(var(--accent-rgb), 0.50);
    padding:18px;
    box-sizing:border-box;
    background: rgba(6,16,20, 0.80);
    backdrop-filter: blur(4px);
    box-shadow:
      0 0 0 1px rgba(17, 75, 95, 0.35) inset,
      0 16px 60px rgba(0, 0, 0, 0.50);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(19,1fr);
    grid-template-rows:repeat(19,1fr);
    gap:var(--grid-gap);
    width:100%;
    height:100%;
    position:relative;
    z-index:1;
  }

  .cell{
    position:relative;
    background-color: rgba(6,16,20, 0.75);
    border: var(--cell-border) solid rgba(17, 75, 95, 0.2);
    box-sizing:border-box;
    transition: background-color .9s ease, border-color .9s ease;
  }
  /* Round 17 (Bertie: smoother build): each room's squares fade and grow in, eased, one flowing wave from
     the outside in, instead of stepping on one at a time. The colour sits on ::after so it can animate. */
  .cell::after{
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0; transform:scale(.35);
    background:linear-gradient(180deg, var(--fill1), var(--fill2));
    box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.20), 0 0 0 0.5px rgba(255,255,255,.08) inset;
  }
  .cell.on::after{ animation: cellFill var(--fd, 520ms) cubic-bezier(.22,.9,.3,1) var(--d, 0ms) both; }
  .cell.on.instant::after{ animation:none; opacity:1; transform:none; filter:none; }
  @keyframes cellFill{
    0%{ opacity:0; transform:scale(.35); filter:hue-rotate(55deg) brightness(1.9); }
    55%{ opacity:1; transform:scale(1.06); filter:hue-rotate(28deg) brightness(1.35); }
    100%{ opacity:1; transform:none; filter:none; }
  }
  .cell.flow{
    background:linear-gradient(180deg, var(--flow1), var(--flow2));
    box-shadow:
      0 0 10px rgba(var(--accent-rgb), 0.25),
      0 0 0 0.5px rgba(255,255,255,.06) inset;
  }

  svg.overlay{ position:absolute; inset:18px; pointer-events:none; z-index:4; }
  /* Round 6 */
  .stage{ padding:56px 190px !important; }
  .cell.hall{ background-color:rgba(36,98,110,.18); border-color:rgba(74,163,255,.10); }
  .plotBar{ position:absolute; left:10px; right:10px; top:18px; height:2px; z-index:6; pointer-events:none; background:#bfe6ff;
    box-shadow:0 0 10px 2px rgba(110,190,255,.85), 0 0 36px 8px rgba(74,163,255,.35); animation:plotSweep 2.6s ease-in-out infinite alternate; transition:opacity .4s ease; }
  .plotBar::after{ content:""; position:absolute; left:0; right:0; top:2px; height:60px; background:linear-gradient(rgba(110,190,255,.12), transparent); }
  @keyframes plotSweep{ from{ top:18px; } to{ top:calc(100% - 20px); } }
  .plotBar{ opacity:0; }
  .plotBar.on{ opacity:1; }
  .plotBar.off{ opacity:0; }
  svg.labels .lblIn{ animation: lblIn .8s ease-out both; }
  @keyframes lblIn{ from{ opacity:0; } to{ opacity:1; } }
  .gridTags{ position:fixed; inset:0; pointer-events:none; z-index:55; }
  .gridTag{ position:absolute; transform:translate(-50%,-50%); white-space:nowrap; font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.08em;
    color:#dffff4; background:rgba(3,22,20,.82); border:1px solid rgba(60,255,200,.6); padding:2px 8px; line-height:1.3; }
  .gridTag small{ font-family:var(--font-mono); font-weight:400; color:#9fe8d2; margin-left:6px; letter-spacing:0; font-size:12px; }
  .gridTag.hot{ background:rgba(60,35,0,.9); border-color:#ffc94d; color:#ffe7a8; }
  .gridTag.hot small{ color:#ffd98a; }
  .gridTag.exit{ border-color:#78ffbe; color:#a0ffd2; }
  @media (max-width:1100px){ .stage{ padding:56px 120px !important; } }
  svg.scan{ position:absolute; inset:18px; pointer-events:none; z-index:2; opacity:.60; mix-blend-mode:screen; }
  svg.labels{ position:absolute; inset:0; pointer-events:none; z-index:10; }

  .legend{
    margin-top:10px;
    display:flex;
    gap:18px;
    font-size:12px;
    opacity:.80;
    color: var(--text-muted);
  }
  .sw{ display:inline-block; width:10px;height:10px; margin-right:8px; border:0.5px solid rgba(255,255,255,.25); transform:translateY(1px); }
  .hint{ margin-top:6px; font-size:11px; opacity:.65; letter-spacing:.05em; color: var(--text-muted);}
  .btnRow{ margin-top:10px; display:flex; gap:10px; align-items:center; }
  button{
    font:inherit;
    color: var(--text);
    border: 0.75px solid var(--border);
    background: rgba(6,16,20, 0.60);
    padding:6px 10px;
    cursor:pointer;
    transition: background var(--transition-fast), border-color var(--transition-fast);
  }
  button:hover{
    background: rgba(17, 75, 95, 0.40);
    border-color: rgba(var(--accent-rgb), 0.50);
  }
  .next-floor-btn{
    background: linear-gradient(135deg, rgba(var(--accent-rgb),.2), rgba(var(--accent-rgb),.15));
    border-color: rgba(var(--accent-rgb),.5);
    color: rgba(var(--accent-rgb),.9);
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .next-floor-btn:hover{
    background: linear-gradient(135deg, rgba(var(--accent-rgb),.3), rgba(var(--accent-rgb),.25));
    border-color: rgba(var(--accent-rgb),.8);
    box-shadow: 0 0 12px rgba(var(--accent-rgb),.3);
  }
  .mini{ font-size:11px; opacity:.65; color: var(--text-muted); }

  .sweep{
    fill:url(#sweepGrad);
    opacity:.23;
    animation:sweepY 4.4s linear infinite;
  }
  @keyframes sweepY{
    0%{ transform:translateY(-30%); }
    100%{ transform:translateY(130%); }
  }

  /* 3D Vault Tilt System */
  .vault{
    transform-style:preserve-3d;
    transition:none;
  }

  .vault.tilting-to-iso{
    animation:tiltToIsometric 1000ms cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
  }

  @keyframes tiltToIsometric{
    0%{
      transform:rotateX(0deg) rotateZ(0deg) scale(1);
    }
    100%{
      transform:rotateX(65deg) rotateZ(-18deg) scale(1.18);
    }
  }

  .vault3d-wrap{
    position:absolute;
    display:none;
    pointer-events:none;
    z-index:25;
    inset:0;
  }

  #vault3d{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    opacity:0;
    transform: none;              /* IMPORTANT: no extra tilt */
    transform-origin: 50% 50%;
  }


.pn-powerup{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(4,14,17,.72); font-family:var(--font-ui); }
.pn-powerup div{ border:1px solid rgba(var(--accent-rgb),.6); background:rgba(9,32,38,.92); padding:22px 30px; text-align:center; letter-spacing:.16em; font-weight:700; color:var(--accent); animation:pnPulse 1.4s ease-in-out infinite; }
.pn-powerup small{ display:block; margin-top:8px; letter-spacing:.06em; font-weight:400; color:var(--text-muted); }
@keyframes pnPulse{ 50%{ box-shadow:0 0 24px rgba(var(--accent-rgb),.35); } }

/* ===== Round 3 group 3: drone flythrough ===== */
.droneHud{ position:fixed; z-index:60; pointer-events:none; font-family:var(--font-mono); color:#d9fff0; }
.droneHud .corner{ position:absolute; width:26px; height:26px; border:2px solid rgba(255,255,255,.75); }
.droneHud .tl{ left:10px; top:10px; border-right:0; border-bottom:0; } .droneHud .tr{ right:10px; top:10px; border-left:0; border-bottom:0; }
.droneHud .bl{ left:10px; bottom:10px; border-right:0; border-top:0; } .droneHud .br{ right:10px; bottom:10px; border-left:0; border-top:0; }
.droneHud .cross{ position:absolute; left:50%; top:50%; width:44px; height:44px; margin:-22px 0 0 -22px; border:1px solid rgba(255,255,255,.6); border-radius:50%; }
.droneHud .cross::before, .droneHud .cross::after{ content:""; position:absolute; background:rgba(255,255,255,.6); }
.droneHud .cross::before{ left:50%; top:-10px; bottom:-10px; width:1px; } .droneHud .cross::after{ top:50%; left:-10px; right:-10px; height:1px; }
.droneHud .top{ position:absolute; left:46px; top:18px; font-size:13px; letter-spacing:.12em; }
.droneHud .top .rec{ color:#ff4f6d; }
.droneHud .alt{ position:absolute; right:46px; top:18px; font-size:13px; letter-spacing:.1em; text-align:right; }
.droneHud .log{ position:absolute; left:46px; bottom:18px; font-size:14px; line-height:1.5; text-shadow:0 0 6px #000; }
.droneHud .log .strong{ color:#ffc94d; }
.droneHud .vign{ position:absolute; inset:0; box-shadow:inset 0 0 120px rgba(0,0,0,.75); }

/* Round 17: the hack into the next floor happens here, straight after the build, in a big box */
body .pnm-type.big-hack .box{ width:min(1180px, 94vw); padding:22px 26px; gap:14px; }
body .pnm-type.big-hack .hd{ font-size:20px; }
body .pnm-type.big-hack .stream{ height:min(38vh, 400px); overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end;
  font-family:"Courier Prime", monospace; font-size:16px; line-height:1.45; color:rgba(125,255,196,.42); border-bottom:1px solid rgba(47,191,138,.25); padding-bottom:8px; white-space:nowrap; }
body .pnm-type.big-hack .stream div{ flex:0 0 auto; overflow:hidden; }
body .pnm-type.big-hack .stream b{ color:#ffe68a; font-weight:400; }
body .pnm-type.big-hack .code{ height:min(22vh, 220px); font-size:24px; line-height:1.35; }
body .pnm-type.big-hack .meter{ height:20px; }
body .pnm-type.big-hack .hint{ font-size:22px; }
.moving{ position:fixed; inset:0; z-index:9460; display:flex; align-items:center; justify-content:center; background:rgba(1,8,12,.95); opacity:0; transition:opacity .3s ease; }
.moving.on{ opacity:1; }
.moving b{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:clamp(28px, 3.4vw, 54px); letter-spacing:.12em; color:#7dffc4; text-shadow:0 0 30px rgba(47,191,138,.6); text-align:center; padding:0 20px; }

/* ===== PRIMENET shared style (docs/STYLE.md). Keep this block last. ===== */
html, body{ background: var(--bg-primary) !important; }
body{ color: var(--text-primary); }
body::before{
  content: "" !important; position: fixed !important; inset: -60px !important; pointer-events: none !important;
  z-index: 0; filter: none !important; opacity: 1 !important; mix-blend-mode: normal !important; transform: none;
  animation: pnDrift 16s linear infinite alternate !important;
  background:
    radial-gradient(1100px 700px at 30% 15%, rgba(var(--accent-rgb), .08), transparent 60%),
    radial-gradient(1400px 900px at 75% 85%, rgba(20,120,130,.18), transparent 65%),
    repeating-linear-gradient(120deg, rgba(var(--accent-rgb), .06) 0 1px, transparent 2px 44px) !important;
}
button, h1, h2, h3, th, label, .pill, .hudPill, .hudBtn, [class*="title"], [class*="Title"]{ font-family: var(--font-ui); }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">
    <div>VAULT GRID: 19×19</div>
    <div>TARGET: N=18</div>
  </div>

  <div class="stage" id="stage">
    <div class="vault" id="vault">
      <div id="grid" class="grid"></div>
      <div class="iso-overlay-container" id="isoOverlayContainer"></div>
      <div class="vault3d-wrap">
        <canvas id="vault3d"></canvas>
      </div>

      <svg class="scan" viewBox="0 0 100 100" preserveAspectRatio="none">
        <defs>
          <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="rgba(74, 163, 255, 0)"></stop>
            <stop offset="40%" stop-color="rgba(74, 163, 255, 0.40)"></stop>
            <stop offset="60%" stop-color="rgba(74, 163, 255, 0.40)"></stop>
            <stop offset="100%" stop-color="rgba(74, 163, 255, 0)"></stop>
          </linearGradient>
        </defs>
        <rect class="sweep" x="0" y="-25" width="100" height="22"></rect>
      </svg>

      <svg id="laserOverlay" class="overlay" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>

    <svg id="labelOverlay" class="labels"></svg>
  </div>

  <div class="legend">
    <div><span class="sw" style="background:var(--accent-hack)"></span>Room: one factor pair</div>
    <div><span class="sw" style="background:rgba(40,110,120,.6)"></span>Corridors and open floor</div>
    <div><span class="sw" style="background:#ffbe5a"></span>Door</div>
    <div><span class="sw" style="background:#2fbf8a"></span>Fire exit</div>
  </div>
  <div class="hint">Now uses a random non-overlapping layout each run, and arrays animate with staggered overlap (smoother, less “one-by-one”).</div>

  <div class="btnRow">
    <label style="display:flex; gap:8px; align-items:center; font-size:12px;">
      TARGET N =
      <select id="nSelect" style="padding:4px 6px; font-family:inherit; color:inherit; background:rgba(6,16,20,.45); border:1px solid rgba(var(--accent-rgb),.45);">
        <optgroup label="L1 (Easy)">
          <option value="12">12</option>
          <option value="18" selected>18</option>
          <option value="20">20</option>
          <option value="24">24</option>
        </optgroup>
        <optgroup label="L2 (Medium)">
          <option value="30">30</option>
          <option value="36">36</option>
          <option value="42">42</option>
          <option value="48">48</option>
        </optgroup>
        <optgroup label="L3 (Hard)">
          <option value="60">60</option>
          <option value="72">72</option>
          <option value="84">84</option>
          <option value="100">100</option>
        </optgroup>
      </select>
    </label>
    <button id="initBtn">INIT</button>
    <button id="rerunBtn">RERUN (new layout)</button>
    <button id="view3dBtn" style="background: linear-gradient(135deg, rgba(var(--accent-rgb),.15), rgba(var(--accent-rgb),.15)); border-color: rgba(var(--accent-rgb),.45); color: rgba(var(--accent-rgb),.85);">3D VIEW</button>
    <button id="exit3dBtn" style="display:none; background: linear-gradient(135deg, rgba(255,100,0,.15), rgba(255,163,74,.15)); border-color: rgba(255,100,0,.45); color: rgba(255,100,0,.85);">EXIT 3D</button>
    <span class="mini" id="seedInfo"></span>
  </div>

  <!-- 3D Extrusion Mode Selector (hidden by default) -->
  <div id="extrusionModePanel" style="display:none; margin-top:12px; padding:10px; border:1px solid rgba(var(--accent-rgb),0.35); background:rgba(7,20,24,0.6); border-radius: 0;">
    <div style="font-size:11px; opacity:0.75; margin-bottom:8px; letter-spacing:0.05em; text-transform:uppercase;">EXTRUSION DIRECTION:</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;">
      <button id="mode1Btn" style="flex:1; min-width:160px; background:rgba(6,16,20,0.6); border-color:rgba(var(--accent-rgb),0.35); color:rgba(200,200,200,0.85);">Mode 1: -60°</button>
      <button id="mode2Btn" style="flex:1; min-width:160px; background:rgba(6,16,20,0.6); border-color:rgba(var(--accent-rgb),0.35); color:rgba(200,200,200,0.85);">Mode 2: -90°</button>
      <button id="mode3Btn" style="flex:1; min-width:160px; background:linear-gradient(135deg,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.15)); border-color:rgba(var(--accent-rgb),.6); color:rgba(var(--accent-rgb),.9); font-weight:600;">Mode 3: -75°</button>
    </div>
    <div style="font-size:11px; opacity:0.75; margin-bottom:8px; letter-spacing:0.05em; text-transform:uppercase;">VAULT TILT:</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="tilt60Btn" style="flex:1; min-width:160px; background:rgba(6,16,20,0.6); border-color:rgba(var(--accent-rgb),0.35); color:rgba(200,200,200,0.85);">Tilt 60°</button>
      <button id="tilt65Btn" style="flex:1; min-width:160px; background:linear-gradient(135deg,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.15)); border-color:rgba(var(--accent-rgb),.6); color:rgba(var(--accent-rgb),.9); font-weight:600;">Tilt 65°</button>
      <button id="tilt70Btn" style="flex:1; min-width:160px; background:rgba(6,16,20,0.6); border-color:rgba(var(--accent-rgb),0.35); color:rgba(200,200,200,0.85);">Tilt 70°</button>
      <button id="tilt75Btn" style="flex:1; min-width:160px; background:rgba(6,16,20,0.6); border-color:rgba(var(--accent-rgb),0.35); color:rgba(200,200,200,0.85);">Tilt 75°</button>
    </div>
  </div>
</div>

<script src="../shared/story.js"></script>

<script src="../shared/primenet.js"></script>
<script src="../shared/mode.js"></script>
<script src="../shared/badges.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twistslot.js"></script>
<script src="../shared/glitch.js"></script>
<script src="../shared/holo.js"></script>
<script src="../shared/sound.js"></script>
<script>
const PN = window.Primenet;
const SND = (name, arg) => { if(window.PNSound) PNSound.play(name, arg); };
let fillCount = 0;
// Browsers only play sound after a key press on the page. If it isn't allowed yet, ask for one before the animation.
function powerUpPrompt(title){
  const ov = document.createElement("div");
  ov.className = "pn-powerup";
  ov.innerHTML = `<div>${title}<small>Press any key or click to continue</small></div>`;
  document.body.appendChild(ov);
  return () => ov.remove();
}

const TEACHER = !!(PN && PN.isTeacher());   // layout and 3D test controls are teacher-only
const FLOORS_NEEDED = 3;
function floorsBuilt(){ try{ return JSON.parse(localStorage.getItem('blueprintProgress') || '[]').length; }catch(e){ return 0; } }

// Curated N values by difficulty
const VALID_N = {
  L1: [12, 18, 20, 24],
  L2: [30, 36, 42, 48],
  L3: [60, 72, 84, 100]
};

let GRID = 19;
let STEP = 100/GRID;
let currentN = 18;  // Track current N

const stageEl = document.getElementById("stage");
const vaultEl = document.getElementById("vault");
const gridEl  = document.getElementById("grid");
const overlay = document.getElementById("laserOverlay");
const labelSvg= document.getElementById("labelOverlay");
const isoOverlayContainer = document.getElementById("isoOverlayContainer");
const seedInfo= document.getElementById("seedInfo");
const nSelect = document.getElementById("nSelect");
const initBtn = document.getElementById("initBtn");
const rerunBtn = document.getElementById("rerunBtn");
const view3dBtn = document.getElementById("view3dBtn");

if(!TEACHER){
  document.querySelector(".hint").hidden = true;
  [nSelect.closest("label"), initBtn, rerunBtn, view3dBtn, seedInfo].forEach(el => { if(el) el.style.display = "none"; });
}

let cells=[];

function buildGrid(){
  gridEl.innerHTML = "";
  cells = [];
  for(let i=0;i<GRID*GRID;i++){
    const d=document.createElement("div");
    d.className="cell";
    gridEl.appendChild(d);
    cells.push(d);
  }
  // Update grid CSS to match new GRID size
  gridEl.style.gridTemplateColumns = `repeat(${GRID}, 1fr)`;
  gridEl.style.gridTemplateRows = `repeat(${GRID}, 1fr)`;
  
  // Adjust borders and gaps for larger grids
  if(GRID > 70){
    document.documentElement.style.setProperty('--grid-gap', '0px');
    document.documentElement.style.setProperty('--cell-border', '0.05px');
  } else if(GRID > 60){
    document.documentElement.style.setProperty('--grid-gap', '0px');
    document.documentElement.style.setProperty('--cell-border', '0.1px');
  } else if(GRID > 40){
    document.documentElement.style.setProperty('--grid-gap', '0.5px');
    document.documentElement.style.setProperty('--cell-border', '0.25px');
  } else {
    document.documentElement.style.setProperty('--grid-gap', '1px');
    document.documentElement.style.setProperty('--cell-border', '0.5px');
  }
}

// Initial build
buildGrid();

const cellAt=(x,y)=>cells[y*GRID+x];

function setCell(x,y,state){
  if(x<0||y<0||x>=GRID||y>=GRID) return;
  const c=cellAt(x,y);
  c.classList.toggle("flow", state==="flow");
  c.classList.toggle("on", state==="on");
  if(state==="off") c.classList.remove("flow","on");
}
// Round 14: TAP TO SKIP on the WATCH bar sets SKIPPING. Every pause then ends at once (waiting ones too),
// so the build runs straight through to the same final state as when it plays out.
let SKIPPING = false;
const pausing = new Set();
const pause=(ms)=>SKIPPING ? Promise.resolve() : new Promise(r=>{   // test tools can speed this up
  const done = () => { clearTimeout(t); pausing.delete(done); r(); };
  const t = setTimeout(done, ms / (window.PNTest ? PNTest.speed() : 1));
  pausing.add(done);
});
let droneAnim = null;
function finishNow(el){ if(el) el.getAnimations({ subtree: true }).forEach(a => { try{ a.finish(); }catch(e){} }); }
function skipBuild(){
  if(SKIPPING) return;
  SKIPPING = true;
  [...pausing].forEach(f => f());
  finishNow(vaultEl);
  if(droneAnim){ try{ droneAnim.finish(); }catch(e){} }
}

/* ---------- Seeded RNG so reruns are stable per seed ---------- */
function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
}

/* ---------- Generate all factor pairs for N ---------- */
function generateFactorPairs(n){
  const pairs = [];
  for(let a = 1; a * a <= n; a++){
    if(n % a === 0){
      const b = n / a;
      pairs.push({w: a, h: b, label: `${a}×${b}`});
      if(a !== b){
        pairs.push({w: b, h: a, label: `${b}×${a}`});
      }
    }
  }
  return pairs;
}

/* ---------- Geometry helpers ---------- */
function rectsOverlap(a,b, pad=0){
  return !(
    a.x + a.w + pad <= b.x ||
    b.x + b.w + pad <= a.x ||
    a.y + a.h + pad <= b.y ||
    b.y + b.h + pad <= a.y
  );
}

/* Random packer: tries to place each factor-rect somewhere new */
function generatePlacements(seed, wanted){
  const rnd = mulberry32(seed);

  // heuristic: place larger first
  wanted = [...wanted];  // copy to avoid mutation
  wanted.sort((a,b)=>(b.w*b.h)-(a.w*a.h));

  const placed = [];
  const triesPerRect = 900;
  const pad = 1; // keep a 1-cell breathing space to stop “samey” clustering

  for(const r0 of wanted){
    let ok = false;
    for(let k=0;k<triesPerRect;k++){
      // allow perimeter preference sometimes so long strips often hug edges, but not always
      const edgeBias = rnd() < 0.55;
      let x, y;

      if(edgeBias){
        const side = Math.floor(rnd()*4);
        if(side===0){ x = Math.floor(rnd()*(GRID - r0.w + 1)); y = 0; }
        else if(side===1){ x = GRID - r0.w; y = Math.floor(rnd()*(GRID - r0.h + 1)); }
        else if(side===2){ x = Math.floor(rnd()*(GRID - r0.w + 1)); y = GRID - r0.h; }
        else { x = 0; y = Math.floor(rnd()*(GRID - r0.h + 1)); }
      }else{
        x = Math.floor(rnd()*(GRID - r0.w + 1));
        y = Math.floor(rnd()*(GRID - r0.h + 1));
      }

      const cand = {x, y, w:r0.w, h:r0.h, label:r0.label};

      // ensure fully inside
      if(cand.x < 0 || cand.y < 0 || cand.x+cand.w>GRID || cand.y+cand.h>GRID) continue;

      // avoid overlap with padding
      let clash=false;
      for(const p of placed){
        if(rectsOverlap(cand,p,pad)){ clash=true; break; }
      }
      if(clash) continue;

      placed.push(cand);
      ok=true;
      break;
    }
    if(!ok){
      // fallback: reduce pad and try again quickly
      for(let k=0;k<triesPerRect;k++){
        const x = Math.floor(rnd()*(GRID - r0.w + 1));
        const y = Math.floor(rnd()*(GRID - r0.h + 1));
        const cand = {x, y, w:r0.w, h:r0.h, label:r0.label};
        let clash=false;
        for(const p of placed){
          if(rectsOverlap(cand,p,0)){ clash=true; break; }
        }
        if(!clash){ placed.push(cand); ok=true; break; }
      }
    }
  }

  // shuffle order for animation variety (still deterministic for seed)
  for(let i=placed.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [placed[i], placed[j]] = [placed[j], placed[i]];
  }
  return placed;
}

/* ---------- Visual engine ---------- */
function drawLaser(rect, ms=920){
  const wait = ms;
  if(window.PNTest) ms = ms / PNTest.speed();
  if(SKIPPING) ms = 0;
  SND("plot");
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",rect.x*STEP);
  r.setAttribute("y",rect.y*STEP);
  r.setAttribute("width",rect.w*STEP);
  r.setAttribute("height",rect.h*STEP);
  r.setAttribute("fill","none");
  r.setAttribute("stroke","var(--laser)");
  r.setAttribute("stroke-width","0.5");
  r.setAttribute("opacity","0.18");
  const per=2*(rect.w*STEP+rect.h*STEP);
  r.style.strokeDasharray=per;
  r.style.strokeDashoffset=per;
  overlay.appendChild(r);

  requestAnimationFrame(()=>{
    r.style.transition=`stroke-dashoffset ${ms}ms cubic-bezier(.45,.05,.35,1), opacity ${ms}ms ease-out`;
    r.style.strokeDashoffset="0";
    r.setAttribute("opacity","0.90");
  });
  return pause(wait + 60).then(() => r);
}

function lockBorder(rect){
  SND("clamp");
  const r=document.createElementNS("http://www.w3.org/2000/svg","rect");
  r.setAttribute("x",rect.x*STEP);
  r.setAttribute("y",rect.y*STEP);
  r.setAttribute("width",rect.w*STEP);
  r.setAttribute("height",rect.h*STEP);
  r.setAttribute("fill","none");
  r.setAttribute("stroke", isStrong(rect) ? "#ffc94d" : "var(--lock)");
  r.setAttribute("stroke-width","0.5");
  r.setAttribute("opacity","0");
  overlay.appendChild(r);
  requestAnimationFrame(()=>{
    r.style.transition=`opacity ${SKIPPING ? 0 : Math.round(600 / (window.PNTest ? PNTest.speed() : 1))}ms ease`;
    r.setAttribute("opacity","0.75");
  });
}

// How long one room takes to fill, in ms at normal speed (every room has N squares)
const fillMs = n => Math.min(6000, 600 + n * 80);
// The room's squares from the outside in, a ring at a time (the same path the old step-by-step fill took)
function spiralOrder(rect){
  const out = [];
  let l=rect.x,r=rect.x+rect.w-1,t=rect.y,b=rect.y+rect.h-1;
  while(l<=r && t<=b){
    for(let x=l;x<=r;x++) out.push([x,t]);
    for(let y=t+1;y<=b;y++) out.push([r,y]);
    if(b>t) for(let x=r-1;x>=l;x--) out.push([x,b]);
    if(r>l) for(let y=b-1;y>=t+1;y--) out.push([l,y]);
    l++;r--;t++;b--;
  }
  return out;
}
// Round 17: one continuous eased wave per room. Each square fades and grows in (CSS), its start time
// spread along the spiral with ease-in-out, so the fill speeds up through the middle and settles at the end.
async function fillOutsideInPower(rect){
  SND("trickle", Math.min(2.2, 0.2 + rect.w * rect.h * 0.03));
  const order = spiralOrder(rect), n = order.length, total = fillMs(currentN);
  const sp = window.PNTest ? PNTest.speed() : 1;
  const cellDur = Math.max(380, Math.min(900, total * 0.35)), spread = total - cellDur;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  order.forEach(([x, y], k) => {
    const c = cellAt(x, y); if(!c) return;
    c.style.setProperty("--d", Math.round(ease(n > 1 ? k / (n - 1) : 0) * spread / sp) + "ms");
    c.style.setProperty("--fd", Math.round(cellDur / sp) + "ms");
    if(SKIPPING) c.classList.add("instant");
    c.classList.add("on");
    fillCount++;
  });
  await pause(total);
  if(SKIPPING) order.forEach(([x, y]) => { const c = cellAt(x, y); if(c) c.classList.add("instant"); });
}

/* Doors: on the visible wall (north, west or east after the tilt) with the most open space in front of it.
   `at` is the door's position along that wall, in cells from the wall's start. */
function doorFor(r, GRID){
  const opts = [
    { side: "n", free: r.y, len: r.w },
    { side: "w", free: r.x, len: r.h },
    { side: "e", free: GRID - (r.x + r.w), len: r.h },
  ].filter(o => o.free > 0);
  const best = opts.sort((a, b) => b.free - a.free)[0] || { side: "n", len: r.w };
  return { side: best.side, at: Math.max(0, Math.floor((best.len - 1) / 2)) };
}
// A free cell on the outer wall, preferring the south edge, for the fire exit
function exitFor(rects, GRID){
  const taken = (x, y) => rects.some(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h);
  for(let x = GRID - 1; x >= 0; x--) if(!taken(x, GRID - 1)) return { x, y: GRID - 1 };
  for(let y = GRID - 1; y >= 0; y--) if(!taken(GRID - 1, y)) return { x: GRID - 1, y };
  return { x: 0, y: GRID - 1 };
}
// Floor rating from how many factor pairs the number has: fewer pairs, fewer rooms to guard
function floorRating(n){
  let pairs = 0; for(let a = 1; a * a <= n; a++) if(n % a === 0) pairs++;
  return { pairs, rating: pairs <= 2 ? "WEAK" : pairs === 3 ? "STANDARD" : "SECURE" };
}

/* Rooms get names from their shape, so the floor plan reads like a building.
   Square pairs are the reinforced strongroom (gold). */
function roomName(rect){
  const a = Math.min(rect.w, rect.h), b = Math.max(rect.w, rect.h);
  if(a === b) return "STRONGROOM";
  if(a === 1) return "ARCHIVE";        // feedback round 7: the space between rooms is the corridor
  if(b / a >= 4) return "SERVER ROW";
  if(b / a >= 2) return "OFFICE";
  return "SERVER ROOM";
}
const isStrong = rect => rect.w === rect.h;

/* External label: based on position, with leader */
function sectorLabelFor(rect){
  const col = String.fromCharCode(65 + rect.x);
  const row = rect.y + 1;
  return `SECTOR ${col}${row}`;
}

// Track placed labels to avoid overlaps
const placedLabels = [];

function clearLabelTracker(){
  placedLabels.length = 0;
}

function labelBounds(lx, ly, anchor, text1, text2){
  // Rough estimate of text width/height for collision detection
  const w1 = text1.length * 7;  // ~7px per char at font-size 12
  const w2 = text2.length * 6;  // ~6px per char at font-size 11
  const maxWidth = Math.max(w1, w2) + 20;
  const height = 32;  // ~16px per line + padding
  
  let x, y;
  if(anchor === "middle"){
    x = lx - maxWidth/2;
    y = ly - height/2;
  }else if(anchor === "end"){
    x = lx - maxWidth;
    y = ly - height/2;
  }else{
    x = lx;
    y = ly - height/2;
  }
  
  return {x, y, w: maxWidth, h: height};
}

function boundsOverlap(b1, b2, margin = 12){
  return !(
    b1.x + b1.w + margin <= b2.x ||
    b2.x + b2.w + margin <= b1.x ||
    b1.y + b1.h + margin <= b2.y ||
    b2.y + b2.h + margin <= b1.y
  );
}

function findNonOverlappingPosition(proposedLx, proposedLy, anchor, text1, text2, side){
  let lx = proposedLx;
  let ly = proposedLy;
  const bounds = labelBounds(lx, ly, anchor, text1, text2);
  
  // Try offsets (increase spacing if overlapping)
  const offsets = [0, 24, -24, 48, -48, 72, -72];
  
  for(const offset of offsets){
    let testLx = lx;
    let testLy = ly;
    
    // Offset based on side
    if(side === "top" || side === "bottom"){
      testLx = lx + offset;
    }else{
      testLy = ly + offset;
    }
    
    const testBounds = labelBounds(testLx, testLy, anchor, text1, text2);
    let overlaps = false;
    
    for(const existing of placedLabels){
      if(boundsOverlap(testBounds, existing)){
        overlaps = true;
        break;
      }
    }
    
    if(!overlaps){
      return {lx: testLx, ly: testLy, bounds: testBounds};
    }
  }
  
  // Fallback: return last bounds anyway
  return {lx, ly, bounds};
}

function addExternalLabel(rect){
  const stageBox=stageEl.getBoundingClientRect();
  const vaultBox=vaultEl.getBoundingClientRect();
  const pad=18;

  const innerW=vaultBox.width-pad*2;
  const innerH=vaultBox.height-pad*2;
  const cellW=innerW/GRID, cellH=innerH/GRID;

  const ax=vaultBox.left+pad+(rect.x+rect.w/2)*cellW;
  const ay=vaultBox.top+pad+(rect.y+rect.h/2)*cellH;

  const cx = rect.x + rect.w/2;
  const cy = rect.y + rect.h/2;

  let lx, ly, anchor, side;
  if(cy < 5){
    lx = ax; ly = vaultBox.top - 24; anchor="middle"; side="top";
  }else if(cy > GRID-6){
    lx = ax; ly = vaultBox.bottom + 28; anchor="middle"; side="bottom";
  }else if(cx < 5){
    lx = vaultBox.left - 26; ly = ay; anchor="end"; side="left";
  }else{
    lx = vaultBox.right + 26; ly = ay; anchor="start"; side="right";
  }

  const text1 = roomName(rect);
  const text2 = `${rect.label} · ${sectorLabelFor(rect)}`;
  
  // Find non-overlapping position
  const positioned = findNonOverlappingPosition(lx, ly, anchor, text1, text2, side);
  lx = positioned.lx;
  ly = positioned.ly;
  placedLabels.push(positioned.bounds);

  const axL=ax-stageBox.left, ayL=ay-stageBox.top;
  const lxL=lx-stageBox.left, lyL=ly-stageBox.top;

  labelSvg.setAttribute("viewBox",`0 0 ${stageBox.width} ${stageBox.height}`);

  const bend=18;
  const path=document.createElementNS("http://www.w3.org/2000/svg","path");
  let d;
  if(anchor==="middle"){
    d = `M ${lxL} ${lyL} L ${lxL} ${lyL + (lyL<ayL? bend : -bend)} L ${axL} ${ayL}`;
  }else if(anchor==="end"){
    d = `M ${lxL} ${lyL} L ${lxL + bend} ${lyL} L ${axL} ${ayL}`;
  }else{
    d = `M ${lxL} ${lyL} L ${lxL - bend} ${lyL} L ${axL} ${ayL}`;
  }
  path.setAttribute("d",d);
  path.setAttribute("fill","none");
  path.setAttribute("stroke","rgba(74,163,255, 0.45)");
  path.setAttribute("stroke-width","0.5");
  if(!SKIPPING) path.setAttribute("class","lblIn");
  labelSvg.appendChild(path);

  const g=document.createElementNS("http://www.w3.org/2000/svg","g");
  g.setAttribute("transform",`translate(${lxL}, ${lyL})`);
  if(!SKIPPING) g.setAttribute("class","lblIn");
  labelSvg.appendChild(g);

  const t1=document.createElementNS("http://www.w3.org/2000/svg","text");
  t1.textContent=text1;
  t1.setAttribute("fill", isStrong(rect) ? "rgba(255,201,77,0.95)" : "rgba(74,163,255, 0.80)");
  t1.setAttribute("font-size","12");
  t1.setAttribute("letter-spacing","1.6");
  t1.setAttribute("dominant-baseline","middle");
  t1.setAttribute("text-anchor", anchor==="middle"?"middle":(anchor==="end"?"end":"start"));
  g.appendChild(t1);

  const t2=document.createElementNS("http://www.w3.org/2000/svg","text");
  t2.textContent=text2;
  t2.setAttribute("fill","rgba(74,163,255, 0.75)");
  t2.setAttribute("font-size","11");
  t2.setAttribute("letter-spacing","0.6");
  t2.setAttribute("dominant-baseline","middle");
  t2.setAttribute("text-anchor", t1.getAttribute("text-anchor"));
  t2.setAttribute("y","16");
  g.appendChild(t2);

  const dot=document.createElementNS("http://www.w3.org/2000/svg","circle");
  dot.setAttribute("cx",axL);
  dot.setAttribute("cy",ayL);
  dot.setAttribute("r","1.8");
  dot.setAttribute("fill","rgba(74,163,255, 0.65)");
  if(!SKIPPING) dot.setAttribute("class","lblIn");
  labelSvg.appendChild(dot);
}

/* One rect animation pipeline */
async function animateRect(rect, startDelay){
  await pause(startDelay);
  // The fill starts while the laser is still closing its loop, so there's no stop between them
  const laser = drawLaser(rect, 900);
  await pause(540);
  await Promise.all([laser, fillOutsideInPower(rect)]);
  lockBorder(rect);
  addExternalLabel(rect);
}

/* Main */
let currentSeed = (Date.now() ^ (Math.random()*1e9)) >>> 0;

async function initVault(N){
  // Update grid and display for new N
  // Grid must be N+1 to fit the largest factor pair (1×N)
  GRID = N + 1;
  STEP = 100 / GRID;
  currentN = N;
  
  // Update select dropdown to match
  nSelect.value = String(N);
  
  // Update title
  document.querySelector(".title div:first-child").textContent = `VAULT GRID: ${GRID}×${GRID}`;
  document.querySelector(".title div:last-child").textContent = `TARGET: N=${N}`;
  
  // Rebuild grid
  buildGrid();
  
  // Generate new seed and run
  currentSeed = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  const wanted = generateFactorPairs(N);
  await run(currentSeed, wanted);
}

async function run(seed, wanted){
  currentSeed = seed >>> 0;
  seedInfo.textContent = `seed: ${currentSeed}`;

  // reset visuals and label tracker
  cells.forEach(c=>{ c.classList.remove("on","flow","hall","instant"); c.style.removeProperty("--d"); c.style.removeProperty("--fd"); });
  overlay.innerHTML="";
  labelSvg.innerHTML="";
  clearLabelTracker();

  // generate layout
  const placements = generatePlacements(currentSeed, wanted);
  
  // Store placements globally for 3D view reuse
  window.lastPlacements = placements;
  // Doors face the widest corridor; one fire exit on the outer wall. Saved so the Blueprint rebuilds this exact floor.
  placements.forEach(r => { r.door = doorFor(r, GRID); });
  window.lastExit = exitFor(placements, GRID);
  try{
    const all = JSON.parse(localStorage.getItem("blueprintLayouts") || "{}");
    all[currentN] = { grid: GRID, rooms: placements.map(({ x, y, w, h, door }) => ({ x, y, w, h, door })), exit: window.lastExit };
    localStorage.setItem("blueprintLayouts", JSON.stringify(all));
  }catch(e){}
  window.lastSeed = currentSeed;
  window.lastN = currentN;

  // A blueprint laser bar sweeps the site while the rooms are drawn, over one soft scanner hum
  const bar = document.createElement("div"); bar.className = "plotBar"; vaultEl.appendChild(bar);
  requestAnimationFrame(() => requestAnimationFrame(() => bar.classList.add("on")));   // fades in rather than popping
  SND("scan", Math.min(8, 2.4 + placements.length * 0.35));
  // border sweep (faint to strong, eased); the first rooms start as it closes, so there's no gap
  const border = drawLaser({x:0,y:0,w:GRID,h:GRID,label:""}, 1350);
  await pause(950);

  // staggered overlap (not strictly sequential)
  // tighter stagger feels smoother; also vary a bit by index for organic cadence
  const base = 260;
  const jitter = 90;
  const rnd = mulberry32(currentSeed ^ 0xA5A5A5A5);

  const tasks = placements.map((r,i)=>{
    const delay = i*base + Math.floor(rnd()*jitter);
    return animateRect(r, delay);
  });

  await Promise.all([border, ...tasks]);
  bar.classList.add("off"); setTimeout(() => bar.remove(), 500);
  // Everything that isn't a room is corridor and open floor inside the same building
  cells.forEach(c => { if(!c.classList.contains("on")) c.classList.add("hall"); });
}

// init button - change N and rebuild
initBtn.addEventListener("click", ()=>{
  const n = parseInt(nSelect.value, 10);
  initVault(n);
});

// rerun button - same N, new layout
rerunBtn.addEventListener("click", ()=>{
  const newSeed = (Date.now() ^ (Math.random()*1e9)) >>> 0;
  const wanted = generateFactorPairs(currentN);
  run(newSeed, wanted);
});

// Get all occupied (filled) grid cells
// Trigger 3D transformation: tilt vault and extrude rectangle arrays
async function triggerIsometricMorph(placements){
  // Hide external labels but keep grid and background visible
  labelSvg.style.display = "none";
  overlay.style.display = "none";
  
  // Fade the flat grid cells to background only (10-15% opacity)
  // Feedback round 10: the squares used to fade before the 3D view arrived, a dim-then-bright flash.
  // They now stay bright through the tilt and cross-fade with the 3D view, which starts from the same flat rooms.
  
  // Start vault tilt animation (800ms total duration)
  vaultEl.classList.add("tilting-to-iso");
  if(SKIPPING) finishNow(vaultEl); else SND("rise");
  
  // Show canvas but keep it invisible while tilting
  const canvasWrapper = document.querySelector(".vault3d-wrap");
  const canvas = document.getElementById("vault3d");
  const exitBtn = document.getElementById("exit3dBtn");
  const modePanel = document.getElementById("extrusionModePanel");
  
  if(canvasWrapper && canvas){
    canvasWrapper.style.display = "block";
    canvas.style.opacity = "0";
    
    if(placements.length > 0){
      // Wait for tilt animation to complete (1000ms)
      await pause(1000);
      
      // Calculate exact canvas dimensions based on grid + padding
      const gridW = gridEl.clientWidth;
      const gridH = gridEl.clientHeight;
      const gap = parseFloat(getComputedStyle(gridEl).gap) || 0;
      const cellSize = (gridW - gap * (GRID - 1)) / GRID;
      const verticalPad = buildingHeight(cellSize, gridW) * 1.2 + cellSize;
      const horizontalPad = buildingHeight(cellSize, gridW) * 0.3 + cellSize * 0.6;
      
      const canvasW = gridW + horizontalPad * 2;
      const canvasH = gridH + verticalPad;
      
      // Position wrapper to be centered on the grid with room for canvas overflow
      const gridPadding = 18;
      const offsetLeft = gridPadding - horizontalPad;
      const offsetTop = gridPadding - verticalPad;
      
      canvasWrapper.style.width = Math.ceil(canvasW) + "px";
      canvasWrapper.style.height = Math.ceil(canvasH) + "px";
      canvasWrapper.style.left = offsetLeft + "px";
      canvasWrapper.style.top = offsetTop + "px";

// ====== DRONE FLYTHROUGH ======
// Once the floor has risen, a drone camera sweeps low over it and logs each room.
function pickCameras(placements){
  const occ = new Set(); placements.forEach(r => { for(let i = 0; i < r.w; i++) for(let j = 0; j < r.h; j++) occ.add((r.x + i) + "," + (r.y + j)); });
  const rnd = mulberry32((currentN * 131) ^ 0xCA3E);
  const spots = [];
  for(let y = 0; y < GRID; y++) for(let x = 0; x < GRID; x++){
    if(occ.has(x + "," + y)) continue;
    const near = [[1,0],[-1,0],[0,1],[0,-1]].find(([dx, dy]) => occ.has((x + dx) + "," + (y + dy)));
    if(near) spots.push({ x, y, dir: Math.atan2(-near[1], -near[0]) });
  }
  // Round 12: one or two cameras on the outer wall point out of the building
  const edge = []; for(let i = 0; i < GRID; i++){ edge.push({ x: i, y: 0, dir: -Math.PI / 2 }, { x: 0, y: i, dir: Math.PI }, { x: GRID - 1, y: i, dir: 0 }); }
  const outs = edge.filter(e => !occ.has(e.x + "," + e.y));
  const out = [], n = Math.min(6, Math.max(4, Math.round(placements.length * 0.7)));
  for(let i = 0; i < 2 && outs.length; i++){ const e = outs.splice(Math.floor(rnd() * outs.length), 1)[0]; if(out.every(o => Math.abs(o.x - e.x) + Math.abs(o.y - e.y) >= GRID / 3)) out.push({ ...e, outward: true }); }
  while(out.length < n && spots.length){
    const s = spots.splice(Math.floor(rnd() * spots.length), 1)[0];
    if(out.every(o => Math.abs(o.x - s.x) + Math.abs(o.y - s.y) >= GRID / 4)) out.push(s);
    else if(!spots.length) break;
  }
  return out;
}
// Round 12: guards are separate from the cameras: small dots walking a short beat on the corridors,
// flaring as the drone's laser passes over them
function pickGuards(placements){
  const occ = new Set(); placements.forEach(r => { for(let i = 0; i < r.w; i++) for(let j = 0; j < r.h; j++) occ.add((r.x + i) + "," + (r.y + j)); });
  const rnd = mulberry32((currentN * 977) ^ 0x6A4D);
  const out = [];
  for(let t = 0; t < 400 && out.length < 3; t++){
    const x = Math.floor(rnd() * GRID), y = Math.floor(rnd() * GRID);
    if(occ.has(x + "," + y)) continue;
    // a straight beat of free corridor cells
    const horiz = rnd() < 0.5; let len = 0;
    while(len < 5 && !occ.has((horiz ? x + len + 1 : x) + "," + (horiz ? y : y + len + 1)) && (horiz ? x + len + 1 : y + len + 1) < GRID) len++;
    if(len >= 2 && out.every(o => Math.abs(o.x - x) + Math.abs(o.y - y) > GRID / 4)) out.push({ x, y, horiz, len, phase: rnd() * 6 });
  }
  return out;
}
async function droneFlythrough(placements){

  const seen = new Set(), rooms = placements.filter(r => { const k = [Math.min(r.w, r.h), Math.max(r.w, r.h)].join("x"); if(seen.has(k)) return false; seen.add(k); return true; });
  const box = stageEl.getBoundingClientRect();
  const hud = document.createElement("div"); hud.className = "droneHud";
  Object.assign(hud.style, { left: box.left + "px", top: box.top + "px", width: box.width + "px", height: box.height + "px" });
  hud.innerHTML = `<div class="vign"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div><div class="cross"></div>
    <div class="top"><span class="rec">● REC</span> DRONE CAM 02</div><div class="alt">ALT <span class="a">12.0</span>m<br>N=${currentN}</div><div class="log"></div>`;
  document.body.appendChild(hud);
  if(!SKIPPING) SND("rise");
  const sp = window.PNTest ? PNTest.speed() : 1, dur = Math.max(9000, rooms.length * 1600) / sp;   // feedback: slower, calmer camera
  const anim = stageEl.animate([
    { transform: "none" },
    { transform: "scale(1.55) translate(14%, 12%) rotate(-2deg)", offset: .2 },
    { transform: "scale(1.7) translate(-14%, 8%) rotate(2deg)", offset: .5 },
    { transform: "scale(1.6) translate(-8%, -12%) rotate(-1deg)", offset: .8 },
    { transform: "none" },
  ], { duration: dur, easing: "ease-in-out" });
  droneAnim = anim; if(SKIPPING) anim.finish();
  const log = hud.querySelector(".log"), alt = hud.querySelector(".a");
  // Keep the room labels pinned to the rooms while the camera moves
  // Round 10: the drone spots the floor's security cameras one by one (on corridor cells beside rooms), with a beep
  window.cams = pickCameras(placements);
  window.guards = pickGuards(placements);
  window.cams.forEach((c, i) => pause((dur * sp) * (0.18 + 0.6 * i / Math.max(1, window.cams.length))).then(() => { c.shown = performance.now(); if(!SKIPPING) SND("beep"); }));
  // Feedback round 9: a laser sweeps across the floor, showing the square grid of every room as it passes
  const sweepMs = Math.min(dur * 0.45, 5200), t0 = performance.now();
  window.sweepTrail = 0.22;
  if(!SKIPPING) SND("scan", sweepMs / 1000);
  let live = true; (function follow(now){ if(!live) return; const k = ((now || performance.now()) - t0) / sweepMs; window.sweep = k <= 1 ? -1 + k * (GRID + 2) : null; if(k > 1) window.roofGrid = Math.max(window.roofGrid || 0, 0.22); rerenderGrid(); requestAnimationFrame(follow); })();
  const lines = [];
  const altTimer = setInterval(() => { alt.textContent = (8 + Math.random() * 6).toFixed(1); }, 180);
  for(const [i, r] of rooms.entries()){
    await pause(dur * sp * 0.8 / rooms.length);
    const a = Math.min(r.w, r.h), b = Math.max(r.w, r.h);
    window.gridHighlight = r; rerenderGrid();
    lines.push(`<div class="${a === b ? "strong" : ""}">ROOM ${String(i + 1).padStart(2, "0")} · ${roomName(r)} ${a}×${b} · ${a * b} squares ✓</div>`);
    log.innerHTML = lines.slice(-4).join("");
    if(!SKIPPING) SND("tag");
  }
  await anim.finished.catch(() => {});
  droneAnim = null;
  live = false; window.sweep = null;
  if(SKIPPING) await new Promise(r => requestAnimationFrame(r));   // let the rise's last frame land first
  window.roofGrid = Math.max(window.roofGrid || 0, 0.22);   // as when the sweep passes (also when skipped)
  if(!window._idleAnim) window._idleAnim = setInterval(() => { if(!document.hidden) rerenderGrid(); }, 120);   // guards keep walking, cameras keep blinking
  clearInterval(altTimer);
  window.gridHighlight = null; rerenderGrid();
  hud.remove();
  await floorAnalysis(placements);
}

    { title: "KEYCARD LOG", flag: "LAST NIGHT", w: 300,
      html: log.map(l => `${l.t} <span class="yl">${l.role}</span> ${l.who}<br><span class="k">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${l.room}</span>`).join("<br>") + (strongRoom ? `<br><span class="k">No one swiped into the <span class="yl">strongroom</span>.</span>` : "") },
    { title: "RADIO INTERCEPT", flag: "CH 4", w: 300,
      html: [`<span class="yl">GUARD 2:</span> ${pickR(["Coffee run, back in ten.", "Door on the east side sticks again.", "Nothing to report. Quiet night."])}`, `<span class="yl">CONTROL:</span> ${pickR(["Copy. Log it.", "Copy. Keep your radio on.", "Understood. Next check at the hour."])}`, `<span class="k">${pickR(["Their radios reuse one channel.", "Check-ins are every 30 minutes.", "Nobody mentioned the fire stairs."])}</span>`].join("<br>") },
    { title: "ALARM PANEL", flag: `${placements.length} ZONES`, w: 290,
      html: placements.slice(0, 4).map((r, i) => `ZONE ${i + 1} · ${roomName(r)} <span class="${i === 1 ? "bad" : "ok"}">${i === 1 ? "FAULT" : "ARMED"}</span>`).join("<br>") + `<br><span class="k">Zone 2 has a fault. It's been ignored for days.</span>` },
    { title: "STAFF FILE", flag: "HR SERVER", w: 290,
      html: `${pickR(names)} · <span class="yl">${pickR(["Night manager", "Head of security", "Cleaner", "IT support"])}</span><br>Keycard: level ${1 + Math.floor(rnd() * 3)}<br>Leaves at ${pickR(["22:10", "23:40", "05:55"])}<br><span class="k">${pickR(["Writes passwords on sticky notes.", "Always takes the lift.", "Never checks the back office."])}</span>` },
    { title: "VENTILATION", flag: "PLANT ROOM", w: 280,
      html: `Main duct runs above the ${pickR(rooms).toLowerCase()}<br>Grille size: <span class="yl">60 × 45 cm</span><br>Airflow: ${pickR(["low overnight", "off after 22:00", "steady"])}<br><span class="k">Too loud to hear footsteps near it.</span>` },
  ];
  // Round 12: more variety: three windows per floor, a different mix each time (CCTV more often than not)
  const cctvFirst = rnd() < 0.7;
  const rest = pool.filter(w => !w.cctv).sort(() => rnd() - 0.5);
  const chosen = (cctvFirst ? [pool.find(w => w.cctv), ...rest] : rest).slice(0, 3);
  const slots = [{ x: 15, y: 26 }, { x: 85, y: 30 }, { x: 15, y: 68 }];
  const list = chosen.map((w, i) => ({ ...w, ...slots[i] }));
  analysisWins = [];
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  for(const w of list){
    const win = PNHolo.open({ ...w, x: 50, y: 46, tilt: 0 });
    analysisWins.push(win);
    win.el.style.transform = "translate(-50%,-50%) scale(1.45)";
    SND("holo");
    if(!SKIPPING) await PNHolo.wait(600);
    win.el.style.transition = "left .5s ease, top .5s ease, transform .5s ease";
    win.el.style.left = w.x + "%"; win.el.style.top = w.y + "%"; win.el.style.transform = "translate(-50%,-50%) scale(1)";
    if(!SKIPPING) await PNHolo.wait(350);
  }
  // A ticking CCTV clock
  const clock = document.querySelector(".cctvClock");
  if(clock){ let t = 2 * 3600 + 14 * 60 + 7; const iv = setInterval(() => { if(!document.body.contains(clock)) return clearInterval(iv); t++; clock.textContent = [Math.floor(t / 3600), Math.floor(t / 60) % 60, t % 60].map(x => String(x).padStart(2, "0")).join(":"); }, 1000); }
}

// ====== 3D CUBOID RECTANGLE RENDERER ======

// Building height grows with the number. A bigger N means a wider grid and smaller cells,
// so a fixed height looked flatter and flatter; this keeps big floors looking like real buildings.
function buildingHeight(cellSize, gridW){
  return Math.max(cellSize * 1.6, gridW * (0.10 + 0.0012 * GRID));
}

// Extrusion direction modes for testing
window.extrusionMode = 3;  // Default: -75° (building-like)
window.animationState = {rects: [], GRID: 0, cellSize: 0, gap: 0, targetHeight: 0};

const EXTRUSION_MODES = {
  1: {name: "-60° Diagonal", hx: (h) => h * 0.50, hy: (h) => -h * 0.90},
  2: {name: "Straight Up (-90°)", hx: (h) => h * 0.00, hy: (h) => -h * 1.10},
  3: {name: "-75° Diagonal", hx: (h) => h * 0.26, hy: (h) => -h * 1.00}
};

const TILT_ANGLES = {
  60: "rotateX(60deg) rotateZ(-18deg) scale(1.18)",
  65: "rotateX(65deg) rotateZ(-18deg) scale(1.18)",
  70: "rotateX(70deg) rotateZ(-18deg) scale(1.18)",
  75: "rotateX(75deg) rotateZ(-18deg) scale(1.18)"
};
window.currentTiltAngle = 65;

// Draw a single cuboid (extruded rectangle) in 3D space using painter's algorithm
// Grid coordinates map to canvas space; fixed extrusion vector creates 3D effect
function drawCuboid(ctx, rect, cellSize, gap, heightPx, mode=1){
  // Floor plane corners in canvas space
  const x0 = rect.x * (cellSize + gap);
  const y0 = rect.y * (cellSize + gap);
  const x1 = x0 + rect.w * cellSize + (rect.w - 1) * gap;
  const y1 = y0 + rect.h * cellSize + (rect.h - 1) * gap;
  
  // Get extrusion offset vector based on mode
  const modeConfig = EXTRUSION_MODES[mode] || EXTRUSION_MODES[1];
  const hx = modeConfig.hx(heightPx);
  const hy = modeConfig.hy(heightPx);
  
  // Floor corners
  const A = {x: x0, y: y0};
  const B = {x: x1, y: y0};
  const C = {x: x1, y: y1};
  const D = {x: x0, y: y1};
  
  // Raised corners
  const Ah = {x: A.x + hx, y: A.y + hy};
  const Bh = {x: B.x + hx, y: B.y + hy};
  const Ch = {x: C.x + hx, y: C.y + hy};
  const Dh = {x: D.x + hx, y: D.y + hy};
  
  // Green buildings with bright edges: the original Vault Grid mix. Canvas can't read CSS variables.
  // The room the drone is looking at glows amber; the square strongroom has gold edges.
  const hot = window.gridHighlight && window.gridHighlight === rect;
  const strong = rect.w === rect.h;
  const colors = hot ? {
    top:   "rgba(255, 200, 90, 0.70)",
    left:  "rgba(150, 100, 30, 0.75)",
    right: "rgba(170, 115, 35, 0.72)",
    front: "rgba(200, 140, 50, 0.66)",
    edge:  "rgba(255, 230, 150, 1)"
  } : {
    top:   "rgba(40, 180, 140, 0.60)",
    left:  "rgba(20, 100, 80, 0.70)",
    right: "rgba(25, 120, 100, 0.65)",
    front: "rgba(35, 150, 120, 0.58)",
    edge:  strong ? "rgba(255, 201, 77, 0.95)" : "rgba(60, 255, 200, 0.9)"
  };
  
  // LEFT FACE: D → A → Ah → Dh
  ctx.fillStyle = colors.left;
  ctx.beginPath();
  ctx.moveTo(D.x, D.y);
  ctx.lineTo(A.x, A.y);
  ctx.lineTo(Ah.x, Ah.y);
  ctx.lineTo(Dh.x, Dh.y);
  ctx.closePath();
  ctx.fill();
  
  // RIGHT FACE: B → C → Ch → Bh
  ctx.fillStyle = colors.right;
  ctx.beginPath();
  ctx.moveTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);
  ctx.lineTo(Ch.x, Ch.y);
  ctx.lineTo(Bh.x, Bh.y);
  ctx.closePath();
  ctx.fill();
  
  // FRONT FACE: A → B → Bh → Ah (solid face closest to viewer)
  ctx.fillStyle = colors.front;
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(Bh.x, Bh.y);
  ctx.lineTo(Ah.x, Ah.y);
  ctx.closePath();
  ctx.fill();
  
  // DOOR: a dark opening with an amber frame on the chosen wall
  if(rect.door && heightPx > 2){
    const step = cellSize + gap, d = rect.door, wLen = Math.min(cellSize * 0.9, step);
    let F0, F1;
    if(d.side === "n"){ F0 = { x: A.x + d.at * step + (step - wLen) / 2, y: A.y }; F1 = { x: F0.x + wLen, y: A.y }; }
    else if(d.side === "w"){ F0 = { x: A.x, y: A.y + d.at * step + (step - wLen) / 2 }; F1 = { x: A.x, y: F0.y + wLen }; }
    else { F0 = { x: B.x, y: B.y + d.at * step + (step - wLen) / 2 }; F1 = { x: B.x, y: F0.y + wLen }; }
    const k = 0.62;
    ctx.fillStyle = "rgba(3, 12, 14, 0.92)";
    ctx.beginPath(); ctx.moveTo(F0.x, F0.y); ctx.lineTo(F1.x, F1.y); ctx.lineTo(F1.x + hx * k, F1.y + hy * k); ctx.lineTo(F0.x + hx * k, F0.y + hy * k); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(255, 190, 90, 0.95)"; ctx.lineWidth = 1.2; ctx.stroke();
  }

  // TOP FACE: Ah → Bh → Ch → Dh
  ctx.fillStyle = colors.top;
  ctx.beginPath();
  ctx.moveTo(Ah.x, Ah.y);
  ctx.lineTo(Bh.x, Bh.y);
  ctx.lineTo(Ch.x, Ch.y);
  ctx.lineTo(Dh.x, Dh.y);
  ctx.closePath();
  ctx.fill();
  
  // Feedback round 9: the array's unit squares on the roof. Strong while the floor is flat, fading as the room
  // rises; the drone's laser sweep lights them up again as it passes and leaves them faintly showing.
  const base = window.roofGrid || 0, sw = window.sweep, step = cellSize + gap;
  if(base > 0.01 || sw != null){
    ctx.lineWidth = 1;
    for(let i = 0; i < rect.w; i++){
      const col = rect.x + i + 0.5;
      let a = base;
      if(sw != null){ const d = col - sw; a = Math.max(a, Math.exp(-d * d / 1.5) * 0.95, d < 0 ? (window.sweepTrail || 0) : 0); }
      if(a < 0.02) continue;
      ctx.strokeStyle = `rgba(190, 255, 235, ${a.toFixed(3)})`;
      for(let j = 0; j < rect.h; j++) ctx.strokeRect(x0 + i * step + hx + 0.5, y0 + j * step + hy + 0.5, cellSize - 1, cellSize - 1);
    }
  }

  // EDGE STROKES
  ctx.strokeStyle = colors.edge;
  ctx.lineWidth = 1.2;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  
  // Outline top face
  ctx.beginPath();
  ctx.moveTo(Ah.x, Ah.y);
  ctx.lineTo(Bh.x, Bh.y);
  ctx.lineTo(Ch.x, Ch.y);
  ctx.lineTo(Dh.x, Dh.y);
  ctx.closePath();
  ctx.stroke();
  
  // Vertical edges from floor to top
  ctx.beginPath();
  ctx.moveTo(A.x, A.y);
  ctx.lineTo(Ah.x, Ah.y);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(B.x, B.y);
  ctx.lineTo(Bh.x, Bh.y);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(C.x, C.y);
  ctx.lineTo(Ch.x, Ch.y);
  ctx.stroke();
  
  ctx.beginPath();
  ctx.moveTo(D.x, D.y);
  ctx.lineTo(Dh.x, Dh.y);
  ctx.stroke();
}

// Render all rectangles as extruded cuboids with painter's algorithm
function renderRectCuboids(ctx, rects, GRID, cellSize, gap, heightPx, mode=1){
  // Clear the whole canvas, padding included (the context is translated by the padding)
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); ctx.restore();
  
  // Draw faint floor grid first (underneath extrusions)
  ctx.strokeStyle = "rgba(17, 75, 95, 0.15)";
  ctx.lineWidth = 0.5;
  for(let i = 0; i <= GRID; i++){
    const pos = i * (cellSize + gap);
    // Vertical lines
    ctx.beginPath();
    ctx.moveTo(pos, 0);
    ctx.lineTo(pos, ctx.canvas.height);
    ctx.stroke();
    // Horizontal lines
    ctx.beginPath();
    ctx.moveTo(0, pos);
    ctx.lineTo(ctx.canvas.width, pos);
    ctx.stroke();
  }
  
  // Debug: Draw cell indices at corners (remove in production)
  if(window.debugCellIndices){
    ctx.fillStyle = "rgba(74,163,255, 0.4)";
    ctx.font = "10px monospace";
    ctx.textAlign = "left";
    ctx.textBaseline = "top";
    for(let y = 0; y < Math.min(3, GRID); y++){
      for(let x = 0; x < Math.min(3, GRID); x++){
        const px = x * (cellSize + gap);
        const py = y * (cellSize + gap);
        ctx.fillText(`${x},${y}`, px + 2, py + 2);
      }
    }
  }
  
  // Sort by painter's algorithm: back to front
  // Rects further back (higher y + h) draw first
  const sorted = rects.slice().sort((a, b) => (a.y + a.h) - (b.y + b.h));
  
  // Fire exit: a green marker on the outer wall
  const ex = window.lastExit;
  if(ex){
    const step = cellSize + gap, x0 = ex.x * step, y0 = ex.y * step;
    ctx.fillStyle = "rgba(47, 191, 138, 0.35)"; ctx.fillRect(x0, y0, cellSize, cellSize);
    ctx.strokeStyle = "rgba(120, 255, 190, 1)"; ctx.lineWidth = 1.5; ctx.strokeRect(x0, y0, cellSize, cellSize);
    ctx.fillStyle = "rgba(160, 255, 210, 1)"; ctx.font = `700 ${Math.max(9, Math.min(13, cellSize * 1.1))}px "Chakra Petch", sans-serif`;
    window._exitAt = { x: x0 + cellSize / 2, y: y0 + cellSize / 2 };
  }

  // One building: the whole plate is floor (corridors and open space), with a low outer wall.
  // Back walls go behind the rooms, front walls in front of them (see-through).
  const step0 = cellSize + gap, full = GRID * step0 - gap;
  const mc = EXTRUSION_MODES[mode] || EXTRUSION_MODES[1], wh = heightPx * 0.4, wx = mc.hx(wh), wy = mc.hy(wh);
  ctx.fillStyle = "rgba(40, 110, 120, 0.16)"; ctx.fillRect(0, 0, full, full);
  const wall = (x0, y0, x1, y1, a) => {
    ctx.fillStyle = `rgba(74, 163, 255, ${a})`; ctx.strokeStyle = "rgba(120, 190, 255, 0.7)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.lineTo(x1 + wx, y1 + wy); ctx.lineTo(x0 + wx, y0 + wy); ctx.closePath(); ctx.fill(); ctx.stroke();
  };
  if(heightPx > 1){ wall(0, 0, full, 0, 0.14); wall(0, 0, 0, full, 0.10); wall(full, 0, full, full, 0.10); }
  // Draw each rectangle as a cuboid
  for(const rect of sorted){
    drawCuboid(ctx, rect, cellSize, gap, heightPx, mode);
  }
  if(heightPx > 1) wall(0, full, full, full, 0.07);
  // Round 10: security cameras the drone spots, a red light and a camera on the wall with a faint view cone
  if(heightPx > 1 && window.cams){
    const now = performance.now(), ch = mc.hx(heightPx * 0.85), cv = mc.hy(heightPx * 0.85);
    for(const c of window.cams){
      if(!c.shown) continue;
      const age = (now - c.shown) / 1000, pop = Math.min(1, age * 4);
      const x = c.x * step0 + cellSize / 2 + ch, y = c.y * step0 + cellSize / 2 + cv;
      // view cone on the floor
      ctx.fillStyle = `rgba(255, 60, 90, ${0.10 * pop})`;
      ctx.beginPath(); ctx.moveTo(x - ch, y - cv); const a0 = c.dir - .5, a1 = c.dir + .5, rr = step0 * 3.2;
      ctx.lineTo(x - ch + Math.cos(a0) * rr, y - cv + Math.sin(a0) * rr); ctx.lineTo(x - ch + Math.cos(a1) * rr, y - cv + Math.sin(a1) * rr); ctx.closePath(); ctx.fill();
      // mount line down the wall
      ctx.strokeStyle = "rgba(255, 120, 140, .5)"; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x - ch, y - cv); ctx.lineTo(x, y); ctx.stroke();
      // camera body and lens
      const k = Math.max(5, Math.min(11, cellSize * 0.42)) * pop;   // round 12: in proportion to the rooms at every level
      ctx.fillStyle = "rgba(20, 8, 12, .95)"; ctx.strokeStyle = "rgba(255, 90, 110, .95)"; ctx.lineWidth = 1.2;
      ctx.fillRect(x - k, y - k * 0.6, k * 1.6, k * 1.2); ctx.strokeRect(x - k, y - k * 0.6, k * 1.6, k * 1.2);
      ctx.beginPath(); ctx.moveTo(x + k * 0.6, y - k * 0.3); ctx.lineTo(x + k * 1.2, y - k * 0.6); ctx.lineTo(x + k * 1.2, y + k * 0.6); ctx.lineTo(x + k * 0.6, y + k * 0.3); ctx.closePath(); ctx.fill(); ctx.stroke();
      // blinking red light with a halo
      const blink = 0.55 + 0.45 * Math.sin(now / 180 + c.x);
      ctx.fillStyle = `rgba(255, 50, 80, ${blink})`; ctx.shadowColor = "rgba(255, 40, 70, 1)"; ctx.shadowBlur = 12;
      ctx.beginPath(); ctx.arc(x - k * 0.3, y, Math.max(3.5, k * 0.34), 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
      if(age < 0.8){ ctx.strokeStyle = `rgba(255, 60, 90, ${0.8 - age})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x - k * 0.3, y, 6 + age * 40, 0, Math.PI * 2); ctx.stroke(); }
    }
  }
  // Guards: red dots walking their beat; brighter as the laser passes
  if(heightPx > 1 && window.guards && window.cams && window.cams.some(c => c.shown)){
    const now = performance.now() / 1000;
    for(const g of window.guards){
      const k = (Math.sin(now * 0.8 + g.phase) + 1) / 2 * g.len;
      const gx = (g.horiz ? g.x + k : g.x) * step0 + cellSize / 2, gy = (g.horiz ? g.y : g.y + k) * step0 + cellSize / 2;
      const near = window.sweep != null ? Math.exp(-Math.pow((g.x + 0.5 + (g.horiz ? k : 0)) - window.sweep, 2) / 2) : 0;
      const r = Math.max(2.5, Math.min(6, cellSize * 0.3));
      ctx.fillStyle = `rgba(255, 70, 90, ${0.55 + 0.45 * near})`; ctx.shadowColor = "rgba(255,60,80,1)"; ctx.shadowBlur = 6 + near * 14;
      ctx.beginPath(); ctx.arc(gx, gy, r * (1 + near * 0.6), 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    }
  }
  // The drone's laser: a bright line across the floor with a thin light curtain up to roof height
  if(window.sweep != null && window.sweep > -1 && window.sweep < GRID + 1){
    const lx = window.sweep * step0, rh = mc.hx(heightPx), rv = mc.hy(heightPx);
    ctx.fillStyle = "rgba(120, 255, 220, 0.10)";
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, full); ctx.lineTo(lx + rh, full + rv); ctx.lineTo(lx + rh, rv); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(150, 255, 230, 0.95)"; ctx.lineWidth = 2; ctx.shadowColor = "rgba(120,255,220,1)"; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.moveTo(lx + rh, rv); ctx.lineTo(lx + rh, full + rv); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, full); ctx.stroke();
    ctx.shadowBlur = 0;
  }

  // Labels on the rooms, as crisp HTML over the view (text painted on the tilted canvas looked pixelated)
  if(heightPx > 1){
    const modeConfig = EXTRUSION_MODES[mode] || EXTRUSION_MODES[1];
    const hx = modeConfig.hx(heightPx), hy = modeConfig.hy(heightPx), step = cellSize + gap;
    const spots = sorted.map(r => ({ key: r, x: r.x * step + r.w * step / 2 + hx, y: r.y * step + r.h * step / 2 + hy,
      html: `${roomName(r)}<small>${Math.min(r.w, r.h)}×${Math.max(r.w, r.h)}</small>`, hot: window.gridHighlight === r }));
    if(window._exitAt) spots.push({ key: "exit", x: window._exitAt.x, y: window._exitAt.y, html: "FIRE EXIT", exit: true });
    placeGridTags(spots);
  } else placeGridTags([]);
}
window.addEventListener("resize", () => rerenderGrid());
window.addEventListener("scroll", () => rerenderGrid(), { passive: true });
// Projects canvas points to the screen with tiny probe elements inside the tilted canvas wrapper,
// then places plain (untilted) labels there
const gridTagEls = new Map(), gridProbes = new Map();
function placeGridTags(spots){
  const wrapEl = document.querySelector(".vault3d-wrap");
  let layer = document.querySelector(".gridTags");
  if(!layer){ layer = document.createElement("div"); layer.className = "gridTags"; document.body.appendChild(layer); }
  const seen = new Set(), pad = window.gridPad || { h: 0, v: 0 };
  spots.forEach(sp => {
    seen.add(sp.key);
    let pr = gridProbes.get(sp.key);
    if(!pr){ pr = document.createElement("i"); pr.style.cssText = "position:absolute;width:1px;height:1px;pointer-events:none"; wrapEl.appendChild(pr); gridProbes.set(sp.key, pr); }
    pr.style.left = (pad.h + sp.x) + "px"; pr.style.top = (pad.v + sp.y) + "px";
    let el = gridTagEls.get(sp.key);
    if(!el){ el = document.createElement("div"); layer.appendChild(el); gridTagEls.set(sp.key, el); }
    el.className = "gridTag" + (sp.hot ? " hot" : "") + (sp.exit ? " exit" : "");
    el.innerHTML = sp.html;
    const q = pr.getBoundingClientRect();
    el.style.left = q.left + "px"; el.style.top = q.top + "px";
  });
  // Nudge labels apart so neighbouring rooms' labels never sit on top of each other
  const boxes = [];
  [...gridTagEls.values()].sort((a, b) => parseFloat(a.style.top) - parseFloat(b.style.top)).forEach(el => {
    const w = el.offsetWidth, h = el.offsetHeight, x = parseFloat(el.style.left);
    let y = parseFloat(el.style.top), moved = true, guard = 0;
    while(moved && guard++ < 8){
      moved = false;
      for(const b of boxes){ if(Math.abs(x - b.x) < (w + b.w) / 2 + 4 && Math.abs(y - b.y) < (h + b.h) / 2 + 2){ y = b.y + (h + b.h) / 2 + 3; moved = true; } }
    }
    el.style.top = y + "px"; boxes.push({ x, y, w, h });
  });
  [...gridTagEls.keys()].forEach(k => { if(!seen.has(k)){ gridTagEls.get(k).remove(); gridTagEls.delete(k); const p = gridProbes.get(k); if(p){ p.remove(); gridProbes.delete(k); } } });
}
function rerenderGrid(){
  const a = window.animationState; if(!a) return;
  renderRectCuboids(a.ctx, a.rects, a.GRID, a.cellSize, a.gap, a.targetHeight, window.extrusionMode);
}

// Animate rectangle extrusion with painter's algorithm occlusion
function animateRectExtrusion(canvas, rects, GRID, duration=650){
  const ctx = canvas.getContext("2d");
  const dpr = window.devicePixelRatio || 1;
  
  // Size canvas to match grid dimensions (with DPR scaling)
  const gridW = gridEl.clientWidth;
  const gridH = gridEl.clientHeight;
  
  // Calculate cellSize from grid dimensions and gap
  const gap = parseFloat(getComputedStyle(gridEl).gap) || 0;
  const cellSize = (gridW - gap * (GRID - 1)) / GRID;
  
  // Add padding to canvas for extrusion overflow
  const verticalPad = buildingHeight(cellSize, gridW) * 1.2 + cellSize;  // room for the buildings to rise
  const horizontalPad = buildingHeight(cellSize, gridW) * 0.3 + cellSize * 0.6; // room for the slant
  
  const canvasW = gridW + horizontalPad * 2;
  const canvasH = gridH + verticalPad;
  
  // Set CSS dimensions to prevent clipping
  canvas.style.width = canvasW + "px";
  canvas.style.height = canvasH + "px";
  
  // DPR-scaled internal resolution
  canvas.width = Math.floor(canvasW * dpr);
  canvas.height = Math.floor(canvasH * dpr);
  
  // Translate canvas context to account for padding
  ctx.setTransform(dpr, 0, 0, dpr, horizontalPad * dpr, verticalPad * dpr);
  window.gridPad = { h: horizontalPad, v: verticalPad };
  
  console.log("Canvas setup: gridW=", gridW, "gridH=", gridH, "cellSize=", cellSize, "gap=", gap, "GRID=", GRID, "canvasW=", canvasW, "canvasH=", canvasH);
  console.log("Padding: horizontalPad=", horizontalPad, "verticalPad=", verticalPad);
  console.log("Rects sample:", rects.slice(0, 3).map(r => ({x: r.x, y: r.y, w: r.w, h: r.h})));
  
  // Fixed extrusion height (doubled for building-like appearance)
  const targetHeight = buildingHeight(cellSize, gridW);
  
  // Store animation state for mode switching
  window.animationState = {rects, GRID, cellSize, gap, targetHeight, ctx, canvas};
  
  // Enable debug visualization
  window.debugCellIndices = false;
  
  // Visual reference: draw expected rect bounds for first rect in light color
  const testRect = rects[0];
  if(testRect){
    const x0_test = testRect.x * (cellSize + gap);
    const y0_test = testRect.y * (cellSize + gap);
    const x1_test = x0_test + testRect.w * cellSize + (testRect.w - 1) * gap;
    const y1_test = y0_test + testRect.h * cellSize + (testRect.h - 1) * gap;
    console.log(`First rect [${testRect.x},${testRect.y}] ${testRect.w}×${testRect.h}: canvas coords (${x0_test}, ${y0_test}) to (${x1_test}, ${y1_test})`);
  }
  
  const start = performance.now();
  
  function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }
  
  function frame(now){
    const t = SKIPPING ? 1 : Math.min(1, (now - start) / duration);
    // The first third holds the flat arrays while their squares fade; then the rooms rise
    window.roofGrid = Math.max(0, 1 - t * 2.4) * 0.9;
    const heightPx = easeOutCubic(Math.max(0, (t - 0.18) / 0.82)) * targetHeight;
    
    renderRectCuboids(ctx, rects, GRID, cellSize, gap, heightPx, window.extrusionMode);
    
    if(t < 1) requestAnimationFrame(frame);
  }
  
  requestAnimationFrame(frame);
}

// Re-render current 3D view with different mode
function refreshExtrusionMode(){
  const state = window.animationState;
  if(!state || !state.rects) return;
  
  const {rects, GRID, cellSize, gap, targetHeight, ctx} = state;
  renderRectCuboids(ctx, rects, GRID, cellSize, gap, targetHeight, window.extrusionMode);
}
</script>
