<!doctype html>
<html lang="en" class="phase-hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · The Strongroom: Code Crack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 23 (Bertie's brief, "The Strongroom (Code Crack)"): the strongroom floor is protected by a rolling code.
     Readings rain down the terminal and freeze; the glowing ones follow a hidden pattern. Six beats:
       1 Intercept   the rain, then freeze (greys dim to ghosts, the code glows)
       2 Investigate tap a glowing reading and its picture builds (the first by hand, then the pad builds them);
                     a grey one never fits
       3 Name it     what do the glowing ones have in common? (L3: and the 10th one), then the decrypt
       4 Prove it    the sensor log with gaps: predict the next ones, a tumbler pin drops for each
       5 Use it      the pattern lays the safe route across the floor (each pattern its own floor)
       6 Debrief     ORACLE names the code, FOX and WREN cross, the code goes in the agent's codebook
     The pattern rotates (shared/primenet.js pickPattern); ?pattern=squares plays one pattern straight away.
     A pattern already in the codebook offers "Know this one?" (name it, predict, floor).
     One screen at 1280 × 720 and up: the pad / floor on the left (clear of the BRIEF and HINTS tabs), the terminal on the right. */
  main.tw{ width:min(1600px, 100%); height:100vh; height:100dvh; box-sizing:border-box; padding:10px 16px 40px; gap:8px; }
  main .tw-head{ padding-bottom:8px; } main .tw-head h1{ font-size:clamp(22px,2.6vw,30px); }
  .sr{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(0, 1fr); gap:12px; }
  .term{ display:flex; flex-direction:column; gap:8px; padding:12px 16px; min-height:0; background:#020a0c; font-family:var(--font-mono); overflow:hidden; }
  .term .hd, .floor .hd{ display:flex; justify-content:space-between; gap:10px; font:700 12px var(--font-ui); letter-spacing:.18em; color:#8feaff; }
  .term .hd #termLab.live{ color:#7dffc4; }
  .cmd{ font-size:15px; line-height:1.45; color:#ff9ae9; min-height:1.45em; }
  .cmd .ok{ color:#7dffc4; } .cmd .sys{ color:var(--text-faint); } .cmd .gold{ color:#ffe14d; }
  /* The readings, frozen after the rain */
  .rain{ position:relative; flex:none; display:grid; grid-template-columns:repeat(var(--cols), minmax(0,1fr)); grid-auto-rows:40px; gap:4px 6px; padding:6px 0; border-top:1px solid rgba(143,234,255,.15); border-bottom:1px solid rgba(143,234,255,.15); transition:opacity .5s; }
  .rain.in .rd{ animation:rdIn .5s ease-out backwards; animation-delay:calc(var(--i) * 14ms); }
  @keyframes rdIn{ from{ opacity:0; transform:translateY(-14px); } }
  .rain.dim{ opacity:.35; }
  .rd{ all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font:700 clamp(17px,1.9vw,24px) var(--font-mono); color:rgba(223,248,255,.42); border:1px solid transparent; position:relative; transition:color .5s, opacity .5s; }
  .rain.frozen .rd:not(.g){ color:rgba(223,248,255,.26); }
  .rd.g{ color:#7dffc4; text-shadow:0 0 10px rgba(125,255,196,.75); }
  .rain.frozen .rd.g{ animation:rdPulse 2.4s ease-in-out infinite; }
  @keyframes rdPulse{ 50%{ text-shadow:0 0 18px rgba(125,255,196,1), 0 0 4px #fff; } }
  .rd.on{ cursor:pointer; border-color:rgba(143,234,255,.16); background:rgba(8,26,31,.5); }
  .rd.g.on{ border-color:rgba(125,255,196,.45); background:rgba(10,40,30,.5); }
  .rd.on:hover, .rd.on:focus-visible{ border-color:#ffe14d; outline:none; }
  .rd.sel{ border-color:transparent !important; background:rgba(255,225,77,.12) !important; }
  /* corner brackets snap on, a scan line sweeps across */
  .rd.sel::before{ content:""; position:absolute; inset:-3px; pointer-events:none; animation:brk .22s ease-out;
    background:linear-gradient(#ffe14d 0 0) 0 0/10px 2px, linear-gradient(#ffe14d 0 0) 0 0/2px 10px, linear-gradient(#ffe14d 0 0) 100% 0/10px 2px, linear-gradient(#ffe14d 0 0) 100% 0/2px 10px,
      linear-gradient(#ffe14d 0 0) 0 100%/10px 2px, linear-gradient(#ffe14d 0 0) 0 100%/2px 10px, linear-gradient(#ffe14d 0 0) 100% 100%/10px 2px, linear-gradient(#ffe14d 0 0) 100% 100%/2px 10px; background-repeat:no-repeat; }
  @keyframes brk{ from{ inset:-12px; opacity:0; } }
  .rd.sel::after{ content:""; position:absolute; top:0; bottom:0; left:0; width:2px; background:#ffe14d; box-shadow:0 0 8px #ffe14d; animation:scanX .5s ease-in-out forwards; }
  @keyframes scanX{ to{ left:100%; opacity:0; } }
  .rd.done .tk, .rd.tried .tk{ position:absolute; right:3px; top:0; font-size:12px; text-shadow:none; }
  .rd.done .tk{ color:#ffe14d; } .rd.tried .tk{ color:#ff8aa0; }
  .rd.glitch{ animation:rdGl .36s steps(2) 1 !important; } @keyframes rdGl{ 33%{ transform:translateX(-3px); color:#ff8aa0; } 66%{ transform:translateX(3px); filter:hue-rotate(90deg); } }
  .rd.faint{ opacity:.35; }
  .rd.dec{ color:#ffe14d !important; text-shadow:0 0 12px rgba(255,225,77,.8) !important; animation:none !important; }
  .work{ display:flex; flex-direction:column; gap:8px; min-height:0; }
  .work:empty{ display:none; }
  .ask{ font:600 18px var(--font-ui); color:#f6feff; line-height:1.35; }
  .choices{ display:flex; flex-direction:column; gap:6px; }
  .choices button{ text-align:left; font:600 16px var(--font-ui); padding:8px 12px; color:#dff8ff; background:rgba(8,26,31,.9); border:1px solid rgba(143,234,255,.4); cursor:pointer; }
  .choices button kbd{ font:700 12px var(--font-mono); padding:1px 6px; margin-right:8px; border:1px solid currentColor; }
  .choices button:hover, .choices button:focus-visible{ border-color:#ffe14d; outline:none; }
  .choices button.no{ opacity:.45; text-decoration:line-through; }
  .choices button.yes{ border-color:#7dffc4; color:#a9ffd9; }
  .log{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; font-size:15px; line-height:1.4; color:#9fffd4; }
  .log .sys{ color:var(--text-faint); } .log .ok{ color:#7dffc4; } .log .bad{ color:#ff8aa0; } .log .me{ color:#ff9ae9; } .log .gold{ color:#ffe14d; } .log .cy{ color:#8feaff; }
  .log .radio{ color:#bfefff; font-family:var(--font-ui); font-weight:600; } .log .radio b{ color:#6ec8ff; letter-spacing:.12em; margin-right:6px; }
  /* Prove it: the sensor log with gaps, and the tumbler pins */
  .seq{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:700 26px var(--font-mono); color:#dff8ff; }
  .seq b{ color:#7dffc4; text-shadow:0 0 8px rgba(125,255,196,.5); } .seq .sep{ color:var(--text-faint); font-size:18px; }
  .seq input{ width:2.9em; font:700 24px var(--font-mono); text-align:center; color:#ffe14d; background:rgba(8,26,31,.95); border:1px solid rgba(143,234,255,.4); padding:2px 0; }
  .seq input:focus{ outline:none; border-color:#ffe14d; box-shadow:0 0 10px rgba(255,225,77,.35); }
  .seq input:disabled{ opacity:.4; } .seq input.right{ opacity:1; border-color:#7dffc4; color:#7dffc4; }
  .seq input.glitch{ animation:rdGl .36s steps(2) 1; }
  .pins{ display:flex; gap:12px; align-items:flex-end; height:46px; padding:0 4px; border-bottom:2px solid rgba(143,234,255,.3); }
  .pins .pin{ width:14px; height:36px; background:linear-gradient(#8feaff, #3b7d8c); border-radius:3px 3px 0 0; transform:translateY(-8px); transition:transform .25s cubic-bezier(.5,1.8,.6,1), background .25s; }
  .pins .pin.drop{ transform:translateY(8px); background:linear-gradient(#ffe14d, #a8860c); }
  .pins.open .pin{ background:linear-gradient(#7dffc4, #2fbf8a); box-shadow:0 0 10px rgba(125,255,196,.6); }
  .pins small{ font:700 12px var(--font-ui); letter-spacing:.16em; color:#8feaff; margin-left:auto; align-self:center; }
  .row1{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row1 input{ width:4em; font:700 24px var(--font-mono); text-align:center; color:#ffe14d; background:rgba(8,26,31,.95); border:1px solid rgba(143,234,255,.4); }
  .row1 input:focus{ outline:none; border-color:#ffe14d; }
  /* The tray of safe readings (the route) */
  .tray{ display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start; }
  .card{ all:unset; box-sizing:border-box; min-width:74px; padding:8px 10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:grab; touch-action:none; user-select:none;
    font:700 30px/1 var(--font-mono); color:#7dffc4; text-shadow:0 0 10px rgba(125,255,196,.6); background:rgba(10,40,30,.7); border:1px solid rgba(125,255,196,.6); }
  .card small{ font:600 12px var(--font-ui); letter-spacing:.08em; color:rgba(223,248,255,.7); text-shadow:none; min-height:1.2em; }
  .card:hover, .card:focus-visible{ border-color:#ffe14d; outline:none; }
  .card.used{ visibility:hidden; }
  .floor{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; min-height:0; position:relative; }
  .floor.shake{ animation:shake .32s ease-in-out 1; } @keyframes shake{ 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  .fwrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  /* The picture: dots that slide into each shape (the dot morph) */
  .picw{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .pic{ position:relative; flex:1; min-height:0; }
  .pic i{ position:absolute; left:0; top:0; border-radius:50%; background:#8feaff; box-shadow:0 0 8px rgba(143,234,255,.7); transition:transform .5s cubic-bezier(.4,.1,.2,1), width .5s, height .5s, background .4s, box-shadow .4s; }
  .pic i.g{ background:#7dffc4; box-shadow:0 0 8px rgba(125,255,196,.8); }
  .pic.lock i{ background:#ffe14d; box-shadow:0 0 10px rgba(255,225,77,.85); }
  .pic i.bad{ background:#ff6b8a; box-shadow:0 0 10px rgba(255,79,109,.8); }
  .pic .frame{ position:absolute; border:2px solid #ffe14d; box-shadow:0 0 18px rgba(255,225,77,.45); pointer-events:none; animation:frIn .3s ease-out; }
  @keyframes frIn{ from{ opacity:0; transform:scale(1.15); } }
  .pic.instant i{ transition:none; }
  .cap{ min-height:1.5em; text-align:center; font:700 18px var(--font-mono); color:#dff8ff; }
  .cap .gold{ color:#ffe14d; } .cap .bad{ color:#ff8aa0; } .cap .sys{ color:var(--text-faint); font-size:16px; }
  /* Name the rule: the evidence, then the choices */
  .evid{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:0 8px; }
  .evid .arrs{ display:flex; flex-wrap:wrap; gap:12px 22px; align-items:flex-end; }
  .evid .choices button{ padding:6px 12px; font-size:15px; }
  .evid figure{ margin:0; display:flex; flex-direction:column; align-items:center; gap:6px; font:700 15px var(--font-ui); color:#dff8ff; }
  .evid figure.ok figcaption{ color:#ffe14d; } .evid figure.gr figcaption{ color:#ff8aa0; }
  .mpic{ position:relative; }
  .mpic i{ position:absolute; border-radius:50%; background:#ffe14d; box-shadow:0 0 4px rgba(255,225,77,.6); }
  .mpic i.n{ background:#8feaff; box-shadow:none; } .mpic i.bad{ background:#ff6b8a; box-shadow:none; }
  /* The sketch pad / the floor */
  .fg{ position:relative; display:grid; gap:2px; padding:2px; background:#071216; border:2px solid rgba(110,200,255,.55); touch-action:none; user-select:none; }
  .fg .c{ position:relative; background:#0c1d24; border:1px solid rgba(143,234,255,.12); }
  .fg.pad .c{ background:#0a1a20; border-color:rgba(143,234,255,.16); cursor:crosshair; }
  .fg.pad .c.sel{ background:rgba(255,225,77,.35); border-color:#ffe14d; }
  .fg.pad .c.sel.off{ background:rgba(255,79,109,.3); border-color:#ff4f6d; }
  .fg .c.live{ background:repeating-linear-gradient(45deg, rgba(255,79,109,.16) 0 4px, transparent 4px 9px), #1a0d12; border-color:rgba(255,107,138,.22); }
  .fg .c.safe{ background:rgba(125,255,196,.07); border-color:rgba(125,255,196,.26); }
  .fg .c.pulse{ animation:plPulse .7s ease-out 1; } @keyframes plPulse{ 40%{ background:rgba(125,255,196,.6); box-shadow:inset 0 0 12px #eafff6; } }
  .fg .c.step{ background:rgba(125,255,196,.55) !important; box-shadow:inset 0 0 12px rgba(234,255,246,.8); }
  .fg .zone{ position:absolute; border:2px dashed rgba(125,255,196,.6); pointer-events:none; }
  .fg .arr{ position:absolute; display:flex; align-items:flex-end; justify-content:center; pointer-events:none; animation:sqIn .3s ease-out; }
  .fg .arr i{ position:absolute; inset:0; background-image:linear-gradient(var(--ac) 0 0); }
  .fg .arr b{ position:relative; margin-bottom:4px; font:700 15px var(--font-ui); letter-spacing:.04em; color:#fff; background:rgba(2,10,14,.82); padding:1px 7px; white-space:nowrap; }
  .fg .arr.rect{ --ac:rgba(110,200,255,.32); border:2px solid #6ec8ff; }
  .fg .arr.sq{ --ac:rgba(255,225,77,.3); border:2px solid #ffe14d; box-shadow:0 0 16px rgba(255,225,77,.45); }
  .fg .arr .grid{ position:absolute; inset:0; background-image:linear-gradient(90deg, rgba(2,10,14,.55) 1px, transparent 1px), linear-gradient(rgba(2,10,14,.55) 1px, transparent 1px); background-size:var(--cw) var(--cw); }
  .fg .tile{ position:absolute; border:2px solid #7dffc4; background:rgba(47,191,138,.34); box-shadow:0 0 14px rgba(125,255,196,.4); display:flex; align-items:center; justify-content:center; font:700 15px var(--font-ui); color:#eafff6; pointer-events:none; animation:sqIn .3s ease-out; }
  .fg .tile span{ background:rgba(2,10,14,.7); padding:1px 6px; white-space:nowrap; }
  @keyframes sqIn{ from{ transform:scale(.6); opacity:0; } }
  .fg .tip{ position:absolute; z-index:5; pointer-events:none; font:700 15px var(--font-mono); padding:3px 8px; background:rgba(2,10,14,.94); border:1px solid #ffe14d; color:#ffe14d; white-space:nowrap; }
  .fg .tip.off{ border-color:#ff4f6d; color:#ff8aa0; }
  .fg .door, .fg .safebox{ position:absolute; font:700 11px var(--font-ui); letter-spacing:.14em; padding:2px 6px; pointer-events:none; }
  .fg .door{ left:-2px; top:-24px; color:#7dffc4; border:1px solid #7dffc4; background:rgba(2,20,14,.9); }
  .fg .safebox{ right:-2px; bottom:-24px; color:#ffe14d; border:1px solid #ffe14d; background:rgba(30,24,2,.9); }
  .fg .agent{ position:absolute; z-index:6; border-radius:50%; transition:left .3s linear, top .3s linear; pointer-events:none; }
  .fg .agent.fox{ background:#6ec8ff; box-shadow:0 0 12px #6ec8ff; } .fg .agent.wren{ background:#bfefff; box-shadow:0 0 10px #bfefff; }
  .ghost{ position:fixed; z-index:9000; pointer-events:none; border:2px solid #7dffc4; background:rgba(47,191,138,.3); box-shadow:0 10px 26px rgba(0,0,0,.6);
    background-image:linear-gradient(90deg, rgba(2,10,14,.5) 1px, transparent 1px), linear-gradient(rgba(2,10,14,.5) 1px, transparent 1px); background-size:var(--cw) var(--cw);
    display:flex; align-items:center; justify-content:center; font:700 15px var(--font-ui); color:#eafff6; }
  .ghost span{ background:rgba(2,10,14,.75); padding:1px 6px; white-space:nowrap; }
  .ghost.off{ border-color:#ff4f6d; background-color:rgba(255,79,109,.25); }
  .ctl{ display:flex; gap:8px; justify-content:flex-end; min-height:0; }
  .ctl:empty{ display:none; }
  .ctl .pn-btn.known{ border-color:#ffe14d; color:#ffe14d; }
  .tw-msg{ min-height:1.4em; }
  /* The intercept: full-screen digital rain */
  #rainfx{ position:fixed; inset:0; z-index:7000; width:100vw; height:100vh; background:#000; transition:opacity .6s; pointer-events:none; }
  /* Access granted: a stamped banner */
  .granted{ position:fixed; left:50%; top:42%; z-index:7500; transform:translate(-50%, -50%) rotate(-4deg); pointer-events:none; padding:14px 34px; border:4px solid #7dffc4; color:#7dffc4; background:rgba(2,16,10,.88);
    font:700 clamp(30px, 5vw, 60px) var(--font-ui); letter-spacing:.22em; text-shadow:0 0 18px rgba(125,255,196,.8); box-shadow:0 0 40px rgba(125,255,196,.35); animation:grIn .6s steps(6) 1; transition:opacity .5s; }
  @keyframes grIn{ 0%{ clip-path:inset(0 100% 0 0); transform:translate(-50%, -50%) rotate(-4deg) scale(1.4); } 50%{ clip-path:inset(30% 0 40% 0); transform:translate(-48%, -50%) rotate(-4deg) scale(1.05); } 100%{ clip-path:inset(0); } }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ .rain.in .rd, .rain.frozen .rd.g, .fg .arr, .fg .tile, .rd.glitch, .rd.sel::before, .rd.sel::after, .floor.shake, .granted, .fg .c.pulse{ animation:none !important; } .fg .agent, .pic i{ transition:none; } }
  html.pn-reduce-motion .rain.in .rd, html.pn-reduce-motion .rain.frozen .rd.g, html.pn-reduce-motion .fg .arr, html.pn-reduce-motion .fg .tile, html.pn-reduce-motion .rd.glitch, html.pn-reduce-motion .rd.sel::before, html.pn-reduce-motion .rd.sel::after,
  html.pn-reduce-motion .floor.shake, html.pn-reduce-motion .granted, html.pn-reduce-motion .fg .c.pulse{ animation:none !important; }
  html.pn-reduce-motion .pic i{ transition:opacity .3s; }
  @media (max-width:980px){ main.tw{ height:auto; } .sr{ grid-template-columns:1fr; } .floor{ min-height:460px; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span id="stageLab"></span></div>
  <div class="sr">
    <section class="pn-panel floor" id="floorP" aria-label="Sketch pad and strongroom floor"><div class="hd"><span id="floorHd">SKETCH PAD</span><span id="floorLab"></span></div>
      <div class="fwrap" id="fwrap"><div class="fg" id="fg"></div></div>
      <div class="picw" id="picw" hidden><div class="pic" id="pic" aria-hidden="true"></div><div class="cap" id="cap" aria-live="polite"></div></div>
      <div class="evid" id="evid" hidden></div><div class="ctl" id="ctl"></div></section>
    <section class="pn-panel term" aria-label="Floor sensor terminal"><div class="hd"><span>FLOOR SENSORS · STRONGROOM</span><span id="termLab">CONNECTING…</span></div>
      <div class="cmd" id="cmd"></div>
      <div class="rain" id="rain" aria-label="Plate readings"></div>
      <div class="work" id="work"></div>
      <div class="log" id="log" aria-live="polite"></div></section>
  </div>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/detect.js"></script>
<script src="../shared/twist.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, PN = window.Primenet, $ = id => document.getElementById(id);
  const isSq = n => n >= 1 && Number.isInteger(Math.sqrt(n));
  const root = n => Math.round(Math.sqrt(n));

  // ===== Which pattern: ?pattern= plays one straight away; otherwise the rotation (teacher ticks, codebook) =====
  const BUILT = ["squares"];   // the patterns this page can play so far (Bertie's brief: one at a time)
  const ASK = new URLSearchParams(location.search).get("pattern");
  const PID = BUILT.includes(ASK) ? ASK : (PN && PN.pickPattern ? PN.pickPattern(BUILT) : BUILT[0]);
  const KNOWN = !!(PN && PN.codebook && PN.codebook()[PID]);

  const L = T.init({ id: "strongroomhack", stage: "THE HEIST", title: "THE STRONGROOM", eyebrow: "THE HEIST", briefTitle: "COMMS · ORACLE", briefStyle: "comms",
    goal: "Readings rain down the terminal. The <b>glowing</b> ones are the real code: they follow a hidden pattern. Tap them to see their pictures, name the rule, predict the next readings, then use it to lay the safe route from the <b>door</b> to the <b>safe</b>.",
    example: "Tap a glowing reading and its picture builds on the pad. Tap a grey one: it never fits the pattern.",
    context: "I'm in their floor system. The readings are live. The glowing ones are the real code. Find the rule.",
    story: "FOX and WREN are at the strongroom door. The floor is pressure plated, protected by a rolling code. ORACLE is in the floor system: crack the code and find the safe way across." });
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(r => setTimeout(r, ms / sp()));
  const RM = () => document.documentElement.classList.contains("pn-reduce-motion") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Levels: the same pool at every level; L3 adds the nth term and an open floor. max: the biggest reading; S: the
  // sketch pad; G: the floor in plates; gaps: predictions in the sensor log
  const LV = {
    L1: { max: 64, S: 10, G: 10, sides: [2, 3, 4, 5], k: [3, 4], rep: 1, outline: true, hintAfter: 2, gaps: 2, from: [1, 2] },
    L2: { max: 144, S: 12, G: 12, sides: [2, 3, 4, 5, 6], k: [4, 5], rep: 2, outline: true, hintAfter: 3, gaps: 3, from: [2, 3, 4] },
    L3: { max: 225, S: 15, G: 14, sides: [2, 3, 4, 5, 6, 7], k: [5, 6], rep: 2, outline: false, hintAfter: 99, gaps: 3, from: [3, 4, 5], nth: 10 },
  }[L] || null;
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function log(html, cls = ""){ const d = document.createElement("div"); d.className = cls; d.innerHTML = html; $("log").appendChild(d); while($("log").children.length > 6) $("log").firstChild.remove(); }
  const radio = (who, text) => { T.SND("radio"); log(`<b>${who}</b>${text}`, "radio"); };

  function tripped(){ const f = $("floorP"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }

  // ===== The pictures: dots on the pad (pts = [{ x, y, c }] in grid units) =====
  // Each pattern draws its readings as dots; the same dots slide from shape to shape (the dot morph)
  const pic = $("pic");
  function showPts(pts, { lock = false, instant = false, frame = null } = {}){
    const r = pic.getBoundingClientRect(), cols = Math.max(1, ...pts.map(p => p.x + 1)), rows = Math.max(1, ...pts.map(p => p.y + 1));
    const u = Math.max(6, Math.min(40, (r.width - 24) / cols, (r.height - 16) / rows)), d = Math.max(4, u * .7);
    const ox = (r.width - cols * u) / 2 + (u - d) / 2, oy = (r.height - rows * u) / 2 + (u - d) / 2;
    pic.classList.toggle("instant", instant || RM());
    while(pic.querySelectorAll("i").length < pts.length){ const i = document.createElement("i"); i.style.transform = `translate(${r.width / 2}px, ${r.height / 2}px)`; i.style.width = i.style.height = "0px"; pic.appendChild(i); }
    const dots = [...pic.querySelectorAll("i")];
    dots.slice(pts.length).forEach(i => i.remove());
    void pic.offsetWidth;
    pts.forEach((p, k) => { const i = dots[k]; i.className = p.c || ""; i.style.width = i.style.height = d + "px"; i.style.transform = `translate(${ox + p.x * u}px, ${oy + p.y * u}px)`; });
    pic.classList.toggle("lock", lock);
    pic.querySelectorAll(".frame").forEach(f => f.remove());
    if(frame){ const f = document.createElement("div"); f.className = "frame"; Object.assign(f.style, { left: (ox - (u - d) / 2 + frame.x * u - 4) + "px", top: (oy - (u - d) / 2 + frame.y * u - 4) + "px", width: (frame.w * u + 8) + "px", height: (frame.h * u + 8) + "px" }); pic.appendChild(f); }
  }
  // A small still picture for the evidence board
  function miniPic(pts, max = 96){
    const cols = Math.max(1, ...pts.map(p => p.x + 1)), rows = Math.max(1, ...pts.map(p => p.y + 1)), u = Math.max(4, Math.min(13, Math.floor(max / Math.max(cols, rows)))), d = Math.max(3, Math.round(u * .72));
    return `<div class="mpic" style="width:${cols * u}px;height:${rows * u}px">${pts.map(p => `<i class="${p.c || ""}" style="left:${p.x * u}px;top:${p.y * u}px;width:${d}px;height:${d}px"></i>`).join("")}</div>`;
  }
  const cap = html => { $("cap").innerHTML = html; };

  // ===== The pattern bank (one entry per pattern; Bertie's brief) =====
  const rectPts = (rows, cols, c = "") => Array.from({ length: rows * cols }, (_, i) => ({ x: i % cols, y: Math.floor(i / cols), c }));
  const PATTERNS = {
    squares: {
      code: "the square code", what: "square numbers",
      term: n => n * n, isTerm: isSq,
      pts: v => rectPts(root(v), root(v)),
      // the first one by hand: drag out an array on the sketch pad (rows × columns)
      hand: "array", handOk: v => v >= 4 && root(v) <= LV.S,
      // a glowing reading: its dots slide through every rectangle they make, and lock gold on the square
      async morph(v, green){
        const fits = T.pairs(v).filter(([a, b]) => b <= 30 && (a > 1 || v <= 12 || !green));
        for(const [a, b] of fits){
          if(over) return;
          const sq = a === b;
          showPts(rectPts(a, b), { lock: sq, frame: sq ? { x: 0, y: 0, w: a, h: a } : null });
          cap(sq ? `${v} = ${a} × ${a} <span class="gold">· a SQUARE</span>` : `${v} = ${a} × ${b}`);

          await wait(sq ? 900 : 720);
        }

        const n = Math.floor(Math.sqrt(v)), left = v - n * n;

      },
      greyPts: v => { const n = Math.floor(Math.sqrt(v)), left = v - n * n; return [...rectPts(n, n, "n"), ...Array.from({ length: left }, (_, j) => ({ x: n + 1 + Math.floor(j / n), y: j % n, c: "bad" }))]; },
      greyCap: v => { const n = Math.floor(Math.sqrt(v)); return `${v} = ${n} × ${n} + ${v - n * n}`; },
      okCap: v => `${v} = ${root(v)} × ${root(v)}`,
      rules(ctx){
        const odd = ctx.greens.find(v => v % 2) || 9, grey = ctx.grey || 12, gp = T.pairs(grey).find(([a]) => a > 1) || [1, grey];
        return [
          { t: "Each one makes a square: as many rows as columns (n × n)", ok: true },
          { t: "They're all even numbers", why: `${odd} glows, and ${odd} is odd.` },
          { t: "They go up by the same amount each time", why: "4 to 9 is 5 more, 9 to 16 is 7 more: the jumps get bigger." },
          { t: "Each one makes a rectangle", why: `So does ${grey} (${gp[0]} × ${gp[1]}), and ${grey} is grey.` },
        ];
      },
      cracked: "Square numbers: a number times itself. 4 = 2 × 2, 9 = 3 × 3, 16 = 4 × 4…",
      nthAsk: k => `How many dots does the ${ord(k)} square need?`,
      nthHint: k => `The 3rd is 3 × 3 = 9. The ${ord(k)} is ${k} × …?`,
      nthCap: k => `the ${ord(k)}: ${k} × ${k} = <span class="gold">${k * k}</span>`,
      hint: (k, tries) => tries < 2 ? `Not quite. ${(k - 1) * (k - 1)} is ${k - 1} × ${k - 1}. What's the next square?` : `The next one is ${k} × ${k}.`,
      failLine: "The safe plates were the square numbers: a number times itself (4 = 2 × 2, 9 = 3 × 3, 16 = 4 × 4…).",
    },
  };

  const ord = k => k + (k % 100 >= 11 && k % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][k % 10] || "th");

  // ===== The floors (beat 5): each pattern lays the safe route its own way =====
  const G = LV.G;
  const FLOORS = {
    // Squares (as Round 22): a chain of square zones, door (top left) to safe (bottom right); drag each reading onto one
    squares(){
      const { sides, k, rep } = LV;
      const overlap = (a, b) => a.x < b.x + b.n && b.x < a.x + a.n && a.y < b.y + b.n && b.y < a.y + a.n;
      let tries = 0;
      function dfs(sq){
        if(++tries > 20000) return null;
        const last = sq[sq.length - 1];
        if(last.x + last.n === G && last.y + last.n === G) return sq.length >= k[0] ? sq : null;
        if(sq.length >= k[1]) return null;
        const opts = [];
        for(const a of sides){
          if(sq.filter(s => s.n === a).length >= rep) continue;
          const ov = Math.min(2, a, last.n);
          for(let y = last.y - a + ov; y <= last.y + last.n - ov; y++) opts.push({ x: last.x + last.n, y, n: a });
          for(let x = last.x - a + ov; x <= last.x + last.n - ov; x++) opts.push({ x, y: last.y + last.n, n: a });
        }
        for(const s of T.shuffle(opts)){
          if(s.x < 0 || s.y < 0 || s.x + s.n > G || s.y + s.n > G || sq.some(t => overlap(t, s))) continue;
          const r = dfs([...sq, s]); if(r) return r;
        }
        return null;
      }
      let best = null, bs = 1e9;
      for(let c = 0; c < 14; c++){
        tries = 0; const r = dfs([{ x: 0, y: 0, n: T.pick(sides) }]); if(!r) continue;
        const s = r.reduce((m, q) => m + Math.abs((q.x + q.n / 2) - (q.y + q.n / 2)), 0) / r.length - new Set(r.map(q => q.n)).size * 1.5;
        if(s < bs){ bs = s; best = r; }
      }
      const zones = best, need = zones.map(z => z.n * z.n);
      const safeAt = Array.from({ length: G }, () => Array(G).fill(false));
      zones.forEach(z => { for(let x = z.x; x < z.x + z.n; x++) for(let y = z.y; y < z.y + z.n; y++) safeAt[y][x] = true; });
      return { safeAt, need, zones, run: () => squareRoute(zones, need, safeAt) };
    },
  };
  const F = FLOORS[PID]();
  W.need = F.need.slice(); W.zones = F.zones && F.zones.map(z => ({ ...z }));

  // ===== The readings: the route's numbers and more terms glow; grey decoys are never terms =====
  const COLS = 6, ROWS = 5;
  function readings(){
    const all = T.range(1, 60).map(P.term).filter(v => v <= LV.max);
    const g = [...new Set(F.need)];
    T.shuffle(all.filter(v => v > 1)).forEach(v => { if(g.length < 9 && !g.includes(v)) g.push(v); });
    if(!g.some(P.handOk)) g[g.length - 1] = all.find(P.handOk);
    // grey: near misses (the tricky ones), then numbers with lots of shapes, then any others
    const near = T.shuffle(all.filter(v => v > 6)).slice(0, 5).map(v => v + T.pick([-1, 1, 2, -2]));
    const rect = T.shuffle(T.range(6, LV.max).filter(v => T.pairs(v).length >= 2));
    const rest = T.shuffle(T.range(5, LV.max));
    const grey = [...new Set([...near, ...rect.slice(0, 14), ...rest])].filter(v => v >= 2 && v <= LV.max && !P.isTerm(v) && !g.includes(v)).slice(0, COLS * ROWS - g.length);
    return T.shuffle([...g, ...grey]).map(v => ({ v, g: P.isTerm(v) }));
  }
  const READ = readings();
  W.readings = READ.map(r => r.v); W.greens = READ.filter(r => r.g).map(r => r.v);
  const rain = $("rain"); rain.style.setProperty("--cols", COLS);
  const rdEls = () => [...rain.querySelectorAll(".rd")];

  // ===== 1. Intercept: full-screen digital rain, then the readings freeze =====
  async function intercept(){
    $("cmd").innerHTML = "$ floorsys.connect --zone STRONGROOM";
    T.SND("radio"); await wait(500);
    $("cmd").innerHTML = `$ floorsys.connect --zone STRONGROOM <span class="ok">✓</span> <span class="sys">· sensors.intercept</span>`;
    $("termLab").textContent = "INTERCEPTING"; $("termLab").classList.add("live");
    let skip = false;
    if(window.PNTest) PNTest.skip("Finish the intercept", () => { skip = true; });
    if(!RM()){
      const cv = document.createElement("canvas"); cv.id = "rainfx"; document.body.appendChild(cv);
      const dpr = Math.min(2, devicePixelRatio || 1), w = innerWidth, h = innerHeight; cv.width = w * dpr; cv.height = h * dpr;
      const x = cv.getContext("2d"); x.scale(dpr, dpr);

        const frame = now => {
          const dt = Math.min(50, now - last) * sp(); last = now;

            c.y += c.v * dt * .3;

            if(Math.floor(c.y / (fs * 1.3)) !== c.k){ c.k = Math.floor(c.y / (fs * 1.3)); c.s = String(T.pick(vals)); c.g = P.isTerm(+c.s); }
            x.fillStyle = c.g ? "#7dffc4" : "rgba(143,234,255,.55)"; x.fillText(c.s, i * fs * 1.6, c.y - fs * 1.3);
            x.fillStyle = "#eafff6"; x.fillText(c.s, i * fs * 1.6, c.y);
          });
          if(now - lastTick > 160){ lastTick = now; T.SND("tick"); }
          if(skip || over || (now - t0) * sp() > 2600) return res();
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);
      });
      cv.style.opacity = "0"; setTimeout(() => cv.remove(), 650);
    }
    // the freeze: off-pattern readings dim to ghosts, the code glows
    rain.innerHTML = READ.map((o, i) => `<button type="button" class="rd${o.g ? " g" : ""}" style="--i:${i}" data-v="${o.v}" tabindex="-1" disabled>${o.v}</button>`).join("");

    $("cmd").innerHTML = `$ sensors.freeze <span class="ok">✓</span> <span class="sys">· ${READ.length} readings, ${READ.filter(o => o.g).length} glowing</span>`;
    log("Glowing = the real code. Grey = noise.", "sys");
    await wait(600);
  }

  // ===== The sketch pad / the floor: one grid, rebuilt for each =====
  const fg = $("fg"); let N = 10, CS = 40, cells = [], labelsOn = false;
  function buildGrid(n, kind){
    N = n; fg.innerHTML = ""; cells = []; fg.className = "fg" + (kind === "pad" ? " pad" : "");
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){ const c = document.createElement("div"); c.className = "c"; c.dataset.x = x; c.dataset.y = y; fg.appendChild(c); cells.push(c); }
    labelsOn = kind === "floor";
    if(labelsOn) fg.insertAdjacentHTML("beforeend", `<span class="door">DOOR</span><span class="safebox">SAFE</span>`);
    fit();
  }
  const cell = (x, y) => cells[y * N + x];
  const px = v => 2 + v * (CS + 2);
  // Show one thing on the left: the pad/floor grid, the picture, or the evidence board
  function view(which){ $("fwrap").hidden = which !== "grid"; $("picw").hidden = which !== "pic"; $("evid").hidden = which !== "evid"; fit(); }
  function fit(){
    // clear of the BRIEF and HINTS tabs (bottom left): start right of the widest one
    const tabs = Math.max(150, ...[...document.querySelectorAll(".twb-chip")].map(c => c.getBoundingClientRect().right));
    ["fwrap", "evid", "picw"].forEach(id => { const e = $(id); e.style.paddingLeft = ""; if(!e.hidden) e.style.paddingLeft = Math.max(0, tabs + 14 - e.getBoundingClientRect().left) + "px"; });

    fg.style.setProperty("--cs", CS + "px"); fg.style.gridTemplateColumns = `repeat(${N}, ${CS}px)`; fg.style.gridAutoRows = CS + "px";
    fg.querySelectorAll("[data-gx]").forEach(place);
  }
  function place(el){ const x = +el.dataset.gx, y = +el.dataset.gy, w = +el.dataset.gw, h = +el.dataset.gh;
    Object.assign(el.style, { left: px(x) + "px", top: px(y) + "px", width: (w * (CS + 2) - 2) + "px", height: (h * (CS + 2) - 2) + "px" }); el.style.setProperty("--cw", (CS + 2) + "px"); }
  function lay(cls, x, y, w, h, html){ const d = document.createElement("div"); d.className = cls; d.dataset.gx = x; d.dataset.gy = y; d.dataset.gw = w; d.dataset.gh = h; d.innerHTML = html || ""; fg.appendChild(d); place(d); return d; }

  // Drag out a rectangle on the sketch pad (rows × columns)
  let onRect = null;
  (function padDrag(){
    let a = null, b = null; const tip = document.createElement("div"); tip.className = "tip"; tip.hidden = true;
    const at = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.classList && t.classList.contains("c") && fg.contains(t) ? [+t.dataset.x, +t.dataset.y] : null; };

      cells.forEach(c => c.classList.remove("sel", "off")); if(!a){ tip.hidden = true; return; }
      const r = rect(), off = W.target && r.w * r.h !== W.target;
      for(let y = r.y; y < r.y + r.h; y++) for(let x = r.x; x < r.x + r.w; x++){ const c = cell(x, y); c.classList.add("sel"); if(off) c.classList.toggle("off", r.w * r.h > W.target); }
      if(!tip.isConnected) fg.appendChild(tip);

    fg.addEventListener("pointermove", e => { if(!a) return; const c = at(e); if(c && (c[0] !== b[0] || c[1] !== b[1])){ b = c; paint(); T.SND("plot"); } });
    const up = () => { if(!a) return; const r = rect(); a = b = null; paint(); if(onRect) onRect(r); };

  })();
  function stamp(r, kind){
    fg.querySelectorAll(".arr").forEach(o => { const ox = +o.dataset.gx, oy = +o.dataset.gy, ow = +o.dataset.gw, oh = +o.dataset.gh;

  }

  const ctl = $("ctl");
  const button = (label, cls, fn) => { const b = document.createElement("button"); b.type = "button"; b.className = "pn-btn " + (cls || ""); b.innerHTML = label; b.addEventListener("click", fn); ctl.appendChild(b); return b; };

  // ===== 2. Investigate: the first glowing reading by hand, then the pad builds them; a grey one never fits =====
  // Resolves "full" (go on to name the rule) or "quick" (Know this one?)
  async function investigate(){
    setStage("investigate");
    $("stageLab").textContent = "Step 1 of 4 · investigate the readings";
    buildGrid(LV.S, "pad"); view("grid"); $("floorHd").textContent = "SKETCH PAD"; $("floorLab").textContent = `${LV.S} × ${LV.S}`;

    return await new Promise(res => {
      let ruleBtn = null, quickBtn = null;
      if(KNOWN){
        quickBtn = button("Know this one? ▸", "known", () => { if(busy) return; T.SND("click"); finish("quick"); });
        log(`${P.code.toUpperCase()} is in your codebook.`, "gold");
      }
      function finish(how){ if(over) return; els.forEach(e => { e.classList.remove("on", "sel"); e.disabled = true; e.tabIndex = -1; }); ctl.innerHTML = ""; onRect = null; res(how); }
      function nextPrompt(){
        if(!handDone) return;
        const g = greensSeen();
        if(g < 2){ say("Tap another glowing reading: this time the pad builds it for you."); T.step("Tap another <b>glowing</b> reading and watch its picture build.", { name: "Investigate" }); return; }
        if(W.grey == null){ say("Now tap a grey one. Does it make the same shape?"); T.step("Tap a <b>grey</b> reading. Does it make the same shape as the glowing ones?", { name: "Investigate" }); return; }
        if(!ruleBtn){ ruleBtn = button("Got the rule? ▸", "primary", () => { if(busy) return; T.SND("click"); finish("full"); }); ruleBtn.focus({ preventScroll: true }); }
        say("Seen enough? Press Got the rule, or tap more readings.");
        T.step("Tap more readings if you like. When you can say what the glowing ones have in common, press <b>Got the rule?</b>", { name: "Investigate" });
      }
      async function auto(e){
        const v = +e.dataset.v, green = P.isTerm(v);
        busy = true; view("pic"); $("floorHd").textContent = `PICTURE · ${v}`; $("floorLab").textContent = green ? "GLOWING" : "GREY";
        log(`> picture.build ${v}`, "me");
        const ok = await P.morph(v, green);
        busy = false; if(over) return;
        e.classList.remove("sel"); mark(e, ok);
        if(!W.seen.includes(v)) W.seen.push(v);
        if(ok){ log(`${P.okCap(v)} <span class="gold">· fits</span>`, "ok"); }
        else { W.grey = W.grey == null ? v : W.grey; T.SND("denied"); e.classList.remove("glitch"); void e.offsetWidth; e.classList.add("glitch"); log(`${P.greyCap(v)} <span class="sys">· never fits</span>`, "bad"); }
        nextPrompt();
      }
      const pickR = e => {
        if(over || busy || stage !== "investigate") return;
        const v = +e.dataset.v;
        rdEls().forEach(o => o.classList.remove("sel")); void e.offsetWidth; e.classList.add("sel"); el = e; T.SND("tag");
        if(part === "hand"){
          if(!P.isTerm(v)){ say("Start with a glowing one: build it on the sketch pad.", "warn"); e.classList.remove("sel"); return; }
          if(!P.handOk(v)){ say(`${v} is too big for the sketch pad. Pick a smaller glowing one.`, "warn"); e.classList.remove("sel"); return; }
          W.target = v; tries = 0; fg.querySelectorAll(".arr").forEach(o => o.remove());
          $("floorHd").textContent = `SKETCH PAD · BUILD ${v}`;
          say(`Build ${v}: drag out ${v} squares on the sketch pad.`);
          return;
        }
        auto(e);
      };
      els.forEach(e => e.addEventListener("click", () => pickR(e)));
      // the hand build: an array of the reading, until it's a square
      onRect = r => {
        if(stage !== "investigate" || part !== "hand") return;
        if(!W.target){ say("Tap a glowing reading first.", "warn"); return; }
        const p = r.w * r.h, v = W.target;
        if(p !== v){ T.SND("untag"); say(`${r.h} × ${r.w} = ${p}. You need ${v} squares.`, "warn"); return; }
        if(r.w !== r.h){
          stamp(r, "rect"); T.SND("tag"); tries++;
          log(`${v} = ${r.h} × ${r.w} <span class="sys">· a rectangle</span>`, "cy");
          say(tries >= LV.hintAfter ? `${r.h} × ${r.w} = ${v} ✓ Now try as many rows as columns: what number times itself makes ${v}?` : `${r.h} × ${r.w} = ${v} ✓ That's ${v}. Can you build ${v} another way, so it looks more special?`, "ok");
          if(tries === LV.hintAfter) T.step(`Try the <b>same number of rows as columns</b>. What number times itself makes ${v}?`, { name: "Investigate" });
          return;
        }
        stamp(r, "sq"); T.SND("lockon");
        mark(el, true); el.classList.remove("sel");
        W.seen.push(v); W.target = 0; part = "auto"; handDone = true;
        log(`${v} = ${r.h} × ${r.w} <span class="gold">· a SQUARE</span>`, "ok");
        say(`${r.h} × ${r.w} = ${v}: a square! As many rows as columns.`, "ok");
        setTimeout(() => { if(stage === "investigate") nextPrompt(); }, 1500 / sp());
      };
      // Teacher SKIP, one step at a time
      if(window.PNTest) PNTest.skip("Investigate a reading", () => {
        if(busy) return;
        if(part === "hand"){ const e = els.find(o => P.isTerm(+o.dataset.v) && P.handOk(+o.dataset.v)); pickR(e); const n = root(+e.dataset.v); onRect({ x: 0, y: 0, w: n, h: n }); return; }
        if(greensSeen() < 2){ pickR(els.find(o => P.isTerm(+o.dataset.v) && !W.seen.includes(+o.dataset.v))); return; }
        if(W.grey == null){ pickR(els.find(o => !P.isTerm(+o.dataset.v) && T.pairs(+o.dataset.v).length >= 2) || els.find(o => !P.isTerm(+o.dataset.v))); return; }
        finish("full");
      });
    });
  }

  // ===== 3. Name the rule: the pictures are the evidence; a right answer decrypts the readings =====
  async function nameRule(quick){
    setStage("name");
    $("stageLab").textContent = "Step 2 of 4 · name the rule";
    const greens = READ.filter(o => o.g).map(o => o.v);
    // the evidence: the readings they looked at (the quick path: two glowing ones the pad shows them)
    let seenG = W.seen.filter(P.isTerm).slice(0, 4);
    if(seenG.length < 2) seenG = [...seenG, ...T.shuffle(greens.filter(v => v > 1 && !seenG.includes(v) && v <= 100))].slice(0, 3);
    const figs = seenG.map(v => `<figure class="ok">${miniPic(P.pts(v))}<figcaption>${P.okCap(v)}</figcaption></figure>`).join("")
      + (W.grey != null ? `<figure class="gr">${miniPic(P.greyPts(W.grey))}<figcaption>${P.greyCap(W.grey)}</figcaption></figure>` : "");
    const C = T.shuffle(P.rules({ greens, grey: W.grey }));
    view("evid"); $("floorHd").textContent = "EVIDENCE"; $("floorLab").textContent = "";
    const ev = $("evid");
    ev.innerHTML = `<div class="arrs">${figs}</div><div class="ask">What do the glowing readings have in common?</div><div class="choices">${C.map((c, i) => `<button type="button" data-k="${i}"><kbd>${i + 1}</kbd>${c.t}</button>`).join("")}</div>`;
    T.step(quick ? "You've cracked this code before. What do the glowing readings have in common?" : "Look at the pictures. What does every glowing reading make that the grey one can't?", { name: "Name the rule" });
    say("");
    ev.querySelector("button").focus({ preventScroll: true });
    await new Promise(res => {
      let done = false;
      const pick = k => {
        if(done || over) return; const c = C[k], b = ev.querySelector(`[data-k="${k}"]`);
        if(c.ok){ done = true; b.classList.add("yes"); document.removeEventListener("keydown", key); res(); return; }
        if(b.classList.contains("no")) return;
        b.classList.add("no"); alarm.hit(); say(`Not quite: ${c.why}`, "bad");
      };
      const key = e => { const k = +e.key - 1; if(k >= 0 && k < C.length && !e.ctrlKey && !e.metaKey && !e.altKey && e.target.tagName !== "INPUT"){ e.preventDefault(); pick(k); } };
      ev.querySelectorAll("button").forEach(b => b.addEventListener("click", () => pick(+b.dataset.k)));
      document.addEventListener("keydown", key);
      if(window.PNTest) PNTest.skip("Name the rule", () => pick(C.findIndex(c => c.ok)));
    });
    if(over) return;
    ev.querySelectorAll("button").forEach(b => { b.disabled = true; });
    await decrypt();
    log(`CIPHER: ${P.code.toUpperCase()}`, "gold");
    say(P.cracked, "ok");
    T.say("That's the cipher. Now predict the next ones and we have the route.");
    if(LV.nth) await nthTerm();
  }
  // The cracked effect: the glowing readings scramble through random digits, then settle one by one
  async function decrypt(){
    T.SND("rise");
    $("cmd").innerHTML = `$ cipher.solve <span class="gold">· decrypting…</span>`;
    const gs = rdEls().filter(e => e.classList.contains("g")), gr = rdEls().filter(e => !e.classList.contains("g"));
    gr.forEach(e => e.classList.add("faint"));
    if(!RM()){
      await Promise.all(gs.map((e, i) => new Promise(r => {
        const v = e.dataset.v, tk = e.querySelector(".tk"); let n = 0;
        setTimeout(() => { const t = setInterval(() => {
          e.firstChild.nodeValue = n++ < 10 ? String(Math.floor(Math.random() * Math.pow(10, v.length))).padStart(v.length, "0") : v;
          if(n > 10){ clearInterval(t); e.classList.add("dec"); r(); }
        }, 55 / sp()); }, i * 110 / sp());
        if(tk) tk.remove();
      })));
    } else gs.forEach(e => e.classList.add("dec"));
    T.SND("thunk");
    $("cmd").innerHTML = `$ cipher.solve <span class="ok">✓</span> <span class="gold">${P.code.toUpperCase()}</span>`;
    await wait(500);
  }
  // L3: the nth term, then the pad builds it to check
  async function nthTerm(){
    const k = LV.nth, ans = P.term(k), w = $("work");
    w.innerHTML = `<div class="ask">${P.nthAsk(k)}</div><div class="row1"><input id="nth" inputmode="numeric" maxlength="4" aria-label="${P.nthAsk(k)}"><button type="button" class="pn-btn primary" id="nthGo">Check</button></div>`;
    T.step(`${P.nthAsk(k)} Type it and press Enter.`, { name: "The 10th one" });
    const inp = $("nth"); inp.focus({ preventScroll: true });
    await new Promise(res => {
      let tries = 0;
      const check = () => {
        if(over) return; const v = +inp.value.trim(); if(!inp.value.trim()) return;
        if(v === ans){ res(); return; }
        tries++; alarm.hit(); inp.classList.remove("glitch"); void inp.offsetWidth; inp.classList.add("glitch"); inp.select();
        say(tries < 2 ? `Not quite. ${P.nthHint(k)}` : `It's ${P.term(k)}: ${P.nthCap(k).replace(/<[^>]+>/g, "")}.`, "bad");
      };
      inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } });
      $("nthGo").addEventListener("click", check);
      if(window.PNTest) PNTest.skip("The 10th one", () => { inp.value = ans; check(); });
    });
    if(over) return;
    w.innerHTML = "";
    view("pic"); $("floorHd").textContent = `PICTURE · THE ${ord(k).toUpperCase()}`;
    showPts(P.pts(ans), { lock: true }); cap(P.nthCap(k)); T.SND("lockon");
    log(`${ord(k)}: ${ans} ✓`, "ok"); say(`Right: ${ans}. The pad builds it to check.`, "ok");
    await wait(1800);
  }

  // ===== 4. Prove it: the sensor log with gaps; predict the next ones, a tumbler pin drops for each =====
  async function prove(){
    setStage("prove");
    $("stageLab").textContent = "Step 3 of 4 · prove it: predict the next readings";
    const k0 = T.pick(LV.from), shown = 4, n = LV.gaps;
    const seq = T.range(k0, k0 + shown + n - 1);
    const w = $("work");
    w.innerHTML = `<div class="pins" id="pins">${"<span class=\"pin\"></span>".repeat(n)}<small>LOCK</small></div>
      <div class="ask">Sensor log: predict the next ${n === 2 ? "two" : "three"} readings</div>
      <div class="seq">${seq.map((k, i) => i < shown ? `<b>${P.term(k)}</b>` : `<input inputmode="numeric" maxlength="4" data-k="${k}" aria-label="Next reading ${i - shown + 1}" disabled>`).join('<span class="sep">·</span>')}</div>`;
    view("pic"); $("floorHd").textContent = "PICTURE"; $("floorLab").textContent = "";
    showPts(P.pts(P.term(seq[shown - 1]))); cap(`${P.term(seq[shown - 1])} <span class="sys">· the last reading</span>`);
    T.step(`Use the rule: what comes next in the sensor log? Type each reading and press Enter. Each one you get right drops a pin in the lock.`, { name: "Prove it" });
    say("What comes next? Type it and press Enter.");
    const ins = [...w.querySelectorAll(".seq input")];
    await new Promise(res => {
      let at = 0, tries = 0;
      const open = () => { ins.forEach((i, j) => { i.disabled = j !== at; }); ins[at].focus({ preventScroll: true }); };
      const check = () => {
        if(over) return; const inp = ins[at]; if(!inp.value.trim()) return;
        const k = +inp.dataset.k, want = P.term(k);
        if(+inp.value.trim() === want){
          inp.classList.add("right"); inp.disabled = true; tries = 0;
          $("pins").children[at].classList.add("drop"); T.SND("latch");
          showPts(P.pts(want), { lock: true }); cap(`${P.okCap(want)} <span class="gold">✓</span>`);
          log(`predicted ${want} ✓`, "ok");
          at++;
          if(at >= ins.length){ $("pins").classList.add("open"); T.SND("lock"); res(); return; }
          say("Pin's down. And the next?", "ok"); open(); return;
        }
        tries++; alarm.hit(); inp.classList.remove("glitch"); void inp.offsetWidth; inp.classList.add("glitch"); inp.select();
        say(P.hint(k, tries), "bad"); log(`${inp.value} ✗`, "bad");
      };
      ins.forEach(i => i.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); check(); } }));
      open();
      if(window.PNTest) PNTest.skip("Predict the next reading", () => { const i = ins[at]; i.value = P.term(+i.dataset.k); check(); });
    });
    if(over) return;
    await granted();
  }
  async function granted(){
    const g = document.createElement("div"); g.className = "granted"; g.textContent = "ACCESS GRANTED"; document.body.appendChild(g);
    T.SND("success"); T.say("Lock's open. We have the route.");
    await wait(1500); g.style.opacity = "0"; setTimeout(() => g.remove(), 520);
    $("work").innerHTML = "";
  }

  // ===== 5. Use it: squares. Drag each safe reading onto the floor: it fills a square zone =====
  const tiles = [];
  const covered = (x, y) => tiles.some(t => x >= t.x && x < t.x + t.n && y >= t.y && y < t.y + t.n);
  let cards = [];
  async function squareRoute(zones, need, safeAt){
    function solvable(extra){
      const free = Array.from({ length: G }, (_, y) => Array.from({ length: G }, (_, x) => safeAt[y][x] && !covered(x, y)));
      if(extra) for(let x = extra.x; x < extra.x + extra.n; x++) for(let y = extra.y; y < extra.y + extra.n; y++) free[y][x] = false;
      const left = cards.filter(c => !c.used && c !== extra?.card).map(c => c.n);
      const cnt = {}; left.forEach(n => { cnt[n] = (cnt[n] || 0) + 1; });
      let nodes = 0;
      const go = () => {
        if(++nodes > 20000) return true;
        let fx = -1, fy = -1; outer: for(let y = 0; y < G; y++) for(let x = 0; x < G; x++) if(free[y][x]){ fx = x; fy = y; break outer; }
        if(fx < 0) return true;
        for(const n of Object.keys(cnt).map(Number)){
          if(!cnt[n] || fx + n > G || fy + n > G) continue;
          let ok = true; for(let y = fy; y < fy + n && ok; y++) for(let x = fx; x < fx + n; x++) if(!free[y][x]){ ok = false; break; }
          if(!ok) continue;
          const set = v => { for(let y = fy; y < fy + n; y++) for(let x = fx; x < fx + n; x++) free[y][x] = v; };
          set(false); cnt[n]--; const r = go(); set(true); cnt[n]++;
          if(r) return true;
        }
        return false;
      };
      return go();
    }
    const why = (x, y, n) => {
      if(x < 0 || y < 0 || x + n > G || y + n > G) return "off";
      for(let i = x; i < x + n; i++) for(let j = y; j < y + n; j++){ if(!safeAt[j][i]) return "live"; if(covered(i, j)) return "overlap"; }
      return "";
    };
    const w = $("work");
    cards = need.slice().sort((p, q) => q - p).map((n, i) => ({ n: root(n), v: n, used: false, i }));
    w.innerHTML = `<div class="ask">Safe readings: drag each one onto the floor</div><div class="tray" id="tray">${cards.map(c => `<button type="button" class="card" data-i="${c.i}">${c.v}<small>${W.seen.includes(c.v) ? `${c.n} × ${c.n}` : ""}</small></button>`).join("")}</div>`;
    T.step(`Drag each safe reading onto the floor: it becomes a square of plates (16 is 4 × 4). Fill every safe zone, so there's a path from the <b>door</b> to the <b>safe</b>. Keep off the red plates.`, { name: "Use it: the safe route" });
    say("Drag each reading onto a safe zone. What size of square is it?");
    await new Promise(res => {
      const update = () => { W.placed = tiles.length; if(cards.every(c => c.used)) res(); };
      const put = (c, x, y) => {
        c.used = true; w.querySelector(`.card[data-i="${c.i}"]`).classList.add("used");
        const el = lay("tile", x, y, c.n, c.n, `<span>${c.n} × ${c.n} = ${c.v}</span>`);
        tiles.push({ x, y, n: c.n, el }); T.SND("clamp");
        log(`${c.v} = ${c.n} × ${c.n} · zone filled`, "ok");
        say(`${c.v} = ${c.n} × ${c.n}: zone filled.`, "ok"); update();
      };
      function landing(c, gx, gy){
        const cand = [];
        for(let dy = -1; dy <= 1; dy++) for(let dx = -1; dx <= 1; dx++){ const x = gx + dx, y = gy + dy; if(!why(x, y, c.n)) cand.push({ x, y, d: Math.abs(dx) + Math.abs(dy), zone: zones.some(z => z.x === x && z.y === y && z.n === c.n) }); }
        cand.sort((p, q) => (q.zone - p.zone) || (p.d - q.d));
        return cand;
      }
      let drag = null;
      w.querySelectorAll(".card").forEach(b => b.addEventListener("pointerdown", e => {
        if(over) return; const c = cards[+b.dataset.i]; if(c.used) return; e.preventDefault();
        const g = document.createElement("div"); g.className = "ghost"; document.body.appendChild(g);
        const size = c.n * (CS + 2) - 2; Object.assign(g.style, { width: size + "px", height: size + "px" }); g.style.setProperty("--cw", (CS + 2) + "px");
        g.innerHTML = `<span>${c.n} × ${c.n} = ${c.v}</span>`; T.SND("tag");
        drag = { c, g, size }; move(e);
        window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
      }));
      const gridAt = (e, size) => { const r = fg.getBoundingClientRect(); return [Math.round((e.clientX - size / 2 - r.left - fg.clientLeft - 2) / (CS + 2)), Math.round((e.clientY - size / 2 - r.top - fg.clientTop - 2) / (CS + 2))]; };
      const overFloor = e => { const r = fg.getBoundingClientRect(); return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom; };
      function move(e){ if(!drag) return; drag.g.style.left = (e.clientX - drag.size / 2) + "px"; drag.g.style.top = (e.clientY - drag.size / 2) + "px";
        const [gx, gy] = gridAt(e, drag.size); drag.g.classList.toggle("off", overFloor(e) && !landing(drag.c, gx, gy).length); }
      function up(e){
        window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
        if(!drag) return; const { c, g, size } = drag; drag = null; g.remove();
        if(!overFloor(e) || over) return;
        const [gx, gy] = gridAt(e, size), spots = landing(c, gx, gy);
        const ok = spots.find(s => solvable({ x: s.x, y: s.y, n: c.n, card: c }));
        if(ok){ put(c, ok.x, ok.y); return; }
        if(spots.length){ T.SND("untag"); say(`If ${c.v} goes there, the zones left can't be filled by the readings you have. Try another spot.`, "warn"); return; }
        const k = why(gx, gy, c.n);
        if(k === "live"){ alarm.hit(); tripped(); radio("FOX", "Plate went off. Holding position."); } else T.SND("untag");
        say(k === "overlap" ? `That zone's already filled. ${c.v} is ${c.n} × ${c.n}: find a zone that size.`
          : k === "off" ? `${c.v} is ${c.n} × ${c.n}: there it would hang off the floor.`
          : `${c.v} is ${c.n} × ${c.n}: there it would step on live plates.`, k === "live" ? "bad" : "warn");
      }
      if(window.PNTest) PNTest.skip("Fill every zone", () => {
        zones.filter(z => !tiles.some(t => t.x === z.x && t.y === z.y && t.n === z.n)).forEach(z => { const c = cards.find(q => !q.used && q.n === z.n); if(c && !why(z.x, z.y, z.n)) put(c, z.x, z.y); });
      });
    });
  }
  async function useIt(){
    setStage("route");
    $("stageLab").textContent = "Step 4 of 4 · use it: lay the safe route";
    rain.classList.add("dim");
    buildGrid(G, "floor"); view("grid"); $("floorHd").textContent = "STRONGROOM FLOOR · PRESSURE PLATES"; $("floorLab").textContent = `${G} × ${G} PLATES`;
    for(let y = 0; y < G; y++) for(let x = 0; x < G; x++) cell(x, y).classList.add(F.safeAt[y][x] ? "safe" : "live");
    if(LV.outline && F.zones) F.zones.forEach(z => lay("zone", z.x, z.y, z.n, z.n));
    T.SND("scanline");
    log(`Safe route mapped from ${P.code}. Red plates are live.`, "sys");
    await F.run();
  }

  // ===== 6. Debrief: the plates pulse door → safe, FOX and WREN cross, the code goes in the codebook =====
  function crossPath(){
    const safeAt = F.safeAt, start = [0, 0], end = [G - 1, G - 1], key = (x, y) => x + "," + y, prev = new Map([[key(...start), null]]), q = [start];
    while(q.length){ const [x, y] = q.shift(); if(x === end[0] && y === end[1]) break;
      for(const [dx, dy] of [[-1, 0], [0, 1], [1, 0], [0, -1]]){ const nx = x + dx, ny = y + dy, k = key(nx, ny); if(nx >= 0 && ny >= 0 && nx < G && ny < G && safeAt[ny][nx] && !prev.has(k)){ prev.set(k, [x, y]); q.push([nx, ny]); } } }
    const out = []; for(let c = end; c; c = prev.get(key(...c))) out.unshift(c); return out;
  }
  async function debrief(){
    setStage("cross"); T.hideBrief();
    $("work").innerHTML = ""; $("stageLab").textContent = "Crossing";
    T.SND("powerup"); log(`> agents.cross(path) // ${P.code}`, "gold");
    T.say(`That's ${P.code}: ${P.what}. FOX, WREN: step only on the safe plates.`);
    const path = crossPath();
    for(let i = 0; i < path.length; i++){ const c = cell(path[i][0], path[i][1]); c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse"); if(i % 3 === 0) await wait(30); }
    await wait(500);
    radio("WREN", "Stepping on your first plate. Trusting you.");
    const dot = cls => { const d = document.createElement("div"); d.className = "agent " + cls; fg.appendChild(d); return d; };
    const fox = dot("fox"), wren = dot("wren");
    const put = (d, [x, y], k) => { const s = CS * k; Object.assign(d.style, { width: s + "px", height: s + "px", left: (px(x) + (CS - s) / 2) + "px", top: (px(y) + (CS - s) / 2) + "px" }); };
    put(fox, [0, 0], .5); put(wren, [0, 0], .4); fox.style.top = (parseFloat(fox.style.top) - CS) + "px"; wren.style.top = (parseFloat(wren.style.top) - CS) + "px";
    await wait(400);
    const stepMs = Math.max(140, Math.min(320, 5200 / path.length));
    for(let i = 0; i <= path.length + 1; i++){
      const f = path[Math.min(i, path.length - 1)]; put(fox, f, .5); cell(f[0], f[1]).classList.add("step");
      if(i >= 2) put(wren, path[Math.min(i - 2, path.length - 1)], .4);
      if(i % 2 === 0) T.SND("tick");
      await wait(stepMs);
    }
    if(PN && PN.crackPattern) PN.crackPattern(PID);
    T.SND("success"); log("Across. No plates triggered.", "ok"); log(`${P.code.toUpperCase()} added to your codebook.`, "gold");
    say("FOX and WREN are across. Not one plate went off.", "ok");
    T.say("We're across. Not one plate went off.");
    setStage("done");
    T.finish({ ok: true, title: "CODE CRACKED", lines: [`${P.code[0].toUpperCase() + P.code.slice(1)}: ${P.cracked}`, `The safe readings: ${[...new Set(F.need)].sort((p, q) => p - q).join(", ")}. Added to your codebook.`], auto: 1600 });
  }

  function fail(){
    if(over) return; over = true; setStage("failed");
    T.finish({ ok: false, title: "PLATE TRIPPED", lines: [P.failLine], note: "Too many quick wrong guesses and the alarm goes." });
  }

  buildGrid(LV.S, "pad"); $("floorLab").textContent = `${LV.S} × ${LV.S}`;
  (async () => {
    await new Promise(r => { if(!T.briefOpen()) return r(); const f = () => { if(!T.briefOpen()){ window.removeEventListener("pn-brief", f); r(); } }; window.addEventListener("pn-brief", f); });
    await intercept(); if(over) return;
    const how = await investigate(); if(over) return;
    await nameRule(how === "quick"); if(over) return;
    await prove(); if(over) return;
    await useIt(); if(over) return;
    await debrief();
  })();
})();
</script>
