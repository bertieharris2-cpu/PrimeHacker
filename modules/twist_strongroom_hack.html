<style>
  /* Round 23 (Bertie's brief, "The Strongroom (Code Crack)"): the strongroom floor is protected by a rolling code.
     Readings rain down the terminal and freeze; the glowing ones follow a hidden pattern. Six beats:
       1 Intercept   the rain, then freeze (greys dim to ghosts, the code glows)
       2 Investigate tap a glowing reading and its picture builds (the first by hand, then the pad builds them);
                     a grey one never fits
       3 Name it     what do the glowing ones have in common? (L3: and the 10th one), then the decrypt
       4 Prove it    the sensor log with gaps: predict the next ones, a tumbler pin drops for each
       5 Use it      the pattern lays the safe route across the floor (each pattern its own floor)
       6 Debrief     ORACLE names the code, FOX and WREN cross, the code goes in the agent's codebook
     The pattern rotates (shared/primenet.js pickPattern); ?pattern=squares plays one pattern straight away.
     A pattern already in the codebook offers "Know this one?" (name it, predict, floor).
     One screen at 1280 × 720 and up: the pad / floor on the left (clear of the BRIEF and HINTS tabs), the terminal on the right. */
  main.tw{ width:min(1600px, 100%); height:100vh; height:100dvh; box-sizing:border-box; padding:10px 16px 40px; gap:8px; }
  main .tw-head{ padding-bottom:8px; } main .tw-head h1{ font-size:clamp(22px,2.6vw,30px); }
  .sr{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0, 1.15fr) minmax(0, 1fr); gap:12px; }
  .term{ display:flex; flex-direction:column; gap:8px; padding:12px 16px; min-height:0; background:#020a0c; font-family:var(--font-mono); overflow:hidden; }
  .term .hd, .floor .hd{ display:flex; justify-content:space-between; gap:10px; font:700 12px var(--font-ui); letter-spacing:.18em; color:#8feaff; }
  .term .hd #termLab.live{ color:#7dffc4; }

  .cmd{ font-size:15px; line-height:1.45; color:#ff9ae9; min-height:1.45em; }
  .cmd .ok{ color:#7dffc4; } .cmd .sys{ color:var(--text-faint); } .cmd .gold{ color:#ffe14d; }
  /* The readings, frozen after the rain */
  .rain{ position:relative; flex:none; display:grid; grid-template-columns:repeat(var(--cols), minmax(0,1fr)); grid-auto-rows:40px; gap:4px 6px; padding:6px 0; border-top:1px solid rgba(143,234,255,.15); border-bottom:1px solid rgba(143,234,255,.15); transition:opacity .5s; }
  .rain.in .rd{ animation:rdIn .5s ease-out backwards; animation-delay:calc(var(--i) * 14ms); }
  @keyframes rdIn{ from{ opacity:0; transform:translateY(-14px); } }
  .rain.dim{ opacity:.35; }
  .rd{ all:unset; box-sizing:border-box; display:flex; align-items:center; justify-content:center; font:700 clamp(17px,1.9vw,24px) var(--font-mono); color:rgba(223,248,255,.42); border:1px solid transparent; position:relative; transition:color .5s, opacity .5s; }
  .rain.frozen .rd:not(.g){ color:rgba(223,248,255,.26); }
  .rd.g{ color:#7dffc4; text-shadow:0 0 10px rgba(125,255,196,.75); }
  .rain.frozen .rd.g{ animation:rdPulse 2.4s ease-in-out infinite; }
  @keyframes rdPulse{ 50%{ text-shadow:0 0 18px rgba(125,255,196,1), 0 0 4px #fff; } }
  .rd.on{ cursor:pointer; border-color:rgba(143,234,255,.16); background:rgba(8,26,31,.5); }
  .rd.g.on{ border-color:rgba(125,255,196,.45); background:rgba(10,40,30,.5); }
  .rd.on:hover, .rd.on:focus-visible{ border-color:#ffe14d; outline:none; }
  .rd.sel{ border-color:transparent !important; background:rgba(255,225,77,.12) !important; }
  /* corner brackets snap on, a scan line sweeps across */
  .rd.sel::before{ content:""; position:absolute; inset:-3px; pointer-events:none; animation:brk .22s ease-out;
    background:linear-gradient(#ffe14d 0 0) 0 0/10px 2px, linear-gradient(#ffe14d 0 0) 0 0/2px 10px, linear-gradient(#ffe14d 0 0) 100% 0/10px 2px, linear-gradient(#ffe14d 0 0) 100% 0/2px 10px,
      linear-gradient(#ffe14d 0 0) 0 100%/10px 2px, linear-gradient(#ffe14d 0 0) 0 100%/2px 10px, linear-gradient(#ffe14d 0 0) 100% 100%/10px 2px, linear-gradient(#ffe14d 0 0) 100% 100%/2px 10px; background-repeat:no-repeat; }
  @keyframes brk{ from{ inset:-12px; opacity:0; } }
  .rd.sel::after{ content:""; position:absolute; top:0; bottom:0; left:0; width:2px; background:#ffe14d; box-shadow:0 0 8px #ffe14d; animation:scanX .5s ease-in-out forwards; }
  @keyframes scanX{ to{ left:100%; opacity:0; } }
  .rd.done .tk, .rd.tried .tk{ position:absolute; right:3px; top:0; font-size:12px; text-shadow:none; }
  .rd.done .tk{ color:#ffe14d; } .rd.tried .tk{ color:#ff8aa0; }
  .rd.glitch{ animation:rdGl .36s steps(2) 1 !important; } @keyframes rdGl{ 33%{ transform:translateX(-3px); color:#ff8aa0; } 66%{ transform:translateX(3px); filter:hue-rotate(90deg); } }
  .rd.faint{ opacity:.35; }
  .rd.dec{ color:#ffe14d !important; text-shadow:0 0 12px rgba(255,225,77,.8) !important; animation:none !important; }
  .work{ display:flex; flex-direction:column; gap:8px; min-height:0; }
  .work:empty{ display:none; }
  .ask{ font:600 18px var(--font-ui); color:#f6feff; line-height:1.35; }

  .choices button kbd{ font:700 12px var(--font-mono); padding:1px 6px; margin-right:8px; border:1px solid currentColor; }
  .choices button:hover, .choices button:focus-visible{ border-color:#ffe14d; outline:none; }
  .choices button.no{ opacity:.45; text-decoration:line-through; }
  .choices button.yes{ border-color:#7dffc4; color:#a9ffd9; }
  .log{ flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:3px; font-size:15px; line-height:1.4; color:#9fffd4; }
  .log .sys{ color:var(--text-faint); } .log .ok{ color:#7dffc4; } .log .bad{ color:#ff8aa0; } .log .me{ color:#ff9ae9; } .log .gold{ color:#ffe14d; } .log .cy{ color:#8feaff; }
  .log .radio{ color:#bfefff; font-family:var(--font-ui); font-weight:600; } .log .radio b{ color:#6ec8ff; letter-spacing:.12em; margin-right:6px; }
  /* Prove it: the sensor log with gaps, and the tumbler pins */
  .seq{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; font:700 26px var(--font-mono); color:#dff8ff; }
  .seq b{ color:#7dffc4; text-shadow:0 0 8px rgba(125,255,196,.5); } .seq .sep{ color:var(--text-faint); font-size:18px; }
  .seq input{ width:2.9em; font:700 24px var(--font-mono); text-align:center; color:#ffe14d; background:rgba(8,26,31,.95); border:1px solid rgba(143,234,255,.4); padding:2px 0; }
  .seq input:focus{ outline:none; border-color:#ffe14d; box-shadow:0 0 10px rgba(255,225,77,.35); }
  .seq input:disabled{ opacity:.4; } .seq input.right{ opacity:1; border-color:#7dffc4; color:#7dffc4; }
  .seq input.glitch{ animation:rdGl .36s steps(2) 1; }
  .pins{ display:flex; gap:12px; align-items:flex-end; height:46px; padding:0 4px; border-bottom:2px solid rgba(143,234,255,.3); }
  .pins .pin{ width:14px; height:36px; background:linear-gradient(#8feaff, #3b7d8c); border-radius:3px 3px 0 0; transform:translateY(-8px); transition:transform .25s cubic-bezier(.5,1.8,.6,1), background .25s; }
  .pins .pin.drop{ transform:translateY(8px); background:linear-gradient(#ffe14d, #a8860c); }
  .pins.open .pin{ background:linear-gradient(#7dffc4, #2fbf8a); box-shadow:0 0 10px rgba(125,255,196,.6); }
  .pins small{ font:700 12px var(--font-ui); letter-spacing:.16em; color:#8feaff; margin-left:auto; align-self:center; }
  .row1{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .row1 input{ width:4em; font:700 24px var(--font-mono); text-align:center; color:#ffe14d; background:rgba(8,26,31,.95); border:1px solid rgba(143,234,255,.4); }
  .row1 input:focus{ outline:none; border-color:#ffe14d; }
  /* The tray of safe readings (the route) */
  .tray{ display:flex; flex-wrap:wrap; gap:10px; align-content:flex-start; }
  .card{ all:unset; box-sizing:border-box; min-width:74px; padding:8px 10px 6px; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:grab; touch-action:none; user-select:none;
    font:700 30px/1 var(--font-mono); color:#7dffc4; text-shadow:0 0 10px rgba(125,255,196,.6); background:rgba(10,40,30,.7); border:1px solid rgba(125,255,196,.6); }
  .card small{ font:600 12px var(--font-ui); letter-spacing:.08em; color:rgba(223,248,255,.7); text-shadow:none; min-height:1.2em; }
  .card:hover, .card:focus-visible{ border-color:#ffe14d; outline:none; }
  .card.used{ visibility:hidden; }
  .floor{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; min-height:0; position:relative; }
  .floor.shake{ animation:shake .32s ease-in-out 1; } @keyframes shake{ 25%{ transform:translateX(-5px); } 75%{ transform:translateX(5px); } }
  .fwrap{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center; }
  /* The picture: dots that slide into each shape (the dot morph) */
  .picw{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .pic{ position:relative; flex:1; min-height:0; }
  .pic i{ position:absolute; left:0; top:0; border-radius:50%; background:#8feaff; box-shadow:0 0 8px rgba(143,234,255,.7); transition:transform .5s cubic-bezier(.4,.1,.2,1), width .5s, height .5s, background .4s, box-shadow .4s; }
  .pic i.g{ background:#7dffc4; box-shadow:0 0 8px rgba(125,255,196,.8); }
  .pic.lock i{ background:#ffe14d; box-shadow:0 0 10px rgba(255,225,77,.85); }
  .pic i.bad{ background:#ff6b8a; box-shadow:0 0 10px rgba(255,79,109,.8); }
  .pic .frame{ position:absolute; border:2px solid #ffe14d; box-shadow:0 0 18px rgba(255,225,77,.45); pointer-events:none; animation:frIn .3s ease-out; }
  @keyframes frIn{ from{ opacity:0; transform:scale(1.15); } }
  .pic.instant i{ transition:none; }
  /* matchsticks: pale wood with a red head; gold when locked */
  .st line{ stroke:#e9c98f; stroke-linecap:round; } .st circle{ fill:#ff5a4f; }
  .pic svg.gates .st{ animation:stIn .2s ease-out backwards; filter:drop-shadow(0 0 3px rgba(233,201,143,.5)); }
  .pic svg.gates.lock .st line{ stroke:#ffe14d; } .pic svg.gates.lock .st{ filter:drop-shadow(0 0 5px rgba(255,225,77,.8)); }
  .pic svg.gates.demo .st{ opacity:.14; animation:none; transition:opacity .3s; } .pic svg.gates.demo .st.on, .pic svg.gates.demo .st.one{ opacity:1; }
  .pic svg.gates.demo .st.one line{ stroke:#6ec8ff; } .pic svg.gates.demo .st.grp1 line{ stroke:#ffe14d; } .pic svg.gates.demo .st.grp0 line{ stroke:#ffb35c; }
  @keyframes stIn{ from{ opacity:0; transform:translateY(-6px); } }
  .fg .arr svg.sticks{ position:absolute; inset:-1px; width:calc(100% + 2px); height:calc(100% + 2px); overflow:visible; }
  .fg .arr svg.sticks .st line{ stroke-width:4; vector-effect:non-scaling-stroke; }
  .fg.pad .arr.ms em, .fg.pad .arr.ms .tag{ display:none; }
  .fg.pad .arr.ms b{ top:50%; left:calc(100% + 10px); transform:translateY(-50%); font-size:13px; }
  .fg .arr.ms{ border-color:transparent !important; background:rgba(110,200,255,.08) !important; box-shadow:none !important; }
  .fg .arr.ms.sq svg.sticks .st line{ stroke:#ffe14d; } .fg .arr.ms.sq svg.sticks{ filter:drop-shadow(0 0 3px rgba(255,225,77,.8)); }
  .fg .lft.stick{ background:none; border:none; } .fg .lft.stick::after{ content:""; position:absolute; left:42%; top:4%; bottom:4%; width:16%; background:#ff4f6d; box-shadow:0 0 6px #ff4f6d; }
  /* The matchstick floor: laser bars along the corridor */
  .fg svg.bars{ position:absolute; pointer-events:none; overflow:visible; z-index:3; }
  .fg svg.bars line{ stroke:#ff3b5c; stroke-width:4; vector-effect:non-scaling-stroke; stroke-linecap:round; filter:drop-shadow(0 0 4px #ff3b5c); transition:stroke .4s, opacity .4s; }
  .fg svg.bars line.hide{ opacity:0; } .fg svg.bars line.off{ stroke:#2fbf8a; filter:none; opacity:.55; }
  .fg svg.bars line.pv{ opacity:1; stroke:#ffe14d; filter:drop-shadow(0 0 4px #ffe14d); }
  .fg svg.bars circle.em{ fill:#4a5a62; }
  .fg .gn{ position:absolute; z-index:4; pointer-events:none; display:flex; align-items:center; justify-content:center; font:700 11px var(--font-mono); color:rgba(223,248,255,.6); }
  .fg .gn.cp{ font-size:12px; color:#2a2100; } .fg .gn.cp span{ background:#ffe14d; padding:0 3px; white-space:nowrap; } .fg .gn.cp.done span{ background:#7dffc4; }
  .cap{ min-height:1.5em; text-align:center; font:700 18px var(--font-mono); color:#dff8ff; }
  .cap .gold{ color:#ffe14d; } .cap .bad{ color:#ff8aa0; } .cap .sys{ color:var(--text-faint); font-size:16px; }
  /* Name the rule: the evidence, then the choices */

  .evid figure.ok figcaption{ color:#ffe14d; } .evid figure.gr figcaption{ color:#ff8aa0; }
  .mpic{ position:relative; }

  .mpic i.n{ background:#8feaff; box-shadow:none; } .mpic i.bad{ background:#ff6b8a; box-shadow:none; }
  /* The sketch pad / the floor */
  .fg{ position:relative; display:grid; gap:2px; padding:2px; background:#071216; border:2px solid rgba(110,200,255,.55); touch-action:none; user-select:none; }
  .fg .c{ position:relative; background:#0c1d24; border:1px solid rgba(143,234,255,.12); }
  .fg.pad .c{ background:#0a1a20; border-color:rgba(143,234,255,.16); cursor:crosshair; }
  .fg.pad .c.sel{ background:rgba(255,225,77,.35); border-color:#ffe14d; }

  .fg .c.live{ background:repeating-linear-gradient(45deg, rgba(255,79,109,.16) 0 4px, transparent 4px 9px), #1a0d12; border-color:rgba(255,107,138,.22); }
  .fg .c.safe{ background:rgba(125,255,196,.07); border-color:rgba(125,255,196,.26); }
  .fg .c.pulse{ animation:plPulse .7s ease-out 1; } @keyframes plPulse{ 40%{ background:rgba(125,255,196,.6); box-shadow:inset 0 0 12px #eafff6; } }
  .fg .c.step{ background:rgba(125,255,196,.55) !important; box-shadow:inset 0 0 12px rgba(234,255,246,.8); }

  .fg .arr i{ position:absolute; inset:0; background-image:linear-gradient(var(--ac) 0 0); }

  .fg .arr.rect{ --ac:rgba(110,200,255,.32); border:2px solid #6ec8ff; }

  /* The intercept: a code flood like the Prime Hack's breach channel. The code's readings keep coming back; the noise never repeats */
  .flood{ position:fixed; inset:0; z-index:7000; display:flex; align-items:center; justify-content:center; background:rgba(3,10,12,.9); transition:opacity .5s; }

  .rx-ban{ font:600 18px/1.4 var(--font-ui); color:#f2fbfd; background:rgba(182,156,255,.14); border-left:4px solid #b69cff; padding:10px 14px; }
  .rx-ban b{ color:#ffd76a; } .rx-ban.done{ background:rgba(143,245,201,.14); border-left-color:#8ff5c9; }

  .cipher.dec .cmain{ grid-template-columns:minmax(0,1fr) 470px; grid-template-rows:auto minmax(0,1fr); }
  .cipher.dec .hist{ grid-column:1; grid-row:1 / span 2; } .cipher.dec .cside{ grid-column:2; grid-row:1; } .cipher.dec .cpic{ display:flex; grid-column:2; grid-row:2; min-height:0; border-left:1px solid rgba(143,234,255,.2); padding-left:14px; }
  .cipher.dec .rx-tab, .cipher.dec .rx-eq{ display:none; } .cipher.dec .rx-grid .rr{ font-size:26px; } .cipher.dec .rx-ban{ font-size:15px; padding:6px 10px; }
  .hterm .hist .req{ color:#10222a; background:#ffd76a; font-weight:600; padding:2px 8px; display:inline-block; margin:4px 0; }
  .hterm .prompt .req{ font:600 19px "IBM Plex Mono", monospace; color:#ffd76a; }
  .hterm .prompt .cd{ flex:1; min-width:90px; height:8px; border:1px solid rgba(255,215,106,.5); } .hterm .prompt .cd i{ display:block; height:100%; width:100%; background:#ffd76a; }
  .cap .k1{ color:#7fd4ff; }
  .cipher.dec .rx-grid .rr{ font-size:24px; } .cipher.dec .rx{ gap:6px; } .cipher.dec .cpic .picw{ min-height:200px; } .cipher.dec .cap{ font-size:14px; }

<body>
<main class="tw">
  <div class="tw-bar"><span id="stageLab"></span></div>
  <div class="sr">
    <section class="pn-panel floor" id="floorP" aria-label="Sketch pad and strongroom floor"><div class="hd"><span id="floorHd">SKETCH PAD</span><span id="floorLab"></span></div>
      <div class="fwrap" id="fwrap"><div class="fg" id="fg"></div></div>
      <div class="picw" id="picw" hidden><div class="pic" id="pic" aria-hidden="true"></div><div class="cap" id="cap" aria-live="polite"></div></div>
      <div class="evid" id="evid" hidden></div><div class="ctl" id="ctl"></div></section>
    <section class="pn-panel term" aria-label="Floor sensor terminal"><div class="hd"><span>FLOOR SENSORS · STRONGROOM</span><span id="termLab">CONNECTING…</span></div>
      <div class="cmd" id="cmd"></div>
      <div class="rain" id="rain" aria-label="Plate readings"></div>
      <div class="work" id="work"></div>
      <div class="log" id="log" aria-live="polite"></div></section>
  </div>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/detect.js"></script>
<script src="../shared/twist.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, PN = window.Primenet, $ = id => document.getElementById(id);
  const isSq = n => n >= 1 && Number.isInteger(Math.sqrt(n));
  const root = n => Math.round(Math.sqrt(n));

  // ===== Which pattern: ?pattern= plays one straight away; otherwise the rotation (teacher ticks, codebook) =====
  const BUILT = ["squares", "matchsticks"];   // the patterns this page can play so far (Bertie's brief: one at a time)
  const ASK = new URLSearchParams(location.search).get("pattern");
  const PID = BUILT.includes(ASK) ? ASK : (PN && PN.pickPattern ? PN.pickPattern(BUILT) : BUILT[0]);
  const KNOWN = !!(PN && PN.codebook && PN.codebook()[PID]);

  T.init({ levels: ["L1"], id: "strongroomhack", stage: "THE HEIST", title: "THE STRONGROOM", eyebrow: "THE HEIST", briefTitle: "COMMS · ORACLE", briefStyle: "comms",
    goal: "Readings rain down the terminal. The <b>glowing</b> ones are the real code: they follow a hidden pattern. Tap them to see their pictures, name the rule, predict the next readings, then use it to lay the safe route from the <b>door</b> to the <b>safe</b>.",
    example: "Tap a glowing reading and its picture builds on the pad. Tap a grey one: it never fits the pattern.",
    context: "I'm in their floor system. The readings are live. The glowing ones are the real code. Find the rule.",
    story: "FOX and WREN are at the strongroom door. The floor is pressure plated, protected by a rolling code. ORACLE is in the floor system: crack the code and find the safe way across." });
  // Bertie: L1 only for now ("if we establish level one we can then extend"). L2/L3 settings stay below for later.
  const L = "L1";
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(r => setTimeout(r, ms / sp()));
  const RM = () => document.documentElement.classList.contains("pn-reduce-motion") || matchMedia("(prefers-reduced-motion: reduce)").matches;
  // Levels: the same pool at every level; L3 adds the nth term and an open floor. max: the biggest reading; S: the
  // sketch pad; G: the floor in plates; gaps: predictions in the sensor log
  const LV = {
    L1: { max: 64, SW: 40, SH: 10, G: 10, sides: [2, 3, 4, 5], k: [3, 4], rep: 1, outline: true, hintAfter: 2, gaps: 2, from: [1, 2] },
    L2: { max: 144, SW: 26, SH: 14, G: 12, sides: [2, 3, 4, 5, 6], k: [4, 5], rep: 2, outline: true, hintAfter: 3, gaps: 3, from: [2, 3, 4] },
    L3: { max: 225, SW: 30, SH: 16, G: 14, sides: [2, 3, 4, 5, 6, 7], k: [5, 6], rep: 2, outline: false, hintAfter: 99, gaps: 3, from: [3, 4, 5], nth: 10 },
  }[L] || null;
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function log(html, cls = ""){ const d = document.createElement("div"); d.className = cls; d.innerHTML = html; $("log").appendChild(d); while($("log").children.length > 6) $("log").firstChild.remove(); }
  // ORACLE's box sits bottom right (here, or the mission page's over this one) and tucks away after a read;
  // while it's up, the terminal panel keeps its bottom clear so the prompt is never under it
  let oraT = 0;
  const oracle = text => {
    if(document.getElementById("cipher") && typeof tl === "function" && hist){ tl(`ORACLE › ${text}`, "ora"); T.SND("comms"); return; }
    T.say(text); const t = document.documentElement; t.classList.add("oracle"); clearTimeout(oraT);
    oraT = setTimeout(() => t.classList.remove("oracle"), (1400 + text.length * 22 + Math.min(9000, 2600 + text.length * 45)) / sp()); };
  const radio = (who, text) => { T.SND("radio"); log(`<b>${who}</b>${text}`, "radio"); };
  const alarm = T.detect({ stage: "heist", onTrip: () => fail() });   // quick wrong guesses trip it
  let over = false, stage = "intercept";
  const W = window.__pnStrong = { level: L, pattern: PID, known: KNOWN, stage, seen: [], grey: null, placed: 0 };   // for automated checks
  const setStage = s => { stage = s; W.stage = s; };
  function tripped(){ const f = $("floorP"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake"); }

  // ===== The pictures: dots on the pad (pts = [{ x, y, c }] in grid units) =====
  // Each pattern draws its readings as dots; the same dots slide from shape to shape (the dot morph)
  const pic = $("pic");
  function showPts(pts, { lock = false, instant = false, frame = null } = {}){
    pic.querySelectorAll("svg").forEach(e => e.remove());
    const r = pic.getBoundingClientRect(), cols = Math.max(1, ...pts.map(p => p.x + 1)), rows = Math.max(1, ...pts.map(p => p.y + 1));
    const u = Math.max(6, Math.min(40, (r.width - 24) / cols, (r.height - 16) / rows)), d = Math.max(4, u * .7);
    const ox = (r.width - cols * u) / 2 + (u - d) / 2, oy = (r.height - rows * u) / 2 + (u - d) / 2;
    pic.classList.toggle("instant", instant || RM());
    while(pic.querySelectorAll("i").length < pts.length){ const i = document.createElement("i"); i.style.transform = `translate(${r.width / 2}px, ${r.height / 2}px)`; i.style.width = i.style.height = "0px"; pic.appendChild(i); }
    const dots = [...pic.querySelectorAll("i")];
    dots.slice(pts.length).forEach(i => i.remove());
    void pic.offsetWidth;
    pts.forEach((p, k) => { const i = dots[k]; i.className = p.c || ""; i.style.width = i.style.height = d + "px"; i.style.transform = `translate(${ox + p.x * u}px, ${oy + p.y * u}px)`; });
    pic.classList.toggle("lock", lock);
    pic.querySelectorAll(".frame").forEach(f => f.remove());
    if(frame){ const f = document.createElement("div"); f.className = "frame"; Object.assign(f.style, { left: (ox - (u - d) / 2 + frame.x * u - 4) + "px", top: (oy - (u - d) / 2 + frame.y * u - 4) + "px", width: (frame.w * u + 8) + "px", height: (frame.h * u + 8) + "px" }); pic.appendChild(f); }
  }
  // One matchstick (Bertie: they looked like a grid of squares): a stick with a gap at each joint and a red head
  function stickSVG(x1, y1, x2, y2, u, extra = ""){
    const g = .13, ax = x1 + (x2 - x1) * g, ay = y1 + (y2 - y1) * g, bx = x2 - (x2 - x1) * g, by = y2 - (y2 - y1) * g;
    return `<g class="st" ${extra}><line x1="${ax}" y1="${ay}" x2="${bx}" y2="${by}" stroke-width="${u * .11}"/><circle cx="${bx}" cy="${by}" r="${u * .075}"/></g>`;
  }
  // A row of n gates, the sticks snapping in one at a time (first gate 4, then 3 each). demo: all start dim, returns them
  function showGates(n, { lock = false, demo = false, groups = false } = {}){
    pic.innerHTML = "";
    const r = pic.getBoundingClientRect(), u = Math.max(8, Math.min(64, (r.width - 40) / n, (r.height - 40) / 1.4)), w = n * u, x0 = (r.width - w) / 2, y0 = (r.height - u) / 2;
    const L = [];
    for(let i = 0; i < n; i++){ const x = x0 + i * u; if(i === 0) L.push([x, y0 + u, x, y0]); L.push([x, y0, x + u, y0], [x, y0 + u, x + u, y0 + u], [x + u, y0 + u, x + u, y0]); }
    const step = Math.min(70, 1600 / L.length);
    pic.innerHTML = `<svg class="gates${lock ? " lock" : ""}${demo ? " demo" : ""}" width="${r.width}" height="${r.height}">${L.map((l, i) => stickSVG(l[0], l[1], l[2], l[3], u, `style="animation-delay:${RM() || demo ? 0 : Math.round(i * step / sp())}ms"`)).join("")}</svg>`;
    const sts = [...pic.querySelectorAll(".st")];
    if(groups){ pic.querySelector("svg").classList.add("demo"); sts.forEach((l, i) => l.classList.add(i === 0 ? "one" : "on", "grp" + (Math.floor((i - 1) / 3) % 2))); }
    else if(!RM()) setTimeout(() => T.SND("tick"), 0);
    return sts;
  }
  const cap = html => { $("cap").innerHTML = html; };

  // ===== The pattern bank (one entry per pattern; Bertie's brief) =====
  const rectPts = (rows, cols, c = "") => Array.from({ length: rows * cols }, (_, i) => ({ x: i % cols, y: Math.floor(i / cols), c }));
  const PATTERNS = {
    squares: {
      code: "the square code", what: "square numbers",
      term: n => n * n, isTerm: isSq,
      pts: v => rectPts(root(v), root(v)),
      // the first two by hand: drag out an array on the sketch pad (rows × columns). The code shape locks gold.
      // Nothing says "square" until the rule is cracked (Bertie: that gives it away).
      handOk: v => v >= 4 && root(v) <= Math.min(PW, PH),
      locks: (h, w) => h === w,
      measure: (h, w) => h * w,
      label: (h, w) => `${h}×${w}`,
      tip: (h, w) => `${h} × ${w} = ${h * w}`,
      handShape: v => [root(v), root(v)],
      art: () => `<i></i><span class="grid"></span>`,
      howTo: "drag out that many boxes (rows × columns)",
      drawAsk: v => `Draw ${v}: drag out ${v} boxes on the sketch pad.`,
      wrongSize: (h, w, p, v) => `${h} × ${w} = ${p}. You need ${v} boxes.`,
      noLock: (h, w, v, hint) => `${h} × ${w} = ${v} ✓ but it won't lock. ${hint ? "Try as many rows as columns." : "Every glowing reading can be drawn one special way. Can you find it?"}`,
      show: (v, o) => showPts(rectPts(root(v), root(v)), o),
      demoArg: "n",
      // n × n: the rows light one at a time (4, 8, 12, 16), then 4 × 4 = 16
      async demo(n, out){
        for(let r = 1; r <= n; r++){
          showPts(rectPts(n, n).map((p, i) => ({ ...p, c: Math.floor(i / n) < r ? "g" : "dim" })), { frame: r === n ? { x: 0, y: 0, w: n, h: n } : null });
          cap(`${r} row${r > 1 ? "s" : ""} of ${n} = <span class="gold">${r * n}</span>`); T.SND("tick"); await wait(520);
        }
        showPts(rectPts(n, n), { lock: true, frame: { x: 0, y: 0, w: n, h: n } }); cap(`${n} × ${n} = <span class="gold">${n * n}</span>`); T.SND("lockon");
        out(`  ${n} × ${n} = ${n * n}`, "ok"); await wait(700);
      },
      // the pad builds a reading: through its rectangles (long and thin first), ending on the one that locks
      shapes: v => T.pairs(v).filter(([a, b]) => a > 1 || v <= 3).map(([a, b]) => [a, b]),
      // a grey reading: the nearest shape that locks, and what's left over
      greyFit: v => { const n = Math.floor(Math.sqrt(v)); return { h: n, w: n, left: v - n * n }; },
      greyPts: v => { const n = Math.floor(Math.sqrt(v)), left = v - n * n; return [...rectPts(n, n, "n"), ...Array.from({ length: left }, (_, j) => ({ x: n + 1 + Math.floor(j / n), y: j % n, c: "bad" }))]; },
      greyCap: v => { const n = Math.floor(Math.sqrt(v)); return `${v} = ${n} × ${n} + ${v - n * n} left over`; },
      okCap: v => `${v} = ${root(v)} × ${root(v)}`,
      // the rule console: each rule makes its own numbers (k = 1, 2, 3…)
      nIs: "n = the position: 1st, 2nd, 3rd…",
      rules: [
        { sq: true, words: "n times itself", ok: true },
        { a: 2, b: 0, words: "n times 2" },
        { a: 3, b: 0, words: "n times 3" },
        { a: 2, b: -1, words: "start at 1, add 2 each time" },
        { a: 3, b: -2, words: "start at 1, add 3 each time" },
      ],
      cracked: "Square numbers: a number times itself. 4 = 2 × 2, 9 = 3 × 3, 16 = 4 × 4…",
      nthAsk: k => `How many dots does the ${ord(k)} square need?`,
      nthHint: k => `The 3rd is 3 × 3 = 9. The ${ord(k)} is ${k} × …?`,
      nthCap: k => `the ${ord(k)}: ${k} × ${k} = <span class="gold">${k * k}</span>`,
      hint: (k, tries) => tries < 2 ? `Not quite. ${(k - 1) * (k - 1)} is ${k - 1} × ${k - 1}. What's the next square?` : `The next one is ${k} × ${k}.`,
      failLine: "The safe plates were the square numbers: a number times itself (4 = 2 × 2, 9 = 3 × 3, 16 = 4 × 4…).",
    },
    // Matchsticks: a row of gates (squares made of sticks). The first gate takes 4, each one after adds 3: 3n + 1.
    // On the pad a block of cells is built from sticks; one straight row of gates is the shape that locks.
    matchsticks: {
      code: "the matchstick code", what: "4, 7, 10, 13…: each new gate adds 3 sticks",
      term: n => 3 * n + 1, isTerm: v => v >= 4 && (v - 1) % 3 === 0,
      max: { L1: 40, L2: 64, L3: 88 },
      pad: { SW: 30, SH: 7 },   // rows of gates: a wide, short pad
      handOk: v => v >= 7 && (v - 1) / 3 <= PW,
      locks: (h, w) => h === 1 || w === 1,
      measure: (h, w) => h * (w + 1) + w * (h + 1),
      label: (h, w) => h === 1 || w === 1 ? `${h * w} gate${h * w > 1 ? "s" : ""}` : `${h}×${w} block`,
      tip: (h, w) => `${h === 1 || w === 1 ? `${h * w} gate${h * w > 1 ? "s" : ""}` : `${h} × ${w} block`} · ${h * (w + 1) + w * (h + 1)} sticks`,
      handShape: v => [1, (v - 1) / 3],
      // the sticks on the cell edges of an h × w block
      art: (h, w) => { let d = ""; for(let y = 0; y <= h; y++) for(let x = 0; x < w; x++) d += stickSVG(x, y, x + 1, y, 1); for(let x = 0; x <= w; x++) for(let y = 0; y < h; y++) d += stickSVG(x, y + 1, x, y, 1);
        return `<svg class="sticks" viewBox="-.1 -.1 ${w + .2} ${h + .2}" preserveAspectRatio="none">${d}</svg>`; },
      howTo: "drag out a block of gates (squares made of sticks) that uses that many sticks",
      drawAsk: v => `Build ${v}: drag out gates that use ${v} sticks.`,
      wrongSize: (h, w, p, v) => `That uses ${p} sticks. You need ${v}.`,
      noLock: (h, w, v, hint) => `A ${h} × ${w} block uses ${v} sticks ✓ but it won't lock. ${hint ? "Try the gates in one straight line." : "Every glowing reading can be built one special way. Can you find it?"}`,
      show: (v, o) => showGates((v - 1) / 3, o),
      demoArg: "gates",
      // 3 × gates + 1: the first stick on its own (the + 1), then each gate's 3 new sticks together (3, 6, 9, 12)
      async demo(n, out){
        const lines = showGates(n, { demo: true });
        lines[0].classList.add("one"); cap(`the first stick: <span class="gold">+ 1</span>`); T.SND("tick"); await wait(800);
        for(let g = 1; g <= n; g++){
          lines.slice(1 + (g - 1) * 3, 1 + g * 3).forEach(l => l.classList.add("on", "grp" + (g % 2)));
          cap(`${g} gate${g > 1 ? "s" : ""}: 3 × ${g} = ${3 * g}, + 1 = <span class="gold">${3 * g + 1}</span>`); T.SND("tick"); await wait(650);
        }
        cap(`3 × ${n} + 1 = <span class="gold">${3 * n + 1}</span> sticks`); T.SND("lockon");
        out(`  3 × ${n} + 1 = ${3 * n + 1}`, "ok"); await wait(700);
      },
      // the pad builds a reading one gate at a time
      shapes: v => T.range(1, Math.max(1, Math.floor((v - 1) / 3))).map(n => [1, n]),
      stepMs: 260,
      greyFit: v => { const n = Math.max(1, Math.floor((v - 1) / 3)); return { h: 1, w: n, left: v - (3 * n + 1), sticks: true }; },
      greyCap: v => { const n = Math.max(1, Math.floor((v - 1) / 3)); return `${v} = ${n} gate${n > 1 ? "s" : ""} (${3 * n + 1}) + ${v - 3 * n - 1} left over`; },
      okCap: v => `${v} = ${(v - 1) / 3} gate${v > 4 ? "s" : ""}`,
      nIs: "n = the number of gates",
      rules: [
        { a: 3, b: 1, words: "start at 4, add 3 each time", ok: true },
        { a: 4, b: 0, words: "n times 4" },
        { a: 3, b: 0, words: "n times 3" },
        { a: 2, b: 2, words: "start at 4, add 2 each time" },
        { dbl: 4, words: "start at 4, double each time" },
      ],
      cracked: "The first gate takes 4 sticks and each new gate adds 3: 4, 7, 10, 13… (3 × gates + 1).",
      nthAsk: k => `How many sticks for ${k} gates?`,
      nthHint: () => "1 gate takes 4 sticks, and each new gate adds 3.",
      nthCap: k => `${k} gates: 4 + ${k - 1} × 3 = <span class="gold">${3 * k + 1}</span>`,
      hint: (k, tries) => tries < 2 ? `Not quite. ${3 * (k - 1) + 1} sticks make ${k - 1} gates. How many does one more gate add?` : `Each new gate adds 3: ${3 * (k - 1) + 1} + 3.`,
      failLine: "The laser bars were the matchstick code: the first gate takes 4 and each new gate adds 3 (4, 7, 10, 13…).",
    },
  };
  const P = PATTERNS[PID];
  const MAX = (P.max && P.max[L]) || LV.max;
  const PW = (P.pad && P.pad.SW) || LV.SW, PH = (P.pad && P.pad.SH) || LV.SH;   // the sketch pad   // the biggest reading (long rows of gates have to fit the pad)
  // A rule as a term equation: its value for n, its equation, and the working with n substituted in
  const sgn = b => b > 0 ? ` + ${b}` : b < 0 ? ` − ${-b}` : "";
  P.rules.forEach(r => {
    r.gen = r.sq ? (k => k * k) : r.dbl ? (k => r.dbl * Math.pow(2, k - 1)) : (k => r.a * k + r.b);
    r.eq = r.sq ? "n × n" : r.dbl ? `${r.dbl}, then double` : `${r.a}n${sgn(r.b)}`;
    r.code = r.eq;
    const N = n => `<span class="nb">${n}</span>`;
    // grid rows: [=, a, ×, n, op, b]; a cell { t, span } spans columns
    r.rows = n => r.sq ? [["", N("n"), "×", N("n"), "", ""], ["", N(n), "×", N(n), "", ""], ["=", { t: `<b>${n * n}</b>`, span: 3 }]]
      : r.dbl ? [["", { t: `${r.dbl}, × 2, × 2 …`, span: 5 }], ["", { t: `${r.dbl}${" × 2".repeat(Math.min(n - 1, 5))}${n > 6 ? " …" : ""}`, span: 5 }], ["=", { t: `<b>${r.gen(n)}</b>`, span: 5 }]]
      : r.b ? [["", r.a, "", N("n"), r.b > 0 ? "+" : "−", Math.abs(r.b)], ["", r.a, "×", N(n), r.b > 0 ? "+" : "−", Math.abs(r.b)], ["=", { t: r.a * n, span: 3 }, r.b > 0 ? "+" : "−", Math.abs(r.b)], ["=", { t: `<b>${r.gen(n)}</b>`, span: 5 }]]
      : [["", r.a, "", N("n"), "", ""], ["", r.a, "×", N(n), "", ""], ["=", { t: `<b>${r.gen(n)}</b>`, span: 3 }]];
    r.work = n => r.sq ? [`${N(n)} × ${N(n)}`, `= <b>${n * n}</b>`]
      : r.dbl ? [`${r.dbl}${" × 2".repeat(Math.min(n - 1, 6))}${n > 7 ? " …" : ""}`, `= <b>${r.gen(n)}</b>`]
      : r.b ? [`${r.a} × ${N(n)}${sgn(r.b)}`, `= ${r.a * n}${sgn(r.b)}`, `= <b>${r.gen(n)}</b>`] : [`${r.a} × ${N(n)}`, `= <b>${r.gen(n)}</b>`];
  });
  P.ruleText = P.rules.find(r => r.ok).eq;
  const ord = k => k + (k % 100 >= 11 && k % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][k % 10] || "th");

  // ===== The floors (beat 5): each pattern lays the safe route its own way =====
  const G = LV.G;
  const FLOORS = {
    // Squares (as Round 22): a chain of square zones, door (top left) to safe (bottom right); drag each reading onto one
    squares(){
      const { sides, k, rep } = LV;

  // The pad keeps every drawing, so they can be compared. Each is tagged with its reading (data-v).
  const onPad = () => [...fg.querySelectorAll(".arr, .lft")].map(o => ({ x: +o.dataset.gx, y: +o.dataset.gy, w: +o.dataset.gw, h: +o.dataset.gh, v: +o.dataset.v, el: o }));
  const hits = (r, o, gap = 0) => r.x < o.x + o.w + gap && o.x < r.x + r.w + gap && r.y < o.y + o.h + gap && o.y < r.y + r.h + gap;

  // A clear space for a w × h drawing (a gap of one round the others); the oldest drawings go if the pad is full
  function freeSpot(w, h, v, evict = true){
    if(w > NW || h > NH) return null;
    for(let pass = 0; pass < 8; pass++){
      const others = onPad().filter(o => o.v !== v);
      // in order: squares left to right; rows of gates top to bottom (their labels sit to the right)
      const lab = PID === "matchsticks" ? 9 : 0, wide = o => ({ ...o, w: o.w + (o.el.classList.contains("arr") ? lab : 0) });

      if(PID === "matchsticks"){ for(let y = 0; y + h <= NH; y++) for(let x = 0; x + w <= NW; x++) if(fits(x, y)) return { x, y, w, h }; }

  // The pad builds a reading: its rectangles in turn, long and thin first; a code reading locks gold, a grey one never does

  // ===== 3 + 4. The cipher terminal (Bertie: one hacker terminal, so it feels like hacking): a scrolling history with

  // The cracked effect: the glowing readings scramble through random digits, then settle one by one
  async function decrypt(){

    const gs = rdEls().filter(e => e.classList.contains("g")), gr = rdEls().filter(e => !e.classList.contains("g"));
    gr.forEach(e => e.classList.add("faint"));
    if(!RM()){
      await Promise.all(gs.map((e, i) => new Promise(r => {
        const v = e.dataset.v, tk = e.querySelector(".tk"); let n = 0;

          e.firstChild.nodeValue = n++ < 10 ? String(Math.floor(Math.random() * Math.pow(10, v.length))).padStart(v.length, "0") : v;
          if(n > 10){ clearInterval(t); e.classList.add("dec"); r(); }

    oracle("We're across. Not one plate went off.");
    setStage("done");
    T.finish({ ok: true, title: "CODE CRACKED", lines: [`${P.code[0].toUpperCase() + P.code.slice(1)}: ${P.cracked}`, `${F.summary()} Added to your codebook.`], auto: 1600 });
  }

  function fail(){
    if(over) return; over = true; setStage("failed");
    T.finish({ ok: false, title: "PLATE TRIPPED", lines: [P.failLine], note: "Too many quick wrong guesses and the alarm goes." });
  }

  buildGrid(PW, PH, "pad"); $("floorLab").textContent = "";
  (async () => {
    await new Promise(r => { if(!T.briefOpen()) return r(); const f = () => { if(!T.briefOpen()){ window.removeEventListener("pn-brief", f); r(); } }; window.addEventListener("pn-brief", f); });
    await intercept(); if(over) return;
    const how = await investigate(); if(over) return;
    await nameRule(how === "quick"); if(over) return;
    await prove(); if(over) return;
    await useIt(); if(over) return;
    await debrief();
  })();
})();
</script>
</body>
</html>
