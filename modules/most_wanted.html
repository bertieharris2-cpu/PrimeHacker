<!doctype html>
<html lang="en" class="phase-hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Most Wanted</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Teacher view for the board: the class's top agents from the mission records on this
     computer (load everyone's record files in the teacher controls first). */
  body{ min-height:100vh; padding:22px 18px 30px; box-sizing:border-box; }
  .wrap{ position:relative; z-index:1; width:min(1200px,100%); margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .top .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .top button[aria-pressed="true"]{ border-color:var(--accent); color:var(--text-primary); box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.4); }
  h1{ margin:0; text-align:center; font-family:var(--font-ui); font-size:clamp(40px,7vw,86px); letter-spacing:.2em; color:#ff4f6d; text-shadow:0 0 30px rgba(255,79,109,.45); line-height:1; }
  .sub{ text-align:center; color:var(--text-muted); letter-spacing:.2em; font-size:14px; margin-top:-8px; }
  .podium{ display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; align-items:end; }
  .poster{ position:relative; background:linear-gradient(#0b1d21, #081417); border:2px solid rgba(255,79,109,.55); padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .poster.p1{ border-color:#ffc94d; box-shadow:0 0 40px rgba(255,201,77,.25), 0 20px 60px rgba(0,0,0,.6); transform:translateY(-18px); }
  .poster .wanted{ font-family:var(--font-ui); font-weight:700; letter-spacing:.32em; color:#ff4f6d; font-size:20px; }
  .poster.p1 .wanted{ color:#ffc94d; }
  .poster .place{ position:absolute; top:10px; left:12px; font-family:var(--font-mono); font-size:28px; font-weight:700; color:rgba(235,255,248,.25); }
  .mug{ width:130px; height:150px; border:1px solid rgba(255,255,255,.2); background:repeating-linear-gradient(#0e2226 0 14px, #0b1b1e 14px 15px); display:flex; align-items:flex-end; justify-content:center; position:relative; }
  .mug svg{ width:100px; height:120px; }
  .mug .num{ position:absolute; bottom:6px; left:0; right:0; font-family:var(--font-mono); font-size:12px; color:#ffe14d; background:rgba(0,0,0,.6); }
  .poster .cn{ font-family:var(--font-ui); font-weight:700; font-size:28px; letter-spacing:.1em; word-break:break-all; }
  .poster .rk{ font-size:13px; letter-spacing:.2em; color:var(--text-muted); text-transform:uppercase; }
  .poster .bounty{ font-family:var(--font-mono); font-size:24px; color:#ffc94d; }
  .poster .bounty small{ display:block; font-family:var(--font-ui); font-size:11px; letter-spacing:.24em; color:var(--text-faint); }
  .poster .crimes{ font-size:14px; color:var(--text-muted); line-height:1.5; }
  .poster .bad{ display:flex; gap:3px; flex-wrap:wrap; justify-content:center; }
  table{ width:100%; border-collapse:collapse; font-size:17px; }
  th, td{ text-align:left; padding:9px 12px; border-top:1px solid var(--line); }
  th{ font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); border-top:0; text-transform:uppercase; }
  td.mono{ font-family:var(--font-mono); }
  td .bad{ display:flex; gap:3px; flex-wrap:wrap; }
  .empty{ text-align:center; padding:40px; color:var(--text-muted); font-size:18px; line-height:1.6; }
  @media (max-width:760px){ .podium{ grid-template-columns:1fr; } .poster.p1{ transform:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="pn-btn small" href="../index.html" style="text-decoration:none">← Back to base</a>
    <div class="row" role="group" aria-label="Rank by">
      <button class="pn-btn small" type="button" data-sort="bounty" aria-pressed="true">Rank by bounty</button>
      <button class="pn-btn small" type="button" data-sort="vaults" aria-pressed="false">Rank by vaults</button>
      <button class="pn-btn small" type="button" data-sort="badges" aria-pressed="false">Rank by badges</button>
      <button class="pn-btn small" type="button" id="fsBtn">Full screen</button>
    </div>
  </div>
  <h1>MOST WANTED</h1>
  <div class="sub" id="sub">PRIMENET // TOP AGENTS</div>
  <div class="podium" id="podium"></div>
  <div class="pn-panel" style="padding:8px 12px" id="restBox"><table><thead><tr><th>#</th><th>Agent</th><th>Rank</th><th>Vaults</th><th>Top level</th><th>Bounty</th><th>Badges</th></tr></thead><tbody id="rest"></tbody></table></div>
</div>

<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/badges.js"></script>
<script>
(() => {
  "use strict";
  const PN = window.Primenet, $ = s => document.getElementById(s);
  const gbp = n => "£" + Math.floor(n).toLocaleString("en-GB");
  if(!PN.isTeacher()){
    document.querySelector(".wrap").innerHTML = `<div class="empty">The Most Wanted poster is for the teacher.<br>Unlock the teacher controls on the title screen, then open it from there.<br><br><a class="pn-btn" href="../index.html">Back to base</a></div>`;
    return;
  }
  // One row per codename: vaults breached, total bounty, highest level cracked, badges
  const by = {};
  PN.getRecords().forEach(s => {
    const r = by[s.codename] || (by[s.codename] = { codename: s.codename, vaults: 0, bounty: 0, top: "", sessions: 0 });
    r.sessions++;
    (s.events || []).filter(e => e.stage === "complete").forEach(e => {
      r.vaults++;
      r.bounty += (e.detail && e.detail.banked) || 0;
      const lvl = (e.detail && e.detail.level) || s.level;
      if(!r.top || PN.LEVEL_ORDER.indexOf(lvl) > PN.LEVEL_ORDER.indexOf(r.top)) r.top = lvl;
    });
  });
  const rows = Object.values(by).filter(r => r.vaults > 0 && r.codename !== "TEST").map(r => ({ ...r, badges: PNBadges.forCodename(r.codename), rank: PN.agentRank(r.codename).rank }));
  let sortBy = "bounty";
  const mug = r => `<div class="mug"><svg viewBox="0 0 100 120"><circle cx="50" cy="42" r="22" fill="rgba(255,79,109,.35)"/><path d="M8 120 C12 86 30 74 50 74 C70 74 88 86 92 120 Z" fill="rgba(255,79,109,.35)"/></svg><div class="num">${PN.agentNumber(r.codename)}</div></div>`;
  function render(){
    const list = rows.slice().sort((a, b) => sortBy === "vaults" ? b.vaults - a.vaults || b.bounty - a.bounty : sortBy === "badges" ? b.badges.length - a.badges.length || b.bounty - a.bounty : b.bounty - a.bounty || b.vaults - a.vaults);
    document.querySelectorAll("[data-sort]").forEach(b => b.setAttribute("aria-pressed", b.dataset.sort === sortBy ? "true" : "false"));
    $("sub").textContent = `PRIMENET // ${list.length} AGENT${list.length === 1 ? "" : "S"} ON FILE // RANKED BY ${sortBy.toUpperCase()}`;
    if(!list.length){
      $("podium").innerHTML = `<div class="empty" style="grid-column:1/-1">No vaults breached yet on this computer.<br>Load your students' record files in the teacher controls, then come back.</div>`;
      $("restBox").hidden = true; return;
    }
    const top3 = list.slice(0, 3), order = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;
    $("podium").style.gridTemplateColumns = `repeat(${top3.length}, minmax(0, ${top3.length < 3 ? "380px" : "1fr"}))`;
    $("podium").style.justifyContent = "center";
    $("podium").innerHTML = order.map(r => {
      const place = list.indexOf(r) + 1;
      return `<div class="poster p${place}"><span class="place">#${place}</span><div class="wanted">WANTED</div>${mug(r)}
        <div class="cn">${r.codename}</div><div class="rk">${r.rank} · ${r.top} ${PN.LEVELS[r.top] ? PN.LEVELS[r.top].rank : ""}</div>
        <div class="bounty"><small>BOUNTY</small>${gbp(r.bounty)}</div>
        <div class="crimes">${r.vaults} vault${r.vaults === 1 ? "" : "s"} breached · ${r.badges.length} badge${r.badges.length === 1 ? "" : "s"}</div>
        <div class="bad">${r.badges.map(id => PNBadges.hex(id, true)).join("")}</div></div>`;
    }).join("");
    const rest = list.slice(3);
    $("restBox").hidden = !rest.length;
    $("rest").innerHTML = rest.map((r, i) => `<tr><td class="mono">${i + 4}</td><td><b>${r.codename}</b></td><td>${r.rank}</td><td class="mono">${r.vaults}</td><td>${r.top}</td><td class="mono">${gbp(r.bounty)}</td><td><div class="bad">${r.badges.map(id => PNBadges.hex(id, true)).join("")}</div></td></tr>`).join("");
  }
  document.querySelectorAll("[data-sort]").forEach(b => b.addEventListener("click", () => { sortBy = b.dataset.sort; PNSound.play("click"); render(); }));
  $("fsBtn").addEventListener("click", () => { if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); });
  render();
})();
</script>
</body>
</html>
