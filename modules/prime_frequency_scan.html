<!doctype html>
<html lang="en" class="phase-hack">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PRIME NET – Prime Frequency Scan</title>

  <!-- Courier Prime (preferred). Falls back to monospace if unavailable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg: var(--bg-primary);
      --panel: rgba(6,16,20, 0.82);
      --border: rgba(var(--accent-rgb), 0.35);
      --text: rgba(240, 255, 248, 0.92);
      --muted: rgba(240, 255, 248, 0.70);
      --green: rgba(var(--accent-rgb), 0.95);
      --greenSoft: rgba(var(--accent-rgb), 0.25);
      --warn: rgba(255, 185, 90, 0.95);
      --danger: rgba(255, 90, 90, 0.92);

      /* Accessibility defaults */
      --fontSize: 18px;      /* slightly larger than typical */
      --lineHeight: 1.55;    /* more spacing for dyslexic learners */
      --radius: 0px;         /* rectangles only */
      --gap: 14px;
      --pad: 16px;
      --maxW: 920px;
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin: 0;
      background: radial-gradient(1200px 800px at 60% 30%, rgba(var(--accent-rgb),0.10), transparent 55%),
                  radial-gradient(900px 700px at 25% 75%, rgba(var(--accent-rgb),0.08), transparent 60%),
                  var(--bg);
      color: var(--text);
      font-family: "Courier Prime", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: var(--fontSize);
      line-height: var(--lineHeight);
      letter-spacing: 0.2px;
      overflow: hidden;
    }

    /* Subtle scanlines + flicker */
    .scanlines::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03) 0px,
        rgba(255,255,255,0.03) 1px,
        rgba(0,0,0,0) 3px,
        rgba(0,0,0,0) 6px
      );
      mix-blend-mode: overlay;
      opacity: 0.25;
      animation: drift 10s linear infinite;
    }
    @keyframes drift{
      0%{ transform: translateY(0); }
      100%{ transform: translateY(24px); }
    }

    .scanlines::after{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 50%, rgba(var(--accent-rgb),0.08), transparent 60%);
      opacity: 0.7;
      animation: flicker 6s infinite;
    }
    @keyframes flicker{
      0%, 100%{ opacity: 0.55; }
      25%{ opacity: 0.65; }
      40%{ opacity: 0.5; }
      65%{ opacity: 0.7; }
      85%{ opacity: 0.58; }
    }

    .app{
      position: relative;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .frame{
      width: min(var(--maxW), 100%);
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb),0.10) inset, 0 18px 60px rgba(0,0,0,0.55);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .topbar{
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
    }

    .brand{
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .status{
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      white-space: nowrap;
    }
    .dot{
      width: 10px;
      height: 10px;
      border: 1px solid var(--border);
      background: rgba(var(--accent-rgb),0.18);
      box-shadow: 0 0 12px rgba(var(--accent-rgb),0.25);
    }
    .status strong{ color: var(--text); font-weight: 700; }

    .content{
      display: grid;
      grid-template-columns: 1fr;
      gap: var(--gap);
      padding: var(--pad);
      min-height: 520px;
    }

    .main{
      border: 1px solid var(--border);
      padding: 18px;
      background: rgba(0,0,0,0.18);
      min-height: 330px;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 14px;
    }

    .console{
      border: 1px solid var(--border);
      padding: 12px 14px;
      background: rgba(0,0,0,0.22);
      color: var(--muted);
      min-height: 84px;
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .consoleLine{
      display: flex;
      gap: 10px;
      align-items: baseline;
    }
    .consoleTag{
      color: var(--green);
      font-weight: 700;
      flex: 0 0 auto;
    }
    .consoleMsg{
      flex: 1 1 auto;
      overflow-wrap: anywhere;
    }

    .titleBig{
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-align: center;
    }
    .sub{
      color: var(--muted);
      text-align: center;
      max-width: 68ch;
    }

    .btnRow{
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 6px;
    }

    button{
      appearance: none;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      color: var(--text);
      padding: 10px 14px;
      font: inherit;
      border-radius: var(--radius);
      cursor: pointer;
      min-width: 180px;
      transition: transform 0.06s ease, background 0.15s ease, border-color 0.15s ease;
    }
    button:hover{
      background: rgba(var(--accent-rgb),0.08);
      border-color: rgba(var(--accent-rgb),0.55);
    }
    button:active{ transform: translateY(1px); }
    button:focus-visible{
      outline: 2px solid rgba(var(--accent-rgb),0.55);
      outline-offset: 2px;
    }
    button[disabled]{
      opacity: 0.5;
      cursor: not-allowed;
    }

    .divider{
      width: 100%;
      height: 1px;
      background: rgba(var(--accent-rgb),0.22);
      margin: 6px 0;
    }

    /* Loading bar */
    .barWrap{
      width: min(520px, 92%);
      height: 16px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
      position: relative;
    }
    .barFill{
      height: 100%;
      width: 0%;
      background: rgba(var(--accent-rgb),0.25);
      border-right: 1px solid rgba(var(--accent-rgb),0.55);
      box-shadow: 0 0 18px rgba(var(--accent-rgb),0.15);
      transition: width 0.2s linear;
    }
    .barPulse{
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(90deg, transparent, rgba(var(--accent-rgb),0.10), transparent);
      transform: translateX(-100%);
      animation: sweep 1.6s linear infinite;
      opacity: 0.65;
    }
    @keyframes sweep{
      0%{ transform: translateX(-100%); }
      100%{ transform: translateX(100%); }
    }

    /* Progress segments */
    .segments{
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }
    .seg{
      width: 48px;
      height: 10px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.35);
    }
    .seg.on{
      background: rgba(var(--accent-rgb),0.22);
      box-shadow: 0 0 12px rgba(var(--accent-rgb),0.18);
    }

    /* Number grid */
    .gridTitle{
      font-weight: 700;
      color: var(--text);
      text-align: center;
    }
    .instruction{
      color: var(--muted);
      text-align: center;
    }
    .numGrid{
      display: grid;
      grid-template-columns: repeat(5, minmax(54px, 1fr));
      gap: 10px;
      width: min(520px, 100%);
      margin-top: 8px;
    }
    .cell{
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.30);
      padding: 10px 8px;
      text-align: center;
      user-select: none;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
    }
    .cell:hover{
      background: rgba(var(--accent-rgb),0.08);
      border-color: rgba(var(--accent-rgb),0.55);
    }
    .cell:active{ transform: translateY(1px); }
    .cell.selected{
      background: rgba(var(--accent-rgb),0.18);
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb),0.18) inset, 0 0 18px rgba(var(--accent-rgb),0.12);
    }
    .cell:focus-visible{
      outline: 2px solid rgba(var(--accent-rgb),0.55);
      outline-offset: 2px;
    }

    /* Alerts */
    .ok{ color: var(--green); font-weight: 700; }
    .warn{ color: var(--warn); font-weight: 700; }
    .bad{ color: var(--danger); font-weight: 700; }

    /* Small helper */
    .small{
      font-size: 0.95rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 560px){
      :root{ --fontSize: 17px; }
      .numGrid{ grid-template-columns: repeat(5, minmax(46px, 1fr)); }
      button{ min-width: 150px; }
    }
/* ===== DEV LAB ===== */
.devBtn{
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 10000;
  border: 1px solid rgba(var(--accent-rgb),0.45);
  background: rgba(0,0,0,0.55);
  color: rgba(240,255,248,0.9);
  padding: 8px 10px;
  cursor: pointer;
  font: inherit;
  border-radius: 0;
}

.devPanel{
  position: fixed;
  top: 52px;
  left: 12px;
  z-index: 10000;
  width: min(360px, 92vw);
  border: 1px solid rgba(var(--accent-rgb),0.35);
  background: rgba(6,16,20,0.90);
  padding: 12px;
  display: none;
  gap: 10px;
}

.devPanel.open{ display: grid; }

.devTitle{
  font-weight: 700;
  color: rgba(240,255,248,0.92);
}

.devGrid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.devPanel button{
  min-width: unset;
  width: 100%;
  padding: 9px 10px;
  font-size: 0.95rem;
}

  
/* ===== Round 3 group 2: signal meter, mistakes, jammer, live intercept ===== */
.scanHead{ display:flex; align-items:center; justify-content:space-between; gap:14px; width:min(620px,100%); }
.signal{ display:flex; align-items:center; gap:8px; font-size:.85rem; color:var(--muted); white-space:nowrap; }
.signal .bars{ display:flex; gap:3px; align-items:flex-end; height:18px; }
.signal .bars i{ width:6px; background:rgba(var(--accent-rgb),.18); border:1px solid rgba(var(--accent-rgb),.35); }
.signal .bars i.on{ background:var(--accent); box-shadow:0 0 8px rgba(var(--accent-rgb),.6); }
.signal .bars.weak i.on{ background:#f2c14e; border-color:#f2c14e; box-shadow:0 0 8px rgba(242,193,78,.5); }
.signal .bars.poor i.on{ background:#ff6b6b; border-color:#ff6b6b; box-shadow:0 0 8px rgba(255,107,107,.5); }
.signal b{ color:var(--text); min-width:3.2em; text-align:right; }
.cell.wrongTag{ border-color:#ff6b6b !important; color:#ff9b9b; background:rgba(255,107,107,.16) !important; animation:tagFlash .5s ease-in-out 3; }
.cell.missed{ border-color:#ffe14d !important; animation:missPulse 1s ease-in-out infinite; }
@keyframes tagFlash{ 50%{ background:rgba(255,107,107,.45); } }
@keyframes missPulse{ 50%{ box-shadow:0 0 0 3px rgba(255,225,77,.35), 0 0 18px rgba(255,225,77,.35); } }
.cell.jammed{ opacity:.28; text-decoration:line-through; text-decoration-color:#ff6b6b; cursor:not-allowed; background:repeating-linear-gradient(135deg, rgba(255,107,107,.08) 0 4px, transparent 4px 9px) !important; }
.cell.jamHit{ animation:jamHit .35s ease-out; }
@keyframes jamHit{ 0%{ transform:scale(1.12); background:rgba(255,107,107,.5); } 100%{ transform:none; } }
.jammer{ display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:8px; width:min(620px,100%); border:1px dashed rgba(var(--accent-rgb),.35); padding:8px 10px; font-size:.9rem; color:var(--muted); }
.jammer .jl{ color:var(--text); font-weight:700; letter-spacing:.08em; }
.jammer button{ min-width:0 !important; padding:5px 12px; font-weight:700; }
.jammer button.used{ opacity:.35; }
.jammer .charges{ color:#ffe14d; }
.mail{ width:min(560px,100%); margin:14px auto 0; border:1px solid rgba(255,201,77,.55); background:rgba(40,30,5,.35); padding:12px 16px; text-align:left; font-size:15px; line-height:1.7; animation:mailIn .6s ease-out; }
.mail .mh{ display:flex; justify-content:space-between; font-family:var(--font-ui); font-weight:700; letter-spacing:.14em; font-size:13px; color:#ffc94d; margin-bottom:6px; }
.mail b{ display:inline-block; width:5.5em; color:var(--muted); font-weight:600; }
.mail .att{ margin-top:4px; color:#ffe9a3; }
@keyframes mailIn{ from{ opacity:0; transform:translateY(8px); } }
@media (prefers-reduced-motion: reduce){ .mail{ animation:none; } }
.ffHint{ font-family:var(--font-ui); font-size:14px; letter-spacing:.12em; color:var(--muted); }
.ffHint kbd{ font:inherit; font-weight:700; color:#03170e; background:var(--accent); padding:1px 7px; }
.scope.ff{ box-shadow:0 0 0 2px rgba(var(--accent-rgb),.6) inset; }
.intercept{ width:min(760px,100%); display:grid; gap:8px; justify-items:center; margin-top:-6px; }
.spk{ font:inherit; font-size:.72em; font-weight:700; margin-left:8px; padding:1px 6px; border:1px solid currentColor; opacity:.8; }
/* Thin hack terminal under the scope: type to lock on (start) and to capture the email (end) */
.ttSlot{ align-self:stretch; justify-self:stretch; width:100%; min-height:92px; display:grid; grid-template-columns:100%; align-content:start; justify-items:center; }   /* fixed space, so nothing jumps */
.thinTerm{ justify-self:stretch; width:100%; box-sizing:border-box; display:grid; grid-template-columns:auto minmax(0,1fr) auto; align-items:center; gap:12px; border:1px solid rgba(var(--accent-rgb),.5); background:rgba(2,12,12,.85); padding:6px 12px; font-family:var(--font-mono); font-size:15px; }
.thinTerm .lab{ font-family:var(--font-ui); font-weight:700; letter-spacing:.14em; color:var(--accent); font-size:13px; white-space:nowrap; }
.thinTerm .code{ color:#9fffd4; white-space:nowrap; overflow:hidden; text-overflow:clip; direction:rtl; text-align:left; }
.thinTerm .code span{ direction:ltr; unicode-bidi:bidi-override; }
.thinTerm .code::after{ content:"▌"; color:var(--accent); animation:ttCur .8s steps(2) infinite; } @keyframes ttCur{ 50%{ opacity:0; } }
.thinTerm .pc{ color:#ffe14d; min-width:3.5em; text-align:right; }
.thinTerm .bar{ grid-column:1 / -1; height:4px; background:rgba(255,255,255,.08); } .thinTerm .bar i{ display:block; height:100%; width:0; background:var(--accent); box-shadow:0 0 10px rgba(var(--accent-rgb),.7); transition:width .12s linear; }
.thinTerm .hint{ grid-column:1 / -1; font-family:var(--font-ui); font-size:14px; letter-spacing:.08em; color:var(--muted); text-align:center; }
.thinTerm .hint kbd{ font:inherit; font-weight:700; color:#03170e; background:var(--accent); padding:0 6px; }
.thinTerm.done{ border-color:#ffe14d; } .thinTerm.done .hint{ color:#ffe14d; }
@media (prefers-reduced-motion: reduce){ .thinTerm .code::after{ animation:none; } }
.scope{ position:relative; width:100%; height:270px; border:1px solid rgba(var(--accent-rgb),.45); background:#03110f; overflow:hidden; box-shadow:inset 0 0 40px rgba(0,0,0,.8); }
.scope canvas{ position:absolute; inset:0; width:100%; height:100%; }
.blip{ position:absolute; top:0; left:0; min-width:0 !important; padding:6px 10px !important; font-family:var(--font-mono) !important; font-size:1.15rem; font-weight:700; color:#d9fff0; background:rgba(3,20,16,.8) !important; border:1px solid rgba(var(--accent-rgb),.7) !important; box-shadow:0 0 14px rgba(var(--accent-rgb),.35); will-change:transform; }
.blip:hover{ border-color:#ffe14d !important; }
.blip.locked{ background:rgba(var(--accent-rgb),.35) !important; border-color:#fff !important; color:#fff; box-shadow:0 0 26px rgba(var(--accent-rgb),.9); pointer-events:none; }
.blip.noise{ background:rgba(255,107,107,.35) !important; border-color:#ff6b6b !important; color:#fff; pointer-events:none; }
.blip.escaped{ opacity:.35; pointer-events:none; }
.scopeHud{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; font-size:.9rem; color:var(--muted); }
.scopeHud b{ color:var(--text); }
.bonusCard{ border:1px solid rgba(var(--accent-rgb),.45); padding:12px 16px; text-align:center; width:min(520px,100%); display:grid; gap:6px; }
.bonusCard .big{ font-size:1.6rem; font-weight:700; color:var(--accent); letter-spacing:.06em; }
.bonusCard .perk{ color:#ffe14d; }
body{ overflow:auto !important; }

/* ===== Modern restyle (feedback: match the identity scan) ===== */
.scanlines::after{ display:none !important; }
.app{ padding:28px 16px !important; }
.frame{ width:min(920px,100%) !important; border:0 !important; background:transparent !important; box-shadow:none !important; overflow:visible !important; }
.topbar{ background:transparent !important; border:0 !important; padding:0 2px 12px !important; }
.brand{ font-family:var(--font-ui) !important; font-weight:700; letter-spacing:.24em; font-size:13px; color:var(--accent) !important; text-transform:uppercase; }
.status{ font-size:13px; letter-spacing:.14em; color:rgba(235,255,248,.5) !important; }
.dot{ width:8px !important; height:8px !important; border-radius:50%; border:0 !important; background:var(--accent) !important; box-shadow:0 0 10px var(--accent) !important; animation:dotPulse 1.6s ease-in-out infinite; }
@keyframes dotPulse{ 50%{ opacity:.35; } }
.content{ padding:0 !important; min-height:0 !important; gap:12px !important; }
.main{ position:relative; background:rgba(6,18,22,.78) !important; border:1px solid rgba(17,90,110,.6) !important; padding:34px 30px !important; min-height:380px !important; gap:18px !important; }
.main::before, .main::after{ content:""; position:absolute; width:22px; height:22px; border:2px solid var(--accent); pointer-events:none; }
.main::before{ top:-2px; left:-2px; border-right:0; border-bottom:0; }
.main::after{ bottom:-2px; right:-2px; border-left:0; border-top:0; }
.titleBig{ font-family:var(--font-ui) !important; font-size:clamp(24px,3.4vw,34px) !important; letter-spacing:.12em !important; font-weight:700 !important; }
.titleBig.ok{ color:var(--accent) !important; text-shadow:0 0 24px rgba(var(--accent-rgb),.4); }
.gridTitle{ font-family:var(--font-ui) !important; font-size:20px !important; letter-spacing:.14em; font-weight:700; }
.sub, .instruction, .small{ color:rgba(235,255,248,.66) !important; line-height:1.55; }
.btnRow{ gap:10px !important; margin-top:10px !important; }
.main button:not(.cell):not(.blip){ font-family:var(--font-ui) !important; text-transform:uppercase; letter-spacing:.12em; font-weight:700; font-size:15px; padding:12px 22px !important; min-width:0 !important;
  background:transparent !important; border:1px solid rgba(var(--accent-rgb),.5) !important; color:rgba(235,255,248,.92) !important; transition:background .15s, box-shadow .15s, border-color .15s; }
.main button:not(.cell):not(.blip):hover{ background:rgba(var(--accent-rgb),.12) !important; box-shadow:0 0 18px rgba(var(--accent-rgb),.25); border-color:var(--accent) !important; }
.btnRow button:first-child{ background:rgba(var(--accent-rgb),.14) !important; border-color:var(--accent) !important; color:var(--accent) !important; }
.numGrid{ gap:10px !important; width:min(640px,100%) !important; }
.cell{ font-size:21px !important; padding:15px 0 !important; background:rgba(0,0,0,.35) !important; border:1px solid rgba(var(--accent-rgb),.22) !important; transition:transform .12s ease, border-color .15s, background .15s, box-shadow .15s !important; }
.cell:hover{ transform:translateY(-2px); border-color:rgba(var(--accent-rgb),.8) !important; }
.cell.selected{ background:rgba(var(--accent-rgb),.2) !important; border-color:var(--accent) !important; color:#fff; box-shadow:0 0 18px rgba(var(--accent-rgb),.35), inset 0 0 0 1px rgba(var(--accent-rgb),.4) !important; }
.barWrap{ height:10px !important; border:1px solid rgba(30,150,170,.55) !important; background:rgba(0,0,0,.35) !important; }
.barFill{ background:var(--accent) !important; box-shadow:0 0 14px rgba(var(--accent-rgb),.6) !important; border:0 !important; }
.barPulse{ display:none !important; }
.segments{ gap:6px !important; }
.seg{ width:56px !important; height:6px !important; border:0 !important; background:rgba(255,255,255,.08) !important; }
.seg.on{ background:var(--accent) !important; box-shadow:0 0 10px rgba(var(--accent-rgb),.6) !important; }
.console{ background:transparent !important; border:0 !important; border-left:2px solid rgba(var(--accent-rgb),.5) !important; padding:4px 0 4px 14px !important; min-height:0 !important; font-size:15px; }
.consoleTag{ font-family:var(--font-ui); letter-spacing:.16em; font-size:12px; color:var(--accent) !important; }
.jammer{ border:1px solid rgba(17,90,110,.6) !important; background:rgba(0,0,0,.25); padding:10px 12px !important; }
.jammer .jl{ font-family:var(--font-ui); letter-spacing:.18em; font-size:13px; color:var(--accent) !important; }
.jammer button{ padding:6px 14px !important; font-size:14px !important; }
.bonusCard{ border:1px solid rgba(17,90,110,.6) !important; background:rgba(0,0,0,.25); padding:16px 18px !important; }
.bonusCard .big{ font-family:var(--font-mono); font-size:40px !important; text-shadow:0 0 22px rgba(var(--accent-rgb),.45); }
.signal{ font-family:var(--font-ui); letter-spacing:.14em; }

/* ===== Live intercept v2: fast, realistic scope ===== */
.scope{ height:300px !important; background:#020b0a !important; border:1px solid rgba(var(--accent-rgb),.45) !important; box-shadow:inset 0 0 60px rgba(0,0,0,.9), 0 0 24px rgba(var(--accent-rgb),.08) !important; }
.scope canvas{ position:absolute; inset:0; width:100%; height:100%; }
.scope .rx{ position:absolute; left:10px; top:8px; z-index:3; font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; color:rgba(var(--accent-rgb),.8); pointer-events:none; }
.scope .rx .rec{ color:#ff4f6d; animation:dotPulse 1s steps(2) infinite; }
.scope .rx2{ left:auto; right:10px; text-align:right; }
.blip{ position:absolute; left:0; top:0; z-index:4; min-width:0 !important; padding:6px 12px !important; font-family:var(--font-mono) !important; font-size:20px !important; font-weight:700; color:#d9fff0 !important;
  background:rgba(2,14,12,.75) !important; border:1px solid rgba(var(--accent-rgb),.55) !important; box-shadow:none !important; cursor:crosshair; will-change:transform; transition:none !important; }
.blip::before, .blip::after{ content:""; position:absolute; width:7px; height:7px; border:2px solid transparent; transition:all .15s; }
.blip::before{ left:-6px; top:-6px; } .blip::after{ right:-6px; bottom:-6px; }
.blip:hover{ border-color:#ffe14d !important; color:#ffe14d !important; }
.blip:hover::before{ border-left-color:#ffe14d; border-top-color:#ffe14d; } .blip:hover::after{ border-right-color:#ffe14d; border-bottom-color:#ffe14d; }
.blip.locked{ background:rgba(var(--accent-rgb),.35) !important; border-color:#fff !important; color:#fff !important; pointer-events:none; }
.blip.locked::before{ left:-9px; top:-9px; border-left-color:#fff; border-top-color:#fff; } .blip.locked::after{ right:-9px; bottom:-9px; border-right-color:#fff; border-bottom-color:#fff; }
.blip.noise{ background:rgba(255,79,109,.3) !important; border-color:#ff4f6d !important; color:#fff !important; pointer-events:none; }
.blip .tag{ position:absolute; left:50%; top:-20px; transform:translateX(-50%); font-size:11px; letter-spacing:.14em; white-space:nowrap; }
.blip.locked .tag{ color:#fff; } .blip.noise .tag{ color:#ff9bb0; }
.escape{ position:absolute; left:6px; z-index:4; font-family:var(--font-mono); font-size:12px; color:#ffb35c; pointer-events:none; animation:escFade 1.2s ease-out forwards; }
@keyframes escFade{ to{ opacity:0; transform:translateX(-10px); } }
.scopeFeed{ align-self:stretch; height:4px; background:rgba(255,255,255,.08); }
.scopeFeed i{ display:block; height:100%; width:0; background:var(--accent); box-shadow:0 0 10px rgba(var(--accent-rgb),.6); }

body{ color: var(--text-primary); }

button, h1, h2, h3, th, label, .pill, .hudPill, .hudBtn, [class*="title"], [class*="Title"]{ font-family: var(--font-ui); }
/* Round 14: the WATCH / YOUR TURN bar pads the top of the body, so keep the page inside the window */

.main .btnRow button.pn-go:disabled{ color:rgba(235,255,248,.55) !important; background:rgba(0,0,0,.25) !important; border-color:rgba(var(--accent-rgb),.3) !important; box-shadow:none; opacity:1; }
html.pn-mode-on .devBtn{ top: calc(var(--pn-mode-h, 62px) + 10px); }
html.pn-mode-on .devPanel{ top: calc(var(--pn-mode-h, 62px) + 50px); }
.cell{ font-family: var(--font-mono) !important; min-width: 0 !important; }  /* the general button min-width squashed the number grid */
</style>

<body class="scanlines">
  <div class="app">
    <div class="frame" role="application" aria-label="PRIME NET Prime Frequency Scan">
      <div class="topbar">
        <div class="brand" id="brandText">PRIME NET v1.3</div>
        <div class="status">
          <span class="dot" aria-hidden="true"></span>
          <span id="statusText">STATUS: CALIBRATION</span>
        </div>
      </div>

      <div class="content">
        <div class="main" id="main"></div>

        <div class="console" aria-live="polite" aria-atomic="true">
          <div class="consoleLine">
            <div class="consoleTag">SYS</div>
            <div class="consoleMsg" id="consoleLine1">Booting secure interface…</div>
          </div>
          <div class="consoleLine">
            <div class="consoleTag">LOG</div>
            <div class="consoleMsg" id="consoleLine2">Establishing number stability parameters…</div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script src="../shared/story.js"></script>

<script src="../shared/primenet.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/mode.js"></script>
<script src="../shared/badges.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twistslot.js"></script>
<script src="../shared/glitch.js"></script>
<script src="../shared/sound.js"></script>
<script>
(() => {
  "use strict";
  const PN = window.Primenet;
  const SND = (name, arg) => { if(window.PNSound) PNSound.play(name, arg); };
  if(PN) PN.log("scan");
  // Round 14: WATCH (nothing to do) and YOUR TURN bar
  const MODE = window.PNMode || { turn(){}, watch(){ return { end(){}, progress(){} }; } };
  let verifyBtnEl = null;
  const syncVerify = () => { if(verifyBtnEl) verifyBtnEl.disabled = selected.size === 0; };
  // Bertie: SPACE presses VERIFY SIGNALS while tagging a band
  document.addEventListener("keydown", e => {
    if(e.code !== "Space" || state !== State.SCAN || !verifyBtnEl || !verifyBtnEl.isConnected || e.target.closest("input,textarea,[contenteditable]")) return;
    e.preventDefault(); if(!verifyBtnEl.disabled && !e.repeat) verifyBtnEl.click();
  });

  // ====== CONFIG (edit safely, no spaghetti) ======
  const CONFIG = {
    versionLabel: "PRIMENET // FREQUENCY SCAN",
    // Bands for warm-up. Add/remove freely.
    // Example: { start: 40, end: 49 }
    // Three bands of ten, picked at random from the level's range each mission (see pickBands)
    bands: [],
    // Grid columns (for 10-number decades, 5x2 feels clean)
    gridColumns: 5,
    bootDurationMs: 1600,
    verifiedPauseMs: 900
  };

  // Each level scans its own range: L1 1–40, L2 31–80, L3 71–150
  const LEVEL_RANGES = { L1:{ from:1, to:40 }, L2:{ from:31, to:80 }, L3:{ from:71, to:150 } };
  const LEVEL_ID = PN ? PN.level() : "L1";
  function pickBands(level){
    const r = LEVEL_RANGES[level] || LEVEL_RANGES.L1, all = [];
    for(let st = r.from; st + 9 <= r.to; st += 10) all.push({ start: st, end: st + 9 });
    return all.sort(() => Math.random() - .5).slice(0, 3).sort((a, b) => a.start - b.start);
  }
  CONFIG.bands = pickBands(LEVEL_ID);

  // Signal strength: starts at 100%, drops with each wrong verify, slow band or intercept slip.
  // A strong signal earns decoder charges for the Factor Vault.
  let signal = 100, bandStartedAt = 0;
  const loseSignal = n => { signal = Math.max(20, signal - n); updateSignalMeters(); };
  function signalMeter(){
    const w = el("div", { class: "signal", title: "Signal strength: a fast, clean scan earns decoder charges for the vault" });
    w.innerHTML = `SIGNAL <span class="bars">${[1,2,3,4,5].map(() => "<i></i>").join("")}</span> <b></b>`;
    paintSignal(w); return w;
  }
  function paintSignal(w){
    const bars = w.querySelector(".bars"), on = Math.ceil(signal / 20);
    [...bars.children].forEach((b, i) => { b.classList.toggle("on", i < on); b.style.height = (6 + i * 3) + "px"; });
    bars.classList.toggle("weak", signal < 80 && signal >= 60); bars.classList.toggle("poor", signal < 60);
    w.querySelector("b").textContent = signal + "%";
  }
  function updateSignalMeters(){ document.querySelectorAll(".signal").forEach(paintSignal); }
  const decodersFor = sig => sig >= 80 ? 2 : sig >= 60 ? 1 : 0;

  // ====== DOM ======
  const brandText = document.getElementById("brandText");
  const statusText = document.getElementById("statusText");
  const main = document.getElementById("main");
  const consoleLine1 = document.getElementById("consoleLine1");
  const consoleLine2 = document.getElementById("consoleLine2");

  brandText.textContent = CONFIG.versionLabel;

  // ====== STATE ======
  const State = Object.freeze({
    BOOT: "BOOT",
    BRIEF: "BRIEF",
    SCAN: "SCAN",
    VERIFIED: "VERIFIED",
    COMPLETE: "COMPLETE",
    INTERCEPT: "INTERCEPT",
  });

  let state = State.BOOT;
  let bandIndex = 0;
  let selected = new Set();
  let progress = new Array(CONFIG.bands.length).fill(false);

  // ====== UTIL ======
  function setStatus(text){
    statusText.textContent = text;
  }

  function setConsole(sysMsg, logMsg){
    consoleLine1.textContent = sysMsg;
    consoleLine2.textContent = logMsg;
  }

  function clearMain(){
    main.innerHTML = "";
  }

  function el(tag, props = {}, children = []){
    const node = document.createElement(tag);
    for (const [k,v] of Object.entries(props)){
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === "html") node.innerHTML = v;
      else node.setAttribute(k, v);
    }
    for (const child of children){
      if (child == null) continue;
      node.appendChild(typeof child === "string" ? document.createTextNode(child) : child);
    }
    return node;
  }

  function isPrime(n){
    if (n <= 1) return false;
    if (n === 2) return true;
    if (n % 2 === 0) return false;
    const r = Math.floor(Math.sqrt(n));
    for (let i = 3; i <= r; i += 2){
      if (n % i === 0) return false;
    }
    return true;
  }

  function primesInBand(start, end){
    const out = [];
    for (let n = start; n <= end; n++){
      if (isPrime(n)) out.push(n);
    }
    return out;
  }

  function bandLabel(b){
    return `BAND ${b.start}\u2013${b.end}`;
  }

  function renderSegments(){
    const wrap = el("div", { class: "segments", "aria-label": "Scan progress" });
    progress.forEach((on, idx) => {
      const seg = el("div", { class: `seg ${on ? "on" : ""}`, "aria-label": `Step ${idx+1} ${on ? "complete" : "incomplete"}` });
      wrap.appendChild(seg);
    });
    return wrap;
  }

  function setSelected(n, on){
    if (on) selected.add(n);
    else selected.delete(n);
  }

  function toggleSelected(n){
    if (selected.has(n)){
      selected.delete(n);
      SND("untag");
      setConsole("SIGNAL REMOVED", `Signal tag cleared: ${n}`);
    } else {
      selected.add(n);
      SND("tag");
      setConsole("SIGNAL TAGGED", `Signal tagged: ${n}`);
    }
  }

  function renderBoot(){
    state = State.BOOT;
    setStatus("STATUS: CALIBRATION");
    setConsole("Booting secure interface…", "Establishing number stability parameters…");
    clearMain();

    const title = el("div", { class: "titleBig", text: "INITIALISING PRIME FREQUENCY SCAN" });
    const barWrap = el("div", { class: "barWrap", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": "0" });
    const fill = el("div", { class: "barFill" });
    const pulse = el("div", { class: "barPulse", "aria-hidden": "true" });
    barWrap.append(fill, pulse);

    const note = el("div", { class: "small", text: "Synchronising channels…" });

    main.append(title, barWrap, note);
    const w = MODE.watch("Starting the scanner", { seconds: CONFIG.bootDurationMs / 1000 });

    // animate loading fill (full a moment before the scene moves on, so the whole bar is seen)
    let p = 0;
    const step = 100 / Math.max(1, Math.floor((CONFIG.bootDurationMs - 400) / 80));
    const tick = setInterval(() => {
      p = Math.min(100, p + step);
      fill.style.width = `${p}%`;
      barWrap.setAttribute("aria-valuenow", String(Math.round(p)));
      if (p >= 100){
        clearInterval(tick);
      }
    }, 80);

    setTimeout(() => {
      w.end();
      renderBrief();
    }, CONFIG.bootDurationMs);
  }

  function renderBrief(){
    state = State.BRIEF;
    setStatus("STATUS: SCANNING");
    setConsole("Scan module armed.", "Awaiting operator input…");
    clearMain();

    const title = el("div", { class: "titleBig", text: "PRIME FREQUENCY SCAN" });
    const sub = el("div", { class: "sub", text: "We've spotted an encrypted email leaving the target. It's carrying their building plans. The channel hides behind prime frequencies." });
    const divider = el("div", { class: "divider" });
    // The intercepted email (Bertie: it makes sense of what we're scanning for)
    const tgt = PN ? PN.mission().target : "Rivercross Utilities", dom = tgt.toLowerCase().replace(/[^a-z]+/g, "");
    const mail = el("div", { class: "mail", html: `<div class="mh"><span class="mt">▲ INTERCEPTED · ENCRYPTED EMAIL</span><span class="lk">🔒 LOCKED</span></div>
      <div><b>From</b> facilities@${dom}.co.uk</div><div><b>To</b> plans@${dom}-security.co.uk</div><div><b>Subject</b> ▒▒▒▒▒▒ ▒▒▒▒▒</div>
      <div class="att">📎 building_plans.enc</div>` });

    MODE.turn("Start the scan");
    const btn = el("button", {
      class: "pn-go",
      text: "BEGIN SCAN",
      onClick: () => {
        SND("start");
        if(window.PNHandler) PNHandler.once("scan-start", PNStory.LINES.scanStart + " A prime has exactly two factors: 1 and itself.", { delay: 600 });
        bandIndex = 0;
        progress = new Array(CONFIG.bands.length).fill(false);
        renderScan();
      }
    });

    const btnRow = el("div", { class: "btnRow" }, [btn]);

    main.append(title, sub, mail, divider, renderSegments(), btnRow);
  }

  function renderScan(){
    state = State.SCAN;
    selected.clear();
    const b = CONFIG.bands[bandIndex];
    setStatus(`SCANNING: ${bandLabel(b)}`);
    setConsole("Scanning number band…", `Target range loaded: ${b.start}\u2013${b.end}`);
    MODE.turn(`Tag every prime · band ${bandIndex + 1} of ${CONFIG.bands.length}`);
    clearMain();

    const heading = el("div", { class: "scanHead" }, [el("div", { class: "gridTitle", text: `SCANNING ${b.start}\u2013${b.end}` }), signalMeter()]);
    bandStartedAt = Date.now(); bandMisses = 0; slowNoted = false;
    const instruction = el("div", { class: "instruction", text: "Identify all stable signals in this band." });

    const grid = el("div", { class: "numGrid", role: "grid", "aria-label": `Number grid ${b.start} to ${b.end}` });
    grid.style.gridTemplateColumns = `repeat(${CONFIG.gridColumns}, minmax(54px, 1fr))`;

    for (let n = b.start; n <= b.end; n++){
      const cell = el("button", {
        class: "cell",
        type: "button",
        role: "gridcell",
        "aria-pressed": "false",
        text: String(n),
        onClick: (e) => {
          if(e.currentTarget.classList.contains("jammed")) return;
          e.currentTarget.classList.remove("wrongTag", "missed");
          toggleSelected(n);
          const pressed = selected.has(n);
          e.currentTarget.classList.toggle("selected", pressed);
          e.currentTarget.setAttribute("aria-pressed", pressed ? "true" : "false");
          syncVerify();
        }
      });
      grid.appendChild(cell);
    }

    const verifyBtn = el("button", {
      class: "pn-go",
      html: "VERIFY SIGNALS <kbd class=\"spk\">SPACE</kbd>",
      onClick: () => verifyBand(b)
    });
    verifyBtnEl = verifyBtn; syncVerify();   // grey until at least one signal is tagged

    const resetBtn = el("button", {
      text: "CLEAR TAGS",
      onClick: () => {
        selected.clear();
        // clear UI state
        [...grid.querySelectorAll(".cell")].forEach(btn => {
          btn.classList.remove("selected", "wrongTag", "missed");
          btn.setAttribute("aria-pressed", "false");
        });
        setConsole("TAGS CLEARED", "All signal tags removed.");
        syncVerify();
      }
    });

    const btnRow = el("div", { class: "btnRow" }, [verifyBtn, resetBtn]);

    main.append(heading, instruction, renderJammer(b, grid), grid, renderSegments(), btnRow);
  }

  // Jammer: knock out every multiple of a small prime, like the Sieve of Eratosthenes.
  // Two charges a band, so students still have to reason about the rest.
  const JAM_CHARGES = 2;
  function renderJammer(b, grid){
    const small = []; for(let p = 2; p * p <= b.end; p++) if(isPrime(p)) small.push(p);
    let charges = JAM_CHARGES;
    const wrap = el("div", { class: "jammer" });
    const label = el("span", { class: "jl", text: "JAMMER" });
    const info = el("span", { html: `knocks out every multiple of a prime · <span class="charges">${charges} charges</span>` });
    wrap.append(label);
    small.forEach(p => {
      const btn = el("button", { type: "button", text: `×${p}`, title: `Knock out every multiple of ${p} (except ${p} itself)` });
      btn.addEventListener("click", () => {
        if(charges <= 0 || btn.classList.contains("used")) return;
        charges--; btn.classList.add("used"); btn.disabled = true;
        info.querySelector(".charges").textContent = `${charges} charge${charges === 1 ? "" : "s"}`;
        if(charges === 0) wrap.querySelectorAll("button").forEach(x => x.disabled = true);
        SND("laser");
        const hit = [];
        [...grid.querySelectorAll(".cell")].forEach(c => {
          const n = Number(c.textContent);
          if(n !== p && n % p === 0 && !c.classList.contains("jammed")){
            hit.push(n);
            setTimeout(() => { c.classList.add("jammed", "jamHit"); c.classList.remove("selected", "wrongTag", "missed"); c.setAttribute("aria-disabled", "true"); selected.delete(n); syncVerify(); SND("pop", hit.indexOf(n)); }, 120 + hit.length * 70);
          }
        });
        setConsole(`JAMMER ×${p}`, hit.length ? `Knocked out ${hit.join(", ")}: all multiples of ${p}, so none of them is prime.` : `No multiples of ${p} left in this band.`);
      });
      wrap.append(btn);
    });
    wrap.append(info);
    return wrap;
  }

  let bandMisses = 0, slowNoted = false;
  function verifyBand(b){
    const primes = new Set(primesInBand(b.start, b.end));
    let ok = true;

    // Must match exactly: selected set equals primes set
    if (selected.size !== primes.size) ok = false;
    if (ok){
      for (const n of selected){
        if (!primes.has(n)){ ok = false; break; }
      }
    }

    if (ok){
      if(window.PNHandler && bandIndex === 0) PNHandler.once("scan-band1", "Band one is clean. Keep going.");
      // A slow band costs a little signal (the clock is generous: 60 seconds)
      if(!slowNoted && Date.now() - bandStartedAt > 60000){ slowNoted = true; loseSignal(5); }
      bandMisses = 0;
      progress[bandIndex] = true;
      SND("correct", bandIndex * 2);
      renderVerified(b);
    } else {
      setConsole("NOISE DETECTED", "Rescan required.");
      bandMisses++;
      loseSignal(10);
      const wrongTags = [...selected].filter(n => !primes.has(n)), missedP = [...primes].filter(n => !selected.has(n));
      if(bandMisses === 1){
        setConsole("NOISE DETECTED", `${wrongTags.length} tag${wrongTags.length === 1 ? " is" : "s are"} noise and ${missedP.length} signal${missedP.length === 1 ? " is" : "s are"} missing. Rescan.`);
      } else {
        // Second miss: show exactly where. Red = tagged noise, pulsing = missed signal.
        main.querySelectorAll(".cell").forEach(c => {
          const n = Number(c.textContent);
          c.classList.toggle("wrongTag", wrongTags.includes(n));
          c.classList.toggle("missed", missedP.includes(n));
        });
        setConsole("NOISE MAPPED", "Red: noise you tagged. Pulsing yellow: primes you missed.");
      }
      if(window.PNHandler && bandMisses === 2) PNHandler.once("scan-miss-" + bandIndex, "Check each number: does it split into a times-table fact, like 3 × 7? Then it's noise, not a prime. And 1 is never prime.");
      SND("wrong");
      // brief visual cue: flash border by toggling status text class
      statusText.classList.remove("ok", "warn", "bad");
      statusText.classList.add("warn");
      setTimeout(() => statusText.classList.remove("warn"), 700);
    }
  }

  function renderVerified(b){
    state = State.VERIFIED;
    setStatus(`VERIFIED: ${bandLabel(b)}`);
    setConsole("SIGNALS VERIFIED", "Channel locked on.");
    clearMain();

    const title = el("div", { class: "titleBig ok", text: "SIGNALS VERIFIED" });

    // segment progress bar feel
    const segs = renderSegments();

    // small loading bar for “system committing results”
    const barWrap = el("div", { class: "barWrap", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": "100", "aria-valuenow": "0" });
    const fill = el("div", { class: "barFill" });
    const pulse = el("div", { class: "barPulse", "aria-hidden": "true" });
    barWrap.append(fill, pulse);

    const note = el("div", { class: "small", text: "Writing verification token…" });

    main.append(title, segs, barWrap, note);
    const w = MODE.watch(`Band ${bandIndex + 1} done. Saving it`, { seconds: (CONFIG.verifiedPauseMs + 450) / 1000 });

    // animate the commit bar quickly
    let p = 0;
    const tick = setInterval(() => {
      p = Math.min(100, p + 14);
      fill.style.width = `${p}%`;
      barWrap.setAttribute("aria-valuenow", String(p));
      if (p >= 100) clearInterval(tick);
    }, 90);

    setTimeout(() => {
      w.end();
      bandIndex += 1;
      if (bandIndex >= CONFIG.bands.length){
        renderIntercept();
      } else {
        renderScan();
      }
    }, CONFIG.verifiedPauseMs + 450);
  }

  // ====== LIVE INTERCEPT (oscilloscope) ======
  // Signals ride a live trace across the scope as peaks. Click the prime peaks before they
  // leave the screen; leave the noise. Fast, and it speeds up as the round goes on.
  const INTERCEPT = {

    };
    PNTest.add("Tag the primes in this band", () => { if(state === State.INTERCEPT) return "This is the live intercept: use Finish."; tagPrimes(); return "Tagged. Press Verify, or use Solve."; });
    PNTest.add("Solve this band", () => { if(state === State.INTERCEPT) return "This is the live intercept: use Finish."; verifyBand(tagPrimes()); });
    PNTest.add("Solve all bands (to the live intercept)", async () => {
      for(let i = 0; i < 3 && state !== State.INTERCEPT && state !== State.COMPLETE; i++){
        while(state === State.VERIFIED) await new Promise(r => setTimeout(r, 100));
        if(state === State.INTERCEPT) break;
        verifyBand(tagPrimes());
        await new Promise(r => setTimeout(r, 200));
      }
    });
    PNTest.add("Finish the live intercept", () => { if(interceptDone) interceptDone(); else return "The intercept isn't running."; });
    PNTest.skip("Solve this band", () => { if(state === State.INTERCEPT){ if(interceptDone) interceptDone(); return "Intercept finished."; } verifyBand(tagPrimes()); });
    PNTest.add("Skip to Target locked", () => { if(PN) PN.log("scan-complete"); location.href = "target_locked.html"; });
  }

  // Round 15: chapter card first, then the boot
  (window.PNMode && PNMode.chapterCard ? PNMode.chapterCard(1, "Intercept") : Promise.resolve()).then(renderBoot, renderBoot);

  // Keyboard convenience: Enter triggers primary button on BRIEF/COMPLETE
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (state === State.BRIEF){
      const btn = main.querySelector("button");
      if (btn) btn.click();
    }
  });

})();
</script>
