<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Guard Patrols (recon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 12 prototype, second pass: recon on the guards, in a CCTV window. One guard paces a corridor up and down,
     another walks a loop of the whole floor; both pass the fire door. When are they there together? (The LCM.)
     Three ways to play it, to compare: ?mode=A mark the timetables then predict on the 3D feed,
     ?mode=B watch the feed until it cuts out then predict, ?mode=C choose from three times.
     Round 13 (Bertie): with no ?mode, door 1 plays watch-then-predict (the feed shows what "together" means) and door 2
     plays predict-then-watch. When the answer is right the camera pushes in on the meeting, our agent throws a beacon
     to the far side of the floor, the guards go to look, and the agent walks in on a path that keeps clear of them. */
  main.tw{ width:min(1280px, 100%); }
  .cctv{ position:relative; height:500px; padding:0; overflow:hidden; background:#020a0c; border:1px solid #2c4c55; transition:height .6s; }
  .cctv.small{ height:300px; }
  .cctv > div{ z-index:2; }
  .cctv .scan{ position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(160,240,255,.05) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 120px rgba(0,0,0,.8); }
  .cctv .corner{ position:absolute; width:26px; height:26px; border:2px solid rgba(255,255,255,.7); pointer-events:none; }
  .cctv .tl{ left:10px; top:10px; border-right:0; border-bottom:0; } .cctv .tr{ right:10px; top:10px; border-left:0; border-bottom:0; }
  .cctv .bl{ left:10px; bottom:10px; border-right:0; border-top:0; } .cctv .br{ right:10px; bottom:10px; border-left:0; border-top:0; }
  .cctv .top{ position:absolute; left:46px; top:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.12em; color:#dff8ff; pointer-events:none; }
  .cctv .top .rec{ color:#ff4f6d; animation:recb 1s steps(2) infinite; } @keyframes recb{ 50%{ opacity:.2; } }
  .cctv .clock{ position:absolute; right:46px; top:12px; font-family:var(--font-mono); font-size:26px; color:#ffe14d; pointer-events:none; text-shadow:0 0 10px rgba(0,0,0,.9); }
  .cctv .legend{ position:absolute; left:46px; bottom:16px; display:flex; gap:14px; font-size:13px; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; }
  .cctv .legend i{ display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:middle; }
  .cctv .log{ position:absolute; left:46px; top:40px; font-family:var(--font-mono); font-size:13px; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; line-height:1.5; }
  .cctv .lost{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-ui); letter-spacing:.3em; font-size:30px; color:#ff4f6d; background:rgba(2,8,10,.55); opacity:0; pointer-events:none; transition:opacity .4s; }
  .cctv .lost.on{ opacity:1; }
  /* A small readout in the corner of the feed for the way in (it never covers the floor) */
  .cctv .tag{ position:absolute; right:46px; bottom:14px; font-family:var(--font-mono); font-size:13px; letter-spacing:.14em; color:#8feaff; padding:5px 10px; border:1px solid rgba(143,234,255,.55); background:rgba(2,10,12,.72); opacity:0; transition:opacity .4s; pointer-events:none; }
  .cctv .tag.on{ opacity:1; } .cctv .tag.gold{ color:#ffe14d; border-color:rgba(255,225,77,.6); }
  .task{ padding:14px 16px; display:flex; flex-direction:column; gap:12px; }
  .rowlab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.14em; color:var(--text-faint); margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .rowlab i{ width:10px; height:10px; border-radius:50%; display:inline-block; }
  .tl{ display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:3px; }
  .tl button{ font:inherit; font-family:var(--font-mono); font-size:13px; padding:7px 0; background:rgba(8,26,31,.9); border:1px solid var(--line); color:rgba(235,255,248,.8); cursor:pointer; }
  .tl button.bad{ background:rgba(255,79,109,.3); border-color:#ff4f6d; }
  .tl button:disabled{ cursor:default; }
  .ans{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:18px; }
  .ans input{ width:80px; font-size:20px; text-align:center; padding:6px; }
  .choices{ display:flex; gap:10px; flex-wrap:wrap; }
  .choices button{ font:inherit; font-family:var(--font-mono); font-size:22px; font-weight:700; padding:10px 22px; background:#0b1d22; color:#dff8ff; border:1px solid #2c4c55; cursor:pointer; }
  .choices button.bad{ border-color:#ff4f6d; color:#ff8aa0; }
  [hidden]{ display:none !important; }
  @media (prefers-reduced-motion: reduce){ .cctv{ transition:none; } .cctv .top .rec{ animation:none; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span>Door <b id="round">1</b> of 2</span><span id="modeLab"></span></div>
  <section class="cctv" id="cctv"><div class="scan"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
    <div class="top"><span class="rec">● REC</span> CAM 04 · FIRE DOOR · <span id="floorName">WEAK FLOOR</span></div><div class="clock" id="clock">00:00</div>
    <div class="legend" id="legend"></div><div class="log" id="log"></div><div class="tag" id="tag"></div><div class="lost" id="lost">FEED LOST</div></section>
  <section class="pn-panel task" id="task">
    <div id="rows"></div>
    <div class="ans" id="ansRow" hidden><label for="ansIn" id="ansLab">They're both at the door together first at minute</label><input class="pn-input" id="ansIn" inputmode="numeric" maxlength="3"><button class="pn-btn small primary" type="button" id="ansBtn">Check on the feed</button></div>
    <div class="choices" id="choices" hidden></div>
  </section>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script src="../shared/floor3d.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.peekLevel();
  const qp = new URLSearchParams(location.search).get("mode");
  // D is the default (Bertie): door 1 watch-then-predict, door 2 predict-then-watch. A, B and C stay as they were for the Twist Lab.
  const MODE = ["A", "B", "C"].includes(qp) ? qp : "D";
  const RM = window.Primenet && Primenet.reducedMotion ? Primenet.reducedMotion() : matchMedia("(prefers-reduced-motion: reduce)").matches;   // the learner's motion setting, or the system one
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(res => setTimeout(res, ms / sp()));
  $("modeLab").textContent = { A: "Option A · mark, then predict", B: "Option B · watch, then predict", C: "Option C · choose the time", D: "Door 1 watch first · Door 2 predict first" }[MODE];
  T.init({ id: "patrols3d", stage: "GETTING IN", title: "RECON: GUARD PATROLS", eyebrow: "RECON UPDATE",
    goal: { A: "Mark when each guard passes the door. Then, on the camera, work out when they're both there <b>together</b>.",
      B: "Watch the camera. When it cuts out, work out when the guards are both at the door <b>together</b>.",
      C: "When are the guards both at the door <b>together</b> for the first time? Choose the time.",
      D: "Door 1: watch the feed, then say when the guards are both at the door <b>together</b>. Door 2: work it out first, then watch the feed prove it." }[MODE],
    example: "Every 4 minutes (4, 8, 12…) and every 6 minutes (6, 12…): together at minute 12, the lowest common multiple of 4 and 6.",
    story: "Recon update: more guards than we expected. We need to know where they'll be, and when, before we go in." });
  const a0 = window.Primenet && Primenet.getAgent();
  if(a0 && a0.weakFloor) $("floorName").textContent = a0.weakFloor.toUpperCase();
  const SETS = { L1: [[3, 4], [4, 6], [2, 5], [4, 5], [3, 5]], L2: [[4, 6], [6, 8], [6, 9], [4, 10], [8, 12], [6, 10]], L3: [[4, 6, 9], [3, 4, 10], [6, 8, 9], [4, 6, 10], [5, 6, 8]] }[L];
  const rounds = T.shuffle(SETS).slice(0, 2);
  const COLS = [0xff4f6d, 0xffb347, 0xc77dff], CSS = ["#ff4f6d", "#ffb347", "#c77dff"], NAMES = ["A", "B", "C"];
  let r = 0, over = false, wrong = 0;
  const isWatch = () => MODE === "B" || (MODE === "D" && r === 0);   // this door: the feed runs first, the timetables stay hidden
  const alarm = T.alarm(3, () => end(false));
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function tag(t, cls){ const el = $("tag"); el.textContent = t; el.className = "tag" + (t ? " on" : "") + (cls ? " " + cls : ""); }
  const lcmAll = arr => arr.reduce((a, b) => T.lcm(a, b));

  // ----- 3D feed -----
  const F = PNFloor3D.create($("cctv"), {});
  const TH = F.THREE, HP = F.PLATE / 2 - 4;
  F.lightsOn(700);
  // Guards walk the free floor squares (never over a room). Find a door on the outside wall with a long clear run inward.
  const G = F.layout.grid, occ = Array.from({ length: G }, () => Array(G).fill(false));
  (F.layout.rooms || []).forEach(rm => { for(let x = rm.x; x < rm.x + rm.w; x++) for(let y = rm.y; y < rm.y + rm.h; y++) if(occ[x] && y >= 0 && y < G) occ[x][y] = true; });
  const free = (x, y) => x >= 0 && y >= 0 && x < G && y < G && !occ[x][y];
  const run = (x, y, n) => { let k = 0; while(free(x + n[0] * k, y + n[1] * k)) k++; return k; };
  const cands = [];
  for(let i = 0; i < G; i++) [[0, i, [1, 0]], [G - 1, i, [-1, 0]], [i, 0, [0, 1]], [i, G - 1, [0, -1]]].forEach(([x, y, n]) => { if(free(x, y)) cands.push({ x, y, n, len: run(x, y, n), mid: -Math.abs(i - G / 2) }); });
  const ex = F.layout.exit;
  cands.sort((p, q) => (q.len - p.len) || (q.mid - p.mid));
  const dc = cands.find(c => ex && c.x === ex.x && c.y === ex.y && c.len >= G / 2) || cands[0] || { x: 0, y: Math.floor(G / 2), n: [1, 0], len: G };
  const N = [-dc.n[0], -dc.n[1]];   // outward, through the door
  const W = (x, y) => F.cellToWorld(x, y);
  const D = W(dc.x, dc.y).add(new TH.Vector3(N[0] * F.cell / 2, 0, N[1] * F.cell / 2));
  const doorMark = new TH.Mesh(new TH.BoxGeometry(N[0] ? 1.4 : F.cell * 1.6, 12, N[0] ? F.cell * 1.6 : 1.4), new TH.MeshBasicMaterial({ color: 0x2fbf8a, transparent: true, opacity: 0.85 }));
  doorMark.position.set(D.x, 6, D.z); F.root.add(doorMark);
  // The camera sits over the door looking across the floor: guard A's corridor runs straight up the picture.
  // Round 13: lower and more oblique, so the floor fills the wide CCTV frame.
  F.camera.position.set(N[0] * 150, 120, N[1] * 150); F.look.set(N[0] * 8, 0, N[1] * 8); F.camera.fov = 36; F.camera.updateProjectionMatrix();
  const CAM0 = { pos: F.camera.position.clone(), look: F.look.clone() };   // the wide shot
  const CAM1 = { pos: new TH.Vector3(D.x + N[0] * 62, 96, D.z + N[1] * 62), look: new TH.Vector3(D.x - N[0] * 34, 2, D.z - N[1] * 34) };   // pushed in: the door low in the frame, the corridor beyond it
  const V = (x, z) => new TH.Vector3(x, 0, z);
  const key = (x, y) => x + "," + y;
  // Shortest walk between squares on the free floor, avoiding any squares in `avoid`
  function bfs(from, to, avoid){
    const prev = new Map([[key(from.x, from.y), null]]), q = [from];
    while(q.length){ const c = q.shift(); if(c.x === to.x && c.y === to.y) break;
      for(const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const nx = c.x + dx, ny = c.y + dy, k = key(nx, ny);
        if(free(nx, ny) && !prev.has(k) && !(avoid && avoid.has(k))){ prev.set(k, c); q.push({ x: nx, y: ny }); } } }
    if(!prev.has(key(to.x, to.y))) return null;
    const out = []; for(let c = to; c; c = prev.get(key(c.x, c.y))) out.unshift(c); return out;
  }
  // Walking distance from one square to every square it can reach (avoiding `avoid`)
  function dists(from, avoid){ const d = new Map([[key(from.x, from.y), 0]]), q = [from];
    while(q.length){ const c = q.shift(), k = d.get(key(c.x, c.y));
      for(const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]){ const nx = c.x + dx, ny = c.y + dy, kk = key(nx, ny); if(free(nx, ny) && !d.has(kk) && !(avoid && avoid.has(kk))){ d.set(kk, k + 1); q.push({ x: nx, y: ny }); } } }
    return d; }
  function farthest(from){ const d = dists(from); let best = from, bd = -1; d.forEach((v, k) => { if(v > bd){ bd = v; const [x, y] = k.split(",").map(Number); best = { x, y }; } }); return best; }
  // Every square within `rad` squares of the given squares (a box round each one)
  function around(cells, rad){ const s = new Set(); cells.forEach(c => { for(let dx = -rad; dx <= rad; dx++) for(let dy = -rad; dy <= rad; dy++) s.add(key(c.x + dx, c.y + dy)); }); return s; }
  const toPts = cells => [D.clone(), ...cells.map(c => W(c.x, c.y)), D.clone()];
  const door = { x: dc.x, y: dc.y };
  // A: up and down the long straight corridor from the door. B: out to the far side one way, back another.
  // C (L3): out to the middle of the floor and back.
  const aEnd = { x: dc.x + dc.n[0] * (dc.len - 1), y: dc.y + dc.n[1] * (dc.len - 1) };
  const far = farthest(door), out1 = bfs(door, far) || [door];
  const avoid = new Set(out1.slice(1, -1).map(c => key(c.x, c.y)));
  const back1 = bfs(far, door, avoid) || out1.slice().reverse();
  const mid = (() => { let best = door, bd = 1e9; for(let x = 0; x < G; x++) for(let y = 0; y < G; y++) if(free(x, y)){ const d = Math.abs(x - G / 2) + Math.abs(y - G / 2); if(d < bd){ bd = d; best = { x, y }; } } return best; })();
  const midPath = bfs(door, mid) || [door];
  const ROUTES = [toPts([door, aEnd, door]), toPts(out1.concat(back1.slice(1))), toPts(midPath.concat(midPath.slice(0, -1).reverse()))];
  function routeFor(i){ return { pts: ROUTES[i] }; }
  // The way in (round 13). The beacon lands on the far side of the floor. The guards go to it: A the direct way, B round
  // the other side, C behind A. Our agent's way in is the square that is far from the beacon AND far from the door,
  // reached without coming within two squares of the beacon.
  const beacon = far, BW = W(beacon.x, beacon.y);
  const LURE = [out1, back1.slice().reverse(), out1];
  const wayIn = (() => { const dB = dists(beacon), dD = dists(door, around([beacon], 2)); let best = door, bs = -1;
    dD.forEach((v, k) => { const s = Math.min(v, dB.get(k) || 0); if(s > bs){ bs = s; const [x, y] = k.split(",").map(Number); best = { x, y }; } }); return best; })();
  let guards = [], minute = 0, rate = 0, target = null, onArrive = null, lure = false, agentWalking = false;
  const agent = F.dot(0x6ec8ff, 2.8); agent.set(D.x + N[0] * 6, D.z + N[1] * 6);
  function setupGuards(periods){
    guards.forEach(g => g.dot.remove());
    guards = periods.map((p, i) => {
      const dot = F.dot(COLS[i], 2.4), path = new TH.CurvePath(), pts = routeFor(i).pts;
      for(let j = 1; j < pts.length; j++) if(pts[j].distanceTo(pts[j - 1]) > 0.5) path.add(new TH.LineCurve3(pts[j - 1], pts[j]));
      return { p, dot, path, i, lure: null };
    });
    $("legend").innerHTML = periods.map((p, i) => `<span><i style="background:${CSS[i]}"></i>Guard ${NAMES[i]}${isWatch() ? "" : `: every ${p} min`}</span>`).join("") + `<span><i style="background:#6ec8ff;border:2px solid #fff"></i>Our agent</span>`;
    window.__pnPatrol.periods = periods.slice();
  }
  // A guard leaves its route and walks to the beacon along `cells` (from the door), after `delay` ms
  function setLure(g, cells, delay){
    const pts = [D.clone(), ...cells.map(c => W(c.x, c.y))], path = new TH.CurvePath();
    for(let j = 1; j < pts.length; j++) if(pts[j].distanceTo(pts[j - 1]) > 0.5) path.add(new TH.LineCurve3(pts[j - 1], pts[j]));
    const l = { cells, path, t0: performance.now() + delay / sp(), ms: Math.min(3400, 200 + 230 * cells.length), k: 0, over: false };
    l.done = new Promise(res => { l.res = res; });
    g.lure = l;
  }
  // Squares the agent must keep out of right now: a square round wherever each guard is or is still going, two round the beacon
  function avoidNow(){ const s = around([beacon], 2); guards.forEach(g => { const l = g.lure; if(l) around(l.cells.slice(Math.max(0, l.k - 1)), 1).forEach(k => s.add(k)); }); return s; }
  const atDoor = g => { const k = (minute % g.p) / g.p; return k < 0.05 || k > 0.97; };
  let last = performance.now(), lastWhole = -1, walkMin = Infinity;
  // Debug hook for the tests: where everyone is (world units), and the closest the agent came to a guard while walking in
  window.__pnPatrol = { cell: F.cell, periods: [], agent: { x: 0, z: 0 }, guards: [], walkMin: Infinity, lure: false, walking: false };
  F.onTick(now => {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    const spd = sp();
    if(target != null){ minute = Math.min(target, minute + dt * Math.max(4, target / 3) * spd); if(minute >= target){ const f = onArrive; target = null; onArrive = null; if(f) f(); } }
    else if(!T.briefOpen()) minute += dt * rate * spd;   // the feed holds while the brief is up
    $("clock").textContent = `00:${String(Math.floor(minute) % 60).padStart(2, "0")}${rate > 1.5 && target == null ? " ▸▸" : ""}`;   // ▸▸: the feed is in fast forward
    if(lure){   // the guards are off their routes, walking to the beacon; the door is clear
      guards.forEach(g => { const l = g.lure; if(!l) return; const e = Math.max(0, Math.min(1, (now - l.t0) / (l.ms / spd)));
        const pt = l.path.curves.length ? l.path.getPointAt(Math.min(0.999, e)) : null; if(pt) g.dot.set(pt.x, pt.z);
        l.k = Math.floor(e * (l.cells.length - 1)); if(e >= 1 && !l.over){ l.over = true; l.res(); } });
      doorMark.material.color.setHex(0x2fbf8a);
    } else {
      guards.forEach(g => { const pt = g.path.getPointAt(Math.min(0.999, (minute % g.p) / g.p)); if(pt) g.dot.set(pt.x, pt.z); });
      const n = guards.filter(atDoor).length;
      doorMark.material.color.setHex(n === guards.length && n ? 0xffc94d : n ? 0xff4f6d : 0x2fbf8a);
      // Watching first: the feed logs each pass while it's live
      const whole = Math.floor(minute);
      if(isWatch() && whole !== lastWhole && rate > 0){ lastWhole = whole;
        guards.forEach(g => { if(whole > 0 && whole % g.p === 0) addLog(`${String(whole).padStart(2, "0")}:00 guard ${NAMES[g.i]} at the door`); });
        if(MODE === "D" && whole > 0 && guards.length && guards.every(g => whole % g.p === 0)) addLog(`${String(whole).padStart(2, "0")}:00 ${guards.length === 3 ? "all three" : "both"} at the door together`);   // door 1 is the worked example
      }
    }
    const H = window.__pnPatrol; H.lure = lure; H.walking = agentWalking;
    if(agentWalking){   // only while the agent walks in: that is what the tests measure
      const a = agent.at(); H.agent = { x: a.x, z: a.z }; H.guards = guards.map(g => { const p = g.dot.at(); return { x: p.x, z: p.z }; });
      guards.forEach(g => { walkMin = Math.min(walkMin, a.distanceTo(g.dot.at())); }); H.walkMin = walkMin;
    }
  });
  const logs = []; function addLog(t){ logs.push(t); $("log").innerHTML = logs.slice(-4).join("<br>"); T.SND("beep"); }
  const runTo = m => new Promise(res => { target = m; onArrive = res; });
  const timers = [];   // the watch flow's timers, cleared when a door is solved (a SKIP can land mid-watch)

  // ----- Rounds -----
  function deal(){
    const periods = rounds[r], M = lcmAll(periods);
    $("round").textContent = r + 1;
    timers.forEach(clearTimeout); timers.length = 0;
    setupGuards(periods); minute = 0; rate = 0.8; logs.length = 0; $("log").innerHTML = ""; $("lost").classList.remove("on"); tag("");
    $("rows").innerHTML = ""; $("ansRow").hidden = true; $("choices").hidden = true; $("cctv").classList.remove("small");
    const who = periods.length === 3 ? "all three" : "both";
    if(MODE === "A"){
      $("cctv").classList.add("small");
      const maxT = Math.min(36, Math.max(M + 2, 18));
      T.step(`Mark every minute <b>guard A</b> passes the door (every ${periods[0]} minutes).`);
      $("rows").innerHTML = periods.map((p, i) => `<div class="row" data-g="${i}" ${i ? "hidden" : ""}><div class="rowlab"><i style="background:${CSS[i]}"></i>GUARD ${NAMES[i]} · EVERY ${p} MIN</div><div class="tl" style="--n:${maxT}">${T.range(1, maxT).map(t => `<button type="button" data-t="${t}">${t}</button>`).join("")}</div></div>`).join("");
      let g = 0, need = new Set(T.range(1, maxT).filter(t => t % periods[0] === 0));
      $("rows").onclick = e => {
        const b = e.target.closest("button[data-t]"); if(!b || b.disabled || over) return;
        const t = +b.dataset.t, gi = +b.closest(".row").dataset.g, p = periods[gi];
        if(t % p === 0){ b.style.background = CSS[gi] + "55"; b.style.borderColor = CSS[gi]; b.disabled = true; need.delete(t); T.SND("tag");
          if(!need.size){ g++; if(g < periods.length){ $("rows").querySelector(`[data-g="${g}"]`).hidden = false; need = new Set(T.range(1, maxT).filter(x => x % periods[g] === 0)); T.step(`Now <b>guard ${NAMES[g]}</b> (every ${periods[g]} minutes).`); }
            else { // the grid goes away; the camera takes over
              timers.push(setTimeout(() => { $("rows").innerHTML = ""; $("cctv").classList.remove("small"); askAnswer(periods); }, 600));
            } }
        } else { b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 800); wrong++; alarm.hit(); say(`${t} isn't in guard ${NAMES[gi]}'s timetable: ${p} doesn't go into ${t}.`, "bad"); }
      };

    } else if(isWatch()){
      // B: the feed cuts out after two rounds of the slowest guard. Default door 1: it runs until they have met once,
      // so the first door is the worked example (Bertie) and door 2 is the real test. Its pace keeps the wait
      // under about 20 seconds: a minute a second for short waits, fast forward (up to 6 minutes a second) for
      // L3's long ones, where the LCM can be 120.
      const watchTo = MODE === "D" ? M + 1 : Math.max(...periods) * 2 + 1;
      if(MODE === "D") rate = Math.min(6, Math.max(1, (M + 1) / 20));
      T.step(`Watch the feed. Note when each guard reaches the door.`);
      say("The feed is live. It won't last long.");
      const iv = setInterval(() => { if(minute >= watchTo){ clearInterval(iv); rate = 0; $("lost").classList.add("on"); T.SND("static"); timers.push(setTimeout(() => { $("lost").classList.remove("on"); minute = 0; askAnswer(periods); }, 1400 / sp())); } }, 100);
      timers.push(iv);
    } else {
      askAnswer(periods);
    }
  }
  function askAnswer(periods){
    if(meeting) return;
    const M = lcmAll(periods), who = periods.length === 3 ? "all three guards" : "both guards";
    rate = 0; minute = 0;
    const lead = MODE === "D" && r === 1 ? "This time, work it out first. " : "";
    T.step(`${lead}When are ${who} at the door <b>together</b> for the first time?${isWatch() ? "" : ` (${periods.map((p, i) => `${NAMES[i]} every ${p} min`).join(", ")})`}`);
    if(MODE === "C"){
      const opts = T.shuffle([...new Set([M, periods.reduce((a, b) => a * b), periods.reduce((a, b) => a + b), M * 2, Math.max(...periods) * 2].filter(v => v !== M))]).slice(0, 2).concat(M);
      $("choices").hidden = false; $("choices").innerHTML = T.shuffle(opts).map(v => `<button type="button" data-v="${v}">${v} min</button>`).join("");
      $("choices").onclick = e => { const b = e.target.closest("button[data-v]"); if(b && !b.disabled) check(+b.dataset.v, b); };
    } else { $("ansLab").textContent = `${periods.length === 3 ? "All three are" : "They're both"} at the door together first at minute`; $("ansRow").hidden = false; $("ansIn").value = ""; $("ansIn").focus(); }
    say("Your answer plays on the camera.");
  }
  $("ansBtn").addEventListener("click", () => { const v = parseInt($("ansIn").value, 10); if(!Number.isInteger(v) || v < 1){ say("Type a minute.", "warn"); return; } check(v); });
  $("ansIn").addEventListener("keydown", e => { if(e.key === "Enter") $("ansBtn").click(); });
  $("ansIn").addEventListener("input", () => T.SND("typing"));
  let checking = false;
  // Every answer is played on the feed: the clock runs to that minute and you see who's at the door
  async function check(v, btn){
    if(over || checking) return; checking = true; $("ansBtn").disabled = true;
    const periods = rounds[r], M = lcmAll(periods);
    minute = 0; say(`Running the feed to minute ${v}…`);
    await runTo(v);
    if(meeting) return;   // a SKIP solved the door while the feed was running
    if(v === M){ checking = false; $("ansBtn").disabled = false; return met(M); }
    const at = periods.map((p, i) => `${NAMES[i]} ${v % p === 0 ? "✓" : "✗"}`).join(" · ");
    wrong++; alarm.hit(); if(btn){ btn.classList.add("bad"); btn.disabled = true; }
    say(periods.every(p => v % p === 0) ? `At minute ${v} they're all there, but they already met earlier. Find the first time.` : `Minute ${v}: ${at}. Not everyone's at the door.`, "bad");
    checking = false; $("ansBtn").disabled = false;
    if(!btn){ $("ansIn").focus(); $("ansIn").select(); }   // the next number typed replaces the wrong one
  }
  // A ring of light on the floor where the beacon lands. It swells three times with a ping, then breathes gently.
  function beaconRing(){
    const m = new TH.Mesh(new TH.RingGeometry(F.cell * 0.55, F.cell * 0.95, 48), new TH.MeshBasicMaterial({ color: 0xffe14d, transparent: true, opacity: 0.8, side: TH.DoubleSide, depthWrite: false }));
    m.rotation.x = -Math.PI / 2; m.position.set(BW.x, 0.6, BW.z); F.root.add(m);
    const post = new TH.Mesh(new TH.CylinderGeometry(0.7, 0.7, 16, 8), new TH.MeshBasicMaterial({ color: 0xffe14d, transparent: true, opacity: 0.6 }));
    post.position.set(BW.x, 8, BW.z); F.root.add(post);
    let alive = true, pulsing = true;
    (async () => {
      for(let i = 0; i < 3 && alive; i++){ T.SND("ping"); if(RM){ await wait(700); continue; } await F.tween(750, e => { m.scale.setScalar(0.5 + 1.7 * e); m.material.opacity = 0.85 * (1 - e); }, t => t); }
      m.scale.setScalar(1); pulsing = false;
    })();
    const off = F.onTick(now => { if(alive && !pulsing) m.material.opacity = RM ? 0.6 : 0.4 + 0.2 * Math.sin(now / 320); });   // a slow breath, twice in three seconds
    return { remove(){ alive = false; off(); F.root.remove(m); F.root.remove(post); } };
  }
  // The agent waits for a way in that keeps clear of the guards, checking again every few frames as they walk away
  async function clearPath(){
    const t0 = performance.now();
    for(;;){
      const av = avoidNow(), p = av.has(key(door.x, door.y)) ? null : bfs(door, wayIn, av);
      if(p) return p;
      if(performance.now() - t0 > 9000 / sp()) return bfs(door, wayIn, around([beacon], 1)) || [door];
      await new Promise(res => setTimeout(res, 80));
    }
  }
  // They meet at the door: the LCM, seen. The camera pushes in. Then the way in: our agent throws a beacon to the far
  // side of the floor, the guards leave their routes to look, and the agent walks in well away from them.
  let meeting = false;
  async function met(M){
    if(meeting) return; meeting = true;
    timers.forEach(clearTimeout); timers.length = 0;
    checking = false; target = null; onArrive = null; $("ansBtn").disabled = false;
    $("ansRow").hidden = true; $("choices").hidden = true; $("rows").innerHTML = ""; $("cctv").classList.remove("small");
    const periods = rounds[r];
    minute = M; rate = 0; T.SND("lockon"); say(`${M}: ${periods.map(p => `${M} = ${p} × ${M / p}`).join(", ")}.`, "ok");
    tag(`${periods.length === 3 ? "ALL THREE" : "BOTH"} AT THE DOOR · MINUTE ${M}`, "gold");
    if(!RM){ T.SND("zoom"); await F.flyTo(CAM1, 900); await wait(700); await F.flyTo(CAM0, 800); } else await wait(1400);
    // the distraction: a beacon thrown to the far side of the floor
    T.SND("chirp");
    const trail = await F.pulse(agent.at().setY(3), BW.clone().setY(3), 0x6ec8ff, 450);
    const ring = beaconRing(); tag("DISTRACTION ▸ BEACON", "gold");
    lure = true; rate = 0.6;
    guards.forEach((g, i) => setLure(g, LURE[i] || out1, 500 + i * 280));
    const arrive = Promise.all(guards.map(g => g.lure.done));
    await wait(900); T.SND("radio"); tag("GUARDS DIVERTED ▸ DOOR CLEAR");
    // the way in, only once the door and the path are clear of the guards
    const path = await clearPath();
    tag("AGENT IN"); T.SND("whoosh");
    agentWalking = true; walkMin = Infinity;
    await agent.walk([agent.at(), D.clone(), ...path.map(c => W(c.x, c.y))], Math.min(3600, 400 + 240 * path.length));
    agentWalking = false;
    await arrive;
    T.SND("success"); tag("AGENT INSIDE");
    await wait(1000);
    F.root.remove(trail); ring.remove(); lure = false;
    r++; meeting = false;
    if(r < rounds.length){ agent.set(D.x + N[0] * 6, D.z + N[1] * 6); deal(); }
    else end(true);
  }
  function end(ok){
    over = true;
    if(ok) T.finish({ ok: true, title: "IN", lines: [], auto: 1800 });
    else T.finish({ ok: false, title: "SPOTTED", lines: ["The first time they're all together is the lowest common multiple (LCM) of their times."] });
  }
  deal();
  if(window.PNTest) PNTest.skip("Solve this door", () => { met(lcmAll(rounds[r])); });
})();
</script>
