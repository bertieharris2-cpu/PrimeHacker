<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Guard Patrols (recon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 17 (teacher: "this is the part that feels quite messy"): one scaffolded work-through of the LCM.
     Two guards walk DIFFERENT routes round the floor; both routes pass the blind spot, a corridor behind a room where
     nobody can see the fire door. When they're both there, FOX and WREN can sneak through.
     Steps (right-hand panel): 1 mark guard A's minutes, 2 mark guard B's, 3 click the first minute marked by both,
     4 watch last night's CCTV to check, 5 at the fire door: watch the blind spot camera and call GO GO GO.
     ?phase=recon: steps 1 to 4 (the plan, straight after the blueprint); it hands back "sneak:M:a:b".
     ?phase=go&a=&b=: step 5 only (the heist, at the fire door). No phase (Twist Lab): all five.
     One screen at 1280 × 720 and up: the feed on the left, the guards and the steps on the right. */
  main.tw{ width:min(1680px, 100%); height:100vh; height:100dvh; box-sizing:border-box; padding:10px 16px 46px; gap:10px; }   /* bottom: clear of FULL SCREEN (the mission's shows over the twist too) */
  main .tw-head{ padding-bottom:8px; } main .tw-head h1{ font-size:clamp(22px,2.6vw,30px); }
  .play{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(340px,31vw,480px); gap:12px; }
  .feed{ display:flex; flex-direction:column; gap:8px; min-width:0; min-height:0; }
  .cctv{ position:relative; flex:1; min-height:0; padding:0; overflow:hidden; background:#020a0c; border:1px solid #2c4c55; }
  .cctv > div{ z-index:2; }
  .cctv .scan{ position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(160,240,255,.05) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 120px rgba(0,0,0,.8); }
  .cctv .corner{ position:absolute; width:26px; height:26px; border:2px solid rgba(255,255,255,.7); pointer-events:none; }
  .cctv .tl{ left:10px; top:10px; border-right:0; border-bottom:0; } .cctv .tr{ right:10px; top:10px; border-left:0; border-bottom:0; }
  .cctv .bl{ left:10px; bottom:10px; border-right:0; border-top:0; } .cctv .br{ right:10px; bottom:10px; border-left:0; border-top:0; }
  .cctv .top{ position:absolute; left:46px; top:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.12em; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; line-height:1.5; }
  .cctv .top .rec{ color:#ff4f6d; animation:recb 2.4s ease-in-out infinite; } @keyframes recb{ 50%{ opacity:.35; } }   /* a slow fade, never a flash */
  .cctv .top em{ font-style:normal; color:#ffe68a; }
  .cctv .clock{ position:absolute; right:46px; top:12px; font-family:var(--font-mono); font-size:26px; color:#ffe14d; pointer-events:none; text-shadow:0 0 10px rgba(0,0,0,.9); }
  .dest{ font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.16em; color:#8feaff; padding:3px 9px; border:1px solid rgba(110,200,255,.6); background:rgba(2,10,12,.72); }
  .cctv .log{ position:absolute; left:46px; top:62px; font-family:var(--font-mono); font-size:13px; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; line-height:1.5; }
  /* The radio at the fire door: FOX, ORACLE and you */
  .radio{ display:flex; flex-direction:column; gap:3px; font-family:var(--font-mono); font-size:15px; line-height:1.35; color:#8feaff; }
  .radio:empty{ display:none; } .radio .r{ color:#7dffc4; font-weight:700; }
  /* A small readout in the corner of the feed (it never covers the floor) */
  .cctv .tag{ position:absolute; right:46px; bottom:14px; font-family:var(--font-mono); font-size:14px; letter-spacing:.12em; color:#8feaff; padding:5px 10px; border:1px solid rgba(143,234,255,.55); background:rgba(2,10,12,.8); opacity:0; transition:opacity .4s; pointer-events:none; }
  .cctv .tag.on{ opacity:1; } .cctv .tag.gold{ color:#ffe14d; border-color:rgba(255,225,77,.6); } .cctv .tag.green{ color:#7dffc4; border-color:rgba(125,255,196,.7); }
  /* The mini CCTV window at the fire door: the blind spot camera */
  .cctv .inset{ position:absolute; right:18px; bottom:52px; width:clamp(200px, 34%, 380px); aspect-ratio:16/10; background:#01080a; border:2px solid rgba(235,255,248,.8); box-shadow:0 0 0 1px #000, 0 10px 30px rgba(0,0,0,.75); overflow:hidden; opacity:0; transition:opacity .5s; pointer-events:none; }
  .cctv .inset.on{ opacity:1; }
  .cctv .inset canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .cctv .inset::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(160,240,255,.06) 0 1px, transparent 1px 3px); pointer-events:none; }
  .cctv .inset .il{ position:absolute; left:8px; top:6px; right:8px; z-index:1; display:flex; justify-content:space-between; gap:8px; font:700 12px/1.3 var(--font-mono); letter-spacing:.1em; color:#dff8ff; text-shadow:0 0 4px #000, 0 0 4px #000; }
  .cctv .inset .il span:first-child::before{ content:"● "; color:#ff4f6d; }
  .cctv .inset .st{ position:absolute; left:8px; bottom:6px; z-index:1; font:700 13px/1.3 var(--font-mono); letter-spacing:.1em; color:#ffe68a; text-shadow:0 0 4px #000, 0 0 4px #000; }
  .cctv .inset .st.both{ color:#7dffc4; }
  /* GO GO GO over the feed: fades up and holds, no flashing */
  .cctv .gogo{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; font-family:var(--font-ui); font-weight:700; font-size:clamp(44px,7vw,100px); letter-spacing:.16em; color:#7dffc4; text-shadow:0 0 30px rgba(47,191,138,.85), 0 0 4px #000; opacity:0; transform:scale(.92); transition:opacity .35s, transform .6s; }
  .cctv .gogo.on{ opacity:1; transform:none; }
  /* The timeline over the feed: a tick every time a guard reaches the blind spot */
  .tline{ flex:none; padding:7px 22px 6px 12px; display:flex; flex-direction:column; gap:3px; }
  .lane, .axis{ display:grid; grid-template-columns:92px minmax(0,1fr); gap:8px; align-items:center; white-space:nowrap; }
  .lane{ height:30px; }
  .lane .ll{ font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.12em; color:var(--c); display:flex; align-items:center; gap:6px; }
  .lane .ll i{ width:10px; height:10px; border-radius:50%; background:var(--c); }
  .track{ position:relative; height:100%; border-bottom:1px solid rgba(143,234,255,.25); }
  .track b{ position:absolute; bottom:0; width:5px; height:24px; margin-left:-2px; background:var(--c); box-shadow:0 0 8px var(--c); animation:tickIn .45s ease-out; }
  @keyframes tickIn{ from{ transform:scaleY(.2); opacity:.3; } }
  .track b.gold{ height:30px; background:#ffe14d; box-shadow:0 0 12px #ffe14d; }
  .track b small{ position:absolute; left:8px; bottom:4px; font:700 16px/1 var(--font-mono); color:#f6feff; text-shadow:0 0 6px #000; }
  .track b.gold small{ color:#ffe14d; font-weight:700; }
  .track .ph{ position:absolute; top:-2px; bottom:-2px; left:0; width:2px; background:rgba(255,255,255,.7); }
  .axis{ font-family:var(--font-mono); font-size:12px; color:var(--text-faint); } .axis > span{ font-family:var(--font-ui); letter-spacing:.14em; font-size:11px; }
  .axis div{ display:flex; justify-content:space-between; }
  /* The side: the guards, the steps, the grid and the button */
  .side{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; min-height:0; overflow:hidden; }
  .gcards{ display:flex; flex-direction:column; gap:5px; }
  .gcard{ display:flex; align-items:center; gap:10px; padding:3px 10px; border:1px solid var(--line); border-left:4px solid var(--c); font-family:var(--font-ui); font-size:15px; line-height:1.25; background:rgba(8,26,31,.6); }
  .gcard b{ color:var(--c); } .gcard svg{ flex:none; width:24px; height:24px; }
  .gcard.on{ border-color:var(--c); box-shadow:inset 0 0 0 1px var(--c); }
  .plan{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
  .plan li{ display:grid; grid-template-columns:22px minmax(0,1fr); gap:9px; align-items:start; padding:2px 8px; border-left:3px solid transparent; font-family:var(--font-ui); font-size:14px; line-height:1.3; color:var(--text-muted); }
  .plan li i{ font-style:normal; font-weight:700; font-size:12px; line-height:18px; height:20px; text-align:center; border:1px solid currentColor; }
  .plan li.done{ color:#7dffc4; } .plan li.done i{ background:rgba(61,220,151,.15); }
  .plan li.on{ padding:7px 8px; border-left-color:var(--warning); background:rgba(255,230,138,.07); font-size:17px; line-height:1.35; color:#f6feff; }
  .plan li.on i{ color:var(--warning); margin-top:2px; } .plan li.on b{ color:#ffe68a; }
  .hs{ flex:1 1 auto; min-height:calc(var(--rows) * 18px); display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); grid-template-rows:repeat(var(--rows), minmax(0,1fr)); gap:3px; max-height:calc(var(--rows) * 46px); }
  .hs > *{ position:relative; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; padding:0; font:inherit; font-family:var(--font-mono); font-size:clamp(12px,2.1vh,18px); font-weight:700; color:rgba(235,255,248,.86); background:rgba(8,26,31,.9); border:1px solid var(--line); }
  .hs button{ cursor:pointer; } .hs button:hover:not(:disabled){ border-color:rgba(var(--accent-rgb),.8); } .hs button:focus-visible{ outline:2px solid var(--warning); outline-offset:1px; }
  .hs button:disabled{ cursor:default; }
  .hs small{ position:absolute; right:3px; top:1px; font-size:10px; font-weight:400; letter-spacing:.04em; color:#fff; }
  .hs .bad{ border-color:#ff8aa0 !important; } .hs .bad::after{ content:"✗"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(30,0,8,.82); color:#ff8aa0; font-size:1.3em; }   /* guard A is red too, so a cross */
  .hs .gold{ background:rgba(255,201,77,.4) !important; border-color:#ffc94d !important; color:#fff3cf; box-shadow:0 0 12px rgba(255,201,77,.5); }
  .act{ display:flex; } .act .pn-btn{ flex:1; font-size:17px; padding:10px 14px; }
  .act .go{ font-size:26px; letter-spacing:.2em; padding:14px; background:#7dffc4; border-color:#7dffc4; color:#032018; animation:goGlow 2.4s ease-in-out infinite; }
  .act .go.wait{ background:rgba(125,255,196,.14); color:#bff8e0; animation:none; }
  @keyframes goGlow{ 50%{ box-shadow:0 0 28px rgba(125,255,196,.75); } }   /* a slow glow, never a flash */
  html.pn-reduce-motion .act .go, html.pn-reduce-motion .cctv .top .rec{ animation:none; }
  @media (prefers-reduced-motion: reduce){ .act .go, .cctv .top .rec{ animation:none; } .cctv .gogo{ transition:opacity .35s; transform:none; } }
  .side .tw-msg{ font-size:15px; min-height:2.6em; }
  .ask{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 12px; border:1px solid rgba(255,230,138,.55); background:rgba(255,230,138,.06); font-family:var(--font-ui); font-size:17px; color:#f6feff; }
  .ask input{ width:3.4em; font:700 22px var(--font-mono); text-align:center; padding:4px 6px; color:#ffe68a; background:#020a0c; border:1px solid #ffe68a; }
  .ask input:focus{ outline:2px solid #ffe68a; outline-offset:1px; }
  .ask .pn-btn{ margin-left:auto; }
  .track .zone{ position:absolute; top:-3px; bottom:-3px; background:rgba(255,225,77,.22); border:1px solid rgba(255,225,77,.8); box-shadow:0 0 10px rgba(255,225,77,.35); pointer-events:none; }
  .tline.go .track .ph{ width:4px; margin-left:-2px; background:#ffe14d; box-shadow:0 0 10px #ffe14d; }
  [hidden]{ display:none !important; }
  @media (max-width:900px){ main.tw{ height:auto; } .play{ grid-template-columns:1fr; } .cctv{ height:360px; flex:none; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span class="dest" id="dest"></span></div>
  <div class="play">
    <div class="feed">
      <section class="pn-panel tline" id="tline" aria-hidden="true"><div id="lanes"></div></section>
      <section class="cctv" id="cctv" aria-label="CCTV of the floor"><div class="scan"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="top"><span class="rec">● REC</span> CAM 04 · <span id="floorName">WEAK FLOOR</span><br><em id="feedLab"></em></div><div class="clock" id="clock">MIN 00</div>
        <div class="log" id="log"></div><div class="tag" id="tag"></div>
        <div class="inset" id="inset" aria-hidden="true"><div class="il"><span>CAM 07 · BLIND SPOT</span><span>LIVE</span></div><div class="st" id="insetSt"></div></div>
        <div class="gogo" id="gogo" aria-hidden="true">GO GO GO</div></section>
    </div>
    <aside class="pn-panel side" id="side">
      <div class="gcards" id="cards"></div>
      <ol class="plan" id="plan" aria-live="polite"></ol>
      <div class="hs" id="hs" hidden></div>
      <div class="ask" id="ask" hidden><label for="askIn">Guard <span id="askG">A</span> passes every</label><input id="askIn" type="text" inputmode="numeric" maxlength="3" autocomplete="off" aria-label="Minutes"><span>minutes</span><button class="pn-btn primary" type="button" id="askBtn">CHECK ▸</button></div>
      <div class="act" id="act" hidden><button class="pn-btn primary pn-go" type="button" id="actBtn"></button></div>
      <div class="tw-msg" id="msg" aria-live="polite"></div>
      <div class="radio" id="radio" aria-live="polite"></div>
    </aside>
  </div>
</main>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script src="../shared/floor3d.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.peekLevel(), qs = new URLSearchParams(location.search);
  const RM = window.Primenet && Primenet.reducedMotion ? Primenet.reducedMotion() : matchMedia("(prefers-reduced-motion: reduce)").matches;   // the learner's motion setting, or the system one
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(res => setTimeout(res, ms / sp()));
  const PHASE = ["recon", "go"].includes(qs.get("phase")) ? qs.get("phase") : "all";   // recon: the plan; go: the fire door in the heist; all: the Twist Lab
  // Where FOX and WREN head once they're through. The heist sends ?next= (and lift=1 when it's on another floor);
  // the Twist Lab sends nothing, so they go for the vault, by the lift.
  const DESTS = { fusebox: ["FUSE BOX", "the fuse box"], keyroom: ["KEY ROOM", "the key room"], deposit: ["DEPOSIT BOXES", "the deposit boxes in the basement"], strongroom: ["STRONGROOM", "the strongroom"], vault: ["THE VAULT", "the vault"] };
  const DK = DESTS[qs.get("next")] ? qs.get("next") : "vault";
  const LIFT = DK === "deposit" || ((DK === "strongroom" || DK === "vault") && (qs.get("lift") === "1" || !DESTS[qs.get("next")]));
  const DEST = { name: DESTS[DK][0], to: DESTS[DK][1], sub: DK === "deposit" ? "LIFT ▸ BASEMENT" : LIFT ? "TAKE THE LIFT" : "NEXT STOP" };

  // ----- The two rounds: numbers scale with the level. The grid always runs past the answer. -----
  const LV = {
    L1: { grid: 30, s: [[3, 4], [4, 5], [3, 5], [4, 6], [2, 5]] },
    L2: { grid: 50, s: [[6, 8], [6, 9], [4, 10], [6, 10], [8, 12], [4, 14], [6, 14]] },
    L3: { grid: 60, s: [[9, 12], [10, 15], [12, 16], [12, 18], [14, 21], [9, 15], [10, 25], [8, 20]] },
  }[L];
  const qa = parseInt(qs.get("a"), 10), qb = parseInt(qs.get("b"), 10);   // the heist passes the plan's rounds on
  const P = (qa > 0 && qb > 0 && qa !== qb ? [qa, qb] : T.pick(LV.s).slice()).sort((x, y) => x - y), M = T.lcm(P[0], P[1]);
  const COLS = [0xff4f6d, 0xffb347], CSS = ["#ff4f6d", "#ffb347"], NAMES = ["A", "B"], BLUE = 0x6ec8ff, GOLD = 0xffc94d, GREEN = 0x2fbf8a;
  const seq = p => `${p}, ${p * 2}, ${p * 3}…`;

  const a0 = window.Primenet && Primenet.getAgent();
  const floorName = a0 && a0.weakFloor ? a0.weakFloor.toUpperCase() : "WEAK FLOOR";
  $("floorName").textContent = floorName;

  // ----- 3D feed -----
  const F = PNFloor3D.create($("cctv"), {});
  const TH = F.THREE;
  F.lightsOn(700);
  // Guards walk the free floor squares (never over a room). Find a door on the outside wall with a long clear run inward.
  const G = F.layout.grid, occ = Array.from({ length: G }, () => Array(G).fill(false));
  (F.layout.rooms || []).forEach(rm => { for(let x = rm.x; x < rm.x + rm.w; x++) for(let y = rm.y; y < rm.y + rm.h; y++) if(occ[x] && y >= 0 && y < G) occ[x][y] = true; });
  const free = (x, y) => x >= 0 && y >= 0 && x < G && y < G && !occ[x][y];
  const run = (x, y, n) => { let k = 0; while(free(x + n[0] * k, y + n[1] * k)) k++; return k; };
  const cands = [];
  for(let i = 0; i < G; i++) [[0, i, [1, 0]], [G - 1, i, [-1, 0]], [i, 0, [0, 1]], [i, G - 1, [0, -1]]].forEach(([x, y, n]) => { if(free(x, y)) cands.push({ x, y, n, len: run(x, y, n), mid: -Math.abs(i - G / 2) }); });
  const ex = F.layout.exit;
  cands.sort((p, q) => (q.len - p.len) || (q.mid - p.mid));
  const dc = cands.find(c => ex && c.x === ex.x && c.y === ex.y && c.len >= G / 2) || cands[0] || { x: 0, y: Math.floor(G / 2), n: [1, 0], len: G };
  const N = [-dc.n[0], -dc.n[1]], NV = new TH.Vector3(N[0], 0, N[1]), SIDE = new TH.Vector3(-N[1], 0, N[0]);   // outward through the door, and along its wall
  const W = (x, y) => F.cellToWorld(x, y);
  const D = W(dc.x, dc.y).add(new TH.Vector3(N[0] * F.cell / 2, 0, N[1] * F.cell / 2));
  const doorMark = new TH.Mesh(new TH.BoxGeometry(N[0] ? 1.4 : F.cell * 1.6, 12, N[0] ? F.cell * 1.6 : 1.4), new TH.MeshBasicMaterial({ color: GREEN, transparent: true, opacity: 0.85 }));
  doorMark.position.set(D.x, 6, D.z); F.root.add(doorMark);
  // The camera sits behind the door, high, looking across the whole floor; it pulls back on a narrow feed
  F.camera.fov = 40;
  const CAM0 = { pos: new TH.Vector3(), look: new TH.Vector3() };
  function frame(){ const a = F.camera.aspect || 1.6, k = Math.max(1, 1.6 / a); CAM0.pos.set(N[0] * 136 * k, 138 * k, N[1] * 136 * k).addScaledVector(SIDE, (D.x * SIDE.x + D.z * SIDE.z) * 0.45); CAM0.look.set(N[0] * 12, 0, N[1] * 12); }
  frame();
  const CAMG = { pos: new TH.Vector3(D.x + N[0] * 78, 88, D.z + N[1] * 78), look: new TH.Vector3(D.x - N[0] * 34, 0, D.z - N[1] * 34) };   // at the fire door, with FOX and WREN
  let camAt = PHASE === "go" ? CAMG : CAM0, flying = false;
  F.camera.position.copy(camAt.pos); F.look.copy(camAt.look); F.camera.updateProjectionMatrix();
  new ResizeObserver(() => { frame(); if(!flying){ F.camera.position.copy(camAt.pos); F.look.copy(camAt.look); } }).observe($("cctv"));
  async function fly(to, ms){ camAt = to; if(RM){ F.camera.position.copy(to.pos); F.look.copy(to.look); return; } flying = true; await F.flyTo(to, ms); flying = false; }
  const key = (x, y) => x + "," + y, kk = c => key(c.x, c.y);
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  // Shortest walk between squares on the free floor, avoiding any squares in `avoid`
  function bfs(from, to, avoid){
    const prev = new Map([[key(from.x, from.y), null]]), q = [from];
    while(q.length){ const c = q.shift(); if(c.x === to.x && c.y === to.y) break;
      for(const [dx, dy] of DIRS){ const nx = c.x + dx, ny = c.y + dy, k = key(nx, ny);
        if(free(nx, ny) && !prev.has(k) && !(avoid && avoid.has(k))){ prev.set(k, c); q.push({ x: nx, y: ny }); } } }
    if(!prev.has(key(to.x, to.y))) return null;
    const out = []; for(let c = to; c; c = prev.get(key(c.x, c.y))) out.unshift(c); return out;
  }
  // Walking distance from one square to every square it can reach
  function dists(from){ const d = new Map([[key(from.x, from.y), 0]]), q = [from];
    while(q.length){ const c = q.shift(), k = d.get(key(c.x, c.y));
      for(const [dx, dy] of DIRS){ const nx = c.x + dx, ny = c.y + dy, kk2 = key(nx, ny); if(free(nx, ny) && !d.has(kk2)){ d.set(kk2, k + 1); q.push({ x: nx, y: ny }); } } }

    F.root.add(g);
    const draw = e => { if(tube) tube.setDrawRange(0, Math.ceil(e * segs) * 6 * 6); const n = e * cells.length; dots.forEach((m, i) => { m.material.opacity = 0.7 * Math.max(0, Math.min(1, n - i)); }); };
    const show = RM ? (draw(1), Promise.resolve()) : F.tween(Math.min(1300, 200 + 50 * cells.length), draw, t => t).then(() => draw(1));
    return { show };
  }
  // FOX leads, WREN a step behind, from outside the door along the route to the destination
  async function walkIn(path){
    const way = [D.clone(), ...path.map(c => W(c.x, c.y))], ms = Math.min(4200, 600 + 230 * path.length);
    const a = fox.walk([fox.at(), ...way, dest.spot.clone()], ms);
    await wait(420);
    const b = wren.walk([wren.at(), ...way], ms);
    await Promise.all([a, b]);
  }
  function end(ok){
    if(over) return; over = true; clearTimeout(timer); if(!ok) mode = "hold";
    const plan = `Guard A every ${P[0]} minutes, guard B every ${P[1]}: both at the blind spot at minute ${M}, the lowest common multiple.`;
    const effect = `sneak:${M}:${P[0]}:${P[1]}`;   // the plan, for the heist
    if(PHASE === "recon"){
      if(ok) T.finish({ ok: true, title: "PLAN SET", lines: [plan, `FOX and WREN go in through the fire door at minute ${M}.`], effect, auto: 2400 });
      else T.finish({ ok: false, title: "SPOTTED", lines: [`ORACLE worked it out: they're both at the blind spot at minute ${M}, the lowest common multiple of ${P[0]} and ${P[1]}.`], note: `The plan: go at minute ${M}.`, effect });
    } else if(ok) T.finish({ ok: true, title: "IN", lines: [`Gone at minute ${M}, with both guards at the blind spot.`, `FOX and WREN are through, heading for ${DEST.to}.`], auto: 1800 });
    else T.finish({ ok: false, title: "SPOTTED", lines: ["The first time both guards are at the blind spot together is the lowest common multiple (LCM) of their rounds."] });
  }

  // ----- Start -----
  render();
  if(PHASE === "go"){ $("hs").hidden = true; tag(""); setTimeout(goLive, 1200 / sp()); }
  else startRecord(0);
  // SPACE: record a pass (recon), or go at the planned minute (fire door). G works at the door too.
  document.addEventListener("keydown", e => {
    if(e.ctrlKey || e.metaKey || e.altKey || T.briefOpen() || (e.target && e.target.tagName === "INPUT")) return;
    const sp = e.code === "Space" || e.key === " ";
    if(sp && (step === S_RECA || step === S_RECB) && !asking){ e.preventDefault(); record(); }
    else if((sp || e.key === "g" || e.key === "G") && step === S_GO && live){ e.preventDefault(); go(); }
  });
  // Teacher SKIP: does the current step
  if(window.PNTest) PNTest.skip("Do this step", () => {
    if(over) return;
    if(step === S_RECA || step === S_RECB){ const g = step;
      if(!asking){ while(recLogs[g].length < 3){ const n = recNext(g); recLogs[g].push(n); tlTick(g, n); } askHowOften(); }
      $("askIn").value = P[g]; answer(); return; }
    if(step === S_MARKA || step === S_MARKB){ const g = step - S_MARKA; T.range(1, LV.grid).filter(t => t % P[g] === 0).forEach(t => marks[g].add(t)); document.querySelectorAll("#hs button").forEach(paint); markDone(g); }
    else if(step === S_BOTH){ clearTimeout(timer); busy = false; choose(M, document.querySelector(`#hs [data-t="${M}"]`)); }
    else if(step === S_GO){ if(!live) return; minute = M; prevM = M - 1; mode = "run"; go(); }
  });
})();
</script>
