<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Guard Patrols (recon)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 12 prototype: recon on the guards, in a CCTV window. One guard paces a corridor up and down, another walks a
     loop of the whole floor; both pass the fire door. When are they there together? (The LCM.)
     Round 13-14: every answer plays on the feed; the guards are lured away and the agent sneaks in on a route that keeps
     clear of them (planned once they're well on their way, hugging the rooms).
     Round 16 (teacher): three stages at every level, numbers scaled by level (L3 adds a third guard in stages 2 and 3).
     1: mark each guard's round on a hundred square and click where they meet. 2: the same grid, nothing to mark: work it
     out and type it. 3: no grid, bigger numbers. Before an answer the feed only loops the first rounds (it always stops
     short of a meeting), and after stage 1 nothing on screen names the meeting time. Each guard's card says how often
     they pass the door; a timeline under the feed ticks every pass, and a tick pops over the door. The decoy is a purple
     throw right across the floor. FOX and WREN's blue route heads for their next stop in the mission (?next= from the
     heist: fuse box, deposit boxes, strongroom or key room; the vault in the Twist Lab), marked and labelled on the floor.
     One screen at 1280 × 720 and up: the feed on the left, the guards and the grid on the right. */
  main.tw{ width:min(1680px, 100%); height:100vh; height:100dvh; box-sizing:border-box; padding:10px 16px 46px; gap:10px; }   /* bottom: clear of FULL SCREEN (the mission's shows over the twist too) */
  main .tw-head{ padding-bottom:8px; } main .tw-head h1{ font-size:clamp(22px,2.6vw,30px); }
  .steps{ display:flex; flex-wrap:wrap; gap:6px; font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; }
  .steps span{ border:1px solid var(--line); padding:3px 8px; color:var(--text-faint); }
  .steps span.on{ color:var(--warning); border-color:var(--warning); } .steps span.done{ color:var(--ok); border-color:rgba(61,220,151,.5); }
  .play{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) clamp(340px,31vw,480px); gap:12px; }
  .feed{ display:flex; flex-direction:column; gap:8px; min-width:0; min-height:0; }
  .cctv{ position:relative; flex:1; min-height:0; padding:0; overflow:hidden; background:#020a0c; border:1px solid #2c4c55; }
  .cctv > div{ z-index:2; }
  .cctv .scan{ position:absolute; inset:0; pointer-events:none; background:repeating-linear-gradient(0deg, rgba(160,240,255,.05) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 120px rgba(0,0,0,.8); }
  .cctv .corner{ position:absolute; width:26px; height:26px; border:2px solid rgba(255,255,255,.7); pointer-events:none; }
  .cctv .tl{ left:10px; top:10px; border-right:0; border-bottom:0; } .cctv .tr{ right:10px; top:10px; border-left:0; border-bottom:0; }
  .cctv .bl{ left:10px; bottom:10px; border-right:0; border-top:0; } .cctv .br{ right:10px; bottom:10px; border-left:0; border-top:0; }
  .cctv .top{ position:absolute; left:46px; top:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.12em; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; line-height:1.5; }
  .cctv .top .rec{ color:#ff4f6d; animation:recb 2.4s ease-in-out infinite; } @keyframes recb{ 50%{ opacity:.35; } }   /* a slow fade, never a flash */
  .cctv .top em{ font-style:normal; color:#ffe68a; }
  .cctv .clock{ position:absolute; right:46px; top:12px; font-family:var(--font-mono); font-size:26px; color:#ffe14d; pointer-events:none; text-shadow:0 0 10px rgba(0,0,0,.9); }
  .dest{ font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.16em; color:#8feaff; padding:3px 9px; border:1px solid rgba(110,200,255,.6); background:rgba(2,10,12,.72); }
  .cctv .log{ position:absolute; left:46px; top:62px; font-family:var(--font-mono); font-size:13px; color:#dff8ff; pointer-events:none; text-shadow:0 0 6px #000; line-height:1.5; }
  /* A small readout in the corner of the feed (it never covers the floor) */
  .cctv .tag{ position:absolute; right:46px; bottom:14px; font-family:var(--font-mono); font-size:14px; letter-spacing:.12em; color:#8feaff; padding:5px 10px; border:1px solid rgba(143,234,255,.55); background:rgba(2,10,12,.8); opacity:0; transition:opacity .4s; pointer-events:none; }
  .cctv .tag.on{ opacity:1; } .cctv .tag.gold{ color:#ffe14d; border-color:rgba(255,225,77,.6); } .cctv .tag.purple{ color:#d7b5ff; border-color:rgba(181,123,255,.8); }
  /* The timeline over the feed (the BRIEF and HINTS tabs sit bottom left): a tick every time a guard reaches the door */
  .tline{ flex:none; padding:7px 22px 6px 12px; display:flex; flex-direction:column; gap:3px; }
  .lane, .axis{ display:grid; grid-template-columns:92px minmax(0,1fr); gap:8px; align-items:center; white-space:nowrap; }
  .lane{ height:20px; }
  .lane .ll{ font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.12em; color:var(--c); display:flex; align-items:center; gap:6px; }
  .lane .ll i{ width:10px; height:10px; border-radius:50%; background:var(--c); }
  .track{ position:relative; height:100%; border-bottom:1px solid rgba(143,234,255,.25); }
  .track b{ position:absolute; bottom:0; width:3px; height:14px; margin-left:-1px; background:var(--c); }
  .track b.gold{ height:19px; background:#ffe14d; box-shadow:0 0 8px #ffe14d; }
  .track b small{ position:absolute; left:6px; bottom:2px; font:400 11px/1 var(--font-mono); color:rgba(235,255,248,.8); }
  .track b.gold small{ color:#ffe14d; font-weight:700; }
  .track .ph{ position:absolute; top:-2px; bottom:-2px; left:0; width:2px; background:rgba(255,255,255,.7); }
  .axis{ font-family:var(--font-mono); font-size:12px; color:var(--text-faint); } .axis > span{ font-family:var(--font-ui); letter-spacing:.14em; font-size:11px; }
  .axis div{ display:flex; justify-content:space-between; }
  /* The side: the guards, then the grid (stages 1 and 2) and the answer */
  .side{ display:flex; flex-direction:column; gap:8px; padding:12px 14px; min-height:0; overflow:hidden; }
  .gcards{ display:flex; flex-direction:column; gap:5px; }
  .gcard{ display:flex; align-items:center; gap:10px; padding:3px 10px; border:1px solid var(--line); border-left:4px solid var(--c); font-family:var(--font-ui); font-size:15px; line-height:1.25; background:rgba(8,26,31,.6); }
  .gcard b{ color:var(--c); } .gcard svg{ flex:none; width:24px; height:24px; }
  .gcard.on{ border-color:var(--c); box-shadow:inset 0 0 0 1px var(--c); }
  .ask{ margin:0; font-family:var(--font-ui); font-size:17px; line-height:1.35; color:#f6feff; } .ask b{ color:#ffe68a; }
  .hs{ flex:1 1 auto; min-height:calc(var(--rows) * 18px); display:grid; grid-template-columns:repeat(10, minmax(0,1fr)); grid-template-rows:repeat(var(--rows), minmax(0,1fr)); gap:3px; max-height:calc(var(--rows) * 46px); }
  .hs > *{ position:relative; display:flex; align-items:center; justify-content:center; min-width:0; min-height:0; padding:0; font:inherit; font-family:var(--font-mono); font-size:clamp(12px,2.1vh,18px); font-weight:700; color:rgba(235,255,248,.86); background:rgba(8,26,31,.9); border:1px solid var(--line); }
  .hs button{ cursor:pointer; } .hs button:hover{ border-color:rgba(var(--accent-rgb),.8); } .hs button:focus-visible{ outline:2px solid var(--warning); outline-offset:1px; }
  .hs.ref > *{ color:rgba(235,255,248,.78); cursor:default; }
  .hs small{ position:absolute; right:3px; top:1px; font-size:10px; font-weight:400; letter-spacing:.04em; color:#fff; }
  .hs .bad{ border-color:#ff8aa0 !important; } .hs .bad::after{ content:"✗"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(30,0,8,.82); color:#ff8aa0; font-size:1.3em; }   /* guard A is red too, so a cross */
  .hs .gold{ background:rgba(255,201,77,.4) !important; border-color:#ffc94d !important; color:#fff3cf; box-shadow:0 0 12px rgba(255,201,77,.5); }
  .ans{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:17px; } .ans label{ flex:1 1 100%; font-family:var(--font-ui); font-size:16px; line-height:1.3; } .ans label b{ color:#ffe68a; }
  .ans input{ width:96px; font-size:22px; text-align:center; padding:6px; }
  .side .tw-msg{ font-size:15px; min-height:2.6em; }
  [hidden]{ display:none !important; }
  @media (max-width:900px){ main.tw{ height:auto; } .play{ grid-template-columns:1fr; } .cctv{ height:360px; flex:none; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span class="steps"><span id="st1">1 · MARK THE ROUNDS</span><span id="st2">2 · USE THE GRID</span><span id="st3">3 · PREDICT</span></span><span class="dest" id="dest"></span></div>
  <div class="play">
    <div class="feed">
      <section class="pn-panel tline" id="tline" aria-hidden="true"><div id="lanes"></div></section>
      <section class="cctv" id="cctv" aria-label="CCTV of the fire door"><div class="scan"></div><div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
        <div class="top"><span class="rec">● REC</span> CAM 04 · FIRE DOOR · <span id="floorName">WEAK FLOOR</span><br><em id="feedLab"></em></div><div class="clock" id="clock">MIN 00</div>
        <div class="log" id="log"></div><div class="tag" id="tag"></div></section>
    </div>
    <aside class="pn-panel side" id="side">
      <div class="gcards" id="cards"></div>
      <p class="ask" id="ask"></p>
      <div class="hs" id="hs" hidden></div>
      <div class="ans" id="ansRow" hidden><label for="ansIn" id="ansLab"></label><input class="pn-input" id="ansIn" inputmode="numeric" maxlength="3" autocomplete="off"><button class="pn-btn small primary pn-go" type="button" id="ansBtn">Play it on the feed</button></div>
      <div class="tw-msg" id="msg" aria-live="polite"></div>
    </aside>
  </div>
</main>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script src="../shared/floor3d.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.peekLevel(), qs = new URLSearchParams(location.search);
  const RM = window.Primenet && Primenet.reducedMotion ? Primenet.reducedMotion() : matchMedia("(prefers-reduced-motion: reduce)").matches;   // the learner's motion setting, or the system one
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(res => setTimeout(res, ms / sp()));
  // Where FOX and WREN head once they're through. The heist sends ?next= (and lift=1 when it's on another floor);
  // the Twist Lab sends nothing, so they go for the vault, by the lift.
  const DESTS = { fusebox: ["FUSE BOX", "the fuse box"], keyroom: ["KEY ROOM", "the key room"], deposit: ["DEPOSIT BOXES", "the deposit boxes in the basement"], strongroom: ["STRONGROOM", "the strongroom"], vault: ["THE VAULT", "the vault"] };
  const DK = DESTS[qs.get("next")] ? qs.get("next") : "vault";
  const LIFT = DK === "deposit" || ((DK === "strongroom" || DK === "vault") && (qs.get("lift") === "1" || !DESTS[qs.get("next")]));
  const DEST = { name: DESTS[DK][0], to: DESTS[DK][1], sub: DK === "deposit" ? "LIFT ▸ BASEMENT" : LIFT ? "TAKE THE LIFT" : "NEXT STOP" };
  T.init({ id: "patrols3d", stage: "GETTING IN", title: "RECON: GUARD PATROLS", eyebrow: "RECON UPDATE", briefTitle: "COMMS · ORACLE",
    goal: "Each guard passes the fire door on their own round. Find the next minute they're <b>at the door together</b>: then one decoy pulls them all away and FOX and WREN slip through.",
    example: "Every 2 minutes (2, 4, 6…) and every 3 minutes (3, 6…): together at the door at minute 6, the lowest common multiple of 2 and 3.",   // a pair no stage uses, so it never gives an answer away
    context: `More guards than we thought. Time their rounds, and FOX and WREN slip through to ${DEST.to}.`,
    story: "Recon update: more guards than we expected. We need to know where they'll be, and when, before we go in." });
  const a0 = window.Primenet && Primenet.getAgent();
  if(a0 && a0.weakFloor) $("floorName").textContent = a0.weakFloor.toUpperCase();
  $("dest").textContent = `FOX + WREN ▸ NEXT STOP: ${DEST.name}`;

  // ----- Stages: three at every level. The grid (stages 1 and 2) never ends on an answer. -----
  const LV = {
    L1: { grid: 30, s: [[[3, 4], [4, 6], [3, 5], [4, 5], [2, 5]], [[4, 6], [3, 8], [6, 8], [4, 10], [6, 9], [2, 7], [4, 7]], [[5, 6], [6, 8], [4, 9], [8, 10], [5, 8], [6, 10], [8, 12]]] },
    L2: { grid: 50, s: [[[6, 8], [4, 10], [6, 9], [6, 10], [8, 12], [4, 6]], [[9, 12], [4, 14], [10, 15], [8, 10], [12, 18], [6, 14], [6, 16]], [[8, 14], [10, 12], [12, 15], [14, 21], [15, 20], [9, 15], [12, 16], [10, 25]]] },
    L3: { grid: 100, s: [[[8, 12], [9, 12], [10, 15], [12, 16], [12, 18], [14, 21], [8, 14], [15, 20]], [[4, 6, 9], [6, 8, 12], [4, 9, 12], [6, 9, 12], [3, 8, 12], [6, 10, 15], [5, 6, 10], [4, 6, 10]], [[6, 8, 9], [8, 10, 12], [5, 6, 8], [6, 9, 15], [8, 12, 18], [10, 12, 15], [6, 8, 10]]] },
  }[L];
  const lcmAll = arr => arr.reduce((a, b) => T.lcm(a, b));
  const rounds = [];
  LV.s.forEach(list => { const pool = list.filter(p => !rounds.some(q => q.slice().sort((x, y) => x - y).join() === p.join() || lcmAll(q) === lcmAll(p))); rounds.push(T.shuffle(T.pick(pool.length ? pool : list))); });   // a new pair and a new answer each stage
  const COLS = [0xff4f6d, 0xffb347, 0xb8f04a], CSS = ["#ff4f6d", "#ffb347", "#b8f04a"], NAMES = ["A", "B", "C"];
  const PURPLE = 0xb57bff, BLUE = 0x6ec8ff;   // purple is the decoy's alone
  const STAGES = ["Stage 1 of 3: mark the rounds", "Stage 2 of 3: use the grid", "Stage 3 of 3: predict"];
  const FEEDS = ["PLAYBACK · LAST NIGHT", "PLAYBACK · EARLIER TONIGHT", "LIVE"];
  let st = 0, over = false;
  const alarm = T.alarm(3, () => end(false));
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function tag(t, cls){ const el = $("tag"); el.textContent = t; el.className = "tag" + (t ? " on" : "") + (cls ? " " + cls : ""); }
  function ask(h){ $("ask").innerHTML = h; }
  const P = () => rounds[st], ANS = () => lcmAll(rounds[st]);
  const both = n => n === 3 ? "all three" : "both";

  // ----- 3D feed -----
  const F = PNFloor3D.create($("cctv"), {});
  const TH = F.THREE;
  F.lightsOn(700);
  // Guards walk the free floor squares (never over a room). Find a door on the outside wall with a long clear run inward.
  const G = F.layout.grid, occ = Array.from({ length: G }, () => Array(G).fill(false));
  (F.layout.rooms || []).forEach(rm => { for(let x = rm.x; x < rm.x + rm.w; x++) for(let y = rm.y; y < rm.y + rm.h; y++) if(occ[x] && y >= 0 && y < G) occ[x][y] = true; });
  const free = (x, y) => x >= 0 && y >= 0 && x < G && y < G && !occ[x][y];
  const run = (x, y, n) => { let k = 0; while(free(x + n[0] * k, y + n[1] * k)) k++; return k; };
  const cands = [];
  for(let i = 0; i < G; i++) [[0, i, [1, 0]], [G - 1, i, [-1, 0]], [i, 0, [0, 1]], [i, G - 1, [0, -1]]].forEach(([x, y, n]) => { if(free(x, y)) cands.push({ x, y, n, len: run(x, y, n), mid: -Math.abs(i - G / 2) }); });
  const ex = F.layout.exit;
  cands.sort((p, q) => (q.len - p.len) || (q.mid - p.mid));
  const dc = cands.find(c => ex && c.x === ex.x && c.y === ex.y && c.len >= G / 2) || cands[0] || { x: 0, y: Math.floor(G / 2), n: [1, 0], len: G };
  const N = [-dc.n[0], -dc.n[1]], NV = new TH.Vector3(N[0], 0, N[1]), SIDE = new TH.Vector3(-N[1], 0, N[0]);   // outward through the door, and along its wall
  const W = (x, y) => F.cellToWorld(x, y);
  const D = W(dc.x, dc.y).add(new TH.Vector3(N[0] * F.cell / 2, 0, N[1] * F.cell / 2));
  const doorMark = new TH.Mesh(new TH.BoxGeometry(N[0] ? 1.4 : F.cell * 1.6, 12, N[0] ? F.cell * 1.6 : 1.4), new TH.MeshBasicMaterial({ color: 0x2fbf8a, transparent: true, opacity: 0.85 }));
  doorMark.position.set(D.x, 6, D.z); F.root.add(doorMark);
  // The camera sits behind the door, high, looking across the whole floor; it pulls back on a narrow feed
  F.camera.fov = 40;
  const CAM0 = { pos: new TH.Vector3(), look: new TH.Vector3() };
  function frame(){ const a = F.camera.aspect || 1.6, k = Math.max(1, 1.6 / a); CAM0.pos.set(N[0] * 136 * k, 138 * k, N[1] * 136 * k).addScaledVector(SIDE, (D.x * SIDE.x + D.z * SIDE.z) * 0.45); CAM0.look.set(N[0] * 12, 0, N[1] * 12); }
  frame(); F.camera.position.copy(CAM0.pos); F.look.copy(CAM0.look); F.camera.updateProjectionMatrix();
  let flying = false;
  new ResizeObserver(() => { frame(); if(!flying){ F.camera.position.copy(CAM0.pos); F.look.copy(CAM0.look); } }).observe($("cctv"));
  const CAM1 = { pos: new TH.Vector3(D.x + N[0] * 62, 96, D.z + N[1] * 62), look: new TH.Vector3(D.x - N[0] * 34, 2, D.z - N[1] * 34) };   // pushed in: the door low in the frame
  async function fly(to, ms){ flying = true; await F.flyTo(to, ms); flying = false; }
  const key = (x, y) => x + "," + y;
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  // Shortest walk between squares on the free floor, avoiding any squares in `avoid`
  function bfs(from, to, avoid){
    const prev = new Map([[key(from.x, from.y), null]]), q = [from];
    while(q.length){ const c = q.shift(); if(c.x === to.x && c.y === to.y) break;
      for(const [dx, dy] of DIRS){ const nx = c.x + dx, ny = c.y + dy, k = key(nx, ny);
        if(free(nx, ny) && !prev.has(k) && !(avoid && avoid.has(k))){ prev.set(k, c); q.push({ x: nx, y: ny }); } } }
    if(!prev.has(key(to.x, to.y))) return null;
    const out = []; for(let c = to; c; c = prev.get(key(c.x, c.y))) out.unshift(c); return out;
  }
  // Walking distance from one square to every square it can reach (avoiding `avoid`)
  function dists(from, avoid){ const d = new Map([[key(from.x, from.y), 0]]), q = [from];
    while(q.length){ const c = q.shift(), k = d.get(key(c.x, c.y));
      for(const [dx, dy] of DIRS){ const nx = c.x + dx, ny = c.y + dy, kk = key(nx, ny); if(free(nx, ny) && !d.has(kk) && !(avoid && avoid.has(kk))){ d.set(kk, k + 1); q.push({ x: nx, y: ny }); } } }
    return d; }
  function farthest(from){ const d = dists(from); let best = from, bd = -1; d.forEach((v, k) => { if(v > bd){ bd = v; const [x, y] = k.split(",").map(Number); best = { x, y }; } }); return best; }
  // Every square within `rad` squares of the given squares (a box round each one)
  function around(cells, rad){ const s = new Set(); cells.forEach(c => { for(let dx = -rad; dx <= rad; dx++) for(let dy = -rad; dy <= rad; dy++) s.add(key(c.x + dx, c.y + dy)); }); return s; }
  const toPts = cells => [D.clone(), ...cells.map(c => W(c.x, c.y)), D.clone()];
  const door = { x: dc.x, y: dc.y }, dDoor = dists(door);
  // A: up and down the long straight corridor from the door. B: out to the far side one way, back another. C: out to the middle and back.
  const aEnd = { x: dc.x + dc.n[0] * (dc.len - 1), y: dc.y + dc.n[1] * (dc.len - 1) };
  const far = farthest(door), out1 = bfs(door, far) || [door];
  const back1 = bfs(far, door, new Set(out1.slice(1, -1).map(c => key(c.x, c.y)))) || out1.slice().reverse();
  const mid = (() => { let best = door, bd = 1e9; for(let x = 0; x < G; x++) for(let y = 0; y < G; y++) if(free(x, y) && dDoor.has(key(x, y))){ const d = Math.abs(x - G / 2) + Math.abs(y - G / 2); if(d < bd){ bd = d; best = { x, y }; } } return best; })();
  const midPath = bfs(door, mid) || [door];
  const ROUTES = [toPts([door, aEnd, door]), toPts(out1.concat(back1.slice(1))), toPts(midPath.concat(midPath.slice(0, -1).reverse()))];

  // ----- Where FOX and WREN are going: a marked, labelled spot on this floor -----
  const byRoom = (x, y) => DIRS.some(([dx, dy]) => { const nx = x + dx, ny = y + dy; return nx >= 0 && ny >= 0 && nx < G && ny < G && occ[nx][ny]; });   // a square right beside a room: a wall to hug
  const onEdge = (x, y) => x === 0 || y === 0 || x === G - 1 || y === G - 1;   // the outside wall of the floor
  // The free square beside a room that's the shortest walk from the door
  function beside(r){ let best = null, bd = 1e9;

    if(t % p[mg] === 0){ marks[mg].add(t); paint(c); T.SND("tag");
      if(T.range(1, LV.grid).filter(x => x % p[mg] === 0).every(x => marks[mg].has(x))){ say(`Guard ${NAMES[mg]}: ${[...marks[mg]].sort((a, b) => a - b).slice(0, 4).join(", ")}…`, "ok"); markNext(mg + 1); }
    } else { c.classList.add("bad"); setTimeout(() => c.classList.remove("bad"), 800); T.SND("wrong"); say(`${t} isn't in guard ${NAMES[mg]}'s round: ${p[mg]} doesn't go into ${t}.`, "bad"); }   // stage 1 is for learning: no strike
  });
  $("ansBtn").addEventListener("click", () => { const v = parseInt($("ansIn").value, 10); if(!Number.isInteger(v) || v < 1){ say("Type a minute.", "warn"); return; } check(v); });
  $("ansIn").addEventListener("keydown", e => { if(e.key === "Enter") $("ansBtn").click(); });
  $("ansIn").addEventListener("input", () => T.SND("typing"));
  // Every answer is checked on the feed. Right: it plays from minute 0 to the meeting. Wrong: it jumps to that minute.
  async function check(v, cell){
    if(over || busy || meeting) return;
    const p = P(), M = ANS();
    busy = true; $("ansBtn").disabled = true; clearTimeout(timer);
    if(v === M){ if(cell) cell.classList.add("gold"); say(`Playing the feed to minute ${v}…`); await runFeed(M); if(meeting) return; return met(); }
    jumpTo(v); alarm.hit();
    if(cell){ cell.classList.add("bad"); setTimeout(() => cell.classList.remove("bad"), 900); }
    say(p.every(q => v % q === 0) ? `Minute ${v}: they're ${both(p.length)} at the door, but they were together earlier. Find the first time after 0.`
      : `Minute ${v}: ${p.map((q, i) => `${NAMES[i]} ${v % q === 0 ? "✓" : "✗"}`).join(" · ")}. Not ${both(p.length)} at the door.`, "bad");
    if(over) return;
    timer = setTimeout(() => { if(over || meeting) return; startLoop(); busy = false; $("ansBtn").disabled = false; if(!cell){ $("ansIn").focus({ preventScroll: true }); $("ansIn").select(); } }, 1900 / sp());
  }
  // The decoy: a purple throw from FOX and WREN right across the floor. It lands, rolls on, and keeps ringing.
  async function throwDecoy(){
    const g = new TH.Group(); F.root.add(g);
    const from = fox.at().setY(4), rest = LW.clone().setY(1.2), dir = rest.clone().sub(D).setY(0).normalize();
    let land = rest.clone().addScaledVector(dir, -F.cell * 2.5);   // it bounces the last few squares
    const lc = { x: Math.round((land.x + F.PLATE / 2) / F.cell - 0.5), y: Math.round((land.z + F.PLATE / 2) / F.cell - 0.5) };
    if(!free(lc.x, lc.y)) land = rest.clone(); land.y = 1.2;
    const span = from.distanceTo(land), arc = new TH.QuadraticBezierCurve3(from, from.clone().lerp(land, 0.5).setY(Math.min(60, 18 + span * 0.35)), land);
    const path = new TH.CurvePath(); path.add(arc); if(land.distanceTo(rest) > 0.5) path.add(new TH.LineCurve3(land, rest));
    const segs = 120, tube = new TH.TubeGeometry(path, segs, 0.7, 6, false);
    const trail = new TH.Mesh(tube, new TH.MeshBasicMaterial({ color: PURPLE, transparent: true, opacity: 0.85, depthWrite: false })); trail.renderOrder = 25; g.add(trail);
    const ball = new TH.Mesh(new TH.SphereGeometry(1.5, 12, 12), new TH.MeshBasicMaterial({ color: PURPLE })); g.add(ball);
    const flightLen = arc.getLength() / path.getLength();
    const at = e => { ball.position.copy(path.getPointAt(Math.min(1, e))); tube.setDrawRange(0, Math.ceil(e * segs) * 6 * 6); };
    if(RM){ at(1); } else await F.tween(Math.min(1700, 700 + span * 7), at, t => t < 0.75 ? (t / 0.75) * flightLen : flightLen + (1 - flightLen) * (1 - Math.pow(1 - (t - 0.75) / 0.25, 2)));   // flies, then rolls to a stop
    at(1); T.SND("clamp");
    const ring = new TH.Mesh(new TH.RingGeometry(F.cell * 0.6, F.cell * 1.0, 40), new TH.MeshBasicMaterial({ color: PURPLE, transparent: true, opacity: 0.8, side: TH.DoubleSide, depthWrite: false }));
    ring.rotation.x = -Math.PI / 2; ring.position.set(rest.x, 0.8, rest.z); g.add(ring);
    const lab = label("DECOY", null, "#d7b5ff", 20); lab.position.copy(rest).addScaledVector(NV, 7).setY(3); g.add(lab);   // just in front of it, low: clear of the feed's header
    const off = F.onTick(now => { if(!RM) ring.material.opacity = 0.45 + 0.3 * Math.sin(now / 480); });   // a slow breath
    T.SND("ping");
    return { remove(){ off(); F.root.remove(g); tube.dispose(); } };
  }
  // A guard leaves its round and walks to the decoy along `cells` (from the door), after `delay` ms
  function setLure(g, cells, delay){
    const pts = [D.clone(), ...cells.map(c => W(c.x, c.y))], path = new TH.CurvePath();
    for(let j = 1; j < pts.length; j++) if(pts[j].distanceTo(pts[j - 1]) > 0.5) path.add(new TH.LineCurve3(pts[j - 1], pts[j]));
    const l = { cells, path, t0: performance.now() + delay / sp(), ms: Math.min(3400, 300 + 200 * cells.length), k: 0, over: false };
    l.done = new Promise(res => { l.res = res; }); if(!path.curves.length){ l.over = true; l.res(); }
    g.lure = l;
  }
  // The squares the guards are on or still have to walk (from the one just behind each guard to the decoy), and the decoy
  function guardCells(){ const s = [lureCell]; guards.forEach(g => { const l = g.lure; if(l) s.push(...l.cells.slice(Math.max(0, l.k - 1))); }); return s; }
  // FOX and WREN wait until every guard is well on the way to the decoy, then take a route that stays at least three
  // squares from wherever they are or are still going (two on a tight floor). If nothing opens up in time they settle
  // for the plain shortest walk clear of the decoy.
  async function planRoute(){
    const t0 = performance.now();
    const ready = () => guards.every(g => g.lure && (g.lure.over || g.lure.k >= 0.6 * (g.lure.cells.length - 1)));
    for(;;){
      const late = performance.now() - t0 > 9000 / sp();
      if(ready() || late){
        const cells = guardCells();
        for(const rad of (late ? [3, 2, 1] : [3, 2])){
          const near = nearMap(cells, rad + 1), hard = new Set(); near.forEach((d, k) => { if(d <= rad) hard.add(k); });
          const p = plan(door, dCell, hard, near, NEAR_ALL, rad); if(p){ window.__pnPatrol.routeRad = rad; return p; }
        }
        if(late){ window.__pnPatrol.routeRad = 0; return bfs(door, dCell, around([lureCell], 1)) || bfs(door, dCell) || [door]; }   // 0: the last resort, for the tests to flag
      }
      await new Promise(res => setTimeout(res, 80));
    }
  }
  // The route on the floor: a blue line of light with a dot on every square, lit from the door to the destination
  function routeLine(cells){
    const pts = [D.clone(), ...cells.map(c => W(c.x, c.y)), dest.spot.clone()].map(v => v.setY(0.9)), g = new TH.Group();
    const path = new TH.CurvePath(); for(let i = 1; i < pts.length; i++) if(pts[i].distanceTo(pts[i - 1]) > 0.05) path.add(new TH.LineCurve3(pts[i - 1], pts[i]));
    const segs = Math.max(20, cells.length * 4), tube = path.curves.length ? new TH.TubeGeometry(path, segs, 0.5, 6, false) : null;
    if(tube){ const m = new TH.Mesh(tube, new TH.MeshBasicMaterial({ color: BLUE, transparent: true, opacity: 0.85, depthWrite: false })); m.renderOrder = 24; g.add(m); }
    const dots = cells.map(c => { const p = W(c.x, c.y), m = new TH.Mesh(new TH.CircleGeometry(Math.max(0.8, F.cell * 0.2), 12), new TH.MeshBasicMaterial({ color: 0x8feaff, transparent: true, opacity: 0, depthWrite: false }));
      m.rotation.x = -Math.PI / 2; m.position.set(p.x, 0.7, p.z); g.add(m); return m; });
    F.root.add(g);
    const draw = e => { if(tube) tube.setDrawRange(0, Math.ceil(e * segs) * 6 * 6); const n = e * cells.length; dots.forEach((m, i) => { m.material.opacity = 0.7 * Math.max(0, Math.min(1, n - i)); }); };
    const show = RM ? (draw(1), Promise.resolve()) : F.tween(Math.min(1300, 200 + 50 * cells.length), draw, t => t).then(() => draw(1));
    return { show, remove(){ F.root.remove(g); if(tube) tube.dispose(); } };
  }
  // FOX leads, WREN a step behind, from outside the door along the route to the destination
  async function walkIn(path){
    const way = [D.clone(), ...path.map(c => W(c.x, c.y))], ms = Math.min(4200, 600 + 230 * path.length);
    const a = fox.walk([fox.at(), ...way, dest.spot.clone()], ms);
    await wait(420);
    const b = wren.walk([wren.at(), ...way], ms);
    await Promise.all([a, b]);
  }
  // They meet at the door: the LCM, seen. Then the decoy, the guards go to look, and FOX and WREN head for their next stop.
  async function met(){
    if(meeting || over) return; meeting = true; busy = false; clearTimeout(timer);
    const p = P(), M = ANS();
    if(st === 0){ marks = p.map(q => new Set(T.range(1, LV.grid).filter(t => t % q === 0))); document.querySelectorAll("#hs button").forEach(c => { paint(c); c.disabled = true; if(+c.dataset.t === M) c.classList.add("gold"); }); }   // a SKIP fills in the grid
    else if(st === 1){ const c = document.querySelector(`#hs [data-t="${M}"]`); if(c) c.classList.add("gold"); }
    $("ansRow").hidden = true; ff = false; dimGuards(false); onArrive = null; mode = "hold";
    if(minute !== M || !document.querySelector(".track b.gold")){ tlWindow(M); for(let m = 1; m <= M; m++) guards.forEach(g => { if(m % g.p === 0) tlTick(g.i, m, m === M); }); }
    minute = M; prevM = M; guards.forEach(doorTick);
    T.SND("lockon"); say(`${M} = ${p.map(q => `${q} × ${M / q}`).join(" = ")}: the lowest common multiple.`, "ok");
    tag(`${both(p.length).toUpperCase()} AT THE DOOR · MINUTE ${M}`, "gold"); logs.length = 0; $("log").innerHTML = "";
    document.querySelectorAll(".gcard").forEach(c => c.classList.remove("on"));
    if(!RM){ T.SND("zoom"); await fly(CAM1, 700); await wait(600); await fly(CAM0, 700); } else await wait(1300);
    // the decoy, thrown right across the floor
    T.step(`One decoy pulls ${both(p.length)} guards away from the door. FOX and WREN head for ${DEST.to}.`, { quiet: true, name: STAGES[st] });
    tag("DECOY THROWN ▸ FAR SIDE", "purple"); T.SND("whoosh");
    const decoy = await throwDecoy();
    lure = true; guards.forEach((g, i) => setLure(g, LURE[i] || lure1, 250 + i * 260));
    const arrive = Promise.all(guards.map(g => g.lure.done));
    await wait(800); T.SND("radio"); tag("GUARDS DRAWN AWAY ▸ DOOR CLEAR");
    const path = await planRoute();
    window.__pnPatrol.route = path.map(c => ({ x: c.x, y: c.y }));
    const line = routeLine(path); dest.light(true); tag(`ROUTE ▸ ${DEST.name}`); T.SND("scanline");
    await line.show; await wait(450);
    tag(`FOX + WREN ▸ ${DEST.name}`); T.SND("whoosh");
    walking = true; walkMin = Infinity;
    await walkIn(path);
    walking = false;
    await arrive;
    T.SND("success"); tag(st < 2 ? `ROUTE CLEAR ▸ ${DEST.name}` : `FOX AND WREN ARE THROUGH ▸ ${DEST.name}`, "gold");
    await wait(1200);
    if(st === rounds.length - 1){ ["st1", "st2", "st3"].forEach(id => { $(id).className = "done"; }); return end(true); }   // the last stage keeps its picture
    decoy.remove(); line.remove(); dest.light(false); lure = false;
    st++; deal();
  }
  function end(ok){
    if(over) return; over = true; mode = "hold"; clearTimeout(timer);
    if(ok) T.finish({ ok: true, title: "IN", lines: [`Meeting times: ${rounds.map(lcmAll).join(", ")} minutes.`, `FOX and WREN are through, heading for ${DEST.to}.`], auto: 1800 });
    else T.finish({ ok: false, title: "SPOTTED", lines: ["The first time the guards are all at the door together is the lowest common multiple (LCM) of their rounds."] });
  }
  deal();
  if(window.PNTest) PNTest.skip("Solve this stage", () => { met(); });
})();
</script>
