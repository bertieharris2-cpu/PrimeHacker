<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Deposit-Box Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 12 prototype: the deposit-box walls, inside the room. A laser-lit vault in one-point perspective,
     deposit boxes down both sides, and the back wall where the key's bank of boxes has to fit.
     Round 14 (Bertie): the side boxes are the real deposit boxes, numbered 1 to N, and the finale happens on them.
     The Venn diagram is a hologram on the back wall, so the boxes and the diagram share one view. */
  main.tw{ width:min(1400px, 100%); }   /* wider than the usual 1100px: the room is the whole show */
  .room{ padding:0; overflow:hidden; background:#010608; }
  .room svg{ display:block; width:100%; height:auto; max-height:min(74vh, 720px); margin:0 auto; }
  .room.walls svg{ max-height:min(48vh, 460px); }   /* while the walls are sorted the FITS buttons must stay on screen; the room grows for the finale */
  .room .cell{ fill:rgba(8,30,36,.9); stroke:rgba(74,163,255,.55); stroke-width:1; }
  .room .cell.box{ fill:hsla(var(--h),60%,42%,.9); stroke:hsla(var(--h),80%,72%,1); }
  .room .laser{ stroke:#ff3355; stroke-width:1.5; opacity:.8; filter:drop-shadow(0 0 4px #ff3355); }
  .room .sweep{ stroke:#ff3355; stroke-width:2.5; filter:drop-shadow(0 0 6px #ff3355); }
  .room .note{ font:600 14px "Chakra Petch", sans-serif; letter-spacing:.14em; fill:#dff8ff; }
  /* The side-wall deposit boxes. Each number sits on its plate, sheared to the wall's angle. */
  .sb{ transition:opacity .5s; }
  .sb .plate{ fill:#0c1f25; stroke:#2c4c55; stroke-width:.8; }
  .sb .handle{ fill:#5b7b82; }
  .sb .num{ font-family:"Courier Prime", monospace; font-weight:700; fill:#a9dbe6; text-anchor:middle; dominant-baseline:central; pointer-events:none; opacity:0; transition:opacity .35s; }
  .sb.lit .num{ opacity:.9; }
  .sb.blink .plate{ animation:sbBlink .5s steps(2) infinite; }   /* the number being sorted: a calm on/off, twice a second */
  .sb.blink .num{ fill:#fff; opacity:1; }
  @keyframes sbBlink{ 50%{ fill:#3d9fd0; stroke:#dff8ff; } }
  .sb.cand .plate{ fill:#2a2410; stroke:#ffc94d; stroke-width:2.2; } .sb.cand .num{ fill:#ffe68a; opacity:1; }   /* in both circles */
  .sb.out{ opacity:.35; }   /* in one circle only */
  .sb.hot .plate{ fill:#8feaff; stroke:#fff; stroke-width:2; filter:drop-shadow(0 0 7px #8feaff); } .sb.hot .num{ fill:#04202a; opacity:1; }   /* the search light */
  .sb.key .plate{ fill:#ffc94d; stroke:#fff3cf; filter:drop-shadow(0 0 9px #ffc94d); } .sb.key .num{ fill:#3a2a00; opacity:1; }
  .sb.dim{ opacity:.16; }
  .scanline{ fill:#8feaff; opacity:.85; filter:drop-shadow(0 0 8px #8feaff); }
  .drawer{ fill:#ffe14d; stroke:#fff3cf; filter:drop-shadow(0 0 12px #ffc94d); }
  .dnum{ font-family:"Courier Prime", monospace; font-weight:700; fill:#3a2a00; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .beam{ stroke:#ff3355; stroke-width:2; stroke-linecap:round; filter:drop-shadow(0 0 5px #ff3355); animation:beamPulse 1s ease-in-out infinite; }
  .beamdot{ fill:#ffd0d8; filter:drop-shadow(0 0 6px #ff3355); }
  @keyframes beamPulse{ 50%{ opacity:.55; } }
  .under{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); gap:16px; align-items:start; }
  .wallinfo{ padding:14px; display:flex; flex-direction:column; gap:8px; }
  .wallinfo .big{ font-family:var(--font-ui); font-size:26px; letter-spacing:.08em; color:var(--accent); }
  .wallinfo .note{ font-size:15px; color:var(--text-muted); min-height:2.8em; }
  .pairs{ padding:14px; display:flex; flex-direction:column; gap:8px; }
  .pairs .lab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.14em; color:var(--text-muted); }
  .pair{ display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; border:1px solid var(--line); padding:7px 10px; background:rgba(0,0,0,.2); }
  .pair b{ font-size:21px; }
  .pair .v{ font-size:14px; color:var(--text-muted); grid-column:1 / -1; }
  .pair.fit{ border-color:var(--accent); } .pair.fit .v{ color:var(--accent); }
  .pair.base{ border-color:#9fb7bb; }
  .pair.done button{ display:none; }
  .pair.done{ grid-template-columns:auto 1fr; } .pair.done .v{ grid-column:auto; }   /* answered: the verdict takes the buttons' place, so the panel never grows */
  @media (max-width:820px){ .under{ grid-template-columns:1fr; } }
  /* Round 13 (Bertie: how does it culminate?): the key box. Every box has a number; the two walls' factors sort
     into a Venn diagram and the key box is the biggest number in both: the highest common factor. */
  .venn{ opacity:0; transition:opacity .6s; } .venn.on{ opacity:1; }
  .vbg{ fill:rgba(110,220,255,.05); stroke:rgba(140,235,255,.4); stroke-width:1.5; }
  .vc{ fill:rgba(110,220,255,.07); stroke:#8feaff; stroke-width:2.5; } .vc.b{ fill:rgba(255,122,230,.06); stroke:#ff7ae6; }
  .vl{ font:700 15px "Chakra Petch", sans-serif; letter-spacing:.12em; fill:#dff8ff; }
  .vl.b{ fill:#ffb3f0; } .vl.a{ fill:#aef0ff; }
  .vhit{ fill:transparent; cursor:pointer; }
  .vn text{ font:700 30px "Courier Prime", monospace; fill:#fff; text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  .vn circle{ fill:transparent; }
  .vn.cur{ font:700 50px "Courier Prime", monospace; fill:#ffe68a; text-anchor:middle; dominant-baseline:central; filter:drop-shadow(0 0 10px #ffc94d); }
  .venn.pick .vn{ cursor:pointer; } .venn.pick .vn:hover text{ fill:#ffe68a; }
  .vn.bad text{ fill:#ff8aa0; } .vn.won text{ fill:#ffe14d; font-size:42px; filter:drop-shadow(0 0 12px #ffc94d); }
  @media (prefers-reduced-motion: reduce){ .sb.blink .plate{ animation:none; fill:#3d9fd0; stroke:#dff8ff; } .beam{ animation:none; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span id="stageLab">Wall <b id="round">1</b> of 2</span><span><b id="nLab"></b></span></div>
  <section class="pn-panel room" id="room"></section>
  <div class="under" id="under">
    <section class="pn-panel wallinfo"><span class="big" id="wallSize"></span><span class="note" id="wallNote"></span></section>
    <section class="pn-panel pairs"><span class="lab">RECTANGLES OF BOXES · FACTOR PAIRS</span><div id="pairs" style="display:flex;flex-direction:column;gap:8px"></div></section>
  </div>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id), NS = "http://www.w3.org/2000/svg";
  // Bertie's options for the finale search. A: the light runs along the boxes and stops at the key box.
  // B: it hops between the gold boxes (the common factors), smallest to biggest, and stops at the biggest.
  // Bertie liked both finales, so with no ?mode the page alternates them: sweep one play, hops the next
  const MODE = (() => { const q = new URLSearchParams(location.search).get("mode"); if(q === "A" || q === "B") return q;
    try{ const last = localStorage.getItem("primenet_walls_finale"), next = last === "A" ? "B" : "A"; localStorage.setItem("primenet_walls_finale", next); return next; }catch(e){ return "A"; } })();
  const L = T.init({ id: "walls3d", stage: "FACTOR VAULT", title: "DEPOSIT-BOX ROOM",
    context: "The key is in one of these deposit boxes.",
    goal: T.peekLevel() === "L1" ? "Which rectangles of boxes fit on the <b>back wall</b>? Tap a rectangle to try it on the wall. Tap it again to <b>turn it round</b>. Or drag boxes out on the wall. Then use the box numbers to find the <b>key box</b>." : "Which rectangles of boxes fit on the <b>back wall</b>? They can be <b>turned round</b>. Then use the box numbers to find the <b>key box</b>.",
    example: "On a back wall 8 wide and 6 high, 4 × 6 fits. 2 × 12 doesn't: 12 is too wide and too tall.",
    story: `We're in ${T.targets()} deposit-box room. The key's box is in a bank on the back wall, and the bank has to fit the wall. Work out which rectangles fit.` });
  const SETS = {
    L1: [[24, 8, 6], [18, 6, 4], [20, 5, 5], [16, 8, 4], [12, 4, 4]],
    L2: [[36, 8, 6], [48, 8, 8], [40, 10, 5], [30, 6, 6], [45, 9, 5]],
    L3: [[72, 9, 8], [60, 10, 6], [84, 12, 7], [90, 10, 9], [96, 12, 8]],
  }[L];
  // Two walls whose totals share a useful common factor (the key box), not 1 and not the smaller total itself
  const rounds = (() => { for(let i = 0; i < 200; i++){ const w = T.shuffle(SETS).slice(0, 2), g = T.gcd(w[0][0], w[1][0]); if(g >= 2 && g < Math.min(w[0][0], w[1][0])) return w; } return T.shuffle(SETS).slice(0, 2); })();
  let r = 0, over = false, right = 0, total = 0, hue = 150;
  const alarm = T.alarm(3, () => end(false));
  const fits = (a, b, W, H) => (a <= H && b <= W) || (b <= H && a <= W);
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const reduced = window.Primenet && Primenet.reducedMotion ? Primenet.reducedMotion() : matchMedia("(prefers-reduced-motion: reduce)").matches;   // the learner's motion setting, or the system one
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }

  // ----- The room in one-point perspective (SVG). Walls at X = ±1, floor/ceiling at Y = ±0.75, back wall at Z = ZB -----
  // A point (X, Y, Z) lands on screen at (CX + X·FOC/Z, CY + Y·FOC/Z). On a side wall FOC/Z is simply the screen
  // distance d from the centre line, so anything on that wall sits at x = CX ± d, y = CY + Y·d.
  const VW = 1000, VH = 480, CX = VW / 2, CY = VH / 2, FOC = 560, ZB = 2.6;
  const P = (X, Y, Z) => [CX + X / Z * FOC, CY + Y / Z * FOC];
  const q = (X, Y, d) => [CX + X * d, CY + Y * d];   // a point X across the room at screen distance d (the side walls are X = ±1)
  const poly = (pts, cls, extra = "") => `<polygon class="${cls}" ${extra} points="${pts.map(p => p.map(v => v.toFixed(1)).join(",")).join(" ")}"/>`;

  // ----- The deposit boxes: 1 to NB down the two side walls, half on each. The left wall holds 1.., the right wall carries on.
  // Rows are equal in the room; columns get wider towards the camera. Boxes read left to right on screen on both walls.
  const NB = Math.max(rounds[0][0], rounds[1][0]), PER = Math.ceil(NB / 2);
  const ROWS = PER <= 12 ? 3 : PER <= 24 ? 4 : PER <= 35 ? 5 : 6, COLS = Math.ceil(PER / ROWS);
  const YB = 0.46, DN = CX - 14, DF = FOC / ZB + 4;   // the boxes span Y = ±YB, from screen distance DN (nearest the camera) to DF (by the back wall)
  const DB = (() => { const g = 1 + 0.6 / COLS, w = (DN - DF) * (g - 1) / (Math.pow(g, COLS) - 1), b = [DN]; for(let k = 0; k < COLS; k++) b.push(b[k] - w * Math.pow(g, COLS - 1 - k)); b[COLS] = DF; return b; })();   // column edges, near to far
  const sideGeo = {};   // box number → { s, Y0, Y1, dn, df } for the finale
  function sideWalls(){
    let g = "";
    for(const s of [-1, 1]) for(let row = 0; row < ROWS; row++) for(let col = 0; col < COLS; col++){
      const ci = s < 0 ? col : COLS - 1 - col, dn = DB[ci] - 1.5, df = DB[ci + 1] + 1.5;   // screen-left to screen-right: near → far on the left wall, far → near on the right
      const Y0 = -YB + row * 2 * YB / ROWS + 0.012, Y1 = -YB + (row + 1) * 2 * YB / ROWS - 0.012, Ym = (Y0 + Y1) / 2;
      const k = (s < 0 ? 0 : PER) + row * COLS + col + 1, real = k <= NB;
      const plate = poly([q(s, Y0, dn), q(s, Y0, df), q(s, Y1, df), q(s, Y1, dn)], "plate");
      // The number is sheared to the wall: along the wall, a step right on screen drops by s·Ym
      const w = dn - df, h = (Y1 - Y0) * (dn + df) / 2, [cx, cy] = q(s, Ym, (dn + df) / 2);
      const fs = Math.min(h * 0.55, w * 0.8 / (0.6 * Math.max(2, String(k).length)));
      const inner = `<g transform="matrix(1 ${(s * Ym).toFixed(3)} 0 1 ${cx.toFixed(1)} ${cy.toFixed(1)})">${real ? `<text class="num" y="${(-h * 0.04).toFixed(1)}" font-size="${fs.toFixed(1)}">${k}</text>` : ""}<rect class="handle" x="${(-w * 0.14).toFixed(1)}" y="${(h * 0.33).toFixed(1)}" width="${(w * 0.28).toFixed(1)}" height="${Math.max(1.2, h * 0.045).toFixed(1)}"/></g>`;
      if(real) sideGeo[k] = { s, Y0, Y1, dn, df, fs };
      g += `<g class="sb"${real ? ` data-n="${k}"` : ""}>${plate}${inner}</g>`;
    }
    return g;
  }
  let backCells = [], boxOf = {};
  function drawRoom(W, H){   // W × H: the back wall holds that grid of box spaces. 0 × 0: the back wall is bare, ready for the hologram
    const bx0 = -0.82, bx1 = 0.82, by0 = -0.6, by1 = 0.62, cw = W ? Math.min((bx1 - bx0) / W, (by1 - by0) / H) : 0;
    const gx0 = -cw * W / 2, gy0 = by0 + ((by1 - by0) - cw * H) / 2;
    let cells = "";
    for(let row = 0; row < H; row++) for(let col = 0; col < W; col++){
      const x0 = gx0 + col * cw + 0.004, x1 = x0 + cw - 0.008, y0 = gy0 + row * cw + 0.004, y1 = y0 + cw - 0.008;
      cells += poly([P(x0, y0, ZB), P(x1, y0, ZB), P(x1, y1, ZB), P(x0, y1, ZB)], "cell", `data-r="${row}" data-c="${col}"`);
    }
    const floorLines = [1.2, 1.5, 1.9, 2.3].map(z => { const [a1, b1] = P(-1, 0.75, z), [a2, b2] = P(1, 0.75, z); return `<line x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}" stroke="#16323a" stroke-width="1"/>`; }).join("");
    // Two laser tripwires low across the room, under the boxes and the hologram
    const lasers = [[0.55, 1.7, 1.4], [0.66, 2.2, 1.9]].map(([y, z, dur]) => { const [a1, b1] = P(-1, y, z), [a2, b2] = P(1, y, z); return `<line class="laser" x1="${a1}" y1="${b1}" x2="${a2}" y2="${b2}"><animate attributeName="opacity" values=".8;.15;.8" dur="${dur}s" repeatCount="indefinite"/></line>`; }).join("");
    const wallBg = s => poly([P(s, -0.75, 1), P(s, -0.75, ZB), P(s, 0.75, ZB), P(s, 0.75, 1)], "", 'fill="#071417" stroke="#123039" stroke-width="1"');
    $("room").innerHTML = `<svg viewBox="0 0 ${VW} ${VH}" id="rsvg" aria-label="Deposit-box room">
      <defs><pattern id="hscan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1.2" fill="rgba(160,240,255,.07)"/></pattern></defs>
      <rect width="${VW}" height="${VH}" fill="#010608"/>
      ${poly([P(-1, 0.75, 1), P(1, 0.75, 1), P(1, 0.75, ZB), P(-1, 0.75, ZB)], "", 'fill="#04161b"')}
      ${poly([P(-1, -0.75, 1), P(1, -0.75, 1), P(1, -0.75, ZB), P(-1, -0.75, ZB)], "", 'fill="#030d10"')}
      ${floorLines}
      ${wallBg(-1)}${wallBg(1)}
      <g id="sides">${sideWalls()}</g>
      ${poly([P(-1, -0.75, ZB), P(1, -0.75, ZB), P(1, 0.75, ZB), P(-1, 0.75, ZB)], "", 'fill="#061418" stroke="#2c4c55"')}
      <g id="back">${cells}</g>
      <g id="holo"></g>
      ${lasers}
      <line class="sweep" id="sweep" x1="0" y1="0" x2="0" y2="0" opacity="0"/>
      <g id="fx"></g>
      ${W ? `<text class="note" x="${CX}" y="${(P(0, -0.75, ZB)[1] - 10).toFixed(1)}" text-anchor="middle">BACK WALL · ${W} WIDE × ${H} HIGH</text>` : ""}
    </svg>`;
    backCells = [...$("room").querySelectorAll(".cell")];
    backCells.forEach(c => c.style.setProperty("--h", 200));
    boxOf = {}; $("room").querySelectorAll(".sb[data-n]").forEach(el => { boxOf[+el.dataset.n] = el; });
    return { gx0, gy0, cw };
  }
  let geo = null;
  // A laser sweep across the room when a wall is dealt. If the brief is up, it waits until it folds away so it's seen.
  let sweepWait = false;
  function sweep(){
    if(T.briefOpen()){
      if(!sweepWait){ sweepWait = true; window.addEventListener("pn-brief", function f(e){ if(e.detail.open) return; window.removeEventListener("pn-brief", f); sweepWait = false; sweep(); }); }
      return;
    }
    const s = $("sweep"), t0 = performance.now(), dur = 1300 / sp();
    s.setAttribute("opacity", "1"); T.SND("scan", 1.3);
    (function f(now){ const k = Math.min(1, (now - t0) / dur), z = 1 + k * (ZB - 1); const [a1, b1] = P(-1, 0.75, z), [a2, b2] = P(1, 0.75, z); s.setAttribute("x1", a1); s.setAttribute("y1", b1); s.setAttribute("x2", a2); s.setAttribute("y2", b2); if(k < 1) requestAnimationFrame(f); else s.setAttribute("opacity", "0"); })(t0);
  }
  const cellEl = (row, col) => backCells.find(c => +c.dataset.r === row && +c.dataset.c === col);
  function paintRect(rows, cols, h){ backCells.forEach(c => { const on = +c.dataset.r < rows && +c.dataset.c < cols; c.classList.toggle("box", on); if(on) c.style.setProperty("--h", h); }); }

  function deal(){
    const [N, W, H] = rounds[r];
    $("round").textContent = r + 1; $("nLab").textContent = `N = ${N} boxes`;
    $("wallSize").textContent = `${W} WIDE × ${H} HIGH`; $("wallNote").textContent = "";
    // The wall's job goes in HINTS; the brief just names the step ("Wall 1 of 2")
    T.step(`<b>${N}</b> boxes, on a back wall <b>${W}</b> wide and <b>${H}</b> high. Mark each rectangle <b>Fits</b> or <b>Doesn't fit</b>.`, { quiet: r > 0, name: `Wall ${r + 1} of ${rounds.length}` });
    $("room").classList.add("walls"); geo = drawRoom(W, H); sweep();
    afterBrief(() => { if(!over && stage === "walls") $("under").scrollIntoView({ block: "nearest", behavior: reduced ? "auto" : "smooth" }); });   // the pairs and their buttons in view, whatever the screen height
    const box = $("pairs"); box.innerHTML = "";
    T.pairs(N).forEach(([a, b]) => {
      total++;
      const el = document.createElement("div"); el.className = "pair";
      el.innerHTML = `<b>${a} × ${b}</b><button class="pn-btn small" type="button" data-a="fit">Fits</button><button class="pn-btn small" type="button" data-a="base">Doesn't fit</button><span class="v"></span>`;
      if(L === "L1"){ const lab = el.querySelector("b"); lab.style.cursor = "pointer"; lab.title = "Try it on the back wall. Tap again to turn it round."; let turned = false;
        lab.addEventListener("click", () => { if(el.classList.contains("done")) return; preview(turned ? b : a, turned ? a : b); turned = !turned; }); }
      el.querySelector('[data-a="fit"]').addEventListener("click", () => answer(el, a, b, true));
      el.querySelector('[data-a="base"]').addEventListener("click", () => answer(el, a, b, false));
      box.appendChild(el);
    });
    if(L === "L1") wireDrag();
    say("");
  }
  function preview(rows, cols){
    const [N, W, H] = rounds[r];
    hue = (hue + 55) % 360; paintRect(rows, cols, hue);
    const o = rows > H || cols > W;
    $("wallNote").textContent = `${rows} high × ${cols} wide${o ? `: too ${rows > H && cols > W ? "tall and too wide" : rows > H ? "tall" : "wide"} for this wall` : ": it fits"}.`;
    T.SND("plot");
  }
  function wireDrag(){
    const svg = $("room").querySelector("svg"); svg.style.touchAction = "none";
    let anchor = null, cur = null;
    const at = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.classList && t.classList.contains("cell") ? { r: +t.dataset.r, c: +t.dataset.c } : null; };
    const paint = () => { const r0 = Math.min(anchor.r, cur.r), r1 = Math.max(anchor.r, cur.r), c0 = Math.min(anchor.c, cur.c), c1 = Math.max(anchor.c, cur.c), h = r1 - r0 + 1, w = c1 - c0 + 1, N = rounds[r][0];
      backCells.forEach(c => { const on = +c.dataset.r >= r0 && +c.dataset.r <= r1 && +c.dataset.c >= c0 && +c.dataset.c <= c1; c.classList.toggle("box", on); if(on) c.style.setProperty("--h", 200); });
      $("wallNote").textContent = `${h} high × ${w} wide = ${h * w} boxes${h * w === N ? ` ✓ that's all ${N}` : ` (need ${N})`}`; };
    svg.addEventListener("pointerdown", e => { if(over) return; const c = at(e); if(!c) return; e.preventDefault(); svg.setPointerCapture(e.pointerId); anchor = cur = c; paint(); T.SND("tag"); });
    svg.addEventListener("pointermove", e => { if(!anchor) return; const c = at(e); if(c && (c.r !== cur.r || c.c !== cur.c)){ cur = c; paint(); T.SND("plot"); } });
    svg.addEventListener("pointerup", () => { anchor = cur = null; });
  }
  function answer(el, a, b, saidFit){
    if(over || el.classList.contains("done")) return;
    const [N, W, H] = rounds[r], f = fits(a, b, W, H), ok = f === saidFit, v = el.querySelector(".v");
    const why = f ? (a <= H && b <= W ? `${a} high and ${b} wide fits.` : `Turned round, ${b} high and ${a} wide fits.`) : `${Math.max(a, b)} is bigger than the wall's width (${W}) and height (${H}), so it can't go on either way.`;
    el.classList.add("done", f ? "fit" : "base");
    v.textContent = (ok ? "✓ " : "✗ ") + why;
    if(f){ const rows = a <= H && b <= W ? a : b, cols = a <= H && b <= W ? b : a; hue = (hue + 55) % 360; paintRect(rows, cols, hue); }
    if(ok){ right++; T.SND("correct", right % 8); say(f ? "It fits on the back wall." : "It doesn't fit, either way round.", "ok"); }
    else { T.SND("wrong"); say(why, "bad"); alarm.hit(); }
    if(!over && [...$("pairs").children].every(p => p.classList.contains("done"))){
      const wait = complete();
      setTimeout(() => { if(over) return; r++; if(r < rounds.length){ T.SND("newlock"); deal(); } else venn(); }, wait / sp());
    }
  }
  // The wall is sorted: each bank that fits slides into the back wall in turn
  function complete(){
    const [N, W, H] = rounds[r];
    const fp = T.pairs(N).filter(([a, b]) => fits(a, b, W, H)).map(([a, b]) => (a <= H && b <= W) ? { rows: a, cols: b } : { rows: b, cols: a });
    $("wallNote").textContent = "Wall sorted. Every bank that fits goes into the wall…";
    fp.forEach((p, k) => setTimeout(() => { if(over) return; paintRect(p.rows, p.cols, (160 + k * 60) % 360); T.SND("blip", k); $("wallNote").textContent = `${p.rows} × ${p.cols} bank in.`; }, (300 + k * 600) / sp()));
    return 300 + fp.length * 600 + 900;
  }

  // ----- The key box: a Venn diagram of the box numbers, as a hologram on the back wall -----
  let stage = "walls", vPlace = null, vPick = null;
  const factors = n => T.range(1, n).filter(d => n % d === 0);
  const afterBrief = fn => { if(!T.briefOpen()) return fn(); window.addEventListener("pn-brief", function f(e){ if(e.detail.open) return; window.removeEventListener("pn-brief", f); fn(); }); };
  const VX = 560, VY = 420, CA = [215, 240], CB = [345, 240], VR = 150;   // the diagram's own coordinates: two circles on a 560 × 420 panel
  function venn(){
    stage = "venn";
    const A = rounds[0][0], B = rounds[1][0], G = T.gcd(A, B);
    const fa = factors(A), fb = factors(B), all = [...new Set([...fa, ...fb])].sort((x, y) => x - y), both = fa.filter(v => fb.includes(v));
    const region = n => fa.includes(n) && fb.includes(n) ? "both" : fa.includes(n) ? "a" : "b";
    $("stageLab").textContent = "Key box"; $("nLab").textContent = `Deposit boxes 1 to ${NB}`;
    $("room").classList.remove("walls"); geo = drawRoom(0, 0); $("under").style.display = "none"; say("");
    $("room").scrollIntoView({ block: "nearest", behavior: "smooth" });
    // The diagram is scaled onto the back wall
    const ww = 2 * FOC / ZB, wh = 1.5 * FOC / ZB, vs = ww / VX, wx = CX - ww / 2, wy = CY - wh / 2 + (wh - VY * vs) / 2;
    $("holo").innerHTML = `<g id="venn" class="venn" transform="translate(${wx.toFixed(1)} ${wy.toFixed(1)}) scale(${vs.toFixed(4)})">
      <rect class="vbg" width="${VX}" height="${VY}"/><rect width="${VX}" height="${VY}" fill="url(#hscan)"/>
      <circle class="vc a" cx="${CA[0]}" cy="${CA[1]}" r="${VR}"/><circle class="vc b" cx="${CB[0]}" cy="${CB[1]}" r="${VR}"/>
      <rect class="vhit" width="${VX}" height="${VY}"/>
      <text class="vl a" x="118" y="44" text-anchor="middle">FACTORS OF ${A}</text><text class="vl b" x="442" y="44" text-anchor="middle">FACTORS OF ${B}</text>
      <text class="vl" x="280" y="409" text-anchor="middle" font-size="13" opacity=".7">BOTH</text>
      <g id="vnums"></g><text class="vn cur" id="vcur" x="280" y="52"></text></g>`;
    const svg = $("rsvg"), vg = $("venn"), cur = $("vcur"), nums = $("vnums"), fx = $("fx");
    const COLV = { a: [118, 170], both: [252, 308], b: [390, 442] }, used = { a: 0, both: 0, b: 0 };
    const slot = reg => { const k = used[reg]++; return [COLV[reg][k % 2], 150 + Math.floor(k / 2) * 44]; };
    let i = 0, busy = false;
    const n = () => all[i];
    const setBox = (v, reg) => { const c = boxOf[v]; if(c){ c.classList.remove("blink"); c.classList.add(reg === "both" ? "cand" : "out"); } };
    // The numbers light up along the walls, then the hologram comes on and the sorting starts
    function reveal(){
      if(over || stage !== "venn") return;
      T.SND("powerup");
      const gap = Math.min(45, 1800 / NB);
      for(let k = 1; k <= NB; k++) setTimeout(() => { if(boxOf[k]) boxOf[k].classList.add("lit"); if(k % 3 === 0) T.SND("tick"); }, k * gap / sp());
      setTimeout(() => { vg.classList.add("on"); T.SND("holo"); }, (NB * gap + 200) / sp());
      setTimeout(showNext, (NB * gap + 800) / sp());
    }
    function showNext(){
      if(over || stage !== "venn") return;
      if(i >= all.length) return pick();
      cur.textContent = n(); if(boxOf[n()]) boxOf[n()].classList.add("blink"); T.SND("plot");
      if(L === "L1") setTimeout(() => { if(!over && stage === "venn" && !busy && i < all.length) place(n(), region(n())); }, 900 / sp());
    }
    function place(v, reg){
      busy = true;
      const [tx, ty] = slot(reg), g = document.createElementNS(NS, "g");
      g.setAttribute("class", "vn"); g.dataset.v = v; g.innerHTML = `<circle r="24"/><text>${v}</text>`; nums.appendChild(g); cur.textContent = "";
      const t0 = performance.now(), dur = 380 / sp();
      (function f(now){ const k = Math.min(1, (now - t0) / dur), e = 1 - (1 - k) * (1 - k); g.setAttribute("transform", `translate(${(280 + (tx - 280) * e).toFixed(1)} ${(52 + (ty - 52) * e).toFixed(1)})`); if(k < 1) requestAnimationFrame(f); })(t0);
      setBox(v, reg);
      T.SND(reg === "both" ? "chirp" : "blip", used[reg]);
      setTimeout(() => { busy = false; i++; showNext(); }, 460 / sp());
    }
    function hit(e){
      const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; const p = pt.matrixTransform(vg.getScreenCTM().inverse());
      const inA = (p.x - CA[0]) ** 2 + (p.y - CA[1]) ** 2 <= VR * VR, inB = (p.x - CB[0]) ** 2 + (p.y - CB[1]) ** 2 <= VR * VR;
      return inA && inB ? "both" : inA ? "a" : inB ? "b" : null;
    }
    svg.addEventListener("click", e => {
      if(over) return;
      if(stage === "pick"){ const t = e.target.closest(".vn"); if(t && t.dataset.v) choose(+t.dataset.v, t); return; }
      if(L === "L1" || busy || stage !== "venn" || i >= all.length || !vg.classList.contains("on")) return;
      const reg = hit(e); if(!reg) return;
      const v = n();
      if(reg === region(v)) return place(v, reg);
      alarm.hit(); T.SND("wrong");
      say(`${v} ${A % v === 0 ? "is" : "isn't"} a factor of ${A}, and ${B % v === 0 ? "is" : "isn't"} a factor of ${B}.`, "bad");
    });
    function pick(){
      stage = "pick"; vg.classList.add("pick");
      T.step(`The key box is the <b>biggest number in both</b> circles. Tap it.`, { name: "Find the key box" });
    }
    function choose(v, t){
      if(v === G) return win(t);
      alarm.hit(); T.SND("wrong"); t.classList.add("bad"); setTimeout(() => t.classList.remove("bad"), 800);
      say(region(v) === "both" ? `${v} is in both, but there's a bigger one.` : `${v} is only a factor of ${region(v) === "a" ? A : B}. The key box number is in both.`, "bad");
    }
    // ----- The finale: scanlines check both walls, a search light runs along the boxes and locks on the key box,
    // every other box dims, and its drawer slides out of the wall towards us with a laser on it -----
    function scanWall(s, dur){
      const el = document.createElementNS(NS, "polygon"); el.setAttribute("class", "scanline"); fx.appendChild(el);
      const t0 = performance.now();
      (function f(now){ const k = Math.min(1, (now - t0) / dur), Y = -0.66 + 1.32 * k;
        el.setAttribute("points", [q(s, Y, DN), q(s, Y, DF), q(s, Y + 0.02, DF), q(s, Y + 0.02, DN)].map(p => p.map(v => v.toFixed(1)).join(",")).join(" "));
        if(k < 1) requestAnimationFrame(f); else el.remove(); })(t0);
    }
    function drawer({ s, Y0, Y1, dn, df, fs }, D){   // the drawer's front is D of the way from the wall to the middle of the room
      const X = s * (1 - D), Ym = (Y0 + Y1) / 2, [cx, cy] = q(X, Ym, (dn + df) / 2);
      const lid = Y0 > 0 ? [q(s, Y0, dn), q(s, Y0, df), q(X, Y0, df), q(X, Y0, dn)] : Y1 < 0 ? [q(s, Y1, dn), q(s, Y1, df), q(X, Y1, df), q(X, Y1, dn)] : null;   // its top seen from above, or its underside from below
      return (lid ? poly(lid, "", 'fill="#d4a92a"') : "") + poly([q(s, Y0, dn), q(X, Y0, dn), q(X, Y1, dn), q(s, Y1, dn)], "", 'fill="#b8860b"') + poly([q(X, Y0, dn), q(X, Y0, df), q(X, Y1, df), q(X, Y1, dn)], "drawer")
        + `<text class="dnum" transform="matrix(1 ${(s * Ym).toFixed(3)} 0 1 ${cx.toFixed(1)} ${cy.toFixed(1)})" font-size="${fs.toFixed(1)}">${G}</text>`;   // the number rides out on the drawer front
    }
    function beam({ s, Y0, Y1, dn, df }, D){   // a laser from our side of the room onto the drawer front, just under its number
      const [x, y] = q(s * (1 - D), Y0 + 0.8 * (Y1 - Y0), (dn + df) / 2);
      return `<line class="beam" x1="${CX}" y1="${VH + 20}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><circle class="beamdot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
    }
    function pushIn({ s, Y0, Y1, dn, df }, dur){   // the camera eases in on the open drawer
      const [tx, ty] = q(s * 0.85, (Y0 + Y1) / 2, (dn + df) / 2), fw = VW * 0.62, fh = VH * 0.62;
      const x1 = Math.max(0, Math.min(VW - fw, tx - fw / 2)), y1 = Math.max(0, Math.min(VH - fh, ty - fh / 2)), t0 = performance.now();
      T.SND("zoom");
      (function f(now){ const k = Math.min(1, (now - t0) / dur), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
        svg.setAttribute("viewBox", `${(x1 * e).toFixed(1)} ${(y1 * e).toFixed(1)} ${(VW - (VW - fw) * e).toFixed(1)} ${(VH - (VH - fh) * e).toFixed(1)}`); if(k < 1) requestAnimationFrame(f); })(t0);
    }
    function win(t){
      if(over) return;
      over = true; stage = "won"; T.hideBrief(); t.classList.add("won"); say(`Box ${G}: the biggest factor of ${A} and ${B}.`, "ok");
      const S = sp(), at = (ms, fn) => setTimeout(fn, ms / S), gsv = sideGeo[G];
      Object.values(boxOf).forEach(c => c.classList.remove("blink"));
      // 1. Scanlines down both walls
      at(0, () => { scanWall(-1, 650 / S); T.SND("scanline", 0.65 / S); });
      at(140, () => scanWall(1, 650 / S));
      // 2. The search light, getting quicker. A: the boxes leading up to the key box. B: the gold boxes, smallest to biggest.
      const K = Math.min(NB - 1, 12), path = MODE === "B" ? both : T.range(0, K).map(j => (((G - 1 - K + j) % NB) + NB) % NB + 1);
      let tm = 850, prev = null;
      path.forEach((v, j) => { at(tm, () => { if(prev) prev.classList.remove("hot"); prev = boxOf[v]; if(prev) prev.classList.add("hot"); T.SND("blip", j); }); tm += MODE === "B" ? 380 - 120 * j / Math.max(1, path.length - 1) : 200 - 120 * j / Math.max(1, K); });
      // 3. Lock on: the key box lights, the rest dim
      at(tm + 150, () => { T.SND("lockon"); Object.entries(boxOf).forEach(([k, c]) => { c.classList.remove("hot", "cand", "out"); c.classList.add(+k === G ? "key" : "dim"); }); });
      // 4. The drawer slides out, the laser finds it, the camera pushes in
      at(tm + 850, () => {
        T.SND("whoosh");
        const t0 = performance.now(), dur = 900 / S;
        (function f(now){ const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3); fx.innerHTML = drawer(gsv, 0.3 * e) + beam(gsv, 0.3 * e); if(k < 1) requestAnimationFrame(f); })(t0);
        at(300, () => T.SND("laser"));
        if(!reduced) pushIn(gsv, 1500 / S);
      });
      // ORACLE speaks with the result, so its panel never sits over the drawer
      at(tm + 850 + 2600, () => { T.say("Drawer's open. That's our key."); T.finish({ ok: true, title: "KEY BOX OPEN", lines: [`Box <b>${G}</b> is the <b>highest common factor</b> of ${A} and ${B}.`], auto: 2600 }); });
    }
    vPlace = () => {
      if(busy){ i++; busy = false; }   // a number mid-flight is already on the diagram
      Object.values(boxOf).forEach(c => c.classList.add("lit")); vg.classList.add("on");
      while(i < all.length && !over){ const v = n(), [tx, ty] = slot(region(v)); nums.insertAdjacentHTML("beforeend", `<g class="vn" data-v="${v}" transform="translate(${tx} ${ty})"><circle r="24"/><text>${v}</text></g>`); setBox(v, region(v)); i++; }
      cur.textContent = ""; if(stage === "venn") pick();
    };
    vPick = () => { const t = nums.querySelector(`[data-v="${G}"]`); if(t) win(t); };
    T.step(L === "L1"
      ? `The key box number is a <b>factor of ${A}</b> and a <b>factor of ${B}</b>. Watch the box numbers sort into the circles.`
      : `Tap where each box number goes: <b>factors of ${A}</b>, <b>factors of ${B}</b>, or the middle for <b>both</b>.`, { name: "Find the key box" });
    afterBrief(reveal);
  }
  function end(ok){
    over = true;
    T.finish({ ok, title: ok ? "KEY BOX OPEN" : "ALARM TRIPPED",
      lines: [`Pairs sorted correctly: <b>${right}</b> of ${total}`, `A pair fits if its smaller number fits one side and its larger number fits the other.`] });
    T.say(ok ? "Drawer's open. That's our key." : "Too many wrong calls. The lasers caught us.");
  }
  deal();
  if(window.PNTest) PNTest.skip("Solve this step", () => {
    if(stage === "won") return "The key box is already opening.";
    if(stage === "venn"){ if(vPlace) vPlace(); return "Numbers sorted."; }
    if(stage === "pick"){ if(vPick) vPick(); return "Key box chosen."; }
    const [N, W, H] = rounds[r];
    [...$("pairs").children].forEach(el => { if(el.classList.contains("done")) return; const [a, b] = el.querySelector("b").textContent.split("×").map(s => +s.trim()); el.querySelector(fits(a, b, W, H) ? '[data-a="fit"]' : '[data-a="base"]').click(); });
  });
})();
</script>
</body>
</html>
