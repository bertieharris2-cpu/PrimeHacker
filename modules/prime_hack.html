<html lang="en" class="phase-hack">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>FINANCIAL SYSTEMS INTERFACE</title>
<style>
  
:root{

  --bg-panel: rgba(10, 22, 28, 0.72);

  --system: #114b5f;

  --text-primary: rgba(var(--accent-rgb), 0.95);
  --text-muted: rgba(0, 220, 100, 0.70);

  --ok: var(--accent);
  --warning: #f2c14e;
  --danger: #ff6b6b;

  --glow-accent: rgba(var(--accent-rgb),0.16);
  --glow-system: rgba(17,75,95,0.18);

  --font-ui: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
  --font-mono: "Courier Prime", ui-monospace, monospace;

  --radius: 0px;
  --border-thin: 1px solid rgba(17,75,95,0.45);
  --border-strong: 1px solid rgba(var(--accent-rgb),0.55);

  --panel-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset;

  --transition-fast: 120ms ease;
  --transition-normal: 240ms ease;
  --transition-slow: 400ms ease;

  /* Legacy PrimeHack aliases -> PRIMENET tokens */
  --green: var(--accent);
  --green2: rgba(var(--accent-rgb),0.88);
  --greenDim: rgba(var(--accent-rgb),0.55);
  --cyan: rgba(120,210,255,0.75);
  --ink: rgba(0,0,0,0.55);
  --panel: var(--bg-panel);
  --line: rgba(17,75,95,0.45);

}


  html,body{height:100%; background: var(--bg-primary); margin:0; font-family: "Courier Prime", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;}
  /* subtle diagonal “laser” backdrop */
  body:before{
    content:"";
    position:fixed; inset:0;
    background:
      radial-gradient(1200px 600px at 20% 10%, rgba(var(--accent-rgb),0.10), transparent 60%),
      radial-gradient(900px 700px at 85% 90%, rgba(0,180,255,0.06), transparent 55%),
      repeating-linear-gradient(120deg, rgba(var(--accent-rgb),0.06) 0 2px, transparent 2px 26px);
    filter: blur(0.2px);
    opacity:0.55;
    pointer-events:none;
  }
  .wrap{ width:min(1100px, 92vw); margin: 18px auto; }
  .topbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 12px;
    background: rgba(0,0,0,0.62);
    border:1px solid var(--border);
    box-shadow: 0 18px 60px var(--shadow);
    border-radius: var(--radius);
  }
  .pill{
    color: var(--green2);
    border:1px solid rgba(var(--accent-rgb),0.22);
    background: rgba(0,0,0,0.45);
    padding:6px 10px;
    border-radius: var(--radius);
    font-size: 14px;
    letter-spacing: 0.3px;
    user-select:none;
  }
  .pill strong{ color: var(--green); }
  .pill.modeRole{ box-shadow: 0 0 0 1px rgba(var(--accent-rgb),0.20) inset; }
  .pill.modeMath{ border-color: rgba(242,193,78,0.35); color: var(--yellow); background: rgba(20,16,0,0.35); box-shadow: 0 0 0 1px rgba(242,193,78,0.18) inset; }
  .btn{
    appearance:none; border:1px solid rgba(var(--accent-rgb),0.35);
    background: rgba(0,0,0,0.55); color: var(--green);
    padding:7px 10px; border-radius: var(--radius);
    cursor:pointer; font-size: 13px;
  }
  .btn:hover{ background: rgba(0,0,0,0.75); }
  .btn.alt{ border-color: rgba(242,193,78,0.35); color: var(--yellow); }
  .btn.small{ padding:6px 9px; font-size: 12px; }
  .btn.active{ box-shadow: 0 0 0 1px rgba(var(--accent-rgb),0.25) inset, 0 0 16px rgba(var(--accent-rgb),0.10); }

  .terminalWindow{
    margin-top: 12px;
    position:relative;
    background: var(--glass);
    border: 1px solid var(--border);
    box-shadow: 0 18px 60px var(--shadow);
    border-radius: var(--radius);
    padding: 22px 28px;
    font-size: 19px;
    line-height: 1.65;
    min-height: 520px;
    overflow:hidden;
  }
  .terminal{
    color: var(--green2);
    height: 420px;
    overflow:auto;
    padding-right: 8px;
  }
  /* DISCRETE SCROLLBAR - subtle styling */
  .terminal::-webkit-scrollbar{
    width: 6px;
  }
  .terminal::-webkit-scrollbar-track{
    background: transparent;
  }
  .terminal::-webkit-scrollbar-thumb{
    background: rgba(var(--accent-rgb),0.25);
    border-radius: 0;
  }
  .terminal::-webkit-scrollbar-thumb:hover{
    background: rgba(var(--accent-rgb),0.45);
  }
  .lineRow{ white-space: pre-wrap; word-break: break-word; }
  .sys{ color: var(--green2); }
  .warn{ color: var(--yellow); }
  .bad{ color: var(--red); }
  .hot{ color: var(--pink); }
  .ok{ color: var(--green); }

  .promptRow{
    display:flex; gap:10px; align-items:flex-start;
    border-top: 1px solid rgba(var(--accent-rgb),0.20);
    padding: 8px 0;
    min-height: 30px;
  }
  .prompt{ color: var(--green); user-select:none; white-space:nowrap; }
  .live{ color: var(--green2); white-space: pre-wrap; word-break: break-word; }
  .cursor{ display:inline-block; width:10px; height:20px; background: rgba(var(--accent-rgb),0.65); margin-left: 2px; transform: translateY(4px); animation: blink 1.1s infinite; }
  @keyframes blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }
  .hiddenInput{ position:absolute; left:-9999px; top:-9999px; opacity:0; }

  /* Mini reward overlay (small bar) - PREMIUM SOLID FEEL */
  .miniOverlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.88); /* increased opacity for solid feel */
    backdrop-filter: blur(2px);
    z-index: 5000;
  }
  .miniBox{
    width:min(680px, 86vw);
    background: rgba(0,0,0,0.94); /* darker, more solid */
    border:1px solid rgba(var(--accent-rgb),0.45); /* faint inner glow */
    box-shadow: 0 0 30px rgba(0,0,0,0.95), inset 0 0 1px rgba(var(--accent-rgb),0.15); /* depth + faint inner border */
    border-radius: var(--radius);
    padding: 18px 18px 16px 18px;
  }
  .miniTitle{ color: var(--green); font-size: 18px; letter-spacing: 0.6px; margin-bottom: 10px; }
  .miniSub{ color: rgba(180,255,215,0.9); font-size: 13px; margin-bottom: 12px; }
  .miniBarWrap{
    height: 18px; border-radius: var(--radius); overflow:hidden;
    border:1px solid rgba(var(--accent-rgb),0.30);
    background: rgba(0,0,0,0.55);
    position:relative;
  }
  .miniBarFill{ height:100%; width:0%; background: rgba(var(--accent-rgb),0.85); }
  .miniBarSweep{
    position:absolute; top:0; bottom:0; width:80px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent);
    animation: sweep 0.9s linear infinite;
    opacity:0.8;
  }
  @keyframes sweep{ from{transform:translateX(-90px)} to{transform:translateX(760px)} }

  /* Buffer dock (centre) - IMMERSIVE MODE - overlays on terminal */
  .bufferDock{
    position:fixed; inset:0; display:flex; align-items:flex-end; justify-content:center;
    background: rgba(0,0,0,0.45); /* slightly more opaque for focus */
    z-index: 6000;
    padding-bottom: 120px; /* Move above HUD bar */
    transition: background 200ms ease;
  }
  .bufferDock.entered{
    background: rgba(0,0,0,0); /* fade out when stage entered */
  }
  .bufferBox{
    width:min(820px, 88vw);
    background: rgba(0,0,0,0.94);
    border:1px solid rgba(var(--accent-rgb),0.42);
    box-shadow: 0 18px 70px rgba(0,0,0,0.80);
    border-radius: var(--radius);
    padding: 18px 22px;
  }
  .bufferRow{
    display:flex; align-items:center; justify-content:center; gap:14px;
    color: rgba(200,255,230,0.95);
    font-size: 18px;
    letter-spacing: 0.6px;
  }
  .bufferRow strong{ color: var(--green); }
  .meter{
    display:inline-flex; gap:6px; align-items:center;
    padding: 10px 14px;
    border: 1px solid rgba(var(--accent-rgb),0.26);
    border-radius: var(--radius);
    background: rgba(0,0,0,0.45);
  }
  .seg{
    width: 18px; height: 18px;
    border: 1px solid rgba(var(--accent-rgb),0.35);
    background: rgba(0,0,0,0.65);
  }
  .seg.on{ background: rgba(var(--accent-rgb),0.85); }
  .pressSpace{
    margin-top: 12px;
    text-align:center;
    color: var(--yellow);
    font-size: 14px;
    letter-spacing: 0.5px;
    opacity:0;
  }
  .pressSpace.show{ opacity:1; animation: blink2 1.1s infinite; }
  @keyframes blink2{ 0%,49%{opacity:1} 50%,100%{opacity:0.25} }

  /* Code flood overlay (final) */
  .codeFloodOverlay{
    position:fixed; inset:0; z-index: 7000;
    display:flex; align-items:center; justify-content:center;
    background: rgba(0,0,0,0.62);
  }
  .codeFloodBox{
    width:min(760px, 90vw);
    border:1px solid rgba(var(--accent-rgb),0.40);
    background: rgba(0,0,0,0.92);
    box-shadow: 0 18px 80px rgba(0,0,0,0.85);
    border-radius: var(--radius);
    padding: 14px 16px 16px 16px;
  }
  .codeFloodHeader{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom: 8px;
  }
  .codeFloodTitle{ color: var(--green); font-size: 16px; letter-spacing:0.6px; }
  .codeFloodStream{
    height: 220px;
    overflow:hidden;
    border:1px solid rgba(var(--accent-rgb),0.18);
    background: rgba(0,0,0,0.55);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: rgba(180,255,215,0.95);
    white-space: pre-wrap;
    font-size: 14px;
    line-height: 1.35;
    word-break: break-word;
  }
  .codeFloodStream .cfPink{ color: #ff4fd8; }
  .codeFloodStream .cfYellow{ color: #ffe66a; }
  .codeFloodStream .cfRed{ color: #ff6b6b; }
  .codeFloodBarWrap{
    margin-top: 10px;
    height: 18px;
    border-radius: var(--radius);
    overflow:hidden;
    border:1px solid rgba(var(--accent-rgb),0.30);
    background: rgba(0,0,0,0.55);
    position:relative;
  }
  .codeFloodBarFill{ height:100%; width:0%; background: rgba(var(--accent-rgb),0.85); }
  .codeFloodBarSweep{
    position:absolute; top:0; bottom:0; width:90px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent);
    animation: sweep2 0.85s linear infinite;
    opacity:0.75;
  }
  @keyframes sweep2{ from{transform:translateX(-110px)} to{transform:translateX(820px)} }
  .codeFloodResult{
    margin-top: 12px;
    text-align:center;
    font-size: 28px;
    letter-spacing: 2px;
    color: var(--green);
  }

/* ===== PRIMENET override layer (readability + modern B) ===== */
body{
  font-family: var(--font-ui) !important;
  color: var(--text-primary);
  background:
    radial-gradient(1200px 700px at 35% 18%, rgba(var(--accent-rgb),0.10), transparent 62%),
    radial-gradient(1000px 800px at 80% 85%, rgba(17,75,95,0.18), transparent 62%),
    linear-gradient(180deg, rgba(255,255,255,0.02), transparent 45%),
    var(--bg-primary) !important;
}

/* Replace the old neon/diagonal haze with subtle scanlines + microgrid */
body:before{
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.010) 0 1px, transparent 1px 28px) !important;
  opacity: 0.35 !important;
  filter: none !important;
}

/* Panels / frames */
.frame, .box, .panel, .hud, .wrap > .box, .wrap > .frame{
  background: var(--bg-panel) !important;
  border: var(--border-thin) !important;
  border-radius: var(--radius) !important;
  box-shadow: var(--panel-shadow) !important;
}

/* Buttons */
.btn, button{
  border: var(--border-thin) !important;
  border-radius: var(--radius) !important;
  background: rgba(0,0,0,0.25) !important;
  color: var(--text-primary) !important;
  transition: transform var(--transition-fast), box-shadow var(--transition-fast), border-color var(--transition-fast);
}
.btn:hover, button:hover{
  border-color: rgba(var(--accent-rgb),0.55) !important;
  box-shadow: 0 0 16px var(--glow-accent);
}
.btn:active, button:active{ transform: translateY(1px); }

/* Inputs */
input, textarea{
  border: var(--border-thin) !important;
  border-radius: var(--radius) !important;
  background: rgba(0,0,0,0.22) !important;
  color: var(--text-primary) !important;
  font-family: var(--font-mono) !important;
}
input:focus, textarea:focus{
  outline: none !important;
  border-color: rgba(var(--accent-rgb),0.60) !important;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 0 18px var(--glow-accent) !important;
}

/* Terminal areas keep mono */
.terminal, .log, pre, code, .mono{
  font-family: var(--font-mono) !important;
  color: var(--text-primary) !important;
}

/* Headings / labels slightly brighter */
h1,h2,h3,.title,.label,.hdr{
  font-family: var(--font-ui) !important;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(240,255,250,0.92) !important;
}

/* Subtle accent for success tags */
.ok, .accepted, .good, .status-ok{
  color: var(--ok) !important;
}



/* ===============================
   PRIMENET LAYOUT REFIT (Option A)
   =============================== */

/* Base page */
html,body{
  height:100%;
  margin:0;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-ui);
}

/* Subtle micro-grid + scanlines (no wide diagonals) */
body:before{
  content:"";
  position:fixed; inset:0;
  background:
    radial-gradient(1200px 700px at 30% 18%, rgba(255,255,255,0.06), transparent 60%),
    radial-gradient(900px 700px at 85% 85%, rgba(255,255,255,0.03), transparent 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,0.020) 0 1px, transparent 1px 7px),
    repeating-linear-gradient(90deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 30px);
  opacity: 0.65;
  pointer-events:none;
  mix-blend-mode: screen;
}

/* Hide old topbar if still present for any reason */
.topbar{ display:none !important; }

.wrap{
  width: min(1180px, 94vw);
  margin: 18px auto;
}

.header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap: 14px;
  padding: 12px 14px;
  border: var(--border-thin);
  background: var(--bg-panel);
  box-shadow: var(--panel-shadow);
}

.brand{
  display:flex;
  flex-direction:column;
  gap: 4px;
  min-width: 180px;
}
.brandMain{
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-size: 13px;
}
.brandSub{
  font-family: var(--font-mono);
  color: var(--text-muted);
  letter-spacing: .10em;
  font-size: 12px;
  text-transform: uppercase;
}

.headerRight{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap: 8px;
  flex: 1;
}

.headerPills{
  display:flex;
  gap: 10px;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.pill{
  border: 1px solid rgba(17,75,95,0.38);
  background: rgba(0,0,0,0.18);
  padding: 6px 10px;
  font-size: 12px;
  letter-spacing: .06em;
  user-select:none;
  font-family: var(--font-ui);
  color: var(--text-muted);
}
.pill strong{
  color: var(--text-primary);
  font-weight: 700;
}

.keys{
  font-family: var(--font-mono);
  font-size: 12px;
  color: rgba(220,240,235,0.62);
  letter-spacing: .06em;
}

/* Workspace */
.workspace{
  display:grid;
  grid-template-columns: 360px 1fr;
  gap: 14px;
  margin-top: 14px;
  min-height: calc(100vh - 120px);
}

/* Left console */
.side{
  display:flex;
  flex-direction:column;
  gap: 14px;
}
.card{
  border: var(--border-thin);
  background: var(--bg-panel);
  box-shadow: var(--panel-shadow);
}
.cardHead{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.10);
  letter-spacing: .10em;
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 700;
}
.cardHead .muted{
  font-family: var(--font-mono);
  font-weight: 400;
  font-size: 11px;
  letter-spacing: .08em;
  color: rgba(220,240,235,0.62);
  text-transform:none;
}
.cardBody{ padding: 12px; display:flex; flex-direction:column; gap: 10px; }
.miniRow{ display:flex; gap: 10px; flex-wrap:wrap; }

.smallText{
  font-family: var(--font-ui);
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1.45;
}
.code{
  font-family: var(--font-mono);
  color: var(--text-primary);
  padding: 0 4px;
  border: 1px solid rgba(17,75,95,0.38);
  background: rgba(0,0,0,0.18);
}

/* Buttons (crisper, less chunky) */
.btn{
  border: 1px solid rgba(17,75,95,0.55);
  background: rgba(0,0,0,0.18);
  color: var(--text-primary);
  padding: 10px 12px;
  font-family: var(--font-ui);
  letter-spacing: .06em;
  text-transform: uppercase;
  font-weight: 600;
  transition: border-color var(--transition-normal), box-shadow var(--transition-normal), transform var(--transition-fast);
}
.btn:hover{ border-color: rgba(var(--accent-rgb),0.55); box-shadow: 0 0 0 1px rgba(255,255,255,0.05) inset, 0 0 18px var(--glow-accent); transform: translateY(-1px); }
.btn:active{ transform: translateY(0px); }
.btn.alt{ border-color: rgba(var(--accent-rgb),0.55); }
.btn.small{ padding: 8px 10px; font-size: 12px; }

/* Main terminal area */
.main{ min-width:0; }
.terminalWindow{
  border: var(--border-thin);
  background: rgba(0,0,0,0.20);
  box-shadow: var(--panel-shadow);
}

/* Ensure terminal text stays mono */
.terminal, .prompt, .keys, .code{
  font-family: var(--font-mono) !important;
}

/* Responsive: stack on narrow screens */
@media (max-width: 980px){
  .workspace{ grid-template-columns: 1fr; }
  .headerRight{ align-items:flex-start; }
  .headerPills{ justify-content:flex-start; }
}


/* ===== Accessibility / spacious layout tuning (Option A v1.1) ===== */
:root{
  --space-1: 10px;
  --space-2: 14px;
  --space-3: 18px;
  --space-4: 24px;
  --space-5: 32px;

  --ui-maxw: 1240px; /* keep content readable on ultrawide */
  --ui-pad: 24px;
  --ui-gap: 18px;

  --text-size: 15px;
  --mono-size: 15px;
  --mono-leading: 1.55;
}

body{
  font-size: var(--text-size);
}

.workspaceWrap{
  max-width: var(--ui-maxw);
  margin: 0 auto;
  padding: var(--ui-pad);
  box-sizing: border-box;
}

/* Increase whitespace between major areas */
.layout{
  gap: var(--ui-gap) !important;
}

/* Panels: a bit more breathing room */
.panel, .card, .pane{
  border-radius: var(--radius) !important;
}
.panelHeader, .panelHead, header .bar, .topbar{
  padding: 14px 16px !important;
}
.panelBody, .body, .content{
  padding: 16px !important;
}

/* Buttons: bigger targets, calmer */
.btn{
  padding: 10px 12px !important;
  min-height: 40px;
  letter-spacing: .10em;
}
.btn.ghost{
  background: rgba(0,0,0,0.10) !important;
  border: var(--border-thin) !important;
}
.btn.ghost:hover{
  border: var(--border-strong) !important;
  box-shadow: 0 0 18px var(--glow-system);
}

/* Terminal readability */
.terminal, #terminal, .term, .terminalWindow{
  font-family: var(--font-mono) !important;
  font-size: var(--mono-size) !important;
  line-height: var(--mono-leading) !important;
}
.inputRow input, .inputRow textarea, input[type="text"], textarea{
  font-size: 16px !important;
  padding: 10px 12px !important;
}

/* Fullscreen state (adds subtle edge + hides browser-ish margins) */
body.isFullscreen{
  background: var(--bg-primary);
}
body.isFullscreen .workspaceWrap{
  max-width: 1400px;
  padding: 28px;
}

/* Small screens: reduce padding a touch */
@media (max-width: 900px){
  :root{ --ui-pad: 14px; --ui-gap: 14px; }
}



/* =========================
   FSI header + control bar overrides
   ========================= */
html,body{ font-family: var(--font-ui); }
.terminal, .prompt, .live{ font-family: var(--font-mono); }

.fsiHeader{
  display:flex; align-items:center; justify-content:center; gap:6px;
  padding: 8px 8px 4px;
  background: transparent;
  border: none !important;
  box-shadow: none !important;
  outline: none;
}
.header, .wrap{
  border: none !important;
  box-shadow: none !important;
}
.fsiTitle{

/* Formatted HINT and HELP packets in the terminal */

/* Always-visible hint strip */

.hintStrip .hintTag{ font-weight:700; font-size:11px; letter-spacing:.14em; color:var(--warning); flex-shrink:0; }

<script>
/* =========================
   PRIME HACK – CLEAN CORE
   ========================= */

const PN = window.Primenet;
const TEACHER = !!(PN && PN.isTeacher());   // level buttons and test controls are teacher-only

// --- Timing & structure config (edit these numbers)
const PRIME_NET_EFFECTS = {
  locksPerRun: 4,
  preludeSeconds: 8,
  bufferStages: 4,
  keysPerStage: 16,
  interStageScrollSeconds: 3,

};

// --- Game difficulty bands (per lock index within run)
const DIFF_BANDS = {
  L1: [
    { p:[2,3,5,7],     q:[2,3,5,7,11] },        // lock 1
    { p:[2,3,5,7,11],  q:[3,5,7,11,13] },       // lock 2
    { p:[3,5,7,11],    q:[5,7,11,13,17] },      // lock 3

  L2: [

  { title:"FIREWALL BREACHED", sub:"Session token secured" },
  { title:"ACCOUNT SHELL OPEN", sub:"Personal details obtained" },
  { title:"VAULT WALL CRACKED", sub:"Ledger channel exposed" },
];

// --- State
let MODE = "roleplay";          // "roleplay" | "math"
let DIFF = "L1";                // "L1" | "L2" | "L3"
let soundOn = false;
let quickPairOn = true;

const Run = {
  index: 1,                     // 1..locksPerRun
  locksPerRun: PRIME_NET_EFFECTS.locksPerRun,
  usedPairs: new Set(),         // avoid repeats within a run

};

// --- Utility
function addLine(text, cls="sys"){
  const div = document.createElement("div");
  div.className = `lineRow ${cls}`;
  div.textContent = text;

  term.scrollTop = term.scrollHeight;

function addBlank(){ addLine(" ", "sys"); }

  const div = document.createElement("div");
  div.className = cls;

// A clear banner each time a lock comes online

const hintIntro = { roleplay:false, math:false };
function primesUpTo(n){ const out=[]; for(let i=2;i<=n;i++) if(isPrime(i)) out.push(i); return out; }
// The opening hint for the current lock (or for roleplay mode)
function lockHint(){
  if(MODE !== "math"){
    if(hintIntro.roleplay){ hideHint(); return; }
    hintIntro.roleplay = true;
    setHint("Roleplay: type anything and press Enter. Press <b>MODE</b> when you're ready to crack the lock.");
    return;
  }
  if(hintIntro.math){ hideHint(); return; }   // only the first lock gets the how-to
  hintIntro.math = true;
  const root = Math.floor(Math.sqrt(Run.n));
  const cands = primesUpTo(root);
  setHint(`Find two primes that multiply to make <b>${Run.n}</b>. Type both numbers with a space between them. ` +
    (cands.length ? `One of them is ${cands.length === 1 ? "" : "at most "}√${Run.n} ≈ ${root}, so try <b>${cands.join(", ")}</b> first.` : ""));
}

function normalise(s){ return (s||"").trim(); }

function isPrime(n){
  if(n<2) return false;
  if(n%2===0) return n===2;
  const r = Math.floor(Math.sqrt(n));
  for(let i=3;i<=r;i+=2) if(n%i===0) return false;
  return true;
}

function generatePairForLock(lockIndex){
  const bands = DIFF_BANDS[DIFF];
  const band = bands[Math.min(lockIndex-1, bands.length-1)];
  let tries=0;
  while(tries++<200){
    const p = pick(band.p);
    const q = pick(band.q);
    const a = Math.min(p,q), b = Math.max(p,q);
    const key = `${a}x${b}`;
    if(Run.usedPairs.has(key)) continue;
    Run.usedPairs.add(key);
    return {p:a, q:b, n:a*b};
  }
  // fallback: allow repeats if somehow exhausted
  const p = pick(band.p), q = pick(band.q);
  return {p:Math.min(p,q), q:Math.max(p,q), n:p*q};
}

function newRunSameDifficulty(){
  Run.tries = 0;
  Run.index = 1;
  Run.usedPairs.clear();
  const lock = generatePairForLock(1);
  Run.p=lock.p; Run.q=lock.q; Run.n=lock.n;
  Run.solved=false;
  Bank.selectAccountForRun(DIFF);
  updateRunUI();
}

function newTargetNextLock(){
  Run.tries = 0;
  const lock = generatePairForLock(Run.index);
  Run.p=lock.p; Run.q=lock.q; Run.n=lock.n;
  Run.solved=false;
  updateRunUI();
}

function newTargetManual(){
  // regenerate current lock (do not advance), but avoid same pair if possible
  const lock = generatePairForLock(Run.index);
  Run.p=lock.p; Run.q=lock.q; Run.n=lock.n;
  Run.solved=false;
  updateRunUI();
  addLine(`LOCK RESET // N=${Run.n}`, "sys");
}

// --- Typewriter helpers
async function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function typeOut(lines, cls="sys", cps=28){
  for(const line of lines){
    const div = document.createElement("div");
    div.className = `lineRow ${cls}`;
    div.textContent = "";
    term.appendChild(div);
    for(let i=0;i<line.length;i++){

      term.scrollTop = term.scrollHeight;
      if(soundOn) Sound.tap();
      await sleep(1000/Math.max(10,cps));
    }
    term.scrollTop = term.scrollHeight;
    await sleep(30);
  }
}

function updateBufferUI(){
  const stageEl = Buffer.dock.querySelector("#bufStage");
  const pctEl = Buffer.dock.querySelector("#bufPct");
  stageEl.textContent = `${Buffer.stage}/${Buffer.stages}`;
  const pct = Math.round((Buffer.stage/Buffer.stages)*100);
  pctEl.textContent = `${pct}%`;

  const totalSegs = Buffer.segs.length;
  const filled = Math.min(totalSegs, Math.floor((Buffer.typed/Buffer.required)*totalSegs));
  Buffer.segs.forEach((s, i)=> s.classList.toggle("on", i < filled));
  Buffer.press.classList.toggle("show", Buffer.ready);
}

function resetBufferStage(){
  Buffer.typed=0;
  Buffer.ready=false;
  updateBufferUI();
  focusInput(); // Ensure input has focus for spacebar/Enter
}

function markBufferReady(){
  Buffer.ready=true;
  Sound.ready();
  updateBufferUI();
}

function commitBufferStage(){
  Sound.commit();
  if(Buffer.dock) Buffer.dock.classList.add("entered");
  Buffer.resolve?.();
  Buffer.resolve=null;
}

async function runBufferSequence(){
  Buffer.stage=1;
  Buffer.stages = PRIME_NET_EFFECTS.bufferStages;
  Buffer.required = PRIME_NET_EFFECTS.keysPerStage;
  buildBufferDock();
  resetBufferStage();

  for(let i=1;i<=Buffer.stages;i++){
    Buffer.stage=i;
    resetBufferStage();
    // Wait for commit
    await new Promise((resolve)=>{ Buffer.resolve=resolve; });
    // small in-terminal burst
    addLine("[TRACE] sync_ledger() :: checksum_ok()", "hot");
    addLine("[VAULT] open_channel() :: mask_account()", "sys");
    addBlank();
    await terminalBurst(PRIME_NET_EFFECTS.interStageScrollSeconds);
  }

  Buffer.dock.remove();
  Buffer.dock=null;
}

function pick(arr){

function formatPair(p, q){
  const a = Math.min(p, q);
  const b = Math.max(p, q);
  return { a, b, n: a * b };

function generateSemiprimeFromBank(bank){
  let p = pick(bank);
  let q = pick(bank);
  let guard = 0;
  while(p === q && guard++ < 20) q = pick(bank);
  return formatPair(p, q);
}

  if(diff === "L1") return PRIME_BANK_3;
  if(diff === "L2") return (Math.random() < 0.25) ? PRIME_BANK_4 : PRIME_BANK_3;
  return (Math.random() < 0.75) ? PRIME_BANK_4 : PRIME_BANK_3;
}

// --- Success pipeline per lock
async function onLockSolved(){
  if(Run.index < Run.locksPerRun){
    // Withdraw funds from target account
    const withdrawn = Bank.withdrawForLock(DIFF, Run.index);
    Sound.ok();
    setTimeout(() => { if(window.PNSound) PNSound.play("cash"); }, 700);

    Run.index += 1;
    newTargetNextLock();
    lockBanner(Run.index === Run.locksPerRun ? "Final lock: crack it to breach the vault" : "");

  }

  // Final lock: full finale
  Sound.ok();
  await breachPrelude(PRIME_NET_EFFECTS.preludeSeconds);
  await runBufferSequence();
  await codeFlood("ENCRYPTION HANDSHAKE", PRIME_NET_EFFECTS.finalFloodSeconds);
  addLine("VAULT BREACH COMPLETE // SESSION SAVED", "ok");

  // Bank the run earnings

  if(PN) PN.log("complete", { level: DIFF, banked });
  if(window.PNSound) PNSound.play("cash");
  await showBankingOverlay(banked);

  // start fresh run same difficulty
  newRunSameDifficulty();
  addBlank();
  lockBanner("New run. Bigger withdrawals await.");
}

// --- Prime checking
function parsePair(text){
  // Accept:
  // - UNLOCK p q
  // - p q (if quickPairOn)
  const parts = text.split(/\s+/).filter(Boolean);
  if(parts.length===0) return null;

  if(parts.length===2 && /^\d+$/.test(parts[0]) && /^\d+$/.test(parts[1])){
    return {p:parseInt(parts[0],10), q:parseInt(parts[1],10)};
  }
  return null;
}

// PRIME? n: tests a number and, if it isn't prime, shows why
function printPrimeTest(raw){
  const n = parseInt(raw, 10);
  if(!Number.isFinite(n) || n < 0){ addLine("Usage: PRIME? 91", "warn"); return; }
  if(n > 1000000){ addLine("That number is too big for this scanner. Try one under 1,000,000.", "warn"); return; }
  if(isPrime(n)){ addLine(`PRIME_TEST // ${n} => PRIME ✓`, "ok"); return; }
  addLine(`PRIME_TEST // ${n} => NOT PRIME ✗`, "bad");
  if(n < 2){ addLine("Primes start at 2.", "sys"); return; }
  for(let i=2;i*i<=n;i++){ if(n%i===0){ addLine(`Evidence: ${i} × ${n/i} = ${n}`, "sys"); return; } }
}

// HINT (RANGE also works): divisibility clues, what to check first, and the prime pools for this lock
function printRangeHint(){
  const n = Run.n;
  const digitSum = String(n).split("").reduce((a,d)=>a+Number(d),0);
  const clues = [
    n % 2 === 0 ? `${n} is even, so <b>2</b> is one of the primes.` : `${n} is odd, so 2 is <b>not</b> one of the primes.`,
    `The digits add to ${digitSum}. ${digitSum % 3 === 0 ? "That divides by 3, so <b>3</b> goes into " + n + "." : "That doesn't divide by 3, so 3 won't work."}`,
  ];
  if(n % 5 === 0) clues.push(`${n} ends in 0 or 5, so <b>5</b> goes into it.`);
  const band = DIFF_BANDS[DIFF][Math.min(Run.index-1, DIFF_BANDS[DIFF].length-1)];
  const chips = list => list.slice().sort((a,b)=>a-b).map(x => `<span class="chip">${x}</span>`).join("");
  const root = Math.floor(Math.sqrt(n));
  const first = primesUpTo(root);
  addBlock(`<div class="ib-head">HINT PACKET // N = ${n}</div>
    <div class="ib-row"><span class="ib-k">CLUES</span><ul>${clues.map(c => `<li>${c}</li>`).join("")}</ul></div>
    <div class="ib-row"><span class="ib-k">CHECK FIRST</span><span>The smaller prime is at most √${n} ≈ ${root}.<br>${first.length ? chips(first) : "Try the pools below."}</span></div>
    <div class="ib-row"><span class="ib-k">PRIME POOLS</span><span>Smaller prime: ${chips(band.p)}<br>Larger prime: ${chips(band.q)}</span></div>
    <div class="ib-tip">Divide ${n} by each prime in turn. When one goes in exactly, the answer is that prime and what's left.</div>`, "infoBlock");
}


async function handleMath(text){
  const t = normalise(text);
  if(!t) return;

  const u = t.toUpperCase();
  if(u==="HELP" || u==="?"){ printHelp(); return; }
  if(u==="NEWTARGET" && TEACHER){ newTargetManual(); lockHint(); return; }
  if(u==="HINT" || u==="RANGE"){
    printRangeHint();
    return;
  }
  const primeCmd = u.match(/^(PRIME\??|ISPRIME)\s+(\S+)$/);
  if(primeCmd){ printPrimeTest(primeCmd[2]); return; }
  if(u.startsWith("LEVEL") && !TEACHER){
    addLine(`Clearance is locked at ${DIFF} for this mission. It was set on the title screen.`, "warn");
    return;
  }
  if(u.startsWith("LEVEL")){
    const n = parseInt(u.replace(/LEVEL/,"").trim(),10);
    const next = n===2?"L2": n===3?"L3":"L1";
    setDiff(next);
    newRunSameDifficulty();
    addLine(`DIFFICULTY SET: ${next} // NEW RUN // N=${Run.n}`, "sys");
    return;
  }
  if(u==="MODE ROLEPLAY"){ setMode("roleplay"); addLine("ROLEPLAY MODE ENABLED", "sys"); return; }
  if(u==="MODE MATH"){ setMode("math"); addLine("MATH MODE ENABLED", "sys"); return; }

  const pair = parsePair(t);
  if(!pair){
    addLine("Unknown command. Type HELP.", "warn");
    return;
  }

  const p = pair.p, q = pair.q;
  const prod = p*q;

  if(prod !== Run.n){
    const dir = prod < Run.n ? "TOO LOW" : "TOO HIGH";
    addLine(`TRY // ${p}×${q} = ${prod}  (${dir})  target=${Run.n}`, "warn");
    // Tiny pattern nudge (last digit) without giving the answer away
    addLine(`Pattern check: ${p} ends ${String(p).slice(-1)}, ${q} ends ${String(q).slice(-1)} ⇒ product ends ${String(prod).slice(-1)}`, "sys");
    Run.tries = (Run.tries || 0) + 1;
    if(window.PNSound) PNSound.play("wrong");
    setHint(Run.tries >= 3
      ? `Stuck? Type <b>HINT</b> for clues, or test a number with <b>PRIME? 91</b>.`
      : `${p} × ${q} = ${prod}, which is too ${prod < Run.n ? "low: try a bigger" : "high: try a smaller"} prime. Target: <b>${Run.n}</b>.`);
    return;
  }
  if(!isPrime(p) || !isPrime(q)){
    addLine(`UNLOCK_PARTIAL // ${p}×${q} matches N, but one factor is not prime.`, "bad");
    if(!isPrime(p)) addLine(`${p} is not prime.`, "bad");
    if(!isPrime(q)) addLine(`${q} is not prime.`, "bad");
    Run.tries = (Run.tries || 0) + 1;
    if(window.PNSound) PNSound.play("denied");
    const bad = !isPrime(p) ? p : q;
    let split = ""; for(let i=2;i*i<=bad;i++){ if(bad%i===0){ split = ` It's ${i} × ${bad/i}.`; break; } }
    setHint(`Right product, but <b>${bad}</b> isn't prime.${split} Break it down and try again.`);
    return;
  }

  addLine(`UNLOCK_OK // primes verified: ${p}, ${q}`, "ok");
  setHint(`Lock cracked: <b>${p} × ${q} = ${Run.n}</b>.`);
  Run.solved = true;
  await onLockSolved();
}

    ["Brute forcing token…", "Result: request accepted. Queueing next step…"],
    ["Syncing ledger…", "Latency: " + (40+randInt(220)) + "ms"],
  ];

  await typeOut(pack, "sys", 55);
}

<script>
/* ===== Fullscreen helper (immersive mode) =====
   - Click FULLSCREEN or press F
   - ESC exits (browser standard)
   - We update button label + body class
*/
(function(){
  const oldBtn = document.getElementById("btnFullscreen");
  const newBtn = document.getElementById("hudBtnFullscreen");

  function isFS(){
    return !!document.fullscreenElement;
  }
  async function toggleFS(){
    try{
      if(!isFS()){
        await document.documentElement.requestFullscreen({ navigationUI: "hide" });
      }else{
        await document.exitFullscreen();
      }
    }catch(e){
      // If fullscreen is blocked, do nothing quietly (classroom machines vary)
      console.warn("Fullscreen unavailable:", e);
    }
  }
  function syncUI(){
    const on = isFS();
    document.body.classList.toggle("isFullscreen", on);
    const label = on ? "EXIT FULLSCREEN" : "FULLSCREEN";
    if(oldBtn) oldBtn.textContent = label;
    if(newBtn) newBtn.textContent = label;
  }

  if(oldBtn) oldBtn.addEventListener("click", toggleFS);
  if(newBtn) newBtn.addEventListener("click", toggleFS);

  document.addEventListener("fullscreenchange", syncUI);

  document.addEventListener("keydown", (e) => {
    // Don't steal keys while typing
    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : "";
    const typing = (tag === "input" || tag === "textarea" || e.target?.isContentEditable);
    if(typing) return;

    if(e.key === "f" || e.key === "F"){
      e.preventDefault();
      toggleFS();
    }
  });

  // initial
  syncUI();
})();
</script>
