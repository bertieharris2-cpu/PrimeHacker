<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Corrupted Blueprint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 12 prototype, second pass (Bertie's notes): the blueprint is corrupted as the floors assemble. A spatial
     puzzle: fit a mix of room arrays onto a bigger squared floor, around the lift, stairs and fire exit. About the
     same challenge at every level. When it all fits, the rooms rise in 3D and the floor rejoins the building.
     Round 13: what to do sits in the hologram brief (H), not on the page. */
  .fbox{ padding:14px; display:flex; flex-direction:column; gap:8px; align-items:center; }
  .fbox .lab{ align-self:stretch; display:flex; justify-content:space-between; font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); }
  .fg{ position:relative; background:
      repeating-linear-gradient(0deg, rgba(74,163,255,.22) 0 1px, transparent 1px var(--c)),
      repeating-linear-gradient(90deg, rgba(74,163,255,.22) 0 1px, transparent 1px var(--c)), #04121a;
    border:2px solid rgba(74,163,255,.7); box-shadow:0 0 30px rgba(74,163,255,.12) inset; touch-action:none; }
  .fg.glitch{ animation:cg .5s steps(3) 2; }
  @keyframes cg{ 50%{ filter:hue-rotate(80deg) contrast(1.4); transform:translateX(2px); } }
  .blk{ position:absolute; display:flex; align-items:center; justify-content:center; font-family:var(--font-ui); font-size:10px; letter-spacing:.12em; pointer-events:none; }
  .blk.lift, .blk.stairs{ background:repeating-linear-gradient(45deg, rgba(255,255,255,.05) 0 5px, rgba(0,0,0,.2) 5px 10px), #243238; border:1px solid #5b6f75; color:#9fb7bb; }
  .blk.exit{ background:rgba(47,191,138,.35); border:1px solid #2fbf8a; color:#9fffd4; font-size:8px; }
  .pc{ position:absolute; display:grid; gap:1px; padding:1px; cursor:grab; touch-action:none; user-select:none; z-index:2; }
  .pc i{ background:hsla(var(--h), 60%, 42%, .85); border:1px solid hsla(var(--h), 80%, 70%, .9); }
  .pc .tag{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-family:var(--font-ui); font-weight:700; font-size:11px; color:#fff; background:rgba(0,0,0,.55); padding:1px 4px; white-space:nowrap; pointer-events:none; }
  .pc.drag{ cursor:grabbing; z-index:50; filter:drop-shadow(0 8px 14px rgba(0,0,0,.6)); }
  .pc.bad i{ background:rgba(255,79,109,.55); border-color:#ff6b8a; }
  .tray{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .tray .lab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); display:flex; justify-content:space-between; }
  .slots{ position:relative; }
  .stage3d{ position:relative; height:440px; padding:0; overflow:hidden; background:radial-gradient(ellipse at 50% 45%, rgba(20,60,70,.4), rgba(2,8,10,.95)); }
  .stage3d .rep{ position:absolute; left:0; right:0; bottom:18px; text-align:center; font-family:var(--font-ui); font-weight:700; letter-spacing:.3em; font-size:26px; color:#3dffa8; text-shadow:0 0 18px rgba(61,255,168,.7); opacity:0; transition:opacity .6s; }
  .stage3d .rep.on{ opacity:1; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span>Rooms placed: <b id="placed">0</b> of <b id="total">0</b></span><span id="area"></span></div>
  <section class="pn-panel fbox" id="fbox"><div class="lab"><span>FLOOR PLAN · CORRUPTED</span><span id="gridLab"></span></div><div class="fg" id="fg"></div></section>
  <section class="pn-panel tray" id="tray"><span class="lab"><span>ROOMS RECOVERED FROM THE FILE</span><span>DRAG · TAP TO TURN</span></span><div class="slots" id="slots"></div></section>
  <section class="pn-panel stage3d" id="stage" hidden><div class="rep" id="rep">BLUEPRINT REPAIRED</div></section>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script src="../shared/floor3d.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.init({ id: "corrupt", stage: "BLUEPRINT", title: "CORRUPTED BLUEPRINT",
    goal: "The plan for this floor came through scrambled. Rooms can't <b>overlap</b>. Keep the lift, stairs and fire exit clear.",
    example: "Each room is an array of squares. A 3 × 4 room can turn round to 4 × 3: same 12 squares, different shape.",
    story: `Interference on the file. The plan for one of ${T.targets()} floors is scrambled. The rooms came through, but not where they go. Fit them back together.` });

  // Feedback: a spatial puzzle, bigger floor, a mix of arrays, about the same at every level (L2/L3 one more row)
  const W = 12, H = L === "L1" ? 8 : 9, TARGET = L === "L1" ? [7, 9] : [8, 11];
  // Build a solution first (so it's always solvable), then scramble the rooms into the tray
  function makePuzzle(){
    let best = null;
    for(let attempt = 0; attempt < 400; attempt++){
      const occ = Array.from({ length: H }, () => Array(W).fill(0));
      const blocks = [];
      const put = b => { for(let y = b.y; y < b.y + b.h; y++) for(let x = b.x; x < b.x + b.w; x++) occ[y][x] = 1; };
      const free = b => { if(b.x < 0 || b.y < 0 || b.x + b.w > W || b.y + b.h > H) return false; for(let y = b.y; y < b.y + b.h; y++) for(let x = b.x; x < b.x + b.w; x++) if(occ[y][x]) return false; return true; };
      // lift (2 × 2) inside, stairs (2 × 3) on an edge, fire exit (1 square) on the outer wall
      const lift = { x: 2 + Math.floor(Math.random() * (W - 5)), y: 2 + Math.floor(Math.random() * (H - 5)), w: 2, h: 2, kind: "lift", name: "LIFT" };
      const onLeft = Math.random() < .5, stairs = { x: onLeft ? 0 : W - 2, y: Math.floor(Math.random() * (H - 3)), w: 2, h: 3, kind: "stairs", name: "STAIRS" };
      const ex = Math.random() < .5 ? { x: 3 + Math.floor(Math.random() * (W - 6)), y: Math.random() < .5 ? 0 : H - 1 } : { x: onLeft ? W - 1 : 0, y: 2 + Math.floor(Math.random() * (H - 4)) };
      const exit = { ...ex, w: 1, h: 1, kind: "exit", name: "EXIT" };
      for(const b of [lift, stairs, exit]){ if(!free(b)) break; put(b); blocks.push(b); }
      if(blocks.length < 3) continue;
      // Rooms: arrays from 2 × 2 up to 4 × 5, plus at most one thin 1 × 3 / 1 × 4 room
      const SIZES = [[2, 2], [2, 3], [2, 4], [2, 5], [3, 3], [3, 4], [3, 5], [4, 4], [2, 6], [1, 3], [1, 4], [4, 5]];
      const rooms = [];
      const cells = []; for(let y = 0; y < H; y++) for(let x = 0; x < W; x++) cells.push([x, y]);
      T.shuffle(cells).forEach(([x, y]) => {
        if(occ[y][x]) return;
        for(const [a, b] of T.shuffle(SIZES)){
          const r = Math.random() < .5 ? { x, y, w: a, h: b } : { x, y, w: b, h: a };
          if(a === 1 && rooms.some(q => Math.min(q.w, q.h) === 1)) continue;
          if(free(r)){ put(r); rooms.push(r); break; }
        }
      });
      const freeCells = W * H - blocks.reduce((s, b) => s + b.w * b.h, 0), used = rooms.reduce((s, r) => s + r.w * r.h, 0), fill = used / freeCells;
      if(rooms.length < TARGET[0] || rooms.length > TARGET[1]) continue;
      if(!best || fill > best.fill) best = { rooms, blocks, fill };
      if(fill >= 0.86) break;
    }
    return best;
  }
  const P = makePuzzle();
  $("total").textContent = P.rooms.length;
  $("gridLab").textContent = `${W} × ${H} SQUARES`;
  const roomArea = P.rooms.reduce((s, r) => s + r.w * r.h, 0);
  $("area").innerHTML = `Rooms: <b>${roomArea}</b> squares · floor space: <b>${W * H - P.blocks.reduce((s, b) => s + b.w * b.h, 0)}</b>`;

  const C = 38, fg = $("fg");
  fg.style.setProperty("--c", C + "px"); fg.style.width = W * C + "px"; fg.style.height = H * C + "px";
  P.blocks.forEach(b => { const d = document.createElement("div"); d.className = "blk " + b.kind; Object.assign(d.style, { left: b.x * C + "px", top: b.y * C + "px", width: b.w * C + "px", height: b.h * C + "px" }); d.textContent = b.name; fg.appendChild(d); });
  const pieces = [];
  const occAt = (x, y, skip) => P.blocks.some(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h) || pieces.some(p => p !== skip && p.onBoard && x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h);
  const valid = (p, x, y) => { if(x < 0 || y < 0 || x + p.w > W || y + p.h > H) return false; for(let j = y; j < y + p.h; j++) for(let i = x; i < x + p.w; i++) if(occAt(i, j, p)) return false; return true; };

  // Tray: the rooms, scrambled and some turned round, laid out in rows below the floor
  const slots = $("slots");
  T.shuffle(P.rooms).forEach((r, idx) => {
    const turned = Math.random() < .5 && r.w !== r.h;
    const el = document.createElement("div"); el.className = "pc";
    const p = { el, sol: r, w: turned ? r.h : r.w, h: turned ? r.w : r.h, hue: (170 + idx * 47) % 360, onBoard: false, x: 0, y: 0, k: idx };
    el.style.setProperty("--h", p.hue);
    pieces.push(p); paint(p); wire(p);
  });
  function layoutTray(){
    const width = Math.max(300, slots.clientWidth || 1000); let x = 0, y = 0, rowH = 0;
    pieces.filter(p => !p.onBoard).forEach(p => { const w = p.w * C, h = p.h * C; if(x + w > width){ x = 0; y += rowH + 14; rowH = 0; } p.home = { left: x, top: y }; x += w + 14; rowH = Math.max(rowH, h); });
    slots.style.height = (y + rowH + 6) + "px";
    pieces.filter(p => !p.onBoard).forEach(toTray);
  }
  function paint(p){ p.el.style.gridTemplateColumns = `repeat(${p.w}, ${C - 1}px)`; p.el.innerHTML = "<i></i>".repeat(p.w * p.h) + `<span class="tag">${p.h} × ${p.w}</span>`; p.el.querySelectorAll("i").forEach(i => i.style.height = (C - 1) + "px"); }
  function toTray(p){ p.onBoard = false; slots.appendChild(p.el); p.el.style.left = p.home.left + "px"; p.el.style.top = p.home.top + "px"; }
  function toBoard(p, x, y){ p.onBoard = true; p.x = x; p.y = y; fg.appendChild(p.el); p.el.style.left = x * C + "px"; p.el.style.top = y * C + "px"; }
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  let over = false, turns = 0, misfits = 0;
  function turn(p){
    [p.w, p.h] = [p.h, p.w]; paint(p); turns++;
    if(p.onBoard && !valid(p, p.x, p.y)){ [p.w, p.h] = [p.h, p.w]; paint(p); say("No room to turn it there. Move it first.", "warn"); T.SND("untag"); return; }
    T.SND("tag"); if(!p.onBoard) layoutTray();
  }
  function wire(p){
    let start = null;
    p.el.addEventListener("pointerdown", e => {
      if(over) return; e.preventDefault();
      const r = p.el.getBoundingClientRect();
      start = { x: e.clientX, y: e.clientY, ox: e.clientX - r.left, oy: e.clientY - r.top, moved: false };
      window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
    });
    const move = e => {
      if(!start) return;
      if(!start.moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 6) return;
      if(!start.moved){ start.moved = true; p.el.classList.add("drag"); const r = p.el.getBoundingClientRect(); document.body.appendChild(p.el); p.el.style.position = "fixed"; p.el.style.left = r.left + "px"; p.el.style.top = r.top + "px"; T.SND("tag"); }
      p.el.style.left = (e.clientX - start.ox) + "px"; p.el.style.top = (e.clientY - start.oy) + "px";
      const g = fg.getBoundingClientRect(), gx = Math.round((e.clientX - start.ox - g.left) / C), gy = Math.round((e.clientY - start.oy - g.top) / C);
      p.el.classList.toggle("bad", inside(e) && !valid(p, gx, gy));
    };
    const up = e => {
      window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
      if(!start) return;
      const s = start; start = null;
      if(!s.moved){ turn(p); return; }
      p.el.classList.remove("drag", "bad"); p.el.style.position = "";
      const g = fg.getBoundingClientRect(), gx = Math.round((e.clientX - s.ox - g.left) / C), gy = Math.round((e.clientY - s.oy - g.top) / C);
      if(inside(e) && valid(p, gx, gy)){ toBoard(p, gx, gy); T.SND("clamp"); say(`${p.h} × ${p.w} room placed.`, "ok"); }
      else if(inside(e)){ p.onBoard = false; misfits++; T.SND("untag"); say("That overlaps another room, the lift, the stairs or the exit. Try another spot, or turn it.", "warn"); fg.classList.remove("glitch"); void fg.offsetWidth; fg.classList.add("glitch"); }
      else { p.onBoard = false; }
      layoutTray(); update();
    };
  }
  const inside = e => { const g = fg.getBoundingClientRect(); return e.clientX >= g.left && e.clientX <= g.right && e.clientY >= g.top && e.clientY <= g.bottom; };
  function update(){ const n = pieces.filter(p => p.onBoard).length; $("placed").textContent = n; if(n === pieces.length && !over) done(); }

  // Solved: the floor rises in 3D (rooms coming up one by one with beeps, lasers sweeping), then rejoins the building
  async function done(){
    over = true; T.SND("verified"); T.hideBrief();   // the rise is the payoff, so nothing sits over it
    say("Every room fits. Rebuilding the floor…", "ok");
    await new Promise(r => setTimeout(r, 500));
    $("fbox").hidden = true; $("tray").hidden = true; $("stage").hidden = false;
    const G = Math.max(W, H), offY = Math.floor((G - H) / 2);
    const exitB = P.blocks.find(b => b.kind === "exit");
    const layout = { grid: G, rooms: pieces.map(p => ({ x: p.x, y: p.y + offY, w: p.w, h: p.h })), exit: exitB ? { x: exitB.x, y: exitB.y + offY } : null };
    const F = PNFloor3D.create($("stage"), { layout, blocks: P.blocks.filter(b => b.kind !== "exit").map(b => ({ ...b, y: b.y + offY })), flat: true });
    F.camera.position.set(0, 175, 70); F.look.set(0, 0, 0);
    F.lightsOn(10);
    F.sweep(1300); T.SND("scan", 1.3);
    await new Promise(r => setTimeout(r, 900 / (window.PNTest ? PNTest.speed() : 1)));
    await F.rise(450, 170, () => T.SND("beep"));
    F.sweep(1100, 0xff3355); T.SND("laser");
    await F.flyTo({ pos: new F.THREE.Vector3(110, 120, 160), look: new F.THREE.Vector3(0, 6, 0) }, 1600);
    F.setSpin(0.004);
    $("rep").classList.add("on"); T.SND("success");
    T.say("Floor rebuilt. Sending it back into the blueprint.");
    setTimeout(() => T.finish({ ok: true, title: "BLUEPRINT REPAIRED", lines: [], effect: "repaired", auto: 2200 }), 1400 / (window.PNTest ? PNTest.speed() : 1));
  }
  layoutTray();
  // Quiet: the brief zooms in by itself a moment after load, with this on top and the goal underneath
  T.step(`Drag all <b>${pieces.length} rooms</b> onto the floor. <b>Tap</b> a room to turn it round.`, { quiet: true });
  if(window.PNTest) PNTest.skip("Fit every room", () => {
    pieces.forEach(p => { if(p.onBoard) return; const s = p.sol; if(p.w !== s.w){ [p.w, p.h] = [p.h, p.w]; paint(p); } toBoard(p, s.x, s.y); });
    layoutTray(); update();
  });
})();
</script>
</body>
</html>
