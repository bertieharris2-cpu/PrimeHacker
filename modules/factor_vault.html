<!doctype html>
<html lang="en" class="phase-build" data-glitch-in="off">
<head>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Factor Pair Array Vault</title>
  <style>
    :root{
      --bg-secondary: var(--bg-primary);
      --blue-strong: var(--accent);
      --blue-mid: var(--accent);
      --blue-soft: rgba(var(--accent-rgb),.35);
      --cyan-accent: var(--accent);
      --panel-bg: rgba(6,16,20,.75);
      --panel-border: rgba(var(--accent-rgb),.35);
      --text-primary: #e6f4ff;
      --text-muted: rgba(200,230,255,.6);
      --font-mono: "Courier Prime", ui-monospace, Menlo, Monaco, Consolas, monospace;
      --grid-unit: 16px;
      --grid-line: rgba(var(--accent-rgb),0.08);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: var(--font-mono);
      background:
        radial-gradient(900px 600px at 60% 20%, rgba(var(--accent-rgb),.08), transparent 60%),
        radial-gradient(1000px 800px at 30% 80%, rgba(var(--accent-rgb),.05), transparent 70%),
        var(--bg-primary);
      color: var(--text-primary);
      min-height:100vh;
      display:flex;
      font-size: 16px;
    }
    .audio-controls{
      display:flex;
      align-items:center;
      gap:6px;
      padding:0 8px;
      border: 1px solid var(--panel-border);
      background: rgba(var(--accent-rgb),.05);
      border-radius: 0;
    }
    .sound-btn{
      background: none;
      border: none;
      color: var(--cyan-accent);
      cursor: pointer;
      font-size: 14px;
      padding: 4px 2px;
      transition: all 120ms ease;
      user-select: none;
    }
    .sound-btn:hover{
      transform: scale(1.1);
      filter: drop-shadow(0 0 4px rgba(var(--accent-rgb),.3));
    }
    .sound-btn.muted{
      opacity: 0.5;
      color: rgba(200,230,255,.4);
    }
    .volume-slider{
      width: 80px;
      height: 4px;
      cursor: pointer;
      accent-color: var(--cyan-accent);
      background: rgba(var(--accent-rgb),.2);
      border-radius: 0;
    }
    .volume-slider::-webkit-slider-thumb{
      appearance: none;
      width: 10px;
      height: 10px;
      background: var(--cyan-accent);
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 4px rgba(var(--accent-rgb),.3);
    }
    .volume-slider::-moz-range-thumb{
      width: 10px;
      height: 10px;
      background: var(--cyan-accent);
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 4px rgba(var(--accent-rgb),.3);
    }
    .vault-grid{
      position: relative;
      width: 100%;
      flex: 1;
      min-height: 720px;
      z-index: 1;
      padding: 0;
      border-radius: 0;
      overflow: visible;
      background: transparent;
    }
    .array-tile{
      position: absolute;
      padding: 0;
      z-index: 2;
      opacity: 0;
      animation: fadeInScale 220ms ease-out forwards;
    }
    
    /* Faint scan glow behind array (kept inside tile so it doesn't look misaligned) */
    .array-tile::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(circle at 40% 35%, rgba(var(--accent-rgb),.10), transparent 62%);
      pointer-events:none;
      opacity:.45;
      filter: blur(1.5px);
      z-index: 0;
    }
    
    /* Confirmation pulse on new array */
    @keyframes confirmPulse{
      0%{ box-shadow: 0 0 0 0 rgba(var(--accent-rgb),.4); }
      100%{ box-shadow: 0 0 0 18px rgba(var(--accent-rgb),0); }
    }
    
    .array-tile.confirmed{
      animation: confirmPulse .6s ease-out;
    }
    
    /* Blueprint-style labelling grid */
    .array-labelled{
      display:grid;
      grid-template-columns: 30px auto;   /* labels hug the array at any square size */
      grid-template-rows: 24px auto;
      align-items:start;
      justify-items:start;
      gap: 0;
      position: relative;
      z-index: 1;
    }
    
    .array-top{
      grid-column:2;
      grid-row:1;
      font-size: clamp(11px, 1.1vw, 16px);
      color: rgba(200,230,255,.85);
      letter-spacing:.08em;
      justify-self: center;
      text-align: center;
    }
    
    .array-left{
      grid-column:1;
      grid-row:2;
      font-size: clamp(11px, 1.1vw, 16px);
      color: rgba(200,230,255,.85);
      letter-spacing:.08em;
      align-self:center;
    }
    
    .array-grid-wrap{
      grid-column:2;
      grid-row:2;
      justify-self: center;
    }
    
    .tile-array{
      display:grid;
      gap: 0;
      background: none; /* avoid double-grid moiré against vault grid */
      padding: 0;
      border: none;
    }
    .array-cell{
      width: var(--grid-unit);
      height: var(--grid-unit);
      background: rgba(var(--accent-hack-rgb),.26);   /* green arrays on the blue interface, like the Vault Grid */
      box-shadow: 0 0 0 1px rgba(var(--accent-hack-rgb),.22) inset;
      border: none;
      box-sizing: border-box;
      margin: 0;
      outline: none;
    }
    @keyframes dashMove{
      0%{ stroke-dashoffset: 0; }
      100%{ stroke-dashoffset: -154; }
    }
    
    @keyframes fadeInScale{
      0%{ 
        opacity: 0;
        transform: scale(0.95);
      }
      100%{ 
        opacity: 1;
        transform: scale(1);
      }
    }
    
    @keyframes blueprintPulse{
      0%, 100%{
        text-shadow: 0 0 8px rgba(var(--accent-rgb),.4), 0 0 20px rgba(var(--accent-rgb),.2);
        transform: scale(1);
      }
      50%{
        text-shadow: 0 0 16px rgba(var(--accent-rgb),.7), 0 0 40px rgba(var(--accent-rgb),.4);
        transform: scale(1.02);
      }
    }

    @keyframes typeWriter{
      from{
        width: 0;
      }
      to{
        width: 100%;
      }
    }

    .blueprint-complete-text{
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--blue-strong);
      margin-bottom: 16px;
      animation: blueprintPulse 2s ease-in-out infinite;
      text-align: center;
    }

    .blueprint-complete-subtext{
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 8px;
    }

    @keyframes preludeGlow{
      0%{
        opacity: 0;
        stroke-dashoffset: 1000;
      }
      20%{
        opacity: 1;
      }
      80%{
        opacity: 1;
      }
      100%{
        opacity: 0;
        stroke-dashoffset: 0;
      }
    }
    
    .scanlines{
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    /* Fullscreen state */
    body.isFullscreen{
      overflow: hidden;
    }

    /* Settings dropdown cog button */
    .settings-cog-btn{
      background: none;
      border: 1px solid var(--panel-border);
      color: var(--blue-strong);
      padding: 6px 10px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 0;
      transition: all 120ms ease;
      position: relative;
      z-index: 1501;
    }

    .settings-cog-btn:hover{
      background: rgba(var(--accent-rgb),.1);
      border-color: var(--cyan-accent);
    }

    /* Settings dropdown panel */
    .settings-dropdown{
      position: fixed;
      top: 60px;
      right: 18px;
      z-index: 2000;
      display: none;
      flex-direction: column;
      gap: 8px;
      padding: 12px 14px;
      background: rgba(6,16,20, 0.95);
      border: 1px solid rgba(var(--accent-rgb),.4);
      box-shadow: 0 8px 32px rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      min-width: 140px;
      pointer-events: auto !important;
    }

    .settings-dropdown.open{
      display: flex;
    }

    .settings-dropdown button{
      background: rgba(6,16,20, 0.80);
      border: 0.75px solid var(--panel-border);
      color: var(--text-primary);
      padding: 9px 11px;
      font-size: 11px;
      font-family: inherit;
      cursor: pointer;
      transition: all 120ms ease;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      pointer-events: auto;
      position: relative;
      z-index: 1500;
    }

    .settings-dropdown button:hover{
      background: rgba(var(--accent-rgb),.15);
      border-color: var(--cyan-accent);
      color: var(--cyan-accent);
    }

    /* Difficulty levels segment */
    .settings-levels{
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 0;
      border-top: 0.5px solid rgba(var(--accent-rgb),.2);
      border-bottom: 0.5px solid rgba(var(--accent-rgb),.2);
      margin: 6px 0;
      pointer-events: auto;
    }

    .settings-levels label{
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 0 0 4px 0;
    }

    .level-buttons{
      display: flex;
      gap: 4px;
      pointer-events: auto;
    }

    .btn.segBtn.level{
      flex: 1;
      padding: 6px 4px;
      background: rgba(6,16,20, 0.80);
      border: 0.75px solid var(--panel-border);
      color: var(--text-primary);
      font-size: 10px;
      font-family: inherit;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 120ms ease;
      border-radius: 0;
      pointer-events: auto !important;
      position: relative;
      z-index: 2001;
    }

    .btn.segBtn.level:hover{
      background: rgba(var(--accent-rgb),.15);
      border-color: var(--cyan-accent);
      color: var(--cyan-accent);
    }

    .btn.segBtn.level.active{
      background: rgba(var(--accent-rgb),.25);
      border-color: var(--cyan-accent);
      color: var(--cyan-accent);
      box-shadow: 0 0 8px rgba(var(--accent-rgb),.3);
    }
    /* ===== Round 17 (Bertie, 1920×1080 play): no banner, three parts at once, nothing to scroll ===== */
    html, body{ height:100%; }
    body{ overflow:hidden; }
    .app{ width:100%; height:100vh; margin:0; padding:12px 20px 16px; display:flex; flex-direction:column; gap:10px; position:relative; z-index:1; }

    /* Sound and settings: a small corner, out of the way */
    .corner-ctl{ position:fixed; top:10px; right:12px; z-index:9300; display:flex; gap:6px; align-items:center; opacity:.55; transition:opacity .2s ease; }
    .corner-ctl:hover, .corner-ctl:focus-within{ opacity:1; }
    .corner-ctl .audio-controls{ height:30px; }
    .corner-ctl .volume-slider{ width:64px; }
    .corner-ctl .settings-cog-btn{ padding:3px 8px; font-size:15px; height:30px; }
    .settings-dropdown{ top:48px !important; right:12px !important; }

    /* The number, the job, the floor */
    .n-top{ flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:0 150px; }
    .n-badge{ position:relative; z-index:6; }
    .n-badge .big{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:clamp(40px, 4.5vw, 64px); line-height:1; letter-spacing:0; word-spacing:-.12em; white-space:nowrap;
      color:#ffc94d; text-shadow:0 0 18px rgba(255,201,77,.55), 0 0 42px rgba(255,201,77,.25); }
    .n-badge.pulse .big{ animation:nPulse 1.1s ease-out 1; }
    @keyframes nPulse{ 0%{ transform:scale(1); } 30%{ transform:scale(1.14); text-shadow:0 0 30px #ffc94d, 0 0 70px rgba(255,201,77,.6); } 100%{ transform:scale(1); } }
    html.pn-reduce-motion .n-badge.pulse .big{ animation:none; }
    @media (prefers-reduced-motion: reduce){ .n-badge.pulse .big{ animation:none; } }
    .task{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:clamp(19px, 1.55vw, 27px); color:#eafcff; letter-spacing:.02em; white-space:nowrap; }
    .task b{ color:#ffc94d; }
    .subline{ display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap; min-height:18px; }
    .floor-tag{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.2em; color:var(--text-muted); }
    .sq-note{ font-family:"Chakra Petch", var(--font-ui); font-size:14px; font-weight:600; color:#ffe3a1; }
    .sq-note[hidden]{ display:none; }

    /* Three parts, always: draw | pairs | arrays */
    main{ flex:1 1 auto; min-height:0; display:grid; grid-template-columns:minmax(0, 1.12fr) minmax(300px, .78fr) minmax(0, 1.1fr); gap:18px; }
    /* Round 22: L3 has no drawing grid (type the pairs); the table and the arrays share the width */
    body.no-draw main{ grid-template-columns:minmax(300px, .9fr) minmax(0, 1.1fr); }
    body.no-draw .panel-draw, body.no-draw .read-box{ display:none; }
    .fv-det{ display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:8px 16px; margin-top:8px; min-height:0; }
    .fv-det:empty{ display:none; }
    .fv-win{ font-family:var(--font-ui); font-weight:700; font-size:12px; letter-spacing:.14em; color:#ffe14d; }
    .fv-win b{ font-family:var(--font-mono); font-size:15px; letter-spacing:.02em; }
    .fv-win.low{ color:#ff8aa0; }
    .panel{ min-height:0; min-width:0; display:flex; flex-direction:column; gap:8px; padding:12px 14px; overflow:hidden;
      border:1px solid var(--panel-border); background:var(--panel-bg); backdrop-filter:blur(8px);
      box-shadow:0 0 0 1px rgba(var(--accent-rgb),.15) inset, 0 20px 60px rgba(0,0,0,.5); position:relative; }
    .phead{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:13px; letter-spacing:.18em; color:var(--text-muted); text-transform:uppercase; }
    .phead .say{ font-weight:600; font-size:15px; letter-spacing:.02em; text-transform:none; color:var(--text-primary); }
    .phead .say b{ color:#ffc94d; }
    .phead button{ font:inherit; font-size:11px; letter-spacing:.12em; padding:4px 9px; background:transparent; border:1px solid var(--panel-border); color:var(--text-muted); cursor:pointer; }
    .phead button:hover{ color:var(--text-primary); border-color:var(--accent); }

    /* LEFT: the drawing grid */
    .draw-area{ flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    .drag-grid{ position:relative; display:grid; gap:2px; touch-action:none; user-select:none; cursor:crosshair; }
    .drag-grid i{ background:rgba(var(--accent-rgb),.08); border:1px solid rgba(var(--accent-rgb),.25); }
    .drag-grid i.sel{ background:rgba(var(--accent-hack-rgb),.45); border-color:var(--accent-hack); }
    .drag-grid.bad i.sel{ background:rgba(255,107,107,.45); border-color:#ff6b6b; }
    .drag-grid i.placed{ background:hsla(calc(160 + var(--hue, 0)), 70%, 45%, .55); border-color:hsla(calc(160 + var(--hue, 0)), 80%, 65%, .9); }
    .drag-grid .dtag{ position:absolute; pointer-events:none; font-family:var(--font-mono); font-size:12px; line-height:1; padding:2px 4px; background:rgba(3,14,16,.85); color:#eafff6; transform:translate(2px, 2px); }
    /* The turned-round copy of a drawn rectangle: swings out beside it for a moment, then fades (never takes clicks) */
    .drag-grid .turned{ position:absolute; display:grid; gap:2px; pointer-events:none; z-index:2; }
    .drag-grid .turned b{ background:hsla(calc(160 + var(--hue, 0)), 70%, 55%, .4); border:1px dashed hsla(calc(160 + var(--hue, 0)), 85%, 75%, .95); }
    .drag-grid .turned span{ position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); font-family:var(--font-mono); font-size:15px; font-weight:700; line-height:1; padding:3px 6px; white-space:nowrap; background:rgba(3,14,16,.9); color:#eafff6; }
    .dnote{ flex:0 0 auto; font-size:14px; color:var(--text-muted); min-height:0; text-align:center; }
    .dnote:empty{ display:none; }

    /* CENTRE: the pairs table, with the drawing readout and the feedback right under it */
    .panel-center{ align-items:stretch; }
    .table-wrapper{ flex:0 1 auto; min-height:0; overflow:hidden; }
    table{ width:100%; border-collapse:collapse; table-layout:fixed; font-family:var(--font-mono); }
    th, td{ border:1px solid var(--panel-border); text-align:center; font-weight:normal; height:var(--row-h, 52px); padding:0 10px; font-size:var(--row-fs, 24px); line-height:1; }
    th.n-head{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; letter-spacing:.08em; color:var(--text-primary); background:rgba(var(--accent-rgb),.05); font-size:calc(var(--row-fs, 24px) * .9); }
    th.n-head b{ color:#ffc94d; }
    /* One line box as tall as the cell, so the caret (even in an empty cell) and the digits sit in the vertical middle */
    td[contenteditable]{ cursor:text; background:rgba(var(--accent-rgb),.08); color:var(--text-primary); line-height:calc(var(--row-h, 52px) - 2px); }
    td[contenteditable]:focus{ outline:none; box-shadow:inset 0 0 0 2px rgba(var(--accent-rgb),.75); background:rgba(var(--accent-rgb),.16); }
    td.found{ color:var(--accent-hack); text-shadow:0 0 10px rgba(var(--accent-hack-rgb),.45); background:rgba(var(--accent-hack-rgb),.06); font-weight:700; }
    tr.fresh td{ animation:rowIn .7s ease-out 1; }
    @keyframes rowIn{ 0%{ background:rgba(var(--accent-hack-rgb),.45); } 100%{ background:rgba(var(--accent-hack-rgb),.06); } }
    .read-box{ flex:0 0 auto; height:clamp(58px, 7.5vh, 80px); display:flex; align-items:center; justify-content:center; border:1px dashed rgba(var(--accent-rgb),.3); background:rgba(0,0,0,.2); }
    .drag-read{ font-family:"Chakra Petch", var(--font-ui); font-weight:700; font-size:clamp(30px, 2.9vw, 50px); line-height:1; white-space:nowrap; color:var(--text-primary); }
    .drag-read .ok{ color:var(--accent-hack); } .drag-read .no{ color:#ff6b6b; }
    .drag-read small{ font-size:.5em; font-weight:600; color:var(--text-muted); letter-spacing:.02em; }
    .drag-read.idle{ font-size:16px; font-weight:600; color:var(--text-muted); letter-spacing:.04em; white-space:normal; text-align:center; }
    .msg-line{ flex:0 0 auto; min-height:2.7em; font-family:"Chakra Petch", var(--font-ui); font-size:clamp(16px, 1.1vw, 20px); font-weight:600; line-height:1.35; text-align:center; color:var(--text-primary); }
    .msg-line.bad{ color:#ff9aa8; } .msg-line.good{ color:#7dffc4; }
    .msg-line.flash{ animation:msgIn .35s ease-out 1; }
    @keyframes msgIn{ from{ opacity:.2; transform:translateY(4px); } to{ opacity:1; transform:none; } }
    .progress-line{ flex:0 0 auto; text-align:center; font-family:"Chakra Petch", var(--font-ui); font-size:13px; letter-spacing:.14em; color:var(--text-muted); text-transform:uppercase; }
    .progress-line b{ color:var(--text-primary); }
    body.floor-done td.found{ color:#ffc94d; text-shadow:0 0 10px rgba(255,201,77,.5); }

    /* RIGHT: the factor arrays */
    .vault-grid{ flex:1 1 auto; min-height:0; }
    .array-top{ align-self:end; padding-bottom:3px; font-size:clamp(13px, 1.05vw, 18px) !important; color:#eafcff !important; }
    .array-left{ justify-self:end; padding-right:6px; font-size:clamp(13px, 1.05vw, 18px) !important; color:#eafcff !important; }
    /* packVault measures the arrays straight after changing the square size: no size transitions here
       (the reduced-motion setting gives every element a tiny transition, which left the arrays measured stale and tiny) */
    #vaultRight *{ transition:none !important; }
    .array-tile.fresh .array-cell{ animation:cellGlow 1.2s ease-out 1; }
    @keyframes cellGlow{ 0%{ background:rgba(var(--accent-hack-rgb),.85); } 100%{ background:rgba(var(--accent-hack-rgb),.26); } }

    /* Practice mode end card */
    .practice-end{ position:fixed; inset:0; z-index:9300; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(2,10,14,.8); }
    .practice-end .card{ width:min(560px, 100%); background:rgba(6,16,20,.98); border:2px solid #2fbf8a; box-shadow:0 0 40px rgba(47,191,138,.25); padding:24px; display:flex; flex-direction:column; gap:16px; text-align:center; font-family:"Chakra Petch", var(--font-ui); }
    .practice-end h3{ margin:0; font-size:30px; letter-spacing:.08em; color:#7dffc4; }
    .practice-end .pairs{ font-family:var(--font-mono); font-size:22px; color:#ffc94d; line-height:1.5; }
    .practice-end .row{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .practice-end button, .practice-end a{ font:inherit; font-weight:700; font-size:16px; letter-spacing:.06em; padding:12px 18px; border:1px solid rgba(var(--accent-rgb),.6); background:rgba(0,0,0,.3); color:var(--text-primary); cursor:pointer; text-decoration:none; }
    .practice-end input{ width:110px; font-family:var(--font-mono); font-size:20px; padding:10px; text-align:center; background:rgba(0,0,0,.3); border:1px solid rgba(var(--accent-rgb),.6); color:var(--text-primary); }
    .practice-end .msg{ min-height:1.2em; color:#ffb3c0; font-size:14px; }

    /* Small screens: stack and let the page scroll */
    @media (max-width:900px){
      body{ overflow:auto; } .app{ height:auto; min-height:100vh; }
      .n-top{ padding:0 90px 0 0; }
      main{ grid-template-columns:1fr; }
      .panel{ min-height:320px; }
    }
  
/* ===== PRIMENET shared style (docs/STYLE.md). Keep this block last. ===== */

<body>
  <!-- Sound and settings, tucked in the corner. The game's sound switch is on the title screen; this adds a volume. -->
  <div class="corner-ctl">
    <div class="audio-controls">
      <button id="soundToggle" class="sound-btn" title="Sound on or off">🔊</button>
      <input id="volumeSlider" type="range" min="0" max="100" value="35" class="volume-slider" title="Volume" aria-label="Volume">
    </div>
    <!-- Flipped arrays (8×3 beside 3×8) always show: that's the maths point. -->
    <input id="showFlipped" type="checkbox" checked hidden />
    <button class="settings-cog-btn" id="settingsCogBtn" type="button" title="Settings" aria-label="Settings">⚙</button>
    <div class="settings-dropdown" id="settingsDropdown">
      <div class="settings-levels">
        <label>Difficulty</label>
        <div class="level-buttons">
          <button class="btn segBtn level" id="btnL1" type="button">L1</button>
          <button class="btn segBtn level" id="btnL2" type="button">L2</button>
          <button class="btn segBtn level" id="btnL3" type="button">L3</button>
        </div>
      </div>
      <button id="settingsBtnFullscreen" type="button" title="Fullscreen">FULLSCREEN</button>
      <button id="settingsBtnNewGame" type="button" title="Reset blueprint progress">NEW GAME</button>
    </div>
  </div>

  <div class="app">
    <div class="n-top">
      <div class="n-badge" id="nBadge" aria-live="polite"><div class="big">N = <span id="nBig">12</span></div></div>
      <div class="task" id="taskLine">Find every pair that makes <b>12</b></div>
      <div class="subline"><span class="floor-tag" id="nSub">FLOOR 1 OF 3</span><span class="sq-note" id="reinforcedNote" hidden></span></div>
    </div>

    <main>
      <!-- LEFT: draw -->
      <section class="panel panel-draw" aria-label="Drawing grid">
        <div class="phead"><span class="say">Drag to draw a rectangle of <b id="dragN">12</b> squares</span><button type="button" id="dragClear" title="Clear the drawings">CLEAR</button></div>
        <div class="draw-area"><div class="drag-grid" id="dragGrid"></div></div>
        <div class="dnote" id="dragNote"></div>
      </section>

      <!-- CENTRE: pairs -->
      <section class="panel panel-center" aria-label="Factor pairs">
        <div class="table-wrapper">
          <table>
            <thead><tr><th colspan="2" class="n-head">? × ? = <b id="nHead">12</b></th></tr></thead>
            <tbody id="pairsTable"></tbody>
          </table>
        </div>
        <div class="read-box" aria-live="polite"><div class="drag-read idle" id="dragRead">Drag on the grid</div></div>
        <div class="msg-line" id="hint" role="status" aria-live="polite"></div>
        <div class="progress-line">Found <b id="progress">0 of 0</b></div>
        <div class="fv-det" id="fvDet"></div>
      </section>

      <!-- RIGHT: arrays -->
      <section class="panel panel-vault" aria-label="Factor arrays">
        <div class="phead"><span>Arrays</span></div>
        <div class="vault-grid" id="vaultRight"></div>
      </section>
    </main>
  </div>

  <script src="../shared/story.js"></script>

  <script src="../shared/primenet.js"></script>
  <script src="../shared/detect.js"></script>
  <script src="../shared/buildings.js"></script>
  <script src="../shared/mode.js"></script>
  <script src="../shared/badges.js"></script>
  <script src="../shared/testtools.js"></script>
  <script src="../shared/handler.js"></script>
  <script src="../shared/glitch.js"></script>
  <script src="../shared/sound.js"></script>
  <script>
    const PN = window.Primenet;
    const TEACHER = !!(PN && PN.isTeacher());
    const FLOORS_NEEDED = 3;
    // Round 14: ?practice=1 (from the teacher's Practice box): one floor, no camera, no mission state saved
    const PRACTICE = new URLSearchParams(location.search).get("practice") === "1";

    // ===== AUDIO MANAGER =====
    class AudioManager {
      constructor(){
        this.audioContext = null;
        this.masterVolume = 0.35;
        this.soundEnabled = true;
        this.lastIncorrectTime = 0;
        this.lastTileSpawnTime = 0;
        this.lastScanSweepTime = 0;
        this.loadPreferences();
      }

      initAudioContext(){
        if(!this.audioContext){
          try {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            this.audioContext = new AudioContextClass();
          } catch(e){
            console.warn("Web Audio API not supported");
            return false;
          }
        }
        return true;
      }

      playCorrectTone(){
        if(window.PNSound){ PNSound.play("correct", Math.max(0, found.size - 1)); return; }   // bell climbs with each pair
        if(!this.soundEnabled || !this.initAudioContext()) return;
        
        const ctx = this.audioContext;
        const now = ctx.currentTime;
        
        // 2-note rising tone: soft attack, smooth release
        const freq1 = 440;  // A4
        const freq2 = 587;  // D5 (perfect 4th)
        const duration = 0.18;
        const attackTime = 0.02;
        const releaseTime = 0.06;
        
        const osc1 = ctx.createOscillator();
        const osc2 = ctx.createOscillator();
        const gain = ctx.createGain();
        const sineGain = ctx.createGain();
        const triangleGain = ctx.createGain();
        
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(freq1, now);
        osc1.frequency.linearRampToValueAtTime(freq2, now + duration * 0.5);
        
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq2 * 1.05, now);
        osc2.frequency.linearRampToValueAtTime(freq2, now + duration);
        
        // Amplitude envelope
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(this.masterVolume * 0.3, now + attackTime);
        gain.gain.exponentialRampToValueAtTime(0.01, now + duration - releaseTime);
        gain.gain.linearRampToValueAtTime(0, now + duration);
        
        sineGain.gain.setValueAtTime(0.6, now);
        triangleGain.gain.setValueAtTime(0.3, now);
        
        osc1.connect(sineGain);
        osc2.connect(triangleGain);
        sineGain.connect(gain);
        triangleGain.connect(gain);
        gain.connect(ctx.destination);
        
        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + duration);
        osc2.stop(now + duration);
      }

      playIncorrectTone(){
        if(window.PNSound){ PNSound.play("wrong"); return; }
        if(!this.soundEnabled || !this.initAudioContext()) return;
        
        const now = Date.now();
        if(now - this.lastIncorrectTime < 400) return; // Throttle
        this.lastIncorrectTime = now;
        
        const ctx = this.audioContext;
        const startTime = ctx.currentTime;
        const duration = 0.14;
        const frequency = 180; // Low muted pulse
        
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(frequency, startTime);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(300, startTime);
        filter.Q.setValueAtTime(2, startTime);
        
        // Soft attack and release
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(this.masterVolume * 0.25, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration - 0.04);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      playTileSpawn(){
        if(window.PNSound){ PNSound.play("pop", Math.floor(Math.random()*6)); return; }
        if(!this.soundEnabled || !this.initAudioContext()) return;
        
        const now = Date.now();
        if(now - this.lastTileSpawnTime < 60) return; // Throttle rapid spawns
        this.lastTileSpawnTime = now;
        
        const ctx = this.audioContext;
        const startTime = ctx.currentTime;
        const duration = 0.12;
        
        // Soft shimmer + low click
        const shimmer = ctx.createOscillator();
        const click = ctx.createOscillator();
        const shimmerGain = ctx.createGain();
        const clickGain = ctx.createGain();
        const mainGain = ctx.createGain();
        
        // High shimmer (frequency variations)
        shimmer.type = 'sine';
        shimmer.frequency.setValueAtTime(2400 + Math.random() * 400, startTime);
        
        // Low click
        click.type = 'sine';
        click.frequency.setValueAtTime(120 + Math.random() * 60, startTime);
        
        // Envelopes
        shimmerGain.gain.setValueAtTime(0, startTime);
        shimmerGain.gain.linearRampToValueAtTime(this.masterVolume * 0.15, startTime + 0.01);
        shimmerGain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
        shimmerGain.gain.linearRampToValueAtTime(0, startTime + duration);
        
        clickGain.gain.setValueAtTime(0, startTime);
        clickGain.gain.linearRampToValueAtTime(this.masterVolume * 0.2, startTime + 0.005);
        clickGain.gain.linearRampToValueAtTime(0, startTime + duration);
        
        mainGain.gain.setValueAtTime(1, startTime);
        
        shimmer.connect(shimmerGain);
        click.connect(clickGain);
        shimmerGain.connect(mainGain);
        clickGain.connect(mainGain);
        mainGain.connect(ctx.destination);
        
        shimmer.start(startTime);
        click.start(startTime);
        shimmer.stop(startTime + duration);
        click.stop(startTime + duration);
      }

      playScanSweep(){
        if(!this.soundEnabled || !this.initAudioContext()) return;
        
        // 12-15% chance to play, with global cooldown
        if(Math.random() > 0.15) return;
        
        const now = Date.now();
        if(now - this.lastScanSweepTime < 8000) return; // 8 second minimum gap
        this.lastScanSweepTime = now;
        
        const ctx = this.audioContext;
        const startTime = ctx.currentTime;
        const duration = 0.5;
        
        const osc = ctx.createOscillator();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();
        
        // Frequency sweep down
        const startFreq = 1200 + Math.random() * 400;
        const endFreq = 300 + Math.random() * 200;
        
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(startFreq, startTime);
        osc.frequency.exponentialRampToValueAtTime(endFreq, startTime + duration);
        
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(startFreq, startTime);
        filter.frequency.exponentialRampToValueAtTime(endFreq * 0.5, startTime + duration);
        filter.Q.setValueAtTime(3, startTime);
        
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(this.masterVolume * 0.08, startTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration - 0.1);
        gain.gain.linearRampToValueAtTime(0, startTime + duration);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        
        osc.start(startTime);
        osc.stop(startTime + duration);
      }

      toggleSound(){
        this.soundEnabled = !this.soundEnabled;
        if(window.PNSound) PNSound.setOn(this.soundEnabled);
        this.savePreferences();
        return this.soundEnabled;
      }

      setVolume(value){
        this.masterVolume = Math.max(0, Math.min(1, value / 100));
        if(window.PNSound) PNSound.setVolume(this.masterVolume);
        this.savePreferences();
      }

      savePreferences(){
        localStorage.setItem('primenet_sound_enabled', JSON.stringify(this.soundEnabled));
        localStorage.setItem('primenet_sound_volume', JSON.stringify(this.masterVolume));
      }

      loadPreferences(){
        const savedEnabled = localStorage.getItem('primenet_sound_enabled');
        const savedVolume = localStorage.getItem('primenet_sound_volume');
        
        if(savedEnabled !== null) this.soundEnabled = JSON.parse(savedEnabled);
        if(savedVolume !== null) this.masterVolume = JSON.parse(savedVolume);
        if(window.PNSound){ this.soundEnabled = PNSound.isOn(); this.masterVolume = PNSound.getVolume(); }   // one switch for the whole game
      }
    }

    // ===== TEMPLATE SYSTEM =====
    function applyVaultTemplate(vaultEl, tileCount){
      let unit = 16; // default medium

      if(tileCount <= 4) unit = 20;       // sparse = bigger
      else if(tileCount <= 8) unit = 16; // medium
      else unit = 12;                    // dense = smaller

      vaultEl.style.setProperty('--grid-unit', unit + 'px');
    }

    function ensureCanvasHeight(vaultEl, tileCount){
      if(tileCount < 9) return; // only for dense mode
      const base = 720;
      const extra = Math.max(0, tileCount - 6) * 140;
      vaultEl.style.minHeight = (base + extra) + 'px';
    }

    function snapToGrid(val, unit){
      return Math.round(val / unit) * unit;
    }

    function getGridUnit(el){
      const st = getComputedStyle(el);
      const unitStr = st.getPropertyValue('--grid-unit').trim();
      return parseInt(unitStr, 10) || 16;
    }

    // ===== INITIALIZE AUDIO MANAGER =====
    const audioManager = new AudioManager();

    // ===== DIFFICULTY LEVELS =====
    const VALID_N = {
      L1: [8, 10, 12, 14, 15, 16, 18, 20, 21, 22, 24],
      L2: [25, 28, 30, 32, 36, 40, 42, 45, 48, 50, 54, 56, 63, 64],
      L3: [60, 72, 80, 84, 90, 96, 100]
    };
    let currentDifficulty = PN ? PN.level() : 'L1';   // set on the title screen

    // ===== GAME STATE =====
    let N = 12; // Game-set value (not user-selectable)
    let allPairs = [];
    let found = new Set();
    let gameStage = 0; // 0=ACCESS, 1=ANALYSIS, 2=SECTOR, 3=BLUEPRINT, 4=FACILITY, 5=DIMENSIONAL, 6=COMPLETE

    const pairsTable = document.getElementById("pairsTable");
    const vaultRight = document.getElementById("vaultRight");
    const hint = document.getElementById("hint");
    const progress = document.getElementById("progress");
    const showFlipped = document.getElementById("showFlipped");
    const soundToggle = document.getElementById("soundToggle");
    const volumeSlider = document.getElementById("volumeSlider");
    const btnL1 = document.getElementById("btnL1");
    const btnL2 = document.getElementById("btnL2");
    const btnL3 = document.getElementById("btnL3");
    const settingsBtnNewGame = document.getElementById("settingsBtnNewGame");
    // ===== MATH =====
    function factorPairsFor(n){
      const pairs = [];
      for(let a = 1; a * a <= n; a++){
        if(n % a === 0){
          pairs.push([a, n / a]);
        }
      }
      return pairs;
    }

    function keyOf(a, b){
      const x = Math.min(a, b);
      const y = Math.max(a, b);
      return `${x},${y}`;
    }

    // ===== MODE SYSTEM =====
    function setMode(modeName){
      if(modeName === "Access Protocol") gameStage = 0;
      else if(modeName === "Vault Analysis Terminal") gameStage = 1;
      else if(modeName === "Sector Authorization") gameStage = 2;
      else if(modeName === "Blueprint Decryption") gameStage = 3;
      else if(modeName === "Facility Reconstruction") gameStage = 4;
      else if(modeName === "Dimensional Mapping") gameStage = 5;
      else if(modeName === "Level Authorization Granted") gameStage = 6;
    }

    // ===== DIFFICULTY SYSTEM =====
    function pickRandomFromDifficulty(difficulty){
      const all = VALID_N[difficulty] || VALID_N['L1'];
      const done = getCompletedLevels();
      const fresh = all.filter(n => !done.includes(n));   // don't repeat a floor already built
      const nums = fresh.length ? fresh : all;
      return nums[Math.floor(Math.random() * nums.length)];
    }

    function setDifficulty(difficulty){
      currentDifficulty = difficulty;
      updateLevelButtons();
    }

    function updateLevelButtons(){
      [btnL1, btnL2, btnL3].forEach(btn => btn.classList.remove('active'));
      if(currentDifficulty === 'L1') btnL1.classList.add('active');
      else if(currentDifficulty === 'L2') btnL2.classList.add('active');
      else if(currentDifficulty === 'L3') btnL3.classList.add('active');
    }

    // ===== BLUEPRINT PROGRESS SYSTEM =====
    function saveCompletedLevel(){
      if(PRACTICE) return getCompletedLevels();
      let completed = JSON.parse(localStorage.getItem('blueprintProgress') || '[]');
      if(!completed.includes(N)){
        completed.push(N);
        localStorage.setItem('blueprintProgress', JSON.stringify(completed));
      }
      return completed;
    }

    function getCompletedLevels(){
      return JSON.parse(localStorage.getItem('blueprintProgress') || '[]');
    }

    function isBlueprintComplete(){
      const completed = getCompletedLevels();
      return completed.length >= 3;
    }

    function clearBlueprintProgress(){
      localStorage.removeItem('blueprintProgress');
    }

    // ===== UI UPDATES =====
    // The feedback line sits right under the pairs table
    function setHint(msg, tone = ""){
      hint.textContent = msg;
      hint.className = "msg-line" + (tone ? " " + tone : "");
      void hint.offsetWidth; hint.classList.add("flash");
    }

    // Found pairs fill the table from the top in the order they were found; empty rows follow.
    // Anything still being typed stays in the empty rows, in order.
    let freshKey = null;
    function renderTable(){
      const pending = [];
      pairsTable.querySelectorAll("tr.open").forEach(row => {
        const a = row.cells[0].textContent.trim(), b = row.cells[1].textContent.trim();
        if(a || b) pending.push({ a, b });
      });
      pairsTable.innerHTML = "";
      const makeRow = cls => { const tr = document.createElement("tr"); tr.className = cls; tr.append(document.createElement("td"), document.createElement("td")); pairsTable.appendChild(tr); return tr; };

      [...found].forEach(k => {
        const [a, b] = k.split(",").map(Number);
        const tr = makeRow(k === freshKey ? "done fresh" : "done");
        tr.cells[0].textContent = String(a); tr.cells[1].textContent = String(b);
        tr.cells[0].className = tr.cells[1].className = "found";
      });

      for(let i = 0; i < allPairs.length - found.size; i++){
        const tr = makeRow("open");
        [...tr.cells].forEach((td, j) => {
          td.contentEditable = busyFloor ? "false" : "true";
          td.className = "empty";
          td.setAttribute("inputmode", "numeric");
          td.setAttribute("aria-label", j ? "Second number" : "First number");
          if(pending[i]) td.textContent = j ? pending[i].b : pending[i].a;
          td.addEventListener("keydown", e => cellKey(e, tr, j));
          td.addEventListener("input", () => {   // numbers only, at most 3 digits
            const v = td.textContent.replace(/\D+/g, "").slice(0, 3);
            if(v !== td.textContent){ td.textContent = v; caretToEnd(td); }
          });
          // Tab or click away: check the row once both numbers are in (not while moving between its two cells)
          td.addEventListener("blur", () => setTimeout(() => {
            if(!tr.isConnected || tr.contains(document.activeElement)) return;
            checkRow(tr, false);
          }, 0));
        });
      }

      progress.textContent = `${found.size} of ${allPairs.length}`;
      requestAnimationFrame(fitTable);
    }
    function caretToEnd(el){ try{ const r = document.createRange(); r.selectNodeContents(el); r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }catch(e){} }
    function cellKey(e, tr, j){
      if(e.key === "Enter"){
        e.preventDefault();
        const me = tr.cells[j], other = tr.cells[1 - j];
        if(me.textContent.trim() && !other.textContent.trim()){ other.focus(); return; }   // fill in the other number first
        checkRow(tr, true);
        return;
      }
      if(e.key.length === 1 && !/[0-9]/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey) e.preventDefault();
    }
    function focusFirstOpen(){ const td = pairsTable.querySelector("tr.open td"); if(td) td.focus(); }

    // Size the rows so every pair fits without scrolling (any N the game uses, 1366×768 and up)
    function fitTable(){
      const wrap = document.querySelector(".table-wrapper"), table = wrap.querySelector("table"), panel = wrap.parentElement;
      const cs = getComputedStyle(panel), gap = parseFloat(cs.rowGap) || 0;
      let used = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom) + gap * (panel.children.length - 1);
      [...panel.children].forEach(ch => { if(ch !== wrap) used += ch.offsetHeight; });
      const rows = allPairs.length + 1;   // + the "? × ? = N" row
      const H = panel.clientHeight - used - 2;
      const rh = Math.max(22, Math.min(76, Math.floor(H / rows) - 1));
      table.style.setProperty("--row-h", rh + "px");
      table.style.setProperty("--row-fs", Math.max(14, Math.min(30, Math.round(rh * 0.46))) + "px");
    }
    window.addEventListener("resize", () => requestAnimationFrame(fitTable));

    // A typed row is checked as soon as both numbers are in
    function checkRow(tr, fromEnter){
      if(busyFloor) return;
      const aT = tr.cells[0].textContent.trim(), bT = tr.cells[1].textContent.trim();
      if(!aT || !bT) return;
      const a = Number(aT), b = Number(bT);
      const clear = () => { tr.cells[0].textContent = ""; tr.cells[1].textContent = ""; if(fromEnter) tr.cells[0].focus(); };
      if(!Number.isInteger(a) || !Number.isInteger(b) || a <= 0 || b <= 0){ wrong("Use whole numbers bigger than 0."); clear(); return; }
      if(a * b !== N){ wrong(`${a} × ${b} = ${a * b}, not ${N}. Try again.`); clear(); return; }
      if(found.has(keyOf(a, b))){ wrong(`You already have ${Math.min(a, b)} × ${Math.max(a, b)}. Find a different pair.`); clear(); return; }
      const refocus = fromEnter || !document.activeElement || document.activeElement === document.body || pairsTable.contains(document.activeElement);
      tr.cells[0].textContent = ""; tr.cells[1].textContent = "";
      acceptPair(a, b);
      if(refocus && !busyFloor) focusFirstOpen();
    }

    let floorMisses = 0;
    function wrong(msg){
      setHint(msg, "bad");
      audioManager.playIncorrectTone();
      floorMisses++;
      if(fvDet) fvDet.hit();   // Round 22: the detection meter (only quick guessing fills it)
      armNudge();
      if(window.PNHandler && floorMisses === 3) PNHandler.once(`vault-tip-${N}`, `Try counting up from 1. If a number goes into ${N} exactly, its partner is ${N} ÷ that number.`);
    }

    // A pair is found (typed, drawn or decoded): into the table, and its arrays appear on the right
    function acceptPair(a, b){
      const x = Math.min(a, b), y = Math.max(a, b), key = keyOf(x, y);
      if(busyFloor || found.has(key)) return false;
      found.add(key);
      freshKey = key;
      armNudge();
      if(found.size === 1) setMode("Sector Authorization");
      audioManager.playCorrectTone();
      setHint(x === y ? `${x} × ${x} = ${N} ✓ A square: it looks the same both ways round.` : `${x} × ${y} = ${N} ✓ Turned round, ${y} × ${x} is the same pair.`, "good");
      renderTable();
      renderVaults(key);
      if(found.size === allPairs.length) completeFloor();
      return true;
    }

    // Every pair found: the floor completes by itself
    let busyFloor = false;
    function completeFloor(){
      busyFloor = true;

    function makeArrayTile(a, b, label){

    function findNonOverlappingPosition(container, tileW, tileH, placedRects, fieldHeight){
      const padding = 0;
      const maxX = container.clientWidth - padding - tileW;
      const maxY = fieldHeight - padding - tileH;
      
      if(maxX <= 0 || maxY <= 0) return null;
      
      // Stratified grid approach with shuffled cell order
      const cellSize = 160;
      const gridCols = Math.max(1, Math.ceil((maxX + tileW) / cellSize));
      const gridRows = Math.max(1, Math.ceil((maxY + tileH) / cellSize));
      const cells = [];
      
      for(let i = 0; i < gridCols * gridRows; i++) cells.push(i);
      
      // Fisher-Yates shuffle
      for(let i = cells.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [cells[i], cells[j]] = [cells[j], cells[i]];
      }
      
      // Try 3 random points per cell
      for(const cellIdx of cells){
        const col = cellIdx % gridCols;
        const row = Math.floor(cellIdx / gridCols);
        const cellX = Math.min(col * cellSize, maxX);
        const cellY = Math.min(row * cellSize, maxY);
        const cellEndX = Math.min(cellX + cellSize, maxX + tileW);
        const cellEndY = Math.min(cellY + cellSize, maxY + tileH);
        
        for(let attempt = 0; attempt < 3; attempt++){
          const x = cellX + Math.random() * Math.max(0, cellEndX - cellX - tileW);
          const y = cellY + Math.random() * Math.max(0, cellEndY - cellY - tileH);
          
          const clampedX = Math.max(padding, Math.min(x, maxX));
          const clampedY = Math.max(padding, Math.min(y, maxY));
          
          // Check for overlap with placed rectangles
          let overlap = false;
          for(const rect of placedRects){
            if(!(clampedX + tileW < rect.x || clampedX > rect.x + rect.w ||
                 clampedY + tileH < rect.y || clampedY > rect.y + rect.h)){
              overlap = true;
              break;
            }
          }
          
          if(!overlap){
            return {x: clampedX, y: clampedY};
          }
        }
      }
      
      // Fallback: pure random attempts
      for(let i = 0; i < 20; i++){
        const x = padding + Math.random() * Math.max(0, maxX - padding);
        const y = padding + Math.random() * Math.max(0, maxY - padding);
        
        let overlap = false;
        for(const rect of placedRects){
          if(!(x + tileW < rect.x || x > rect.x + rect.w ||
               y + tileH < rect.y || y > rect.y + rect.h)){
            overlap = true;
            break;
          }
        }
        
        if(!overlap){
          return {x, y};
        }
      }
      
      return null;
    }

    // Feedback: arrays sat far apart and some crossed the panel edges. Pack them in tidy rows,
    // centred in the panel, shrinking the grid unit until everything fits inside.
    function packVault(vault){
      const tiles = [...vault.querySelectorAll(".array-tile")];
      if(!tiles.length) return;
      const pad = 14, gapPx = 18;
      let unit = 60;   // start big and shrink until every array fits the panel
      vault.style.setProperty("--grid-unit", unit + "px");
      for(let attempt = 0; attempt < 40; attempt++){
        const W = vault.clientWidth - pad * 2, H = vault.clientHeight - pad * 2;
        const rows = []; let row = { items: [], w: 0, h: 0 };
        tiles.forEach(t => {
          const w = t.offsetWidth, h = t.offsetHeight;
          if(row.items.length && row.w + gapPx + w > W){ rows.push(row); row = { items: [], w: 0, h: 0 }; }
          row.w += (row.items.length ? gapPx : 0) + w; row.h = Math.max(row.h, h); row.items.push({ t, w, h });
        });
        rows.push(row);
        const total = rows.reduce((a, r) => a + r.h, 0) + gapPx * (rows.length - 1);
        const widest = Math.max(...rows.map(r => r.w));
        if((total > H || widest > W) && unit > 3){ unit = Math.max(3, Math.floor(unit * 0.9)); vault.style.setProperty("--grid-unit", unit + "px"); continue; }
        let y = pad + Math.max(0, (H - total) / 2);
        rows.forEach(r => {
          let x = pad + Math.max(0, (W - r.w) / 2);
          r.items.forEach(({ t, w, h }) => { t.style.left = x + "px"; t.style.top = (y + (r.h - h) / 2) + "px"; x += w + gapPx; });
          y += r.h + gapPx;
        });
        break;
      }
    }

    function redrawScanLines(panel, svg){
      if(!svg || !panel) return;

      const tiles = [...panel.querySelectorAll(".array-tile")];
      svg.innerHTML = "";

      if(tiles.length < 2) return;

      const pb = panel.getBoundingClientRect();
      const recent = tiles.slice(-8); // Connect up to 8 most recent tiles

      for(let i = 1; i < recent.length; i++){
        const a = recent[i-1].getBoundingClientRect();
        const b = recent[i].getBoundingClientRect();

        const x1 = (a.left + a.right)/2 - pb.left;
        const y1 = (a.top + a.bottom)/2 - pb.top;
        const x2 = (b.left + b.right)/2 - pb.left;
        const y2 = (b.top + b.bottom)/2 - pb.top;

        // Base blue dashed line
        const baseLine = document.createElementNS("http://www.w3.org/2000/svg","line");
        baseLine.setAttribute("x1", x1);
        baseLine.setAttribute("y1", y1);
        baseLine.setAttribute("x2", x2);
        baseLine.setAttribute("y2", y2);
        baseLine.setAttribute("stroke", "rgba(74,163,255,.35)");
        baseLine.setAttribute("stroke-width", "1");
        baseLine.setAttribute("stroke-dasharray", "6 10");
        baseLine.setAttribute("stroke-linecap", "round");
        baseLine.style.filter = "drop-shadow(0 0 4px rgba(74,163,255,0.15))";
        svg.appendChild(baseLine);

        // Yellow travelling glow line (30% chance or every 3rd line)
        if(i % 3 === 0 || Math.random() < 0.3){
          audioManager.playScanSweep();
          const glowLine = document.createElementNS("http://www.w3.org/2000/svg","line");
          glowLine.setAttribute("x1", x1);
          glowLine.setAttribute("y1", y1);
          glowLine.setAttribute("x2", x2);
          glowLine.setAttribute("y2", y2);
          glowLine.setAttribute("stroke", "rgba(242,193,78,0.45)");
          glowLine.setAttribute("stroke-width", "2");
          glowLine.setAttribute("stroke-dasharray", "14 140");
          glowLine.setAttribute("stroke-linecap", "round");
          glowLine.style.animation = "dashMove 1.8s linear infinite";
          glowLine.style.filter = "drop-shadow(0 0 6px rgba(242,193,78,0.3))";
          svg.appendChild(glowLine);
        }
      }
    }

    // ===== Square numbers and the drawing grid =====
    const isSquare = n => Number.isInteger(Math.sqrt(n));
    function setupFloorExtras(){
      const sq = isSquare(N);
      const note = document.getElementById("reinforcedNote");
      note.hidden = !sq;
      note.textContent = sq ? `${N} is a square number, so one pair uses the same number twice.` : "";

    // LEFT panel: always there. Drag out a rectangle; one of exactly N squares adds its pair to the table.
    const drawState = { placed: [], hue: 0 };
    function sizeDrawGrid(){
      const grid = document.getElementById("dragGrid"), area = document.querySelector(".draw-area"), note = document.getElementById("dragNote");
      const dims = () => {
        const W = area.clientWidth - 4, H = area.clientHeight - 4;
        // Wide enough for 1 × N when it fits at a readable cell size (10px+); otherwise as wide as the panel allows
        const cols = Math.max(4, Math.min(N, Math.floor(W / 12)));
        let size = Math.max(9, Math.min(46, Math.floor(W / cols) - 2));
        let rows = Math.max(4, Math.min(N, Math.floor(H / (size + 2))));
        // Few rows fit at this size (a small N in a short panel): shrink the squares so a tall shape fits too
        if(rows < Math.min(N, 12)){ size = Math.max(9, Math.floor(H / Math.min(N, 12)) - 2); rows = Math.max(4, Math.min(N, Math.floor(H / (size + 2)))); }
        return { W, H, cols, size, rows };
      };
      const setNote = d => {
        const tooLong = allPairs.filter(([a, b]) => !(a <= d.rows && b <= d.cols) && !(a <= d.cols && b <= d.rows)).map(([a, b]) => `${a} × ${b}`);
        note.textContent = tooLong.length ? `Too long to draw here: ${tooLong.join(", ")}. Type ${tooLong.length === 1 ? "it" : "them"} in the table.` : "";
      };
      grid.innerHTML = "";   // measure the empty area
      let d = dims();
      if(d.W < 40 || d.H < 40) return;
      // The note under the grid takes space, so set it, then measure again
      for(let k = 0; k < 2; k++){ setNote(d); d = dims(); }
      setNote(d);
      const { cols, size, rows } = d;
      grid.style.gridTemplateColumns = `repeat(${cols}, ${size}px)`;
      grid.style.gridAutoRows = `${size}px`;
      grid.dataset.rows = rows; grid.dataset.cols = cols; grid.dataset.size = size;
      const frag = document.createDocumentFragment();
      for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++){ const i = document.createElement("i"); i.dataset.r = r; i.dataset.c = c; frag.appendChild(i); }
      grid.appendChild(frag);
      // Keep what's been drawn on this floor (if it still fits)
      drawState.placed = drawState.placed.filter(pl => pl.r0 + pl.h <= rows && pl.c0 + pl.w <= cols);
      drawState.placed.forEach(pl => stampArray(pl));
    }
    function stampArray(pl){
      const grid = document.getElementById("dragGrid");
      grid.querySelectorAll("i").forEach(i => { const r = +i.dataset.r, c = +i.dataset.c;
        if(r >= pl.r0 && r < pl.r0 + pl.h && c >= pl.c0 && c < pl.c0 + pl.w){ i.classList.add("placed"); i.style.setProperty("--hue", pl.hue); } });
      const size = +grid.dataset.size, tag = document.createElement("span"); tag.className = "dtag";
      tag.textContent = `${pl.h}×${pl.w}`; tag.style.left = (pl.c0 * (size + 2)) + "px"; tag.style.top = (pl.r0 * (size + 2)) + "px";
      grid.appendChild(tag);
    }
    // A correct drawing: its turned-round version (e.g. 8×2 beside 2×8) swings out beside it, then fades.
    // Just a picture: the pair already counts, and the pupil can keep drawing straight away.
    function showTurned(pl){
      if(pl.h === pl.w) return;
      const grid = document.getElementById("dragGrid"), size = +grid.dataset.size, step = size + 2;
      const gw = +grid.dataset.cols * step - 2, gh = +grid.dataset.rows * step - 2;
      const x0 = pl.c0 * step, y0 = pl.r0 * step, w0 = pl.w * step - 2, h0 = pl.h * step - 2;   // the drawn one
      const w = h0, h = w0, gap = Math.max(8, size);                                              // the turned one
      const spots = [
        { x: x0 + w0 + gap, y: y0 }, { x: x0 - gap - w, y: y0 },
        { x: x0, y: y0 + h0 + gap }, { x: x0, y: y0 - gap - h }
      ];
      const fits = q => q.x >= 0 && q.y >= 0 && q.x + w <= gw && q.y + h <= gh;
      const spot = spots.find(fits) || { x: Math.max(0, Math.min(gw - w, spots[0].x)), y: Math.max(0, Math.min(gh - h, y0)) };
      const g = document.createElement("div"); g.className = "turned"; g.setAttribute("aria-hidden", "true");
      g.style.setProperty("--hue", pl.hue);
      g.style.gridTemplateColumns = `repeat(${pl.h}, ${size}px)`; g.style.gridAutoRows = `${size}px`;
      g.style.left = spot.x + "px"; g.style.top = spot.y + "px";
      for(let k = 0; k < pl.h * pl.w; k++) g.appendChild(document.createElement("b"));
      const tag = document.createElement("span"); tag.textContent = `${pl.w}×${pl.h}`; g.appendChild(tag);
      grid.appendChild(g);
      const reduced = !!(PN && PN.reducedMotion && PN.reducedMotion());
      let anim;
      if(reduced){
        anim = g.animate([{ opacity: 0 }, { opacity: 1, offset: .12 }, { opacity: 1, offset: .7 }, { opacity: 0 }], { duration: 1300, easing: "linear", fill: "both" });
      } else {
        // Start exactly on top of the drawn rectangle (a quarter turn back), swing round into the space beside it
        const dx = (x0 + w0 / 2) - (spot.x + w / 2), dy = (y0 + h0 / 2) - (spot.y + h / 2);
        anim = g.animate([
          { opacity: .85, transform: `translate(${dx}px, ${dy}px) rotate(-90deg)` },
          { opacity: 1, transform: "none", offset: .4, easing: "linear" },
          { opacity: 1, transform: "none", offset: .72 },
          { opacity: 0, transform: "none" }
        ], { duration: 1400, easing: "ease-in-out", fill: "both" });
        tag.animate([{ opacity: 0 }, { opacity: 0, offset: .35 }, { opacity: 1, offset: .45 }, { opacity: 1 }], { duration: 1400, fill: "both" });
      }
      anim.onfinish = () => g.remove();
      setTimeout(() => g.remove(), 1600);   // belt and braces
    }
    let drawResize = null;
    window.addEventListener("resize", () => { clearTimeout(drawResize); drawResize = setTimeout(sizeDrawGrid, 120); });
    document.getElementById("dragClear").addEventListener("click", () => {
      drawState.placed = []; sizeDrawGrid();
      setHint("Grid cleared. The pairs you found stay found.");
      if(window.PNSound) PNSound.play("click");
    });

    // The live readout: big, right under the pairs table
    const dragRead = document.getElementById("dragRead");
    let readTimer = null;
    function resetRead(){ clearTimeout(readTimer); dragRead.className = "drag-read idle"; dragRead.textContent = "Drag on the grid"; }
    function showRead(html, holdMs){ clearTimeout(readTimer); dragRead.className = "drag-read"; dragRead.innerHTML = html; if(holdMs) readTimer = setTimeout(resetRead, holdMs); }

    (function dragInput(){
      const grid = document.getElementById("dragGrid");
      let anchor = null, cur = null;
      const cellFrom = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentElement === grid && t.tagName === "I" ? { r: +t.dataset.r, c: +t.dataset.c } : null; };
      function rect(){ return { r0: Math.min(anchor.r, cur.r), c0: Math.min(anchor.c, cur.c), h: Math.abs(anchor.r - cur.r) + 1, w: Math.abs(anchor.c - cur.c) + 1 }; }
      function paint(){
        if(!anchor || !cur) return;
        const q = rect(), n = q.h * q.w, ok = n === N;
        grid.querySelectorAll("i").forEach(i => { const r = +i.dataset.r, c = +i.dataset.c; i.classList.toggle("sel", r >= q.r0 && r < q.r0 + q.h && c >= q.c0 && c < q.c0 + q.w); });
        grid.classList.toggle("bad", n > N);
        showRead(`${q.h} × ${q.w} = <span class="${ok ? "ok" : n > N ? "no" : ""}">${n}</span>${ok ? " ✓" : ` <small>need ${N}</small>`}`);
        return { ...q, ok };
      }
      const overlaps = q => [...grid.querySelectorAll("i.placed")].some(i => { const r = +i.dataset.r, c = +i.dataset.c; return r >= q.r0 && r < q.r0 + q.h && c >= q.c0 && c < q.c0 + q.w; });
      grid.addEventListener("pointerdown", e => {
        if(busyFloor) return;
        const c = cellFrom(e); if(!c) return;
        e.preventDefault(); try{ grid.setPointerCapture(e.pointerId); }catch(err){}
        anchor = cur = c; paint(); if(window.PNSound) PNSound.play("tag");
      });
      grid.addEventListener("pointermove", e => { if(!anchor) return; const c = cellFrom(e); if(c && (c.r !== cur.r || c.c !== cur.c)){ cur = c; paint(); if(window.PNSound) PNSound.play("plot"); } });
      const finish = () => {
        if(!anchor) return;
        const res = paint(); anchor = cur = null;
        setTimeout(() => { grid.querySelectorAll("i.sel").forEach(i => i.classList.remove("sel")); grid.classList.remove("bad"); }, 450);
        if(!res) return;
        const a = Math.min(res.h, res.w), b = Math.max(res.h, res.w);
        if(!res.ok){ readTimer = setTimeout(resetRead, 1800); wrong(`${res.h} × ${res.w} = ${res.h * res.w} squares. You need exactly ${N}.`); return; }
        readTimer = setTimeout(resetRead, 2200);
        if(overlaps(res)){ setHint("That crosses a rectangle you already drew. Draw it in an empty space.", "bad"); if(window.PNSound) PNSound.play("untag"); return; }
        if(found.has(keyOf(a, b))){ setHint(`You already have ${a} × ${b}. Turned round, it is the same pair. Try a different shape.`, "bad"); if(window.PNSound) PNSound.play("untag"); return; }
        const pl = { ...res, hue: drawState.hue }; drawState.placed.push(pl); stampArray(pl);
        drawState.hue = (drawState.hue + 47) % 360;
        if(acceptPair(a, b)) showTurned(pl);
      };
      grid.addEventListener("pointerup", finish);
      grid.addEventListener("pointercancel", finish);
    })();

    // Teacher test tools (only while unlocked)
    if(window.PNTest){
      const decode = count => {
        const todo = allPairs.filter(([a, b]) => !found.has(keyOf(a, b))).slice(0, count);
        todo.forEach(([a, b]) => acceptPair(a, b));
        return todo.length ? `Decoded ${todo.length} pair${todo.length === 1 ? "" : "s"}.` : "Nothing left to decode.";
      };
      PNTest.add("Decode all pairs", () => decode(99));
      PNTest.add("Decode one pair", () => decode(1));
      PNTest.skip("Decode all pairs", () => decode(99));
      PNTest.add("Skip to Blueprint (3 floors at this level)", () => {
        const b = window.PNBuildings && PNBuildings.current({ make: true });   // the mission's building, if it has one
        if(b) PNBuildings.install();
        const pool = b ? b.floors.slice() : VALID_N[currentDifficulty].slice().sort(() => Math.random() - .5).slice(0, 3);
        localStorage.setItem("blueprintProgress", JSON.stringify(pool));
        pool.forEach(n => PN && PN.log("vault-complete", { n, level: currentDifficulty }));
        location.href = "vault_blueprint_viewer.html";
      });
    }

    // Start the game. (The "connecting to floor" hack-in now happens on the grid page, straight after the build.)
    const urlParams = new URLSearchParams(window.location.search);
    const urlN = parseInt(urlParams.get('n'), 10);

    // If specific N provided via URL, use it and detect its difficulty level
    if(Number.isInteger(urlN) && urlN > 1){
      if(VALID_N.L1.includes(urlN)) currentDifficulty = 'L1';
      else if(VALID_N.L2.includes(urlN)) currentDifficulty = 'L2';
      else if(VALID_N.L3.includes(urlN)) currentDifficulty = 'L3';
      else currentDifficulty = 'L1';
      updateLevelButtons();
      init(urlN);
    } else {
      updateLevelButtons();
      init();
    }
  </script>
</body>
