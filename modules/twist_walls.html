<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Deposit-Box Walls</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Factor Vault twist: which factor-pair arrays of deposit boxes fit on a wall of a fixed size? */
  .layout{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:16px; align-items:start; }
  .wallbox{ padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .wallbox .lab{ align-self:stretch; display:flex; justify-content:space-between; font-family:var(--font-ui); font-size:13px; letter-spacing:.14em; color:var(--text-muted); }
  .wall{ display:grid; gap:3px; padding:10px; border:2px solid rgba(var(--accent-rgb),.6); background:rgba(0,0,0,.3); }
  .wall i{ width:var(--c); height:var(--c); border:1px solid rgba(var(--accent-rgb),.25); background:rgba(8,26,31,.9); position:relative; }
  .wall i::after{ content:""; position:absolute; left:50%; top:50%; width:3px; height:3px; margin:-1.5px; border-radius:50%; background:rgba(var(--accent-rgb),.35); }
  .wall i.box{ background:hsla(var(--h), 70%, 45%, .6); border-color:hsla(var(--h), 80%, 70%, .95); }
  .wall i.box::after{ background:#fff3cf; }
  .wall-note{ min-height:1.4em; font-size:15px; color:var(--text-muted); text-align:center; }
  .pairs{ padding:16px; display:flex; flex-direction:column; gap:8px; }
  .pairs .lab{ font-family:var(--font-ui); font-size:13px; letter-spacing:.14em; color:var(--text-muted); }
  .pair{ display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; border:1px solid var(--line); padding:8px 10px; background:rgba(0,0,0,.2); }
  .pair b{ font-size:22px; }
  .pair .v{ font-size:14px; color:var(--text-muted); grid-column:1 / -1; }
  .pair.fit{ border-color:var(--accent); } .pair.fit .v{ color:var(--accent); }
  .pair.base{ border-color:#9fb7bb; } .pair.base .v{ color:#cfe0e3; }
  .pair.done button{ display:none; }
  /* Feedback round 8: when a wall is sorted, the rectangles that fit slide in as banks of deposit boxes and the key box glows */
  .rack{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; align-items:flex-end; min-height:0; }
  .bank{ display:flex; flex-direction:column; align-items:center; gap:4px; opacity:0; transform:translateY(18px); transition:opacity .4s, transform .4s; }
  .bank.in{ opacity:1; transform:none; }
  .bank .g{ display:grid; gap:1px; padding:3px; border:1px solid rgba(var(--accent-rgb),.5); background:rgba(0,0,0,.35); }
  .bank .g i{ width:14px; height:14px; background:hsla(var(--h), 55%, 40%, .7); border:1px solid hsla(var(--h), 70%, 65%, .8); }
  .bank span{ font-family:var(--font-mono); font-size:13px; color:var(--text-muted); }
  .bank.key .g{ border-color:#ffc94d; box-shadow:0 0 18px rgba(255,201,77,.55); animation:keyGlow 1.2s ease-in-out infinite alternate; }
  .bank.key .g i{ background:rgba(255,201,77,.55); border-color:#ffe7a8; }
  .bank.key span{ color:#ffc94d; font-weight:700; }
  @keyframes keyGlow{ to{ box-shadow:0 0 28px rgba(255,201,77,.9); } }
  @media (prefers-reduced-motion: reduce){ .bank{ transition:none; } .bank.key .g{ animation:none; } }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span>Wall <b id="round">1</b> of 3</span><span><b id="nLab"></b></span></div>
  <div class="layout">
    <section class="pn-panel wallbox">
      <div class="lab"><span>DEPOSIT WALL</span><span id="wallSize"></span></div>
      <div class="wall" id="wall"></div>
      <div class="wall-note" id="wallNote"></div>
      <div class="rack" id="rack" aria-live="polite"></div>
    </section>
    <section class="pn-panel pairs">
      <span class="lab">RECTANGLES OF BOXES (FACTOR PAIRS)</span>
      <div id="pairs" style="display:flex;flex-direction:column;gap:8px"></div>
    </section>
  </div>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.init({ id: "walls", stage: "FACTOR VAULT", title: "DEPOSIT-BOX WALLS",
    goal: T.peekLevel() === "L1" ? "Which rectangles of boxes fit on the wall? Drag boxes out on the wall, or tap a rectangle to try it." : "Which rectangles of boxes <b>fit on the wall</b>? They can be turned round.",
    example: "On a wall 8 wide and 6 high, 4 × 6 fits (4 high, 6 wide). 2 × 12 doesn't: 12 is too wide and too tall.",
    story: `The key is in ${T.targets()} deposit boxes. The boxes are fitted into the vault wall in rectangles. Work out which rectangles fit, and we'll know where to look.` });
  // [N, wall width, wall height], chosen so some pairs only fit turned round and some don't fit at all
  const SETS = {
    L1: [[24, 8, 6], [18, 6, 4], [20, 5, 5], [16, 8, 4], [12, 4, 4]],
    L2: [[36, 8, 6], [48, 8, 8], [40, 10, 5], [30, 6, 6], [45, 9, 5]],
    L3: [[72, 9, 8], [60, 10, 6], [84, 12, 7], [90, 10, 9], [96, 12, 8]],
  }[L];
  const rounds = T.shuffle(SETS).slice(0, 3);
  let r = 0, over = false, right = 0, total = 0, hue = 150;
  const alarm = T.alarm(3, () => end(false));
  const fits = (a, b, W, H) => (a <= H && b <= W) || (b <= H && a <= W);
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function deal(){
    const [N, W, H] = rounds[r];
    $("round").textContent = r + 1; $("nLab").textContent = `N = ${N} boxes`;
    $("wallSize").textContent = `${W} WIDE × ${H} HIGH`;
    const wall = $("wall"), c = Math.max(14, Math.min(32, Math.floor(360 / Math.max(W, H))));
    wall.style.gridTemplateColumns = `repeat(${W}, ${c}px)`; wall.style.setProperty("--c", c + "px");
    wall.innerHTML = Array.from({ length: W * H }, (_, k) => `<i data-r="${Math.floor(k / W)}" data-c="${k % W}"></i>`).join("");
    $("wallNote").textContent = ""; $("rack").innerHTML = "";
    const box = $("pairs"); box.innerHTML = "";
    T.pairs(N).forEach(([a, b]) => {
      total++;
      const el = document.createElement("div"); el.className = "pair";
      el.innerHTML = `<b>${a} × ${b}</b><button class="pn-btn small" type="button" data-a="fit">Fits</button><button class="pn-btn small" type="button" data-a="base">Doesn't fit</button><span class="v"></span>`;
      // L1: tap the rectangle to try it on the wall first, and turn it round
      if(L === "L1"){ const lab = el.querySelector("b"); lab.style.cursor = "pointer"; lab.title = "Try it on the wall"; let turned = false;
        lab.addEventListener("click", () => { if(el.classList.contains("done")) return; preview(turned ? b : a, turned ? a : b); turned = !turned; }); }
      el.querySelector('[data-a="fit"]').addEventListener("click", () => answer(el, a, b, true));
      el.querySelector('[data-a="base"]').addEventListener("click", () => answer(el, a, b, false));
      box.appendChild(el);
    });
    say(`${N} boxes. The wall is ${W} boxes wide and ${H} high.`);
  }
  // Try a rectangle on the wall (L1): rows × cols, shown even if it spills over the edge
  function preview(rows, cols){
    const [N, W, H] = rounds[r];
    hue = (hue + 55) % 360;
    $("wall").querySelectorAll("i").forEach(i => { const on = +i.dataset.r < rows && +i.dataset.c < cols; i.classList.toggle("box", on); if(on) i.style.setProperty("--h", hue); });
    const over = rows > H || cols > W;
    $("wallNote").textContent = `${rows} high × ${cols} wide${over ? `: too ${rows > H && cols > W ? "tall and too wide" : rows > H ? "tall" : "wide"} for this wall` : ": it fits"}. Tap it again to turn it round.`;
    T.SND("plot");
  }
  // L1 scaffold: drag out rectangles on the wall to experiment (removed at L2 and L3)
  if(L === "L1"){
    const wall = $("wall"); wall.style.touchAction = "none"; wall.style.cursor = "crosshair";
    let anchor = null, cur = null;
    const cellAt = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentElement === wall ? { r: +t.dataset.r, c: +t.dataset.c } : null; };
    const paint = () => { const r0 = Math.min(anchor.r, cur.r), r1 = Math.max(anchor.r, cur.r), c0 = Math.min(anchor.c, cur.c), c1 = Math.max(anchor.c, cur.c), h = r1 - r0 + 1, w = c1 - c0 + 1, N = rounds[r][0];
      hue = 200; wall.querySelectorAll("i").forEach(i => { const on = +i.dataset.r >= r0 && +i.dataset.r <= r1 && +i.dataset.c >= c0 && +i.dataset.c <= c1; i.classList.toggle("box", on); if(on) i.style.setProperty("--h", hue); });
      $("wallNote").textContent = `${h} high × ${w} wide = ${h * w} boxes${h * w === N ? ` ✓ that's all ${N}` : ` (need ${N})`}`; };
    wall.addEventListener("pointerdown", e => { if(over) return; const c = cellAt(e); if(!c) return; e.preventDefault(); wall.setPointerCapture(e.pointerId); anchor = cur = c; paint(); T.SND("tag"); });
    wall.addEventListener("pointermove", e => { if(!anchor) return; const c = cellAt(e); if(c && (c.r !== cur.r || c.c !== cur.c)){ cur = c; paint(); T.SND("plot"); } });
    wall.addEventListener("pointerup", () => { anchor = cur = null; });
  }
  function show(a, b){
    const [N, W, H] = rounds[r];
    let rows = a, cols = b, turned = false;
    if(!(rows <= H && cols <= W)){ rows = b; cols = a; turned = true; }
    hue = (hue + 55) % 360;
    $("wall").querySelectorAll("i").forEach(i => { const on = +i.dataset.r < rows && +i.dataset.c < cols; i.classList.toggle("box", on); if(on) i.style.setProperty("--h", hue); });
    $("wallNote").textContent = `${rows} rows × ${cols} columns = ${N}${turned ? " (turned round to fit)" : ""}`;
  }
  function answer(el, a, b, saidFit){
    if(over || el.classList.contains("done")) return;
    const [N, W, H] = rounds[r], ok = fits(a, b, W, H) === saidFit, v = el.querySelector(".v");
    const why = fits(a, b, W, H)
      ? (a <= H && b <= W ? `${a} high and ${b} wide fits.` : `Turned round, ${b} high and ${a} wide fits.`)
      : `${Math.max(a, b)} is bigger than the wall's width (${W}) and height (${H}), so it can't go on either way.`;
    el.classList.add("done", fits(a, b, W, H) ? "fit" : "base");
    v.textContent = (ok ? "✓ " : "✗ ") + why;
    if(fits(a, b, W, H)) show(a, b);
    if(ok){ right++; T.SND("correct", right % 8); say(fits(a, b, W, H) ? "It fits on the wall." : "It doesn't fit, either way round.", "ok"); }
    else { T.SND("wrong"); say(why, "bad"); alarm.hit(); }
    if(!over && [...$("pairs").children].every(p => p.classList.contains("done"))){
      const wait = complete();
      setTimeout(() => { if(over) return; r++; if(r < rounds.length){ T.SND("newlock"); deal(); } else end(true); }, wait / (window.PNTest ? PNTest.speed() : 1));
    }
  }
  // The wall is sorted: every rectangle that fits slides in as a bank of boxes, then the key box glows gold.
  // The key is in the bank that only fits turned round, or else the one closest to a square.
  const keys = [];
  function complete(){
    const [N, W, H] = rounds[r], sp = window.PNTest ? PNTest.speed() : 1;
    const fp = T.pairs(N).filter(([a, b]) => fits(a, b, W, H)).map(([a, b]) => (a <= H && b <= W) ? { rows: a, cols: b, turned: false } : { rows: b, cols: a, turned: true });
    if(!fp.length) return 1500;
    const tr = fp.filter(p => p.turned), kp = tr.length === 1 ? tr[0] : fp[fp.length - 1];
    $("wall").querySelectorAll("i").forEach(i => i.classList.remove("box"));
    $("wallNote").textContent = "Wall sorted. Fitting the deposit boxes…";
    $("rack").innerHTML = fp.map((p, k) => `<div class="bank" data-k="${k}" style="--h:${(160 + k * 50) % 360}"><div class="g" style="grid-template-columns:repeat(${p.cols}, 14px)">${"<i></i>".repeat(p.rows * p.cols)}</div><span>${p.rows} × ${p.cols}</span></div>`).join("");
    fp.forEach((p, k) => setTimeout(() => { const b = $("rack").querySelector(`[data-k="${k}"]`); if(b){ b.classList.add("in"); T.SND("clamp"); } }, (300 + k * 350) / sp));
    const tKey = 300 + fp.length * 350 + 400;
    setTimeout(() => {
      const b = $("rack").querySelector(`[data-k="${fp.indexOf(kp)}"]`); if(!b || over) return;
      b.classList.add("key"); b.querySelector("span").textContent = `KEY BOX · ${kp.rows} × ${kp.cols}`; T.SND("success");
      const why = tr.length === 1 ? "the only one that fits turned round" : "the one closest to a square";
      $("wallNote").textContent = `The key is in the ${kp.rows} × ${kp.cols} bank: ${why}.`;
      keys.push(`${N} boxes: the ${kp.rows} × ${kp.cols} bank (${why})`);
    }, tKey / sp);
    return tKey + 2200;
  }
  function end(ok){
    over = true;
    T.finish({ ok, title: ok ? "WALLS MAPPED" : "ALARM TRIPPED",
      lines: [`Pairs sorted correctly: <b>${right}</b> of ${total}`, ...(ok && keys.length ? [`Key box: <b>${keys[keys.length - 1]}</b>`] : []), `A pair fits if its smaller number fits one side and its larger number fits the other.`, `Turning an array round (3 × 8 into 8 × 3) keeps the same number of boxes.`] });
    T.say(ok ? "Walls mapped and the key box found. The crew know exactly which one to open." : "Too many wrong calls. Security heard us.");
  }
  deal();
  T.say("Deposit boxes, same number every way round. Will they fit on the wall?", { delay: 600 });
  if(window.PNTest) PNTest.skip("Sort this wall", () => {
    const [N, W, H] = rounds[r];
    [...$("pairs").children].forEach(el => { if(el.classList.contains("done")) return; const [a, b] = el.querySelector("b").textContent.split("×").map(s => +s.trim()); el.querySelector(fits(a, b, W, H) ? '[data-a="fit"]' : '[data-a="base"]').click(); });
  });
})();
</script>
</body>
</html>
