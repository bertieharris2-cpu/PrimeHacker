<!doctype html>

<head>

<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">

<style>
  /* Mission part two opener. The town and TARGET LOCKED now happen in the briefing (shared/townlock.js). Here: the email
     intercepted in part one (an envelope with a padlock, building_plans.enc) opens, the hologram of the target's floors rises
     out of it, PLANS INTERCEPTED, soft red interference bands (still encrypted) and ORACLE's line about decrypting each floor.
     About 10 seconds, WATCH, skippable. */
  html, body{ height:100%; }
  body{ margin:0; overflow:hidden; background:radial-gradient(ellipse at 50% 55%, #0b2a33 0%, #04101a 55%, #01060a 100%); color:var(--text-primary); font-family:var(--font-ui); }
  .tl-stage{ position:fixed; inset:0; z-index:1; }
  .tl-stage canvas{ display:block; width:100%; height:100%; }
  .tl-scan{ position:fixed; inset:0; pointer-events:none; z-index:2;
    background:repeating-linear-gradient(0deg, rgba(120,230,255,.05) 0 1px, transparent 1px 4px); mix-blend-mode:screen; }
  .tl-scan::after{ content:""; position:absolute; left:0; right:0; height:120px; top:-120px;
    background:linear-gradient(180deg, transparent, rgba(120,230,255,.10), transparent); animation:tlSweep 3.2s linear infinite; }
  @keyframes tlSweep{ to{ top:100%; } }
  .tl-vig{ position:fixed; inset:0; pointer-events:none; z-index:2; box-shadow:inset 0 0 180px rgba(0,0,0,.85); }
  .tl-head{ position:fixed; left:22px; top:calc(var(--pn-mode-h, 62px) + 16px); z-index:3; font-family:var(--font-mono); font-size:13px; letter-spacing:.14em; color:rgba(140,230,255,.75); line-height:1.7; }
  .tl-head b{ color:#bff4ff; font-weight:700; }
  .tl-head em{ font-style:normal; color:#ffc94d; }
  /* the lock-on brackets close in on the building */
  .tl-ret{ position:fixed; left:50%; top:54%; width:720px; height:620px; transform:translate(-50%,-50%); z-index:3; pointer-events:none; opacity:0;
    transition:width 1.1s cubic-bezier(.2,.8,.2,1), height 1.1s cubic-bezier(.2,.8,.2,1), opacity .3s, border-color .3s; }
  .tl-ret i{ position:absolute; width:34px; height:34px; border:3px solid #6fe8ff; filter:drop-shadow(0 0 6px rgba(111,232,255,.7)); }
  .tl-ret i:nth-child(1){ left:0; top:0; border-right:0; border-bottom:0; }
  .tl-ret i:nth-child(2){ right:0; top:0; border-left:0; border-bottom:0; }
  .tl-ret i:nth-child(3){ left:0; bottom:0; border-right:0; border-top:0; }
  .tl-ret i:nth-child(4){ right:0; bottom:0; border-left:0; border-top:0; }
  .tl-ret.on{ opacity:1; }
  .tl-ret.close{ width:min(46vw, 480px); height:min(62vh, 470px); }
  .tl-ret.locked i{ border-color:#ffc94d; filter:drop-shadow(0 0 10px rgba(255,201,77,.8)); }
  /* the stamp */
  .tl-stamp{ position:fixed; left:50%; top:72%; z-index:4; transform:translate(-50%,-50%) rotate(-6deg) scale(2.4); opacity:0; pointer-events:none; text-align:center;
    border:5px solid #ffc94d; padding:14px 34px 12px; background:rgba(20,12,0,.55); box-shadow:0 0 40px rgba(255,201,77,.35), inset 0 0 30px rgba(255,201,77,.18); }
  .tl-stamp b{ display:block; font-size:clamp(30px, 4vw, 54px); letter-spacing:.14em; white-space:nowrap; color:#ffc94d; text-shadow:0 0 24px rgba(255,201,77,.6); line-height:1; }
  .tl-stamp span{ display:block; margin-top:10px; font-size:clamp(16px, 1.9vw, 24px); letter-spacing:.22em; color:#fff3cf; text-transform:uppercase; }
  .tl-stamp.on{ animation:tlStamp .38s cubic-bezier(.3,1.6,.5,1) forwards; }
  @keyframes tlStamp{ 0%{ opacity:0; transform:translate(-50%,-50%) rotate(-6deg) scale(2.4); } 100%{ opacity:1; transform:translate(-50%,-50%) rotate(-6deg) scale(1); } }
  .tl-stamp.shake{ animation:tlStamp .38s cubic-bezier(.3,1.6,.5,1) forwards, tlShake .3s .38s steps(3) 1; }
  @keyframes tlShake{ 33%{ margin-left:4px; } 66%{ margin-left:-3px; } }
  /* the three floors, each still encrypted */
  .tl-floors{ position:fixed; left:22px; top:calc(var(--pn-mode-h, 62px) + 110px); z-index:3; display:flex; flex-direction:column; gap:8px; }
  .tl-floors div{ font-family:var(--font-ui); font-weight:700; font-size:16px; letter-spacing:.16em; padding:8px 14px; border:1px solid rgba(255,107,107,.6); background:rgba(40,6,10,.6); color:#ffb0b0;
    opacity:0; transform:translateX(-20px); transition:opacity .35s, transform .35s; }
  .tl-floors div.on{ opacity:1; transform:none; }
  .tl-floors div small{ color:#ff6b6b; margin-left:10px; letter-spacing:.2em; }
  /* The intercepted email: its back and open flap sit behind the hologram, its front pocket in front (so the hologram rises out of it) */
  .env{ position:fixed; left:var(--ex, 50%); top:var(--ey, 62%); width:220px; height:140px; margin-left:-110px; pointer-events:none; perspective:700px;
    opacity:0; transform:translateY(14px) scale(.6); transition:opacity .45s ease, transform .5s cubic-bezier(.2,1.3,.4,1); }
  .env svg{ position:absolute; left:0; top:0; width:100%; overflow:visible; }
  .env.back{ z-index:0; } .env.front{ z-index:2; }
  body.env-in .env{ opacity:1; transform:none; }
  body.env-out .env{ opacity:0; transform:translateY(40px) scale(.9); transition:opacity .8s ease, transform .9s ease; }
  .env .flap{ position:absolute; left:0; top:0; width:220px; height:80px; transform-origin:50% 0; }
  .env .flap.up{ transform:rotateX(180deg); }
  .env-glow{ position:absolute; left:-40px; right:-40px; bottom:calc(100% - 26px); height:220px; opacity:0; transition:opacity .6s ease;
    background:radial-gradient(ellipse 50% 55% at 50% 100%, rgba(140,235,255,.55), rgba(111,232,255,.14) 55%, transparent 75%); }
  body.env-lit .env-glow{ opacity:1; }
  .env .env-lock{ position:absolute; left:50%; top:66px; width:34px; height:40px; margin-left:-17px; filter:drop-shadow(0 0 8px rgba(255,90,102,.55)); }
  .env-name{ position:absolute; left:50%; top:152px; transform:translateX(-50%); text-align:center; white-space:nowrap; font-family:var(--font-mono); font-size:16px; letter-spacing:.06em; color:#bff4ff; }
  .env-name small{ display:block; margin-top:4px; font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:.2em; color:#ff8a8a; }
  .tl-nogl{ position:fixed; left:50%; top:54%; transform:translate(-50%,-50%); color:rgba(140,230,255,.6); font-family:var(--font-mono); letter-spacing:.2em; z-index:1; }
  .pn-powerup{ position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; background:rgba(4,14,17,.72); font-family:var(--font-ui); }
  .pn-powerup div{ border:1px solid rgba(var(--accent-rgb),.6); background:rgba(9,32,38,.92); padding:22px 30px; text-align:center; letter-spacing:.16em; font-weight:700; color:var(--accent); animation:pnPulse 1.4s ease-in-out infinite; }
  .pn-powerup small{ display:block; margin-top:8px; letter-spacing:.06em; font-weight:400; color:var(--text-muted); }
  @media (max-width:700px){ .tl-floors{ top:auto; bottom:24px; left:16px; } .tl-head{ left:16px; } }
  @media (prefers-reduced-motion: reduce){ .tl-scan::after{ animation:none; } .tl-ret{ transition:none; } .env{ transform:none; transition:opacity .45s ease; } body.env-out .env{ transform:none; } }
  .pn-reduce-motion .env, .pn-reduce-motion body.env-out .env{ transform:none; }
  /* reduced motion: the stamp just appears (its entrance is an animation, which reduced motion switches off) */
  @media (prefers-reduced-motion: reduce){ .tl-stamp.on{ animation:none; opacity:1; transform:translate(-50%,-50%) rotate(-6deg); } }
  .pn-reduce-motion .tl-stamp.on{ animation:none; opacity:1; transform:translate(-50%,-50%) rotate(-6deg); }
</style>
</head>
<body>
<div class="tl-stage" id="stage" aria-hidden="true"></div>
<div class="tl-scan"></div><div class="tl-vig"></div>
<div class="tl-head" id="head"></div>
<div class="tl-ret" id="ret"><i></i><i></i><i></i><i></i></div>
<div class="env back" aria-hidden="true">
  <div class="env-glow"></div>
  <svg viewBox="0 0 220 140"><rect x="1" y="1" width="218" height="138" rx="4" fill="#061a22" stroke="rgba(111,232,255,.55)" stroke-width="2"/><path d="M1 3L110 64L219 3" fill="none" stroke="rgba(111,232,255,.18)" stroke-width="1.5"/></svg>
  <div class="flap up" id="flapUp" hidden><svg viewBox="0 0 220 80"><path d="M2 1L110 78L218 1Z" fill="#0b2c38" stroke="#6fe8ff" stroke-width="2" stroke-linejoin="round"/></svg></div>
</div>
<div class="env front" id="env">
  <svg viewBox="0 0 220 140" aria-hidden="true"><path d="M1 1H219V135a4 4 0 0 1-4 4H5a4 4 0 0 1-4-4Z" fill="#0a2630" stroke="#6fe8ff" stroke-width="2" stroke-linejoin="round"/>
    <path d="M2 138L96 72M218 138L124 72" fill="none" stroke="rgba(111,232,255,.45)" stroke-width="1.5" stroke-linecap="round"/></svg>
  <div class="flap" id="flapDown" aria-hidden="true"><svg viewBox="0 0 220 80"><path d="M2 1L110 78L218 1Z" fill="#0d3340" stroke="#6fe8ff" stroke-width="2" stroke-linejoin="round"/></svg></div>
  <svg class="env-lock" viewBox="0 0 34 40" aria-hidden="true"><path d="M9 18V12a8 8 0 0 1 16 0v6" fill="none" stroke="#ff8a8a" stroke-width="3.2" stroke-linecap="round"/>
    <rect x="4" y="17" width="26" height="21" rx="3" fill="#3a0c12" stroke="#ff6b6b" stroke-width="2.4"/><circle cx="17" cy="25.5" r="2.6" fill="#ff8a8a"/><path d="M17 27.5v4.5" stroke="#ff8a8a" stroke-width="2.4" stroke-linecap="round"/></svg>
  <div class="env-name">building_plans.enc<small>ENCRYPTED ATTACHMENT</small></div>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/voice.js"></script>
<script src="../shared/mode.js"></script>
<script src="../shared/badges.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/glitch.js"></script>
<script>
(function(){
  "use strict";
  const PN = window.Primenet;
  const NEXT = "factor_vault.html";
  const SND = (n, a) => { if(window.PNSound) PNSound.play(n, a); };
  const speed = () => (window.PNTest ? PNTest.speed() : 1);
  const sleep = ms => new Promise(r => setTimeout(r, ms / speed()));
  const reduced = () => !!(PN && PN.reducedMotion && PN.reducedMotion());
  const M = PN ? PN.mission() : { target: "Rivercross Utilities", operation: "SILENT HERON", codename: "AGENT" };
  document.getElementById("bank").textContent = M.target;
  document.getElementById("head").innerHTML = `PRIMENET // INTERCEPTED EMAIL<br>OPERATION <b>${M.operation}</b><br>PLANS OF <b>${M.target.toUpperCase()}</b><br><em id="stat">EMAIL INTERCEPTED</em>`;
  if(PN) PN.log("target-locked", { target: M.target });

  // ---------- The scene: the target's three storeys (no plans inside), rising out of the intercepted email ----------
  const CYAN = 0x6fe8ff, RED = 0xff5a66;
  let rise = 0, ringK = 0, reveal = 0, tint = 0, crypt = 0;   // 0..1: out of the envelope; ground rings; floors appearing; gold; red encryption bands
  let anchor = () => ({ x: innerWidth / 2, y: innerHeight * .7 });   // where the building's base sits on screen (the envelope's opening)
  const floors = [];
  (function scene(){
    if(!window.THREE){ return nogl(); }
    let renderer;
    try{ renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); if(!renderer.getContext()) throw 0; }catch(e){ return nogl(); }
    const host = document.getElementById("stage");
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    host.appendChild(renderer.domElement);
    const sc = new THREE.Scene();
    const cam = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
    const W = 6, D = 4, H = 1.35;
    const line = (op = .9, c = CYAN) => new THREE.LineBasicMaterial({ color: c, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false });
    const world = new THREE.Group(); sc.add(world);
    const root = new THREE.Group(); world.add(root);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;   // same noise every time

    // --- The hologram: three storeys, each with soft red interference drifting across it ---
    function windows(w, d, h){
      const pts = [], rect = (a, b, c, e, f) => { // quad corners in 3D
        [[a, b], [b, c], [c, e], [e, a]].forEach(([p, q]) => pts.push(...p, ...q)); };
      const wh = h * .42, y0 = h * .3, y1 = y0 + wh;
      const face = (n, len, place) => { const gap = len / n; for(let i = 0; i < n; i++){ const x0 = -len / 2 + gap * i + gap * .22, x1 = x0 + gap * .56; place(x0, x1); } };
      face(6, w, (x0, x1) => { const z = d / 2 + .001; rect([x0, y0, z], [x1, y0, z], [x1, y1, z], [x0, y1, z]); rect([x0, y0, -z], [x1, y0, -z], [x1, y1, -z], [x0, y1, -z]); });
      face(4, d, (z0, z1) => { const x = w / 2 + .001; rect([x, y0, z0], [x, y0, z1], [x, y1, z1], [x, y1, z0]); rect([-x, y0, z0], [-x, y0, z1], [-x, y1, z1], [-x, y1, z0]); });
      const g = new THREE.BufferGeometry(); g.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3)); return g;
    }
    // A soft, blurry texture of broken horizontal noise lines (the "encrypted" look)
    const noiseTex = (() => {
      const c = document.createElement("canvas"); c.width = 256; c.height = 128; const x = c.getContext("2d");
      for(let i = 0; i < 26; i++){
        const y = rnd() * 128, th = 1 + rnd() * 3; x.fillStyle = `rgba(255,60,80,${.15 + rnd() * .45})`;
        for(let u = rnd() * 30; u < 256; u += 8 + rnd() * 40) x.fillRect(u, y, 6 + rnd() * 50, th);
      }
      const b = document.createElement("canvas"); b.width = 256; b.height = 128; const bx = b.getContext("2d");
      bx.filter = "blur(2px)"; bx.drawImage(c, 0, 0); bx.filter = "none"; bx.globalAlpha = .5; bx.drawImage(c, 0, 0);
      const t = new THREE.CanvasTexture(b); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
    })();
    // A wobbly red loop round a storey's walls, which drifts slowly up and fades in and out
    function fuzzLoop(w, d){
      const pts = [], cs = [[-w / 2, -d / 2], [w / 2, -d / 2], [w / 2, d / 2], [-w / 2, d / 2]];
      cs.forEach((p, i) => { const q = cs[(i + 1) % 4]; for(let s = 0; s < 14; s++){ const u = s / 14; pts.push(new THREE.Vector3(p[0] + (q[0] - p[0]) * u, (rnd() - .5) * .07, p[1] + (q[1] - p[1]) * u)); } });
      pts.push(pts[0].clone());
      return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), line(0, RED));
    }
    for(let i = 0; i < 3; i++){
      const f = new THREE.Group(); f.position.y = i * H;
      const bx = new THREE.BoxGeometry(W, H, D); bx.translate(0, H / 2, 0);
      const shell = new THREE.LineSegments(new THREE.EdgesGeometry(bx), line(.95));
      const glass = new THREE.Mesh(bx, new THREE.MeshBasicMaterial({ color: CYAN, transparent: true, opacity: .07, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      const win = new THREE.LineSegments(windows(W, D, H), line(.55));
      const tex = noiseTex.clone(); tex.needsUpdate = true; tex.repeat.set(2, 1); tex.offset.set(rnd(), rnd());
      const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, H * .9, 4, 1, true), new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
      sleeve.rotation.y = Math.PI / 4; sleeve.scale.set((W + .08) / Math.SQRT2, 1, (D + .08) / Math.SQRT2); sleeve.position.y = H / 2;
      const loops = [fuzzLoop(W + .1, D + .1), fuzzLoop(W + .14, D + .14)];
      f.add(glass, shell, win, sleeve, ...loops); root.add(f);
      floors.push({ g: f, mats: [shell.material, win.material, glass.material], base: [.95, .55, .07], sleeve, tex, loops, ph: i * .37 });
    }
    // Roof: parapet, plant rooms and an antenna
    const roof = new THREE.Group(); roof.position.y = 3 * H; root.add(roof);
    const addEdges = (geo, x, y, z, op) => { geo.translate(x, y, z); const l = new THREE.LineSegments(new THREE.EdgesGeometry(geo), line(op)); roof.add(l); return l; };
    const roofMats = [];
    roofMats.push(addEdges(new THREE.BoxGeometry(W + .12, .22, D + .12), 0, .11, 0, .9).material);
    roofMats.push(addEdges(new THREE.BoxGeometry(1.4, .6, 1.1), -1.5, .3, -.5, .7).material);
    roofMats.push(addEdges(new THREE.BoxGeometry(.9, .4, .9), 1.4, .2, .6, .7).material);
    const ant = new THREE.BufferGeometry(); ant.setAttribute("position", new THREE.Float32BufferAttribute([1.9, 0, -1.1, 1.9, 1.6, -1.1, 1.7, 1.2, -1.1, 2.1, 1.2, -1.1], 3));
    const antL = new THREE.LineSegments(ant, line(.8)); roof.add(antL); roofMats.push(antL.material);
    const beacon = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), new THREE.MeshBasicMaterial({ color: 0xff6b6b })); beacon.position.set(1.9, 1.62, -1.1); roof.add(beacon);
    // Ground: target rings (they fade in as the camera arrives)
    const rings = new THREE.Group(); world.add(rings);
    const ringMats = [4.6, 5.4, 6.4].map((r, k) => {
      const c = new THREE.BufferGeometry().setFromPoints(Array.from({ length: 97 }, (_, i) => { const a = i / 96 * Math.PI * 2; return new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r); }));
      const l = new THREE.Line(c, line(0)); rings.add(l); return [l.material, k === 0 ? .55 : .25];
    });

    const C1 = new THREE.Vector3(0, 4.2, 15.5), L1 = new THREE.Vector3(0, 2.1, 0);
    function size(){ const w = window.innerWidth, h = window.innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); placeEnv(); }
    cam.position.copy(C1); cam.lookAt(L1);
    anchor = () => { cam.updateMatrixWorld(); const v = new THREE.Vector3(0, 0, 0).project(cam); return { x: (v.x + 1) / 2 * innerWidth, y: (1 - v.y) / 2 * innerHeight }; };
    size(); window.addEventListener("resize", size);
    const cyan = new THREE.Color(CYAN), gold = new THREE.Color(0xffc94d), col = new THREE.Color();
    const ease = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const clamp = v => Math.max(0, Math.min(1, v));
    let last = performance.now(), t = 0, spin = 0;
    (function frame(now){
      const dt = Math.min(.1, (now - last) / 1000) * speed(), rm = reduced(); last = now; t += dt;
      world.rotation.y = .45;
      if(reveal > 0 && !rm) spin += dt * .32;
      root.rotation.y = spin; rings.rotation.y = rm ? 0 : -t * .15;
      // Out of the envelope: small, it rises from inside the pocket, then grows to full size
      const up = ease(clamp(rise / .6)), grow = ease(clamp((rise - .45) / .55));
      root.position.y = -1.9 * (1 - up); root.scale.setScalar(.4 + .6 * grow);
      ringMats.forEach(([m, op]) => { m.opacity = op * ringK; });
      col.copy(cyan).lerp(gold, tint * .55);
      floors.forEach((f, i) => {
        const k = Math.max(0, Math.min(1, reveal * 3 - i));   // bottom floor first
        f.g.scale.y = .001 + .999 * k; f.g.visible = k > 0;
        const flick = rm ? 1 : .9 + .1 * Math.sin(t * 2.3 + i * 2.1);   // a slow shimmer, not a flicker
        f.mats.forEach((m, j) => { m.opacity = f.base[j] * k * flick; if(m.color) m.color.copy(col); });
        // Encrypted: blurry red bands drift slowly across the walls, and two red lines rise and fade
        const c = crypt * k;
        if(!rm){ f.tex.offset.y -= dt * .045; f.tex.offset.x += dt * .012; }
        f.sleeve.material.opacity = c * (rm ? .55 : .5 + .2 * Math.sin(t * .8 + i * 2));
        f.loops.forEach((l, j) => {
          const u = rm ? .3 + j * .4 : (t * .09 + f.ph + j * .5) % 1;
          l.position.y = H * (.1 + .8 * u); l.material.opacity = c * (rm ? .5 : .75 * Math.sin(Math.PI * u));
        });
      });
      const rk = Math.max(0, Math.min(1, reveal * 3 - 2.6) / .4);
      roof.visible = rk > 0; roofMats.forEach(m => { m.opacity = .8 * rk; m.color.copy(col); });
      beacon.visible = rk > 0 && (rm || Math.sin(t * 3) > 0);
      renderer.render(sc, cam);
      requestAnimationFrame(frame);
    })(last);
  })();
  function nogl(){ const d = document.createElement("div"); d.className = "tl-nogl"; d.textContent = "HOLOGRAM OFFLINE"; d.style.top = "30%"; document.body.appendChild(d); placeEnv(); }
  // The envelope's opening sits where the building's base will be
  function placeEnv(){ const a = anchor(), r = document.documentElement.style; r.setProperty("--ex", Math.round(a.x) + "px"); r.setProperty("--ey", Math.round(a.y) + "px"); }

  // ---------- The cinematic ----------
  let left = false, watchH = null;
  function goOn(){
    if(left) return; left = true;
    if(watchH){ watchH.end(); watchH = null; }
    window.PNGlitch ? PNGlitch.go(NEXT) : (location.href = NEXT);
  }
  if(window.PNTest){
    PNTest.skip("Go to the Factor Vault", () => { goOn(); return "Going to the Factor Vault."; });
    PNTest.add("Go to the Factor Vault", () => { goOn(); });
  }
  function powerUpPrompt(title){
    const ov = document.createElement("div"); ov.className = "pn-powerup";
    ov.innerHTML = `<div>${title}<small>Press any key or click to continue</small></div>`;
    document.body.appendChild(ov);
    return () => ov.remove();
  }
  // Run fn(k) with k going 0..1 over ms (the test speed-up applies); reduced motion jumps straight to the end
  function tween(ms, fn, jump){
    if(jump){ fn(1); return Promise.resolve(); }
    const t0 = performance.now(), dur = ms / speed();
    return new Promise(res => (function f(now){ const k = Math.min(1, (now - t0) / dur); fn(k); if(k < 1 && !left) requestAnimationFrame(f); else { fn(1); res(); } })(t0));
  }
  const stat = t => { const e = document.getElementById("stat"); if(e) e.textContent = t; };
  // The flap swings open: the closed half (over the pocket, in front) then the open half (behind the hologram)
  function openFlap(ms){
    const dn = document.getElementById("flapDown"), up = document.getElementById("flapUp");
    const done = () => { dn.hidden = true; up.hidden = false; };
    if(reduced() || !dn.animate){ done(); return Promise.resolve(); }
    const half = ms / 2 / speed();
    return dn.animate([{ transform: "rotateX(0deg)" }, { transform: "rotateX(90deg)" }], { duration: half, easing: "ease-in", fill: "forwards" }).finished
      .then(() => { done(); return up.animate([{ transform: "rotateX(90deg)" }, { transform: "rotateX(180deg)" }], { duration: half, easing: "ease-out" }).finished; }).catch(() => done());
  }
  async function play(){
    await (window.PNSound ? PNSound.whenUnlocked(() => powerUpPrompt("OPEN THE INTERCEPTED EMAIL")) : Promise.resolve());
    if(window.PNMode) await PNMode.chapterCard(2, "Decrypt the plans");
    if(left) return;
    const rm = reduced(), body = document.body;
    watchH = window.PNMode ? PNMode.watch("Plans intercepted", { seconds: rm ? 8.2 : 10.7, onSkip: goOn }) : null;
    const ret = document.getElementById("ret"), stamp = document.getElementById("stamp");
    placeEnv();
    // 1. The intercepted email: an envelope with a padlock
    body.classList.add("env-in"); SND("data");
    await sleep(900);
    if(left) return;
    // 2. It opens (the padlock stays: the plans inside are still encrypted)
    stat("OPENING BUILDING_PLANS.ENC"); SND("latch");
    await openFlap(650);
    body.classList.add("env-lit");
    await sleep(rm ? 700 : 150);
    if(left) return;
    // 3. The hologram rises out of it, the envelope sinks away, and the building grows to full size
    SND("rise");
    setTimeout(() => { if(!left) body.classList.add("env-out"); }, (rm ? 0 : 1300) / speed());
    setTimeout(() => { if(!left){ ret.classList.add("on"); requestAnimationFrame(() => requestAnimationFrame(() => ret.classList.add("close"))); } }, (rm ? 0 : 1500) / speed());
    await tween(2500, k => { rise = k; reveal = Math.min(1, k / .45); }, rm);
    if(left) return;
    // 4. PLANS INTERCEPTED
    ret.classList.add("on", "close", "locked"); tint = 1;
    stamp.classList.add("on", "shake"); SND("lockon"); stat("PLANS INTERCEPTED");
    tween(900, k => { ringK = k; }, rm);
    await sleep(500);
    if(left) return;
    // 5. Each floor is scrambled red, and ORACLE explains
    SND("scanline", 1.1);
    if(window.PNHandler) PNHandler.say(PNStory.LINES.decrypt);
    await tween(900, k => { crypt = k; });
    if(left) return;
    stat("FLOOR PLANS ENCRYPTED");
    if(stamp.animate) stamp.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700 / speed(), fill: "forwards" });   // out of the way of the red floors and ORACLE's line
    const rows = [...document.querySelectorAll("#floors div")];
    for(const r of rows){ if(left) return; r.classList.add("on"); SND("chirp"); await sleep(280); }
    await sleep(rm ? 4200 : 4300);   // time to read (or hear) ORACLE's line
    goOn();
  }
  play();
})();
</script>
