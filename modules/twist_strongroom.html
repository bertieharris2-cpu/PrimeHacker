<!doctype html>
<html lang="en" class="phase-build">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Square Strongroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Factor Vault twist: the strongroom's floor is square. L1 builds squares, L2 tests tile counts, L3 finds side lengths */
  .layout{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; align-items:start; }
  .gridbox{ padding:16px; display:flex; flex-direction:column; gap:10px; align-items:center; }
  .dg{ display:grid; gap:2px; touch-action:none; user-select:none; cursor:crosshair; }
  .dg i{ width:var(--c); height:var(--c); background:rgba(var(--accent-rgb),.08); border:1px solid rgba(var(--accent-rgb),.25); }
  .dg i.sel{ background:rgba(var(--accent-rgb),.45); border-color:var(--accent); }
  .dg.bad i.sel{ background:rgba(255,107,107,.4); border-color:#ff6b6b; }
  .dg i.done{ background:rgba(255,201,77,.45); border-color:#ffc94d; }
  .read{ font-family:var(--font-mono); font-size:20px; min-height:1.4em; }
  .side{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .side .lab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); }
  .target{ font-family:var(--font-ui); font-size:44px; font-weight:700; color:var(--accent); line-height:1; }
  .target small{ display:block; font-size:14px; color:var(--text-muted); letter-spacing:.08em; font-weight:400; margin-top:4px; }
  .rooms{ display:flex; flex-direction:column; gap:4px; font-size:15px; color:var(--text-muted); }
  .rooms .ok{ color:#ffc94d; } .rooms .no{ color:#9fb7bb; }
  .answer{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .answer input{ width:80px; font-size:20px; text-align:center; padding:6px; }
  .answer[hidden], .gridbox[hidden], .strip[hidden]{ display:none; }
  /* L3: drag along a line to set the side length instead of typing it */
  .strip{ display:flex; flex-direction:column; gap:6px; }
  .strip .cells{ display:grid; grid-template-columns:repeat(20, 1fr); gap:1px; touch-action:none; user-select:none; cursor:crosshair; }
  .strip .cells i{ height:22px; background:rgba(var(--accent-rgb),.08); border:1px solid rgba(var(--accent-rgb),.25); }
  .strip .cells i.on{ background:rgba(255,201,77,.5); border-color:#ffc94d; }
  .strip .sr{ font-family:var(--font-mono); font-size:15px; color:var(--text-muted); }
  /* Step 2: the strongroom's pressure plates. The square-numbered plates are live */
  .find{ padding:16px; display:flex; flex-direction:column; gap:10px; }
  .find[hidden], .layout[hidden]{ display:none; }
  .find .tw-grid{ grid-template-columns:repeat(8, minmax(0,1fr)); }
  .find .tw-tile{ aspect-ratio:1.6; border-radius:3px; background:repeating-linear-gradient(45deg, rgba(8,26,31,.95) 0 6px, rgba(12,34,40,.95) 6px 12px); }
  .find .tw-tile.gold{ background:rgba(255,201,77,.25); }
  .steps{ display:flex; gap:6px; font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; }
  .steps span{ border:1px solid var(--line); padding:3px 8px; color:var(--text-faint); }
  .steps span.on{ color:var(--warning); border-color:var(--warning); }
  .steps span.done{ color:var(--ok); border-color:rgba(61,220,151,.5); }
  @media (max-width:820px){ .layout{ grid-template-columns:1fr; } }
  @media (max-width:560px){ .find .tw-grid{ grid-template-columns:repeat(5, minmax(0,1fr)); } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span class="steps"><span id="st1" class="on">1 · BUILD THE STRONGROOM</span><span id="st2">2 · FIND THE LIVE PLATES</span></span><span id="bar1">Room <b id="k">1</b> of <b id="of">4</b></span><span id="bar2" hidden>Live plates found: <b id="count">0</b> of <b id="total">0</b></span></div>
  <div class="layout" id="layout">
    <section class="pn-panel gridbox" id="gridbox"><div class="dg" id="dg"></div><div class="read" id="read">&nbsp;</div></section>
    <aside class="pn-panel side">
      <span class="lab">FLOOR TILES</span><div class="target" id="target"></div>
      <div class="answer" id="answer" hidden><label for="sideIn">Side length:</label><input class="pn-input" id="sideIn" inputmode="numeric" maxlength="3"><button class="pn-btn small primary" type="button" id="sideBtn">Check</button></div>
      <div class="strip" id="strip" hidden><span class="lab">OR DRAG ALONG ONE SIDE</span><div class="cells" id="cells"></div><span class="sr" id="stripRead">&nbsp;</span></div>
      <button class="pn-btn small" type="button" id="noBtn" hidden>It can't be a square</button>
      <span class="lab">STRONGROOMS</span><div class="rooms" id="rooms"></div>
    </aside>
  </div>
  <section class="pn-panel find" id="find" hidden><div class="tw-grid" id="plates"></div></section>
  <div class="tw-msg" id="msg" aria-live="polite"></div>
</main>

<script src="../shared/sound.js"></script>
<script src="../shared/story.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.peekLevel();
  // Feedback round 8: square channels and the strongroom are one task. Step 1 builds squares, step 2 spots them.
  const GOALS = {
    L1: "Drag out a <b>square</b> room that uses exactly the number of tiles shown.",
    L2: "Can these tiles make a <b>square</b> room? Build it, or say it can't be done.",
    L3: "Give the square room's <b>side length</b>, or say it can't be a square.",
  };
  const GOAL2 = "The pressure plates with <b>square numbers</b> are live. Find every one.";
  T.init({ id: "strongroom", stage: "FACTOR VAULT", title: "SQUARE STRONGROOM", goal: GOALS[L],
    example: "16 tiles make a 4 × 4 square room. 12 tiles can't: 3 × 3 = 9 is too few and 4 × 4 = 16 too many.",
    story: `${T.targets()} strongroom has a square floor: the same number of tiles along every side. Work out its size, then we'll find its alarm plates.` });
  // Tile counts per level
  const SETS = {
    L1: () => T.shuffle([9, 16, 25, 36]).slice(0, 3),
    L2: () => T.shuffle([...T.shuffle([36, 49, 64, 81]).slice(0, 2), ...T.shuffle([40, 45, 50, 60, 72, 30]).slice(0, 2)]),
    L3: () => T.shuffle([...T.shuffle([121, 144, 169, 196, 225, 256, 289, 324]).slice(0, 2), ...T.shuffle([120, 150, 200, 250, 300, 180]).slice(0, 2)]),
  };
  const counts = SETS[L]();
  $("of").textContent = counts.length;
  let k = 0, over = false, right = 0;
  const alarm = T.alarm(3, () => end(false));
  const SIZE = 10;
  const dg = $("dg"), read = $("read");
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  function buildGrid(){
    const c = Math.max(22, Math.min(38, Math.floor(420 / SIZE)));
    dg.style.gridTemplateColumns = `repeat(${SIZE}, ${c}px)`; dg.style.setProperty("--c", c + "px");
    dg.innerHTML = Array.from({ length: SIZE * SIZE }, (_, i) => `<i data-r="${Math.floor(i / SIZE)}" data-c="${i % SIZE}"></i>`).join("");
  }
  function show(){
    const n = counts[k];
    $("k").textContent = k + 1; $("target").innerHTML = `${n}<small>tiles</small>`;
    read.innerHTML = "&nbsp;"; buildGrid();
    $("gridbox").hidden = L === "L3"; $("answer").hidden = L !== "L3"; $("noBtn").hidden = L === "L1"; $("strip").hidden = L !== "L3";
    $("cells").querySelectorAll("i").forEach(i => i.classList.remove("on")); $("stripRead").innerHTML = "&nbsp;";
    if(L === "L3"){ $("sideIn").value = ""; $("sideIn").focus(); }
  }
  function next(ok, n, side){
    $("rooms").insertAdjacentHTML("beforeend", side ? `<span class="ok">${n} tiles: ${side} × ${side} ✓</span>` : `<span class="no">${n} tiles: not square</span>`);
    if(ok) right++;
    k++;
    if(k === counts.length) return setTimeout(() => { if(!over) step2(); }, 900);
    setTimeout(() => { if(!over) show(); }, 900 / (window.PNTest ? PNTest.speed() : 1));
  }
  const between = n => { const r = Math.floor(Math.sqrt(n)); return `${r} × ${r} = ${r * r} and ${r + 1} × ${r + 1} = ${(r + 1) * (r + 1)}`; };
  // Dragging a room (L1 and L2)
  let anchor = null, cur = null;
  const cellFrom = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentElement === dg ? { r: +t.dataset.r, c: +t.dataset.c } : null; };
  function paint(){
    const r0 = Math.min(anchor.r, cur.r), r1 = Math.max(anchor.r, cur.r), c0 = Math.min(anchor.c, cur.c), c1 = Math.max(anchor.c, cur.c), h = r1 - r0 + 1, w = c1 - c0 + 1;
    dg.querySelectorAll("i").forEach(i => { const r = +i.dataset.r, c = +i.dataset.c; i.classList.toggle("sel", r >= r0 && r <= r1 && c >= c0 && c <= c1); });
    dg.classList.toggle("bad", h !== w || h * w > counts[k]);
    read.textContent = `${h} × ${w} = ${h * w}`;
    return { h, w };
  }
  dg.addEventListener("pointerdown", e => { if(over) return; const c = cellFrom(e); if(!c) return; e.preventDefault(); dg.setPointerCapture(e.pointerId); anchor = cur = c; paint(); T.SND("tag"); });
  dg.addEventListener("pointermove", e => { if(!anchor) return; const c = cellFrom(e); if(c && (c.r !== cur.r || c.c !== cur.c)){ cur = c; paint(); T.SND("plot"); } });
  dg.addEventListener("pointerup", () => {
    if(!anchor) return;
    const { h, w } = paint(); anchor = cur = null;
    const n = counts[k];
    if(h !== w){ say(`${h} × ${w} isn't square: the sides must match.`, "warn"); T.SND("untag"); return; }
    if(h * w !== n){ say(`${h} × ${h} = ${h * h}. You need ${n} tiles.`, "warn"); T.SND("untag"); return; }
    dg.querySelectorAll("i.sel").forEach(i => { i.classList.remove("sel"); i.classList.add("done"); });
    T.SND("correct", k); say(`${h} × ${h} = ${n}. A square strongroom.`, "ok");
    next(true, n, h);
  });
  $("noBtn").addEventListener("click", () => {
    if(over) return;
    const n = counts[k];
    if(T.isSquare(n)){ const r = Math.sqrt(n); say(`It can: ${r} × ${r} = ${n}.`, "bad"); alarm.hit(); if(!over && L !== "L1") next(false, n, r); return; }
    T.SND("correct", k); say(`Right: ${between(n)}, so ${n} sits between two square numbers.`, "ok");
    next(true, n, 0);
  });
  $("sideBtn").addEventListener("click", () => {
    if(over) return;
    const n = counts[k], v = parseInt($("sideIn").value, 10);
    if(!Number.isInteger(v)){ say("Type a side length, or press \"It can't be a square\".", "warn"); return; }
    if(v * v === n){ T.SND("correct", k); say(`${v} × ${v} = ${n}. Side length ${v}.`, "ok"); return next(true, n, v); }
    say(T.isSquare(n) ? `${v} × ${v} = ${v * v}, not ${n}.` : `${v} × ${v} = ${v * v}. In fact ${n} isn't square: ${between(n)}.`, "bad");
    alarm.hit();
  });
  $("sideIn").addEventListener("keydown", e => { if(e.key === "Enter") $("sideBtn").click(); });
  // The side-length strip: drag along it, and the length goes in the box
  (function strip(){
    const cells = $("cells"); cells.innerHTML = Array.from({ length: 20 }, (_, i) => `<i data-i="${i}"></i>`).join("");
    let dragging = false;
    const set = len => { cells.querySelectorAll("i").forEach(i => i.classList.toggle("on", +i.dataset.i < len)); $("sideIn").value = len; $("stripRead").textContent = `side ${len}: ${len} × ${len} = ${len * len} tiles`; };
    const at = e => { const t = document.elementFromPoint(e.clientX, e.clientY); return t && t.parentElement === cells ? +t.dataset.i + 1 : null; };
    cells.addEventListener("pointerdown", e => { const v = at(e); if(!v) return; e.preventDefault(); dragging = true; cells.setPointerCapture(e.pointerId); set(v); T.SND("plot"); });
    cells.addEventListener("pointermove", e => { if(!dragging) return; const v = at(e); if(v) set(v); });
    cells.addEventListener("pointerup", () => { dragging = false; });
  })();
  // Step 2: the floor's pressure plates. Plates numbered with a square number are wired to the alarm.
  let plates = [], liveList = [], found = 0;
  function step2(){
    $("layout").hidden = true; $("find").hidden = false; $("bar1").hidden = true; $("bar2").hidden = false;
    $("st1").className = "done"; $("st2").className = "on";
    T.setGoal(GOAL2);
    if(L === "L1") plates = T.range(1, 48);
    else {
      const hi = L === "L2" ? 150 : 400, lo = L === "L2" ? 40 : 100;
      const sq = T.shuffle(T.range(1, 20).map(k => k * k).filter(n => n >= lo && n <= hi)).slice(0, L === "L2" ? 5 : 6);
      const near = new Set(); sq.forEach(n => { near.add(n - 1); near.add(n + 1); near.add(n + 2); });
      T.range(lo, hi).filter(n => n % 10 === 0).forEach(n => near.add(n));
      const decoys = T.shuffle([...near].filter(n => n >= lo && n <= hi && !T.isSquare(n))).slice(0, 24 - sq.length);
      plates = T.shuffle([...sq, ...decoys]);
    }
    liveList = plates.filter(T.isSquare);
    $("total").textContent = liveList.length;
    const grid = $("plates");
    grid.innerHTML = plates.map(n => `<button type="button" class="tw-tile" data-n="${n}">${n}</button>`).join("");
    grid.addEventListener("click", e => { const b = e.target.closest(".tw-tile"); if(b) tap(+b.dataset.n); });
    // The squares they built in step 1 are already known
    counts.filter(n => T.isSquare(n) && plates.includes(n)).forEach(n => lockIn(n, true));
    T.say("Room mapped. Now the plates: every square-numbered plate is live. Find them all.");
    say(found ? "The squares you built are already marked. Find the rest." : "Tap a plate with a square number.");
  }
  const plate = n => $("plates").querySelector(`[data-n="${n}"]`);
  function lockIn(n, quiet){
    const r = Math.sqrt(n), b = plate(n);
    b.classList.add("gold"); b.innerHTML = `${n}<small>${r}×${r}</small>`; b.disabled = true;
    found++; $("count").textContent = found;
    if(!quiet){ T.SND("correct", found); say(`${n} = ${r} × ${r}. Live plate marked.`, "ok"); }
    if(found === liveList.length) setTimeout(() => end(true), 500);
  }
  function tap(n){
    if(over) return;
    const b = plate(n); if(b.disabled) return;
    if(T.isSquare(n)) return lockIn(n);
    b.classList.add("bad"); setTimeout(() => b.classList.remove("bad"), 900);
    say(`${n} isn't square: ${between(n)}, so no number times itself makes ${n}.`, "bad");
    alarm.hit();
  }
  function end(ok){
    over = true;
    liveList.forEach(n => { const b = plate(n); if(b && !b.classList.contains("gold")) b.classList.add("missed"); });
    const sqs = [...new Set([...counts, ...liveList])].filter(T.isSquare).sort((a, b) => a - b);
    T.finish({ ok, title: ok ? "STRONGROOM MAPPED" : "ALARM TRIPPED",
      lines: [`Rooms right: <b>${right}</b> of ${counts.length}`, liveList.length ? `Live plates found: <b>${found}</b> of ${liveList.length}` : "The plates weren't reached.",
        `Square numbers: ${sqs.slice(0, 8).map(n => `${n} = ${Math.sqrt(n)} × ${Math.sqrt(n)}`).join(", ")}`,
        counts.some(n => !T.isSquare(n)) ? `Not square: ${counts.filter(n => !T.isSquare(n)).sort((a, b) => a - b).join(", ")}` : "A square number is a number times itself."] });
    T.say(ok ? "Strongroom mapped and every live plate marked. We can walk straight across." : "Too many wrong guesses. Let's rethink.");
  }
  show();
  if(window.PNTest) PNTest.skip("Solve this step", () => {
    if(!$("find").hidden){ liveList.forEach(n => { if(!plate(n).disabled) lockIn(n); }); return; }
    const n = counts[k]; if(n === undefined) return;
    if(T.isSquare(n)){ if(L === "L3"){ $("sideIn").value = Math.sqrt(n); $("sideBtn").click(); } else { dg.querySelectorAll("i").forEach(i => { if(+i.dataset.r < Math.sqrt(n) && +i.dataset.c < Math.sqrt(n)) i.classList.add("done"); }); next(true, n, Math.sqrt(n)); } }
    else $("noBtn").click();
  });
})();
</script>
</body>
</html>
