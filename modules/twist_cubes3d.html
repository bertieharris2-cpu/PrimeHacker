<!doctype html>
<html lang="en" class="phase-hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Ceiling Relays (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* Round 12 prototype: the ceiling relays on the student's own floor in 3D. Each cube sends electricity
     through the ceiling to a room; with every relay powered, the floor (and the blueprint) goes dark.
     Round 14 (Bertie): the floor is large on the left and the relay is built on the right, by dragging.
     ?mode=A (default) stacks square layers on a pallet; ?mode=B sorts cube crates off a conveyor belt. */
  main.tw{ width:min(1500px,100%); }
  .layout{ display:grid; grid-template-columns:minmax(0,1.3fr) minmax(400px,1fr); gap:16px; align-items:start; }
  .left, .side{ display:flex; flex-direction:column; gap:10px; min-width:0; }
  .stage3d{ position:relative; height:clamp(440px, calc(100vh - 300px), 640px); padding:0; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, rgba(20,60,70,.35), rgba(2,8,10,.9)); }
  .stage3d .hud{ position:absolute; left:12px; top:10px; font-family:var(--font-ui); font-size:12px; letter-spacing:.18em; color:#ffe14d; pointer-events:none; text-shadow:0 0 8px rgba(0,0,0,.8); }
  .stage3d .hud b{ font-size:18px; }
  .stage3d .cam{ position:absolute; right:12px; top:10px; font-family:var(--font-ui); font-size:11px; letter-spacing:.2em; color:rgba(160,240,255,.7); pointer-events:none; }
  .stage3d .cam i{ font-style:normal; color:#ff6b8a; }
  /* A line of light sweeps down the viewer when a relay powers (once, slowly: nothing flashes) */
  .stage3d .scan{ position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg, transparent, #bff7ff 30%, #bff7ff 70%, transparent); box-shadow:0 0 16px #8feaff; opacity:0; pointer-events:none; }
  .stage3d .scan.go{ animation:scanDown .8s linear 1; }
  @keyframes scanDown{ 0%{ top:0; opacity:.9; } 100%{ top:100%; opacity:0; } }
  .stage3d .blackout{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-ui); font-weight:700; letter-spacing:.3em; font-size:clamp(22px,4vw,40px); color:#ff4f6d; text-shadow:0 0 24px rgba(255,60,90,.8); opacity:0; pointer-events:none; transition:opacity .6s; }
  .stage3d .blackout.on{ opacity:1; }
  .log{ display:flex; flex-wrap:wrap; gap:6px; font-size:14px; color:var(--text-muted); min-height:1.6em; align-items:center; }
  .log .lab{ margin-right:4px; }
  .log span.r{ border:1px solid rgba(255,201,77,.35); padding:3px 9px; background:rgba(255,201,77,.06); } .log b{ color:#fff3cf; }
  .table{ font-size:14px; color:var(--text-muted); border-top:1px solid var(--line); padding-top:8px; }
  [hidden]{ display:none !important; }
  .steps{ display:flex; gap:6px; font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; }
  .steps span{ border:1px solid var(--line); padding:3px 8px; color:var(--text-faint); }
  .steps span.on{ color:var(--warning); border-color:var(--warning); }
  .steps span.done{ color:var(--ok); border-color:rgba(61,220,151,.5); }
  .lab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); }
  .need{ font-family:var(--font-ui); font-size:19px; } .need b{ color:var(--accent); font-size:28px; }
  .count{ font-family:var(--font-mono); font-size:22px; min-height:1.5em; } .count b{ color:var(--warning); } .count small{ font-size:14px; color:var(--text-faint); }
  /* Cube notation, the same everywhere: 3³ with the small 3 bright so it stands out (Bertie, round 15) */
  .cu{ font-family:var(--font-ui); font-weight:700; color:var(--warning); white-space:nowrap; }
  .cu sup{ font-size:.72em; line-height:0; color:#ffe14d; text-shadow:0 0 12px rgba(255,225,77,.9); }
  /* The reveal: when the stack locks, the finished cube lifts off the pallet, turns once in the middle of the panel and is named */
  .reveal{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:16px; border-radius:inherit; background:radial-gradient(ellipse at 50% 42%, rgba(18,54,64,.985), rgba(3,10,13,.99)); opacity:0; transition:opacity .4s; }
  .reveal.on{ opacity:1; }
  .rv-cube{ width:min(62%, 250px); height:auto; filter:drop-shadow(0 0 16px rgba(255,201,77,.5)); transition:transform .65s cubic-bezier(.2,.9,.3,1); }
  .rv-cube polygon{ stroke:#ffe7a8; stroke-width:1.2; stroke-linejoin:round; } .rv-cube line{ stroke:#ffe7a8; stroke-width:.8; opacity:.8; }
  .rv-eq{ display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:2px 14px; font-family:var(--font-mono); font-size:clamp(22px, 2.2vw, 30px); color:#fff3cf; text-align:center; }
  .rv-eq b{ color:var(--warning); }
  .rv-eq .pw{ opacity:0; transform:scale(.6); transition:opacity .3s, transform .45s cubic-bezier(.2,1.2,.3,1); }
  .rv-eq .cu{ font-size:1.55em; }
  .reveal.named .rv-eq .pw{ opacity:1; transform:none; }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .answer{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:17px; }
  .answer input{ width:80px; font-size:20px; text-align:center; padding:6px; }
  /* Mode A: the pallet. An isometric grid to draw a square layer on, and the stack that grows on it. */
  .pallet{ padding:14px; display:flex; flex-direction:column; gap:10px; }
  .pal{ display:block; width:100%; height:auto; touch-action:none; user-select:none; }
  .pal .cell{ fill:rgba(var(--accent-rgb),.07); stroke:rgba(var(--accent-rgb),.38); stroke-width:1; cursor:crosshair; }
  .pal .cell.sel{ fill:rgba(255,201,77,.45); stroke:#ffc94d; }
  .pal.bad .cell.sel{ fill:rgba(255,107,107,.4); stroke:#ff6b6b; }
  .pal.taken .cell{ cursor:default; }
  .slab polygon{ stroke:#ffe7a8; stroke-width:1; } .slab line{ stroke:#ffe7a8; stroke-width:.7; opacity:.8; }
  .pal .slab{ pointer-events:none; } .pal .slab.top{ pointer-events:auto; cursor:grab; } .pal.l3 .slab.top{ pointer-events:none; }
  .pal.locked .slab polygon{ stroke:#ffffff; filter:drop-shadow(0 0 6px rgba(255,225,120,.9)); }
  .pal .plab{ font:700 12px var(--font-ui); letter-spacing:.18em; fill:rgba(235,255,248,.45); }
  .trayRow{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; min-height:54px; }
  .tray{ cursor:grab; touch-action:none; user-select:none; display:inline-block; padding:4px 6px; border:1px dashed rgba(255,201,77,.45); }
  .tray svg{ display:block; }
  #trayWrap{ display:flex; flex-direction:column; gap:4px; }
  .ghost{ position:fixed; z-index:9000; pointer-events:none; transform:translate(-50%,-60%); filter:drop-shadow(0 0 10px rgba(255,201,77,.7)); opacity:.9; }
  .ghost.over{ opacity:1; }
  /* Mode B: the conveyor belt into the transformer bay */
  .belt{ padding:14px; display:flex; flex-direction:column; gap:12px; }
  .belt svg{ display:block; width:100%; height:auto; }
  .belt .band{ fill:#0b1d22; stroke:#2c4c55; }
  .belt .dash{ stroke:#2fbf8a; stroke-width:3; stroke-dasharray:16 14; opacity:.55; }
  .belt .bay{ fill:rgba(255,179,71,.14); stroke:#ffb347; stroke-dasharray:5 4; }
  .belt .gate{ stroke:#ffe14d; stroke-width:2; opacity:.7; }
  .belt .blab{ font:700 11px var(--font-ui); letter-spacing:.18em; fill:rgba(235,255,248,.6); }
  .crate .f{ fill:#173840; stroke:#8feaff; stroke-width:1.5; } .crate .t{ fill:#2a5a66; stroke:#8feaff; } .crate .s{ fill:#0f2a31; stroke:#8feaff; }
  .crate text{ font:700 26px var(--font-mono); fill:#fff; text-anchor:middle; dominant-baseline:central; }
  .crate.front .f{ stroke:#ffc94d; stroke-width:3; }
  .crate.held .f{ fill:#2a3a2a; }
  .decide{ display:flex; flex-direction:column; gap:10px; }
  .decide .big{ font-family:var(--font-ui); font-size:20px; min-height:1.4em; } .decide .big b{ font-size:30px; color:var(--accent); }
  .decide .row .pn-btn{ flex:1; font-size:15px; padding:14px 10px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chips button{ font-family:var(--font-mono); font-size:26px; padding:8px 18px; } .chips sup{ font-size:.6em; }
  .chips button.bad{ border-color:var(--danger); color:var(--danger); }
  .board{ padding:16px; }
  .spot .tw-grid{ grid-template-columns:repeat(4, minmax(0,1fr)); }
  @media (max-width:1240px){ .stage3d .cam{ top:30px; } }   /* a narrow stage: the camera label drops under the HUD line instead of over it */
  @media (max-width:980px){ .layout{ grid-template-columns:1fr; } .stage3d{ height:420px; } .stage3d .cam{ top:10px; } }
  /* Two columns: the controls are on the right, so ORACLE's panel docks bottom left, over the floor view, never over a button */
  @media (min-width:981px){ body .pnh{ right:auto; left:18px; } }
  @media (prefers-reduced-motion: reduce){ .stage3d .scan.go{ animation:none; } }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span class="steps"><span id="st1" class="on">1 · CUBE RELAYS</span><span id="st2">2 · RELAY BOARD</span></span><span>Relays powered: <b id="count">0</b> of <b id="total">0</b></span></div>
  <div class="layout">
    <div class="left">
      <section class="pn-panel stage3d" id="stage"><div class="hud">CEILING OF <span id="floorName">THE TARGET FLOOR</span> · TRANSFORMER LOAD <b id="hudN">0</b> / <b id="hudT">0</b> ROOMS</div><div class="cam"><i>●</i> CAM 1 · CEILING</div><div class="scan" id="scan"></div><div class="blackout" id="blackout">BLACKOUT</div></section>
      <div class="log" id="log"><span class="lab">RELAY LOG</span></div>
      <div class="table" id="table" hidden></div>
    </div>
    <div class="side">
      <div class="tw-msg" id="msg" aria-live="polite"></div>
      <section class="pn-panel pallet" id="pallet" hidden>
        <div class="need" id="needLine"></div>
        <div class="answer" id="rootRow" hidden><label for="rootIn">Blocks along each side</label><input class="pn-input" id="rootIn" inputmode="numeric" maxlength="2"><button class="pn-btn small primary" type="button" id="rootBtn">Check</button><button class="pn-btn small" type="button" id="noCube">It can't be a cube</button></div>
        <svg class="pal" id="pal" aria-label="The pallet"></svg>
        <div class="trayRow"><div id="trayWrap" hidden><span class="lab">SPARE LAYER · DRAG IT ONTO THE STACK</span><div class="tray" id="tray"></div></div><div class="count" id="countLine"></div></div>
        <div class="row" id="buildRow"><button class="pn-btn small" type="button" id="addBtn" disabled>Add a layer</button><button class="pn-btn small" type="button" id="unstackBtn" disabled>Take one off</button><button class="pn-btn small" type="button" id="clearBtn" disabled>Clear the pallet</button><button class="pn-btn small primary" type="button" id="lockBtn">Power the relay</button></div>
      </section>
      <section class="pn-panel belt" id="beltPanel" hidden>
        <svg id="beltSvg" viewBox="0 0 560 262" aria-label="The conveyor belt"></svg>
        <div class="decide">
          <div class="big" id="crateLine">Waiting for the first crate.</div>
          <div class="row"><button class="pn-btn primary" type="button" id="loadBtn" disabled>Load it: a cube number</button><button class="pn-btn" type="button" id="rejBtn" disabled>Reject: not a cube</button></div>
          <div id="rootQ" hidden><div class="lab" id="rootQLab"></div><div class="chips" id="chips"></div><div class="answer" id="rootRowB" hidden><label for="rootInB">Blocks along each side</label><input class="pn-input" id="rootInB" inputmode="numeric" maxlength="2"><button class="pn-btn small primary" type="button" id="rootBtnB">Check</button></div></div>
        </div>
      </section>
      <section class="pn-panel board spot" id="spot" hidden><div class="tw-grid" id="grid"></div></section>
    </div>
  </div>
</main>

<script src="../shared/vendor/three.min.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script src="../shared/testtools.js"></script>
<script src="../shared/handler.js"></script>
<script src="../shared/twist.js"></script>
<script src="../shared/floor3d.js"></script>
<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = T.peekLevel();
  const MODE = new URLSearchParams(location.search).get("mode") === "B" ? "B" : "A";
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(r => setTimeout(r, ms / sp()));
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.contains("pn-reduce-motion");
  // Runs when the brief first folds away. (The brief zooms open by itself a moment after load, so "is it open now?" is no guide.)
  const afterBrief = fn => window.addEventListener("pn-brief", function f(e){ if(e.detail.open) return; window.removeEventListener("pn-brief", f); fn(); });
  const GOALS = {
    A: { L1: "Build each relay as a <b>cube</b>: drag a <b>square layer</b> on the pallet, then stack layers until the count matches.",
         L2: "Build each relay as a <b>cube</b>: drag a <b>square layer</b> on the pallet, then stack layers until the count matches.",
         L3: "Give each relay's <b>cube root</b>: how many blocks along each side. Or say it can't be a cube." },
    B: { L1: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and say which cube each one is.",
         L2: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and say which cube each one is.",
         L3: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and give each one's <b>cube root</b>." },
  };
  const GOAL2 = "Tap every <b>cube number</b> on the relay board. Each one powers another room.";
  T.init({ id: "cubes3d", stage: "BLUEPRINT", title: "CEILING RELAYS", goal: GOALS[MODE][L],
    context: "Every light on this floor runs back to one transformer.",
    example: "<b>27 = 3³</b>, a cube number: 3 blocks along each side and 3 layers, 3 × 3 × 3 = 27. The small ³ means three of that number multiplied together.",
    story: `This is the target floor of ${T.target()}. Every room's lights and cameras run back to one transformer. Wire each room in with a cube-number relay, then overload it: the whole floor blacks out.` });
  $("st1").textContent = MODE === "B" ? "1 · LOAD THE CRATES" : "1 · STACK THE RELAYS";

  // ----- The 3D floor: the student's own weak floor -----
  const F = PNFloor3D.create($("stage"), {});
  const TH = F.THREE;
  const a0 = window.Primenet && Primenet.getAgent();
  $("floorName").textContent = (a0 && a0.weakFloor ? a0.weakFloor : "FLOOR N=" + F.n).toUpperCase();
  // Camera: HOME frames the floor and the transformer; the page opens on a fly-in from FAR once the brief folds away
  const HOME = { pos: new TH.Vector3(-4, 150, 166), look: new TH.Vector3(-14, 0, 4) };
  const FAR = { pos: new TH.Vector3(-90, 300, 360), look: new TH.Vector3(-14, 0, 4) };
  F.look.copy(HOME.look);
  F.lightsOn(1000);
  F.setSpin(0.0005);
  afterBrief(() => { if(!REDUCE){ T.SND("whoosh"); F.flyTo(HOME, 1800).then(() => { if(!camBusy && !over) atHome = true; }); } });
  // Round 12 feedback: wiring. One transformer outside the wall; a cable from it to each room's lights runs
  // along the ceiling in straight lines. Each cube number wires a room in; with every room on it, it overloads.
  const CY = F.H + 1.6, TX = -F.PLATE / 2 - 10;
  const tr = new TH.Mesh(new TH.BoxGeometry(9, 14, 9), new TH.MeshStandardMaterial({ color: 0xffb347, emissive: 0x663300, emissiveIntensity: 0.6 })); tr.position.set(TX, 7, 0); F.root.add(tr);
  const trTop = new TH.Mesh(new TH.CylinderGeometry(1.2, 1.2, 4, 10), new TH.MeshBasicMaterial({ color: 0xdddddd })); trTop.position.set(TX, 16, 0); F.root.add(trTop);
  const cables = F.rooms.map((r, i) => {
    const lane = -F.PLATE / 2 + 3 + (i % 5) * 1.2;   // a bundle along the west wall, branching off to each room
    const pts = [new TH.Vector3(TX, 14, 0), new TH.Vector3(TX, CY, 0), new TH.Vector3(lane, CY, 0), new TH.Vector3(lane, CY, r.z), new TH.Vector3(r.x, CY, r.z)];
    const geo = new TH.BufferGeometry().setFromPoints(pts), mat = new TH.LineDashedMaterial({ color: 0x4a5a5e, dashSize: 2, gapSize: 1.5 });
    const line = new TH.Line(geo, mat); line.computeLineDistances(); F.root.add(line);
    const plug = new TH.Mesh(new TH.BoxGeometry(3, 1.4, 3), new TH.MeshBasicMaterial({ color: 0x3a4a4e })); plug.position.set(r.x, CY, r.z); F.root.add(plug);
    return { pts, line, plug, room: r, wired: 0 };
  });
  $("hudT").textContent = cables.length;
  // Cameras: red lights on the floor corners (a slow blink, well under 1 Hz)
  const cams = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => { const m = new TH.Mesh(new TH.SphereGeometry(1.8, 10, 10), new TH.MeshBasicMaterial({ color: 0xff3355 })); m.position.set(sx * (F.PLATE / 2 - 3), F.H - 2, sz * (F.PLATE / 2 - 3)); F.root.add(m); return m; });
  F.onTick(now => cams.forEach((c, i) => { if(!c.userData.off) c.material.color.setHex(Math.sin(now / 320 + i) > 0 ? 0xff3355 : 0x661122); }));
  // Round 15 (Bertie): the floor must never be cut off at the sides of its panel. HOME keeps its direction, but its
  // distance is worked out from the floor's bounds: the plate, every room and the transformer. The floor spins slowly,
  // so the bounds are taken as a drum round the spin axis (the widest sweep at any angle), and the camera backs off
  // until the drum's rim fits both the vertical and the horizontal view with a margin. Done once now and on every resize.
  const fit = (() => {
    const spin0 = F.root.rotation.y; F.root.rotation.y = 0; F.root.updateMatrixWorld(true);
    const box = new TH.Box3().setFromObject(F.root); F.root.rotation.y = spin0;
    const rim = Math.hypot(Math.max(-box.min.x, box.max.x), Math.max(-box.min.z, box.max.z));
    const samples = [];
    for(let k = 0; k < 36; k++){ const a = k / 36 * Math.PI * 2; samples.push(new TH.Vector3(rim * Math.cos(a), box.min.y, rim * Math.sin(a)), new TH.Vector3(rim * Math.cos(a), box.max.y, rim * Math.sin(a))); }
    const dir = HOME.pos.clone().sub(HOME.look).normalize();   // from the look point out to the camera: the direction never changes
    const fwd = dir.clone().negate(), right = fwd.clone().cross(new TH.Vector3(0, 1, 0)).normalize(), up = right.clone().cross(fwd).normalize();
    const MIN = 190;   // never closer than this, however wide the panel
    return () => {
      const st = $("stage"), w = st.clientWidth, h = st.clientHeight; if(!w || !h) return;
      const tanV = Math.tan(F.camera.fov / 2 * Math.PI / 180), tanH = tanV * (w / h);
      let d = MIN;
      samples.forEach(q => {
        const rel = q.clone().sub(HOME.look), along = rel.dot(dir), v = rel.dot(up), x = Math.abs(rel.dot(right));
        d = Math.max(d, x / (tanH * 0.92) + along, (v > 0 ? v / (tanV * 0.80) : -v / (tanV * 0.92)) + along);   // extra room at the top, under the HUD line
      });
      HOME.pos.copy(HOME.look).addScaledVector(dir, d);
      if(atHome) F.camera.position.copy(HOME.pos);
    };
  })();
  let atHome = REDUCE;   // true while the camera rests at HOME, so a resize can move it straight there
  fit();
  F.camera.position.copy(REDUCE ? HOME.pos : FAR.pos);
  new ResizeObserver(fit).observe($("stage"));

  const cubeRoot = n => Math.round(Math.cbrt(n));
  const cu = a => `<span class="cu">${a}<sup>3</sup></span>`;   // 3³, styled the same everywhere
  const STEP1 = { L1: () => [8, 27, 64], L2: () => T.shuffle([27, 64, 125]), L3: () => T.shuffle([...T.shuffle([216, 343, 512, 729, 1000]).slice(0, 3), T.pick([100, 200, 300, 400, 500])]) };
  const s1 = STEP1[L]();
  const BOARD = { L1: { max: 70, size: 16 }, L2: { max: 130, size: 20 }, L3: { max: 1000, size: 24 } }[L];
  const s2all = T.range(1, 10).map(k => k ** 3).filter(c => c <= BOARD.max && !(L === "L3" && c < 8));
  const s2 = L === "L3" ? T.shuffle(s2all).slice(0, 6) : s2all;
  const RELAYS = [...s1.filter(T.isCube), ...s2];
  $("total").textContent = RELAYS.length;

  let found = 0, over = false, camBusy = false;
  const alarm = T.alarm(3, () => end(false));
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  const between = n => { let a = 1; while((a + 1) ** 3 <= n) a++; return `${a} × ${a} × ${a} = ${a ** 3} and ${a + 1} × ${a + 1} × ${a + 1} = ${(a + 1) ** 3}`; };
  const world = v => F.root.localToWorld(v.clone());
  function scanline(){ const s = $("scan"); s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); T.SND("scanline"); }
  // Each cube wires a room: the camera pushes in, a spark runs from the transformer along the cable, the cable
  // goes live, the room's lights flare and a scanline sweeps the viewer. Then the camera eases back home.
  async function light(n){
    const c = cables[found % cables.length], room = c.room;
    found++; $("count").textContent = found;
    const r = cubeRoot(n);
    if(!$("log").querySelector(`[data-n="${n}"]`)) $("log").insertAdjacentHTML("beforeend", `<span class="r" data-n="${n}"><b>${n} = ${r}³</b> · ${room.name.toLowerCase()}</span>`);
    T.SND("correct", found);
    const cine = !REDUCE && !camBusy && !over;
    if(cine){
      camBusy = true; atHome = false; T.SND("zoom");
      const mid = world(new TH.Vector3((TX + room.x) / 2, 6, room.z / 2));
      F.flyTo({ pos: mid.clone().add(new TH.Vector3(14, 72, 96)), look: mid }, 900);
    }

    const svg = $("beltSvg");
    svg.innerHTML = `<rect class="bay" x="6" y="${BY - 116}" width="${GX - 30}" height="${142}"/>
      <text class="blab" x="8" y="${BY - 124}">TRANSFORMER BAY</text>
      <rect class="band" x="0" y="${BY}" width="${W}" height="26"/><line class="dash" id="dash" x1="0" y1="${BY + 13}" x2="${W}" y2="${BY + 13}"/>
      <line class="gate" x1="${GX - 8}" y1="${BY - 100}" x2="${GX - 8}" y2="${BY + 26}"/>
      <text class="blab" x="${W - 8}" y="${BY + 48}" text-anchor="end">CRATES IN: <tspan id="bLeft"></tspan></text>
      <text class="blab" x="8" y="${BY + 48}" id="bHold"></text><g id="crates"></g>`;
    const crateSVG = n => `<polygon class="t" points="0,0 ${D},${-D} ${S + D},${-D} ${S},0"/><polygon class="s" points="${S},0 ${S + D},${-D} ${S + D},${S - D} ${S},${S}"/><rect class="f" width="${S}" height="${S}"/><text x="${S / 2}" y="${S / 2 + 1}">${n}</text>`;
    const crates = T.shuffle([...s1, ...extra]).map((n, i) => {
      const g = document.createElementNS("http://www.w3.org/2000/svg", "g"); g.setAttribute("class", "crate"); g.innerHTML = crateSVG(n);
      const c = { n, g, x: W + 40 + i * GAP, state: "queue" }; $("crates").appendChild(g); return c;
    });
    const front = () => crates[0];
    let pending = null, right = 0, heldAt = 0, nudged = false, lastNow = performance.now(), dash = 0, alive = true;
    const place = c => c.g.setAttribute("transform", `translate(${c.x.toFixed(1)}, ${BY - S})`);
    crates.forEach(place);
    // The readouts are only rewritten when they change (the loop runs every frame)
    const shown = {}, put = (id, prop, v) => { if(shown[id] === v) return; shown[id] = v; $(id)[prop] = v; };
    // The belt: crates queue up behind the front one, which stops at the gate. Nothing moves while the brief is up.
    function loop(now){
      if(!alive || over) return;
      const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
      let moved = false;
      if(!T.briefOpen() && !pending){
        crates.forEach((c, i) => { if(c.state !== "queue") return; const tgt = GX + i * GAP; if(c.x > tgt){ c.x = Math.max(tgt, c.x - 30 * sp() * dt); place(c); moved = true; } });
      }
      const f = front();
      const held = f && f.state === "queue" && f.x <= GX + 0.5;
      if(f){ f.g.classList.add("front"); f.g.classList.toggle("held", held); }
      if(held){ if(!heldAt) heldAt = now; if(!nudged && now - heldAt > 9000 / sp()){ nudged = true; T.say("Belt's held. Take your time: is that a cube number?"); } }
      else heldAt = 0;
      put("bHold", "textContent", held ? "BELT HELD · DECIDE" : moved ? "BELT RUNNING" : "");
      if(moved){ dash -= 30 * sp() * dt; $("dash").setAttribute("stroke-dashoffset", dash.toFixed(1)); }
      put("loadBtn", "disabled", !f || !!pending); put("rejBtn", "disabled", !f || !!pending);
      put("crateLine", "innerHTML", f ? (pending ? `Crate <b>${f.n}</b>: which cube?` : `Crate <b>${f.n}</b>. Is ${f.n} a cube number?`) : "Belt clear.");
      put("bLeft", "textContent", String(crates.length));
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
    function decide(load){
      const c = front(); if(!c || pending || over) return;
      const cube = T.isCube(c.n), r = cubeRoot(c.n);
      if(load && cube){ pending = c; c.state = "asked"; T.SND("tag"); askRoot(c); return; }
      if(!load && !cube){ T.SND("correct", right++); say(`Right: ${c.n} isn't a cube. It sits between ${between(c.n)}.`, "ok"); $("log").insertAdjacentHTML("beforeend", `<span class="r">${c.n}: rejected, not a cube</span>`); return eject(c); }
      if(load && !cube){ alarm.hit(); say(`${c.n} isn't a cube: it sits between ${between(c.n)}.${T.isSquare(c.n) ? ` It's a square (${Math.sqrt(c.n)} × ${Math.sqrt(c.n)}), not a cube.` : ""}`, "bad"); return eject(c); }
      alarm.hit(); say(`${c.n} is a cube: ${r} × ${r} × ${r} = ${c.n}. Load it.`, "bad");   // a rejected cube stays on the belt
    }
    $("loadBtn").addEventListener("click", () => decide(true));
    $("rejBtn").addEventListener("click", () => decide(false));
    // Naming the cube: L1 and L2 tap 3³ from a set of chips; L3 types the side length
    function askRoot(c){
      $("rootQ").hidden = false;
      if(L3){ $("rootRowB").hidden = false; $("chips").innerHTML = ""; $("rootQLab").textContent = `${c.n} IS A CUBE. HOW MANY BLOCKS ALONG EACH SIDE?`; $("rootInB").value = ""; $("rootInB").focus(); }
      else {
        const r = cubeRoot(c.n), others = T.shuffle(T.range(1, L === "L1" ? 5 : 6).filter(k => k !== r)).slice(0, 3);
        $("rootQLab").textContent = `${c.n} IS A CUBE. WHICH CUBE? TAP IT.`;
        $("chips").innerHTML = T.shuffle([r, ...others]).map(k => `<button class="pn-btn" type="button" data-v="${k}">${k}<sup>3</sup></button>`).join("");
      }
      brief("root", L3 ? `<b>${c.n}</b> is a cube. Type how many blocks along each side and press <b>Check</b>.` : `<b>${c.n}</b> is a cube. Which cube is it? Tap it.`);
    }
    function answerRoot(v, btn){
      const c = pending; if(!c || over) return;
      if(v ** 3 === c.n){
        pending = null; $("rootQ").hidden = true; $("chips").innerHTML = "";
        say(`${c.n} = ${v}³ = ${v} × ${v} × ${v}. Loaded.`, "ok"); return load(c);
      }
      alarm.hit(); say(`${v} × ${v} × ${v} = ${v ** 3}, not ${c.n}.`, "bad");
      if(btn){ btn.classList.add("bad"); btn.disabled = true; }
    }
    $("chips").addEventListener("click", e => { const b = e.target.closest("button"); if(b && !b.disabled) answerRoot(+b.dataset.v, b); });
    $("rootBtnB").addEventListener("click", () => { const v = parseInt($("rootInB").value, 10); if(!Number.isInteger(v)){ say("No side length yet.", "warn"); T.showHints(); return; } answerRoot(v); });
    $("rootInB").addEventListener("keydown", e => { if(e.key === "Enter") $("rootBtnB").click(); });
    // A loaded crate slides into the bay and the spark runs; a rejected one drops off the belt
    function retire(c){ crates.splice(crates.indexOf(c), 1); c.state = "gone"; c.g.classList.remove("front", "held"); nudged = false; heldAt = 0; if(!crates.length) setTimeout(() => { if(!over) step2(); }, 1400 / sp()); }
    async function load(c){
      retire(c); T.SND("whoosh");
      const x0 = c.x; await F.tween(700, e => { c.x = x0 - (x0 + S + D + 10) * e; place(c); });
      c.g.remove(); light(c.n);
    }
    async function eject(c){
      retire(c); T.SND("whooshDown");
      const x0 = c.x; await F.tween(600, e => { c.g.setAttribute("transform", `translate(${x0.toFixed(1)}, ${(BY - S + 150 * e * e).toFixed(1)}) rotate(${(12 * e).toFixed(1)} ${S / 2} ${S / 2})`); c.g.style.opacity = 1 - e; });
      c.g.remove();
    }
    function ask(){ brief("belt", `Crates are coming down the belt. For each one: press <b>Load</b> if its number is a <b>cube number</b>, or <b>Reject</b> if it isn't.`); }
    function skip(){
      if(pending) return answerRoot(cubeRoot(pending.n));
      const c = front(); if(!c) return;
      if(T.isCube(c.n)){ decide(true); answerRoot(cubeRoot(c.n)); } else decide(false);
    }
    return { ask, reset(){}, skip };
  }

  // Stage 2: the relay board
  const tile = n => $("grid").querySelector(`[data-n="${n}"]`);
  let s2found = 0;
  function step2(){
    ["pallet", "beltPanel"].forEach(id => $(id).hidden = true); $("spot").hidden = false;
    $("st1").className = "done"; $("st2").className = "on";
    T.setGoal(GOAL2, { name: "Stage 2: the relay board" });
    const pool = new Set();
    s2.forEach(c => { if(c > 2){ pool.add(c - 1); pool.add(c + 1); } });
    [4, 9, 16, 25, 32, 36, 49, 81, 100, 121, 128, 144, 169, 196, 12, 18, 24, 30, 45, 54, 60, 72, 90, 96, 108, 120, 150, 180, 200, 256, 300, 400, 500, 600, 800, 900].forEach(n => pool.add(n));
    const decoys = T.shuffle([...pool].filter(n => n <= BOARD.max && !T.isCube(n))).slice(0, BOARD.size - s2.length);
    $("grid").innerHTML = T.shuffle([...s2, ...decoys]).map(n => `<button type="button" class="tw-tile" data-n="${n}">${n}</button>`).join("");
    $("grid").addEventListener("click", e => { const b = e.target.closest(".tw-tile"); if(b) tap(+b.dataset.n); });
    T.say("Those rooms are wired. The rest of the relays are on this board: find every cube number.");
    T.SND("powerup");   // the last relay's feedback line stays until the first tap on the board
  }
  function tap(n){
    if(over || found === RELAYS.length) return;   // the blackout is running: the board is done
    const b = tile(n); if(b.disabled) return;
    if(T.isCube(n)){
      const r = cubeRoot(n); b.classList.add("gold"); b.innerHTML = `${n}<small>${r}³</small>`; b.disabled = true;
      light(n); s2found++; say(`${n} = ${r}³ = ${r} × ${r} × ${r}. Another room wired in.`, "ok");
      return;   // the last one triggers the blackout, which ends the twist
    }
    b.classList.add("bad"); b.disabled = true;
    say(`${n} isn't a cube: ${between(n)}.${T.isSquare(n) ? ` It's a square (${Math.sqrt(n)} × ${Math.sqrt(n)}), not a cube.` : ""}`, "bad");
    if(alarm.hit() === 2){ $("table").hidden = false; $("table").innerHTML = "CUBE TABLE: " + T.range(1, 10).map(k => `${k}³ = ${k ** 3}`).join(" · "); T.say("I've sent you the cube table."); }
  }
  function end(ok){
    if(over) return;
    over = true;
    if(!ok) s2.forEach(n => { const b = tile(n); if(b && !b.disabled) b.classList.add("missed"); });
    T.finish({ ok, title: ok ? "BLACKOUT" : "RELAY ALARM", effect: ok ? "dark" : "", auto: ok ? 2500 : 0,
      lines: [`Relays powered: <b>${found}</b> of ${RELAYS.length}`, `Cube numbers: <b>${[...new Set(RELAYS)].sort((a, b) => a - b).map(n => `${n} = ${cubeRoot(n)}³`).join(", ")}</b>`, "A cube number is a number times itself, times itself again: 4³ = 4 × 4 × 4 = 64."] });
    T.say(ok ? "Whole floor's dark. Their cameras can't see a thing." : "Too many wrong relays. The lights stay on.");
  }
  M = MODE === "B" ? modeB() : modeA();
  M.ask();
  if(window.PNTest) PNTest.skip("Solve this step", () => {
    if(!$("spot").hidden){ s2.forEach(n => { if(!tile(n).disabled) tap(n); }); return; }
    M.skip();
  });
})();
</script>
</body>
