<!doctype html>
<html lang="en" class="phase-hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Ceiling Relays (3D)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<link rel="stylesheet" href="../shared/cipher.css">
<style>
  /* Round 12 prototype: the ceiling relays on the student's own floor in 3D. Each cube sends electricity
     through the ceiling to a room. ?mode=A (default) stacks square layers on a pallet; ?mode=B sorts cube crates off a conveyor belt.
     Round 16 (teacher feedback): everything fits on screen with no scrolling (1280 x 720 and up). The build area is the main
     panel on the left, the ceiling view the side panel. Each relay's cube comes from its wires: n wires in means n × n × n
     blocks. Stage 2 is a corridor of numbered floor tiles in perspective: the cube numbers in order light a path to the fuse
     box. The ending is the fuse box being wired by lasers; the blackout itself now plays on the heist's blueprint. */
  main.tw{ width:min(1500px,100%); height:100vh; padding:10px 16px 12px; gap:10px; }
  main.tw > .tw-head{ padding-bottom:8px; }
  main.tw .tw-head h1{ font-size:26px; line-height:1.15; }
  .layout{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1.62fr) minmax(300px,1fr); gap:14px; }
  .work, .side{ display:flex; flex-direction:column; gap:8px; min-width:0; min-height:0; }
  .work > .pn-panel{ flex:1; min-height:0; }
  [hidden]{ display:none !important; }
  .steps{ display:flex; gap:6px; font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; }
  .steps span{ border:1px solid var(--line); padding:3px 8px; color:var(--text-faint); }
  .steps span.on{ color:var(--warning); border-color:var(--warning); }
  .steps span.done{ color:var(--ok); border-color:rgba(61,220,151,.5); }
  .lab{ font-family:var(--font-ui); font-size:12px; letter-spacing:.16em; color:var(--text-faint); }
  .row{ display:flex; gap:8px; flex-wrap:wrap; }
  .answer{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:17px; }
  .answer input{ width:80px; font-size:20px; text-align:center; padding:6px; }
  /* Cube notation, the same everywhere: 3³ with the small 3 bright so it stands out (Bertie, round 15) */
  .cu{ font-family:var(--font-ui); font-weight:700; color:var(--warning); white-space:nowrap; }
  .cu sup{ font-size:.72em; line-height:0; color:#ffe14d; text-shadow:0 0 12px rgba(255,225,77,.9); }
  /* The side panel: the relay log and the ceiling of the target floor in 3D */
  .stage3d{ position:relative; flex:1; min-height:0; padding:0; overflow:hidden; background:radial-gradient(ellipse at 50% 40%, rgba(20,60,70,.35), rgba(2,8,10,.9)); }
  .stage3d .hud{ position:absolute; left:12px; top:10px; font-family:var(--font-ui); font-size:12px; line-height:1.7; letter-spacing:.18em; color:#ffe14d; pointer-events:none; text-shadow:0 0 8px rgba(0,0,0,.8); }
  .stage3d .hud b{ font-size:16px; }
  .stage3d .cam{ position:absolute; left:12px; bottom:10px; font-family:var(--font-ui); font-size:11px; letter-spacing:.2em; color:rgba(160,240,255,.7); pointer-events:none; }
  .stage3d .cam i{ font-style:normal; color:#ff6b8a; }
  /* A line of light sweeps down the viewer when a relay powers (once, slowly: nothing flashes) */
  .stage3d .scan{ position:absolute; left:0; right:0; top:0; height:3px; background:linear-gradient(90deg, transparent, #bff7ff 30%, #bff7ff 70%, transparent); box-shadow:0 0 16px #8feaff; opacity:0; pointer-events:none; }
  .stage3d .scan.go{ animation:scanDown .8s linear 1; }
  @keyframes scanDown{ 0%{ top:0; opacity:.9; } 100%{ top:100%; opacity:0; } }
  .log{ display:flex; flex-wrap:wrap; gap:6px; font-size:14px; color:var(--text-muted); min-height:30px; max-height:62px; overflow:hidden; align-items:center; }
  .log .lab{ margin-right:4px; }
  .log span.r{ border:1px solid rgba(255,201,77,.35); padding:3px 9px; background:rgba(255,201,77,.06); } .log b{ color:#fff3cf; }
  /* The build panel: the relay and its wires on top, the tools and the pallet below. The tools keep to the top left and the
     pallet to the right, so the BRIEF and HINTS tabs (bottom left of the screen) never cover a button or a cell. */
  .pallet{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .relay{ display:flex; gap:16px; align-items:center; padding-bottom:8px; border-bottom:1px solid var(--line); }
  .wires{ flex:0 0 auto; width:230px; height:84px; overflow:visible; }
  .wires .w{ fill:none; stroke-linecap:round; opacity:.5; }
  .wires .w.on{ opacity:1; filter:drop-shadow(0 0 4px currentColor); }
  .wires .w.draw{ stroke-dasharray:1; stroke-dashoffset:1; animation:wireIn .7s ease-out forwards; }
  @keyframes wireIn{ to{ stroke-dashoffset:0; } }
  .wires .box{ fill:#0f2a31; stroke:#ffc94d; stroke-width:1.5; transition:fill .4s; } .wires .box.on{ fill:rgba(255,201,77,.35); }
  .wires .bolt{ fill:rgba(255,201,77,.75); } .wires .pin{ fill:#ffe7a8; }
  .wires .t{ font:700 10px var(--font-ui); letter-spacing:.16em; fill:#ffe7a8; text-anchor:middle; }
  .wires .hid{ fill:#0b1d22; stroke:#3b6470; stroke-dasharray:5 4; } .wires .q{ font:700 30px var(--font-ui); fill:rgba(235,255,248,.6); text-anchor:middle; dominant-baseline:central; }
  .need{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  .need p{ margin:0; font-family:var(--font-ui); font-size:21px; line-height:1.35; }
  .need p b{ color:#fff3cf; } .need p .cu{ font-size:1.15em; } .need .nw{ white-space:nowrap; }
  .bench{ position:relative; flex:1; min-height:0; display:flex; gap:14px; }
  .palWrap{ position:relative; flex:1; min-width:0; min-height:0; }
  .pal{ position:absolute; inset:0; width:100%; height:100%; touch-action:none; user-select:none; }
  .pal .cell{ fill:rgba(var(--accent-rgb),.07); stroke:rgba(var(--accent-rgb),.38); stroke-width:1; cursor:crosshair; }
  .pal .cell.sel{ fill:rgba(255,201,77,.45); stroke:#ffc94d; }
  .pal.bad .cell.sel{ fill:rgba(255,107,107,.4); stroke:#ff6b6b; }
  .pal.taken .cell{ cursor:default; }
  .slab polygon{ stroke:#ffe7a8; stroke-width:1; } .slab line{ stroke:#ffe7a8; stroke-width:.7; opacity:.8; }
  .pal .slab{ pointer-events:none; } .pal .slab.top{ pointer-events:auto; cursor:grab; } .pal.l3 .slab.top{ pointer-events:none; }
  .pal.locked .slab polygon{ stroke:#ffffff; filter:drop-shadow(0 0 6px rgba(255,225,120,.9)); }
  .pal .plab{ font:700 13px var(--font-ui); letter-spacing:.16em; fill:rgba(235,255,248,.6); }
  .tools{ flex:0 0 214px; display:flex; flex-direction:column; gap:10px; min-height:0; overflow:hidden; }
  .tools .col{ display:flex; flex-direction:column; gap:6px; }
  .tools .pn-btn{ width:100%; }
  .tools .answer{ flex-direction:column; align-items:stretch; } .tools .answer .row{ flex-wrap:nowrap; } .tools .answer input{ flex:0 0 80px; }
  .count{ font-family:var(--font-mono); font-size:20px; line-height:1.35; min-height:1.4em; } .count b{ color:var(--warning); } .count small{ display:block; font-size:14px; color:var(--text-faint); }
  .tray{ cursor:grab; touch-action:none; user-select:none; display:inline-block; padding:4px 6px; border:1px dashed rgba(255,201,77,.45); }
  .tray svg{ display:block; }
  #trayWrap{ position:absolute; left:0; top:0; z-index:1; width:190px; display:flex; flex-direction:column; gap:4px; align-items:flex-start; }   /* the empty corner above the pallet */
  .ghost{ position:fixed; z-index:9000; pointer-events:none; transform:translate(-50%,-60%); filter:drop-shadow(0 0 10px rgba(255,201,77,.7)); opacity:.9; }
  .ghost.over{ opacity:1; }
  /* The reveal: when the stack locks, the finished cube lifts off the pallet, turns once in the middle of the bench and is named */
  .reveal{ position:absolute; inset:0; z-index:3; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:16px; background:radial-gradient(ellipse at 50% 42%, rgba(18,54,64,.985), rgba(3,10,13,.99)); opacity:0; transition:opacity .4s; }
  .reveal.on{ opacity:1; }
  .rv-cube{ width:min(62%, 250px); height:auto; filter:drop-shadow(0 0 16px rgba(255,201,77,.5)); transition:transform .65s cubic-bezier(.2,.9,.3,1); }
  .rv-cube polygon{ stroke:#ffe7a8; stroke-width:1.2; stroke-linejoin:round; } .rv-cube line{ stroke:#ffe7a8; stroke-width:.8; opacity:.8; }
  .rv-eq{ display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:2px 14px; font-family:var(--font-mono); font-size:clamp(22px, 2.2vw, 30px); color:#fff3cf; text-align:center; }
  .rv-eq b{ color:var(--warning); }
  .rv-eq .pw{ opacity:0; transform:scale(.6); transition:opacity .3s, transform .45s cubic-bezier(.2,1.2,.3,1); }
  .rv-eq .cu{ font-size:1.55em; }
  .reveal.named .rv-eq .pw{ opacity:1; transform:none; }
  /* Mode B: the conveyor belt into the transformer bay */
  .belt{ padding:14px; display:flex; flex-direction:column; gap:12px; }
  .belt svg{ display:block; flex:1; min-height:0; width:100%; }
  .belt .band{ fill:#0b1d22; stroke:#2c4c55; }
  .belt .dash{ stroke:#2fbf8a; stroke-width:3; stroke-dasharray:16 14; opacity:.55; }
  .belt .bay{ fill:rgba(255,179,71,.14); stroke:#ffb347; stroke-dasharray:5 4; }
  .belt .gate{ stroke:#ffe14d; stroke-width:2; opacity:.7; }
  .belt .blab{ font:700 11px var(--font-ui); letter-spacing:.18em; fill:rgba(235,255,248,.6); }
  .crate .f{ fill:#173840; stroke:#8feaff; stroke-width:1.5; } .crate .t{ fill:#2a5a66; stroke:#8feaff; } .crate .s{ fill:#0f2a31; stroke:#8feaff; }
  .crate text{ font:700 26px var(--font-mono); fill:#fff; text-anchor:middle; dominant-baseline:central; }
  .crate.front .f{ stroke:#ffc94d; stroke-width:3; }
  .crate.held .f{ fill:#2a3a2a; }
  .decide{ display:flex; flex-direction:column; gap:10px; }
  .decide .big{ font-family:var(--font-ui); font-size:20px; min-height:1.4em; } .decide .big b{ font-size:30px; color:var(--accent); }
  .decide .row .pn-btn{ flex:1; font-size:15px; padding:14px 10px; }
  .chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .chips button{ font-family:var(--font-mono); font-size:26px; padding:8px 18px; } .chips sup{ font-size:.6em; }
  .chips button.bad{ border-color:var(--danger); color:var(--danger); }
  /* Stage 2: the relay corridor. A camera down the corridor to the fuse box; numbered floor tiles in perspective. */
  .corridor{ padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .ctop{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px 16px; }
  .trail{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; font-family:var(--font-mono); font-size:20px; }
  .trail i{ font-style:normal; color:var(--text-faint); }
  .trail .s{ padding:1px 10px; border:1px solid rgba(255,201,77,.55); background:rgba(255,201,77,.14); color:#fff3cf; }
  .trail .s.f{ font-family:var(--font-ui); font-size:14px; letter-spacing:.16em; }
  .trail .q{ padding:1px 10px; border:1px dashed rgba(143,234,255,.75); color:#8feaff; }
  .typeIt{ display:flex; gap:8px; align-items:center; font-size:16px; color:var(--text-muted); }
  .typeIt input{ width:96px; font-size:20px; text-align:center; padding:6px; }
  .table{ position:absolute; left:0; top:0; z-index:1; font-size:15px; line-height:1.45; color:#e8fbff; background:rgba(2,10,12,.88); border:1px solid rgba(143,234,255,.45); padding:6px 12px; }
  .hallWrap{ position:relative; flex:1; min-height:0; }
  #hall{ position:absolute; inset:0; width:100%; height:100%; }
  #hall .wall{ fill:#07181d; } #hall .far{ fill:#0a2127; stroke:#1d4a55; }
  #hall .rk{ stroke:rgba(90,170,190,.22); stroke-width:1; } #hall .led{ opacity:.7; }
  #hall .floor{ fill:#051317; stroke:rgba(143,234,255,.25); }
  #hall .fuse .fb{ fill:#24404a; stroke:#ffc94d; stroke-width:2; transition:fill .5s; } #hall .fuse .fz{ fill:#ff4f6d; transition:fill .5s; }
  #hall .fuse text{ font:700 12px var(--font-ui); letter-spacing:.2em; fill:#ffc94d; text-anchor:middle; }
  #hall .fuse.on .fb{ fill:rgba(255,201,77,.5); filter:drop-shadow(0 0 10px rgba(255,201,77,.9)); } #hall .fuse.on .fz{ fill:#fff3cf; } #hall .fuse.on text{ fill:#1a1405; }
  #hall .tile{ outline:none; }
  #hall .tile polygon{ fill:rgba(143,234,255,.05); stroke:rgba(143,234,255,.3); stroke-width:1.2; transition:fill .3s, stroke .3s; }
  #hall .tile text{ font-family:var(--font-mono); font-weight:700; fill:rgba(235,255,248,.5); text-anchor:middle; dominant-baseline:central; pointer-events:none; }
  #hall .tile.next{ cursor:pointer; } #hall .tile.next polygon{ fill:rgba(143,234,255,.14); stroke:#8feaff; stroke-width:2; } #hall .tile.next text{ fill:#ffffff; }
  #hall .tile.next:hover polygon{ fill:rgba(143,234,255,.32); }
  #hall .tile:focus-visible polygon{ stroke:#ffe14d; stroke-width:3; fill:rgba(143,234,255,.32); }
  #hall .tile.lit polygon{ fill:rgba(255,201,77,.62); stroke:#fff3cf; stroke-width:2; filter:drop-shadow(0 0 8px rgba(255,201,77,.8)); } #hall .tile.lit text{ fill:#1a1405; }
  #hall .tile.bad polygon{ fill:rgba(255,79,109,.2); stroke:#ff6b8a; } #hall .tile.bad text{ fill:#ff8aa0; text-decoration:line-through; }
  #hall .tile.missed polygon{ stroke:#f2c14e; stroke-width:2.5; stroke-dasharray:6 4; }
  #hall .route{ fill:none; stroke:#ffe14d; stroke-width:3; stroke-linejoin:round; stroke-dasharray:10 6; opacity:.85; }
  #hall .crew circle{ stroke:#021014; stroke-width:2; } #hall .crew .sh{ fill:rgba(0,0,0,.5); }
  #hall .crew text{ font:700 11px var(--font-ui); letter-spacing:.1em; fill:#eafff6; transition:opacity .4s; } #hall .crew.go text{ opacity:0; }
  /* The intro: the fuse box's inner cover swings open onto the relays (about a second). Over the brief, under ORACLE. */
  .fbIntro{ position:fixed; inset:0; z-index:8650; perspective:1800px; pointer-events:none; }
  .fbIntro .plate{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; transform-origin:0 50%;
    background:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px), linear-gradient(160deg, #2b4a55, #173039 55%, #22404a);
    border:4px solid #ffc94d; box-shadow:inset 0 0 0 10px rgba(0,0,0,.25), inset 0 0 90px rgba(0,0,0,.6); transition:transform .8s cubic-bezier(.55,0,.35,1), opacity .8s ease-in; }
  .fbIntro .plate::before{ content:""; position:absolute; left:16px; top:14%; bottom:14%; width:10px; background:linear-gradient(#8aa0a6 0 16%, transparent 16% 84%, #8aa0a6 84%); }
  .fbIntro .plate::after{ content:""; position:absolute; right:34px; top:calc(50% - 50px); width:14px; height:100px; background:#8aa0a6; box-shadow:inset 0 0 0 2px #56686e; }
  .fbIntro.open .plate{ transform:rotateY(-100deg); opacity:0; }
  .fbIntro b{ font-family:var(--font-ui); font-size:clamp(26px,4vw,46px); letter-spacing:.34em; color:#ffc94d; text-shadow:0 0 18px rgba(255,201,77,.4); }
  .fbIntro small{ font-family:var(--font-ui); font-size:14px; letter-spacing:.3em; color:rgba(235,255,248,.7); }
  .fbIntro .fuses{ display:flex; gap:28px; } .fbIntro .fuses i{ width:40px; height:130px; background:linear-gradient(#ff6b82, #d8324e); border:2px solid #ffd0d8; }
  /* The finale: the fuse box, its wiring drawn in by lasers */
  .finale{ position:fixed; inset:0; z-index:60; background:radial-gradient(ellipse at 50% 45%, #0d2c34, #020809 75%); opacity:0; transition:opacity .35s; }
  .finale.on{ opacity:1; }
  .finale canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .finale .fdim{ position:absolute; inset:0; background:#020809; opacity:0; pointer-events:none; }
  .finale .fcap{ position:absolute; left:28px; top:22px; font-family:var(--font-ui); font-size:14px; letter-spacing:.22em; color:#ffe14d; text-shadow:0 0 8px #000; }
  .finale .fcap span{ color:#8feaff; }
  .finale .fdone{ position:absolute; left:50%; top:64px; transform:translateX(-50%); white-space:nowrap; padding:10px 24px; background:rgba(2,10,12,.86); border:1px solid rgba(255,201,77,.55);
    font-family:var(--font-ui); font-weight:700; font-size:clamp(20px,2.4vw,30px); letter-spacing:.22em; color:#fff3cf; text-shadow:0 0 14px rgba(255,201,77,.5); opacity:0; transition:opacity .5s; }   /* high up, clear of ORACLE (bottom right) */
  .finale .fdone.on{ opacity:1; }
  @media (max-width:980px){ main.tw{ height:auto; } .layout{ grid-template-columns:1fr; } .work > .pn-panel{ min-height:560px; } .stage3d{ flex:0 0 360px; } }
  @media (prefers-reduced-motion: reduce){ .stage3d .scan.go{ animation:none; } .fbIntro.open .plate{ transform:none; } }
  html.pn-reduce-motion .fbIntro.open .plate{ transform:none; }
  /* Round 24 (Bertie: the strongroom standard). Readable: slate panels, IBM Plex Mono at normal weight. */
  .pallet, .comms{ background:#0f2129; border-color:rgba(143,234,255,.28); }
  .need p{ font:500 21px/1.4 var(--font-ui); color:#e4f1f4; } .need p b{ color:#ffd76a; font-weight:600; }
  .need .rdn{ display:inline-block; font:600 26px "IBM Plex Mono", monospace; color:#8ff5c9; text-shadow:0 0 8px rgba(125,255,196,.5); }
  .need .rdn.ping{ animation:rdPing 1s ease-out 1; }
  .count{ font:500 22px/1.4 "IBM Plex Mono", monospace; color:#e4f1f4; } .count b{ color:#ffd76a; font-weight:600; } .count small{ font:500 14px var(--font-ui); color:#a9c3c9; }
  .count .ok{ color:#8ff5c9; } .count .warn{ color:#ffd76a; }
  .log{ font-family:"IBM Plex Mono", monospace; } .log span.r{ font-weight:400; } .log b{ font-weight:500; }
  .rv-eq{ font-family:"IBM Plex Mono", monospace; font-weight:500; }
  .tools .pn-btn.rule{ margin-top:6px; }
  /* Comms: FOX and WREN, and the pupil's one reply */
  .comms{ padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .comms .hd{ font:700 12px var(--font-ui); letter-spacing:.18em; color:#8feaff; }
  .clog{ flex:none; max-height:70%; overflow:auto; display:flex; flex-direction:column; gap:10px; padding:4px 2px; }
  .clog .cl{ display:flex; flex-direction:column; gap:3px; padding:10px 12px; border-left:3px solid #6ec8ff; background:rgba(110,200,255,.08); font:500 19px/1.4 var(--font-ui); color:#e4f1f4; max-width:80%; animation:rdIn .35s ease-out; }
  .clog .cl b{ font:700 12px var(--font-ui); letter-spacing:.18em; color:#6ec8ff; }
  .clog .cl.me{ align-self:flex-end; border-left:none; border-right:3px solid #8ff5c9; background:rgba(143,245,201,.08); text-align:right; } .clog .cl.me b{ color:#8ff5c9; }
  .creply{ display:flex; flex-direction:column; gap:8px; } .creply:empty{ display:none; }
  .creply small{ font:700 12px var(--font-ui); letter-spacing:.18em; color:#8feaff; }
  .creply button{ font:500 19px var(--font-ui); text-align:left; padding:12px 16px; color:#f2fbfd; background:#16303a; border:1px solid rgba(143,245,201,.5); cursor:pointer; }
  .creply button:hover, .creply button:focus-visible{ border-color:#ffd76a; outline:none; }
  .cipher{ transition:background .3s; } .cipher .cbox{ transition:opacity .3s; }
  .cipher.peek{ background:transparent; pointer-events:none; } .cipher.peek .cbox{ opacity:.06; }
  /* The cipher's picture: the cube for n */
  .cipher .cpic svg.rv-cube{ width:min(100%, 280px); height:auto; }
  .cipher .cpic svg.rv-cube polygon{ stroke:#ffe7a8; stroke-width:1.2; stroke-linejoin:round; } .cipher .cpic svg.rv-cube line{ stroke:#ffe7a8; stroke-width:.8; opacity:.8; }
  .cipher .cpic .cu{ font-size:1.2em; }
</style>
</head>
<body>
<main class="tw">
  <div class="tw-bar"><span class="steps"><span id="st1" class="on">1 · BUILD THE RELAYS</span><span id="st2">2 · CRACK THE CODE</span><span id="st3">3 · POWER THE REST</span></span><span>Relays powered: <b id="count">0</b> of <b id="total">0</b></span></div>
  <div class="layout">
    <div class="work">
      <section class="pn-panel comms" id="commsP" hidden aria-label="Comms"><div class="hd">COMMS · FOX &amp; WREN</div><div class="clog" id="clog"></div><div class="creply" id="creply"></div></section>
      <section class="pn-panel pallet" id="pallet" hidden aria-label="Build the relay">
        <div class="relay"><svg class="wires" id="wires" viewBox="0 0 230 84" aria-hidden="true"></svg><div class="need"><span class="lab" id="relayLab"></span><p id="needLine"></p></div></div>
        <div class="slot"><div class="tw-msg" id="msg" aria-live="polite"></div></div>
        <div class="bench" id="bench">
          <div class="tools">
            <div class="count" id="countLine"></div>

<script src="../shared/vendor/three.min.js"></script>

<script>
(() => {
  "use strict";
  const T = window.PNTwist, $ = id => document.getElementById(id);
  const L = "L1";   // Round 24 (Bertie): L1 only for now, as the strongroom
  const MODE = new URLSearchParams(location.search).get("mode") === "B" ? "B" : "A";
  const sp = () => (window.PNTest ? PNTest.speed() : 1);
  const wait = ms => new Promise(r => setTimeout(r, ms / sp()));
  const REDUCE = matchMedia("(prefers-reduced-motion: reduce)").matches || document.documentElement.classList.contains("pn-reduce-motion");
  // Runs when the brief first folds away. (The brief zooms open by itself a moment after load, so "is it open now?" is no guide.)
  const afterBrief = fn => window.addEventListener("pn-brief", function f(e){ if(e.detail.open) return; window.removeEventListener("pn-brief", f); fn(); });
  const GOALS = {
    A: { L1: "Each relay has wires coming in. <b>n wires in</b> means a cube of <b>n × n × n</b> blocks: draw one <b>square layer</b> on the pallet, then stack one layer for each wire.",
         L2: "Each relay has wires coming in. <b>n wires in</b> means a cube of <b>n × n × n</b> blocks: draw one <b>square layer</b> on the pallet, then stack one layer for each wire.",
         L3: "Each relay needs a number of blocks. How many <b>wires</b> come in? That's the <b>cube root</b>: the blocks along each side. Or say it can't be a cube." },
    B: { L1: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and say which cube each one is.",
         L2: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and say which cube each one is.",
         L3: "Only <b>cube-number</b> crates go into the transformer. Load the cubes, reject the rest, and give each one's <b>cube root</b>." },
  };
  // Round 24 (Bertie: the strongroom standard). Nothing names the pattern until it's cracked: the brief says what the
  // relays need, not how to build them, and never "cube" in mode A.
  T.init({ levels: ["L1"], id: "cubes3d", stage: "BLUEPRINT", title: "CEILING RELAYS", goal: MODE === "B" ? GOALS.B.L1 : "Each relay has wires coming in and takes a set number of blocks. Build each relay's blocks on the pallet: only one shape will lock. Then crack the rule that links wires to blocks, and use it to power the rest.", result: "auto",
    briefStyle: "comms", briefTitle: "COMMS · ORACLE",
    context: "This fuse box runs every light on the floor. Each relay takes the right number of blocks.",
    example: MODE === "B" ? "<b>3 wires in: 3 × 3 × 3 = 27 = 3³</b>." : "Drag out a layer of blocks on the pallet, then add layers. Any stack with the right number of blocks is kept, but only one shape locks.",
    story: `We're at the fuse box for ${T.targets()} target floor. Wire the relays and their lights are ours.` });
  if(MODE === "B"){ $("st1").textContent = "1 · LOAD THE CRATES"; $("st2").textContent = "2 · RELAY CORRIDOR"; $("st3").remove(); }

  // ----- The intro: the fuse box's inner cover swings open onto the relays. Waits for the page to load (in a mission the
  // frame fades in on load), then takes about a second; with reduced motion it just goes. -----
  (() => {
    let gone = false;
    const go = () => { if(gone) return; gone = true; setTimeout(() => { $("fbIntro").classList.add("open"); if(!REDUCE) T.SND("clamp"); setTimeout(() => $("fbIntro").remove(), 900); }, REDUCE ? 50 : 300); };
    if(document.readyState === "complete") go(); else window.addEventListener("load", go);
    setTimeout(go, 2500);   // never left closed by a slow font
  })();

  // ----- The 3D ceiling (side panel): the student's own weak floor -----
  const F = PNFloor3D.create($("stage"), {});
  const TH = F.THREE;
  const a0 = window.Primenet && Primenet.getAgent();
  $("floorName").textContent = (a0 && a0.weakFloor ? a0.weakFloor : "FLOOR N=" + F.n).toUpperCase();
  // Camera: HOME frames the floor and the transformer; the view opens on a fly-in from FAR once the brief folds away
  const HOME = { pos: new TH.Vector3(-4, 150, 166), look: new TH.Vector3(-14, 0, 4) };
  const FAR = { pos: new TH.Vector3(-90, 300, 360), look: new TH.Vector3(-14, 0, 4) };
  F.look.copy(HOME.look);
  F.lightsOn(1000);
  F.setSpin(0.0005);
  afterBrief(() => { if(!REDUCE){ T.SND("whoosh"); F.flyTo(HOME, 1800).then(() => { if(!camBusy && !finishing) atHome = true; }); } });
  // Wiring: one transformer outside the wall; a cable from it to each room's lights runs along the ceiling in straight lines
  const CY = F.H + 1.6, TX = -F.PLATE / 2 - 10;
  const tr = new TH.Mesh(new TH.BoxGeometry(9, 14, 9), new TH.MeshStandardMaterial({ color: 0xffb347, emissive: 0x663300, emissiveIntensity: 0.6 })); tr.position.set(TX, 7, 0); F.root.add(tr);
  const trTop = new TH.Mesh(new TH.CylinderGeometry(1.2, 1.2, 4, 10), new TH.MeshBasicMaterial({ color: 0xdddddd })); trTop.position.set(TX, 16, 0); F.root.add(trTop);
  const cables = F.rooms.map((r, i) => {
    const lane = -F.PLATE / 2 + 3 + (i % 5) * 1.2;   // a bundle along the west wall, branching off to each room
    const pts = [new TH.Vector3(TX, 14, 0), new TH.Vector3(TX, CY, 0), new TH.Vector3(lane, CY, 0), new TH.Vector3(lane, CY, r.z), new TH.Vector3(r.x, CY, r.z)];
    const geo = new TH.BufferGeometry().setFromPoints(pts), mat = new TH.LineDashedMaterial({ color: 0x4a5a5e, dashSize: 2, gapSize: 1.5 });
    const line = new TH.Line(geo, mat); line.computeLineDistances(); F.root.add(line);
    const plug = new TH.Mesh(new TH.BoxGeometry(3, 1.4, 3), new TH.MeshBasicMaterial({ color: 0x3a4a4e })); plug.position.set(r.x, CY, r.z); F.root.add(plug);
    return { pts, line, plug, room: r, wired: 0 };
  });
  $("hudT").textContent = cables.length;
  // Cameras: red lights on the floor corners (a slow blink, well under 1 Hz)
  const cams = [[-1, -1], [1, -1], [1, 1], [-1, 1]].map(([sx, sz]) => { const m = new TH.Mesh(new TH.SphereGeometry(1.8, 10, 10), new TH.MeshBasicMaterial({ color: 0xff3355 })); m.position.set(sx * (F.PLATE / 2 - 3), F.H - 2, sz * (F.PLATE / 2 - 3)); F.root.add(m); return m; });
  F.onTick(now => cams.forEach((c, i) => c.material.color.setHex(Math.sin(now / 320 + i) > 0 ? 0xff3355 : 0x661122)));
  // Round 15 (Bertie): the floor must never be cut off at the sides of its panel. HOME keeps its direction, but its
  // distance is worked out from the floor's bounds: the plate, every room and the transformer. The floor spins slowly,
  // so the bounds are taken as a drum round the spin axis (the widest sweep at any angle), and the camera backs off
  // until the drum's rim fits both the vertical and the horizontal view with a margin. Done once now and on every resize.
  const fit = (() => {
    const spin0 = F.root.rotation.y; F.root.rotation.y = 0; F.root.updateMatrixWorld(true);
    const box = new TH.Box3().setFromObject(F.root); F.root.rotation.y = spin0;
    const rim = Math.hypot(Math.max(-box.min.x, box.max.x), Math.max(-box.min.z, box.max.z));
    const samples = [];
    for(let k = 0; k < 36; k++){ const a = k / 36 * Math.PI * 2; samples.push(new TH.Vector3(rim * Math.cos(a), box.min.y, rim * Math.sin(a)), new TH.Vector3(rim * Math.cos(a), box.max.y, rim * Math.sin(a))); }
    const dir = HOME.pos.clone().sub(HOME.look).normalize();   // from the look point out to the camera: the direction never changes
    const fwd = dir.clone().negate(), right = fwd.clone().cross(new TH.Vector3(0, 1, 0)).normalize(), up = right.clone().cross(fwd).normalize();
    const MIN = 190;   // never closer than this, however wide the panel
    return () => {
      const st = $("stage"), w = st.clientWidth, h = st.clientHeight; if(!w || !h) return;
      const tanV = Math.tan(F.camera.fov / 2 * Math.PI / 180), tanH = tanV * (w / h);
      let d = MIN;
      samples.forEach(q => {
        const rel = q.clone().sub(HOME.look), along = rel.dot(dir), v = rel.dot(up), x = Math.abs(rel.dot(right));
        d = Math.max(d, x / (tanH * 0.92) + along, (v > 0 ? v / (tanV * 0.72) : -v / (tanV * 0.92)) + along);   // extra room at the top, under the HUD lines
      });
      HOME.pos.copy(HOME.look).addScaledVector(dir, d);
      if(atHome) F.camera.position.copy(HOME.pos);
    };
  })();
  let atHome = REDUCE;   // true while the camera rests at HOME, so a resize can move it straight there
  fit();
  F.camera.position.copy(REDUCE ? HOME.pos : FAR.pos);
  new ResizeObserver(fit).observe($("stage"));

  const cubeRoot = n => Math.round(Math.cbrt(n));
  const cu = a => `<span class="cu">${a}<sup>3</sup></span>`;   // 3³, styled the same everywhere
  // Round 22 (Bertie: cube numbers stay smaller than other twists' numbers): L1 up to 4³, L2 5³, L3 6³ = 216 (was 10³).
  // L3 adds one square that isn't a cube, to catch out "it's a square, so it's a cube".
  const STEP1 = { L1: () => [8, 27, 64], L2: () => T.shuffle([27, 64, 125]), L3: () => T.shuffle([...T.shuffle([27, 64, 125, 216]).slice(0, 3), T.pick([36, 100, 144, 196])]) };
  const s1 = STEP1[L]();
  // Stage 2: the corridor's cube numbers, in order, one per row (L1 1 to 64, L2 1 to 125, L3 1 to 216)
  const PATH = { L1: [1, 4], L2: [1, 5], L3: [1, 6] }[L];
  const s2 = T.range(PATH[0], PATH[1]).map(k => k ** 3);
  // Round 24, mode A: the three built by hand (or by the pallet), then three requests in the cipher: 1, 5 and 10 wires
  const REQN = T.shuffle([1, 5, 10]);
  const RELAYS = MODE === "B" ? [...s1.filter(T.isCube), ...s2] : [...s1, ...REQN.map(n => n ** 3)];
  $("total").textContent = RELAYS.length;

  let found = 0, over = false, camBusy = false, finishing = false, cracked = false, cracking = false;
  const W = window.__pnRelay = { mode: MODE, stage: "comms", locked: [], read: [], req: [] };   // for automated checks
  const alarm = T.detect({ stage: "heist", onTrip: () => end(false) });   // Round 22: quick wrong guesses trip it
  function say(t, cls){ const m = $("msg"); m.textContent = t; m.className = "tw-msg" + (cls ? " " + cls : ""); }
  const slot = id => { const s = $(id).querySelector(".slot"); if(s) s.appendChild($("msg")); };   // the feedback line sits in whichever panel is showing
  const between = n => { let a = 1; while((a + 1) ** 3 <= n) a++; return `${a} × ${a} × ${a} = ${a ** 3} and ${a + 1} × ${a + 1} × ${a + 1} = ${(a + 1) ** 3}`; };
  const world = v => F.root.localToWorld(v.clone());
  function scanline(){ const s = $("scan"); s.classList.remove("go"); void s.offsetWidth; s.classList.add("go"); T.SND("scanline"); }
  // Each cube wires a room: the camera pushes in, a spark runs from the transformer along the cable, the cable
  // goes live, the room's lights flare and a scanline sweeps the viewer. Then the camera eases back home.
  async function light(n){
    const c = cables[found % cables.length], room = c.room;
    found++; $("count").textContent = found;
    const r = cubeRoot(n), last = found === RELAYS.length;
    if(!$("log").querySelector(`[data-n="${n}"]`)) $("log").querySelector(".lab").insertAdjacentHTML("afterend", `<span class="r" data-n="${n}"><b>${n} = ${cracked || MODE === "B" ? `${r}³` : `${r} × ${r} × ${r}`}</b> · ${room.name.toLowerCase()}</span>`);   // newest first (no "³" until it's cracked)
    T.SND("correct", found);
    const cine = !REDUCE && !camBusy && !over;
    if(cine){
      camBusy = true; atHome = false; T.SND("zoom");
      const mid = world(new TH.Vector3((TX + room.x) / 2, 6, room.z / 2));
      F.flyTo({ pos: mid.clone().add(new TH.Vector3(14, 72, 96)), look: mid }, 900);
    }
    for(let k = 1; k < c.pts.length; k++){ if(c.pts[k].distanceTo(c.pts[k - 1]) > 0.1) await F.pulse(c.pts[k - 1], c.pts[k], 0xffe14d, 160); }
    c.wired++;
    c.line.material = new TH.LineBasicMaterial({ color: c.wired > 1 ? 0xffffff : 0xffe14d });
    c.plug.material.color.setHex(0xffe14d);
    room.lights.draw(room.a * room.b, "rgba(255,240,120,1)");
    $("hudN").textContent = cables.filter(q => q.wired).length;
    scanline(); T.SND("chirp");
    if(cine){ await wait(500); if(!last){ await F.flyTo(HOME, 1000); atHome = !finishing; } camBusy = false; }
  }
  // Instructions live in the HINTS window (opens only on request). A new step updates it and pings its tab.
  const seen = new Set();
  // The brief only names the step ("Relay 2 of 4"); the how-to goes to HINTS
  const stepName = () => MODE === "B" ? "Load the crates" : `Relay ${Math.min(i1 + 1, s1.length)} of ${s1.length}`;
  function brief(kind, html){ T.step(html, { quiet: seen.has(kind), name: stepName() }); seen.add(kind); }
  let i1 = 0;
  const want = () => s1[i1];
  let M = null;   // the mode: { ask, reset, skip }
  function nextRelay(){
    i1++;
    if(cracking) return;
    if(i1 === s1.length) return setTimeout(() => { if(!over) (MODE === "B" ? step2() : crack()); }, 1000 / sp());
    M.reset(); M.ask();
  }
  // ===== Mode A: build the relay (Round 24, Bertie: the strongroom standard). Each relay shows its wires and how many
  // blocks it takes. Drag out any rectangle of blocks as a layer, then stack layers. Any stack with the right number of
  // blocks is kept but won't lock; only the one as wide, as deep and as tall as the wires locks gold. Nothing says
  // "cube" until the rule is cracked. After two by hand, the pallet builds the third. =====
  const HAND = 2;
  function modeA(){
    const G = 6, MAXL = 6, Hh = 420, C30 = 0.866;
    const u = (Hh - 28) / (G + MAXL), W = Math.ceil(G * 2 * C30 * u + 30), cx = W / 2, cy = MAXL * u + 10;   // the view hugs the pallet, so it can be as big as possible
    const P = (x, y, z) => [cx + (x - z) * C30 * u, cy + (x + z) * 0.5 * u - y * u];
    const pts = arr => arr.map(p => P(...p).map(v => v.toFixed(1)).join(",")).join(" ");
    const svg = $("pal"); svg.setAttribute("viewBox", `0 0 ${W} ${Hh}`);
    let cellsHTML = "";
    for(let z = 0; z < G; z++) for(let x = 0; x < G; x++) cellsHTML += `<polygon class="cell" data-r="${z}" data-c="${x}" points="${pts([[x, 0, z], [x + 1, 0, z], [x + 1, 0, z + 1], [x, 0, z + 1]])}"/>`;
    svg.innerHTML = `<g id="cells">${cellsHTML}</g><g id="stack"></g><text class="plab" id="plab" x="${W / 2}" y="${Hh - 4}" text-anchor="middle"></text>`;
    // The relay and its wires: n coloured wires from the ceiling into the relay's pins. Unlit until a layer plugs each one in.
    const WCOL = ["#ff6b6b", "#4aa3ff", "#7dffc4", "#ffe14d", "#ffb35c", "#c792ff", "#8feaff", "#ff8ad8", "#b8f06a", "#f4f4f4"];
    function drawWires(n){
      const BX = 160, BY = 8, BH = 70, f = v => v.toFixed(1);
      let g = "";
      for(let k = 0; k < n; k++){
        const y0 = 4 + 76 * (k + .5) / n, y1 = BY + 6 + (BH - 12) * (k + .5) / n, sw = Math.max(2.5, Math.min(6, 30 / n));
        g += `<path class="w draw" style="color:${WCOL[k % 10]};animation-delay:${k * 90}ms" stroke="currentColor" stroke-width="${f(sw)}" pathLength="1" d="M0 ${f(y0)} C70 ${f(y0)} 80 ${f(y1)} ${BX - 8} ${f(y1)} L${BX} ${f(y1)}"/><rect class="pin" x="${BX - 5}" y="${f(y1 - 2)}" width="6" height="4"/>`;
      }
      g += `<rect class="box" id="wbox" x="${BX}" y="${BY}" width="64" height="${BH}" rx="3"/><path class="bolt" d="M${BX + 36} ${BY + 8} L${BX + 22} ${BY + 36} L${BX + 31} ${BY + 36} L${BX + 26} ${BY + 56} L${BX + 43} ${BY + 28} L${BX + 34} ${BY + 28} Z"/><text class="t" x="${BX + 32}" y="${BY + BH - 5}">RELAY</text>`;
      $("wires").innerHTML = g;
    }
    const litWires = k => $("wires").querySelectorAll(".w").forEach((w, i) => w.classList.toggle("on", i < k));
    // One layer of a × b blocks (a along x, b along z): corner (ox, oz), bottom at height y0. Top, right and front faces.
    function slabSVG(P2, a, b, ox, oz, y0, cls){
      const y1 = y0 + 1;
      const pl = (arr, f) => `<polygon points="${arr.map(p => P2(...p).map(v => v.toFixed(1)).join(",")).join(" ")}" fill="${f}"/>`;
      const ln = (p, q) => { const [x1, ya] = P2(...p), [x2, yb] = P2(...q); return `<line x1="${x1.toFixed(1)}" y1="${ya.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${yb.toFixed(1)}"/>`; };
      let g = pl([[ox, y1, oz], [ox + a, y1, oz], [ox + a, y1, oz + b], [ox, y1, oz + b]], "rgba(255,201,77,.62)")
        + pl([[ox + a, y0, oz], [ox + a, y1, oz], [ox + a, y1, oz + b], [ox + a, y0, oz + b]], "rgba(255,201,77,.36)")
        + pl([[ox, y0, oz + b], [ox + a, y0, oz + b], [ox + a, y1, oz + b], [ox, y1, oz + b]], "rgba(255,201,77,.22)");
      for(let k = 1; k < a; k++) g += ln([ox + k, y1, oz], [ox + k, y1, oz + b]) + ln([ox + k, y0, oz + b], [ox + k, y1, oz + b]);
      for(let k = 1; k < b; k++) g += ln([ox, y1, oz + k], [ox + a, y1, oz + k]) + ln([ox + a, y0, oz + k], [ox + a, y1, oz + k]);
      return `<g class="slab ${cls || ""}">${g}</g>`;
    }
    let bw = 0, bd = 0, layers = 0, ox = 0, oz = 0, locked = false, tries = 0;
    const blocks = () => bw * bd * layers, isEven = () => bw === bd && bd === layers;
    function traySVG(scale = 1){
      const tu = 15 * scale, w = (bw + bd) * C30 * tu + 10, h = (bw + bd) * 0.5 * tu + tu + 10;
      const P3 = (x, y, z) => [5 + bd * C30 * tu + (x - z) * C30 * tu, tu + 5 + (x + z) * 0.5 * tu - y * tu];
      return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">${slabSVG(P3, bw, bd, 0, 0, 0)}</svg>`;
    }
    const trayScale = () => Math.min(1, 80 / (Math.max(bw, bd) + 1) / 15, 186 / (C30 * (bw + bd)) / 15);   // the spare layer fits its column
    function paint(drop){
      const st = $("stack"); let g = "";
      for(let k = 0; k < layers; k++) g += slabSVG(P, bw, bd, ox, oz, k, k === layers - 1 ? "top" : "");
      st.innerHTML = g;
      if(drop && layers && !REDUCE){ const top = st.lastElementChild; top.style.transition = "none"; top.style.transform = `translateY(${-u * 1.6}px)`; requestAnimationFrame(() => { top.style.transition = `transform ${240 / sp()}ms ease-out`; top.style.transform = "translateY(0)"; }); }

  // ===== Power the rest: the relay code streams in; three relays cut in with a request each. Set n with ▲▼ and the

  async function power(ov){

    let rate = 110, stopped = false;

      await wait(i ? 2200 : 2800); if(over) return;

      ex.banner(`<span class="rq">${ask}</span><span class="rqh">Press ▲ ▼ to set <span class="nb">n</span> = ${n}, then type the answer in the box.</span><span class="cd"><i id="cdi"></i></span>`).classList.add("req");
      say(ask.replace("⚠ ", ""));
      await new Promise(res => {
        const T0 = 25000; let left = T0, last = performance.now(), live = true;   // a countdown; at L1 running out only gives a hint
        const tick = now => { if(!live || over) return; left -= (now - last) * sp(); last = now; const b = $("cdi"); if(b) b.style.width = Math.max(0, left / T0 * 100) + "%";
          if(left <= 0){ left = T0; tl("  trace rising… request repeated", "bad"); say(hint, "warn"); T.SND("denied"); }
          requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
        const check = async inp => {
          if(over || !live) return;
          if(+inp.value.trim() === want){
            live = false; const got = document.createElement("b"); got.className = "got"; got.textContent = want; got.dataset.v = want; inp.replaceWith(got);
            await PNCipher.scramble(got, "ping"); T.SND("latch"); res(); return; }

          tl(`  ${inp.value} ✗ REJECTED`, "bad"); say(hint, "bad");
        };

      ex.ask(null); ex.banner("STREAMING · the next request will appear here").classList.remove("req");
      rate = 70;
    }
    if(over) return;
    rate = 30; await wait(900); stopped = true;
    cstat("ALL RELAYS POWERED"); tl("ALL RELAYS POWERED ✓", "gold"); T.SND("lock");

  // ===== The opening (Round 24): FOX and WREN on comms; the pupil's one reply =====

    function loop(now){

        crates.forEach((c, i) => { if(c.state !== "queue") return; const tgt = GX + i * GAP; if(c.x > tgt){ c.x = Math.max(tgt, c.x - 30 * sp() * dt); place(c); moved = true; } });

  // ===== Stage 2: the relay corridor. A camera looks down the corridor to the fuse box: rows of numbered floor tiles in

  const CX = 300, FN = 250, HY = -150, K = 600, ZF = 2, ZL = 0.9, COLS = 4;

  function decoys(r){

    ["pallet", "beltPanel"].forEach(id => $(id).hidden = true); $("spot").hidden = false; slot("spot"); say("");
    $("st1").className = "done"; $("st2").className = "on";
    const first = s2[0] === 1 ? "1, 8, 27" : `${s2[0]}, ${s2[1]}, ${s2[2]}`;
    T.setGoal(`Light a path to the fuse box: in each row, step on the <b>cube number</b>. They go up in order: ${first} and so on. Click the tile, or type its number and press Enter.`, {
      name: "Stage 2: the relay corridor", example: `${s2.slice(0, 3).map(n => `<b>${n} = ${cubeRoot(n)}³</b>`).join(", ")}: the next is ${cubeRoot(s2[3])} × ${cubeRoot(s2[3])} × ${cubeRoot(s2[3])} = ${s2[3]}.`,
      context: `The last relays are under this corridor floor. Step on the <b>cube numbers in order</b> to light a path to the fuse box.` });
    buildHall(); markNext(); trail();
    T.say("Those rooms are wired. The last relays are under the corridor: step on the cube numbers, in order, to reach the fuse box.");
    T.SND("powerup");
  }
  function stepOn(i){
    const t = tiles[i], el = t && tileEl(i);
    if(over || finishing || !t || el.classList.contains("lit") || el.classList.contains("bad") || t.row < row) return;
    if(t.row > row){ say("One row at a time: the next tile is in the row just in front of FOX and WREN.", "warn"); T.SND("untag"); return; }
    const c = s2[row], r = cubeRoot(c);
    if(t.n === c){
      el.classList.add("lit"); el.setAttribute("aria-label", `Tile ${t.n}, lit`);
      const kbd = document.activeElement === el;
      row++; markNext(); trail(); route();
      const last = row === s2.length;
      say(`${c} = ${r} × ${r} × ${r} = ${r}³.${last ? " The path reaches the fuse box." : " On to the next row."}`, "ok");
      $("crew").classList.add("go"); moveCrew({ x: t.xc, y: t.yc, s: .9 / t.z });
      light(c);
      if(last) reachFuse();
      else if(kbd){ const nx = $("hall").querySelector(".tile.next"); if(nx) nx.focus(); }
      return;
    }
    el.classList.add("bad"); el.classList.remove("next"); el.setAttribute("tabindex", "-1"); el.setAttribute("aria-label", `Tile ${t.n}, not a cube`);
    say(why(t.n, r), "bad");
    if(alarm.hit() === 2 && !over){ $("table").hidden = false; $("table").innerHTML = `<span class="lab">CUBE TABLE</span><br>` + T.range(1, 10).map(k => `${k}³ = ${k ** 3}`).join("<br>"); T.say("I've sent you the cube table."); }
  }
  // Typing: the number of a tile in the next row steps on it (digits typed anywhere land in the box)
  function typed(){
    const inp = $("stepIn"), v = parseInt(inp.value, 10); inp.value = "";
    if($("spot").hidden || over || finishing) return;
    if(!Number.isInteger(v)){ say("Type the number on a tile in the next row, then press Enter.", "warn"); return; }
    const i = tiles.findIndex(t => t.row === row && t.n === v);
    if(i >= 0 && tileEl(i).classList.contains("bad")){ say(`${v} is already ruled out. Try another tile in that row.`, "warn"); T.SND("untag"); return; }
    if(i >= 0) return stepOn(i);
    say(tiles.some(t => t.row > row && t.n === v) ? `${v} is further along. One row at a time: the row just in front of FOX and WREN.` : `There's no ${v} tile in the next row.`, "warn"); T.SND("untag");
  }
  $("hall").addEventListener("click", e => { const el = e.target.closest(".tile"); if(el) stepOn(+el.dataset.i); });
  $("hall").addEventListener("keydown", e => { const el = e.target.closest && e.target.closest(".tile"); if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); stepOn(+el.dataset.i); } });
  $("stepBtn").addEventListener("click", typed);
  $("stepIn").addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); typed(); } });
  document.addEventListener("keydown", e => {
    if($("spot").hidden || over || finishing || T.briefOpen() || e.ctrlKey || e.metaKey || e.altKey) return;
    const tg = e.target; if(tg && (tg.tagName === "INPUT" || tg.tagName === "TEXTAREA")) return;
    if(/^[0-9]$/.test(e.key)) $("stepIn").focus();   // the digit carries on into the box
  });
  // The path reaches the far end: FOX and WREN walk up to the fuse box, which lights, then the fuse box itself
  async function reachFuse(){
    finishing = true;
    await wait(450);
    const fp = { x: CX, y: hy(ZF) - 4, s: 1 / ZF };
    route([fp.x, fp.y]);
    await moveCrew(fp);
    $("fuse").classList.add("on"); T.SND("lockon");
    await wait(900);
    finale();
  }

  // ===== The finale: the fuse box itself. Four lasers draw its wiring (breakers, the relays just built, terminals, and the
  // cables out to the building), the camera easing back as it fills in, then pulling right out. Nothing flashes: the lines
  // grow and the colours swell once. The blackout plays on the heist's blueprint afterwards (effect: "dark"). =====
  async function finale(){
    T.hideBrief(); document.querySelectorAll(".twb-chip").forEach(c => c.classList.add("hide"));
    T.say("That's every relay. Watch the fuse box wire itself up.");
    const ov = $("finale"); ov.hidden = false; ov.getBoundingClientRect(); ov.classList.add("on");
    let R3 = null;
    try{ R3 = new TH.WebGLRenderer({ canvas: $("fbCanvas"), antialias: true, alpha: true }); if(!R3.getContext()) throw 0; }catch(e){ R3 = null; }
    if(!R3){ await wait(900); return end(true); }   // no WebGL: straight on
    R3.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    const S = new TH.Scene(), cam = new TH.PerspectiveCamera(40, 1, 0.5, 3000), look = new TH.Vector3(), V = (x, y, z) => new TH.Vector3(x, y, z);
    const size = () => { R3.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); };
    size(); window.addEventListener("resize", size);
    const G = new TH.Group(); S.add(G);
    const part = (w, h, d, x, y, z, col, edge, op = 1, parent = G) => {
      const geo = new TH.BoxGeometry(w, h, d), m = new TH.Mesh(geo, new TH.MeshBasicMaterial({ color: col, transparent: op < 1, opacity: op }));
      if(edge !== undefined) m.add(new TH.LineSegments(new TH.EdgesGeometry(geo), new TH.LineBasicMaterial({ color: edge })));
      m.position.set(x, y, z); parent.add(m); return m;
    };
    // The cabinet: back plate with a faint grid, walls with the heist's gold edges, the door swung wide open
    part(66, 46, 1, 0, 0, -.5, 0x08181c, 0x1c4450);
    const grid = new TH.GridHelper(46, 23, 0x1a4652, 0x0e2830); grid.scale.x = 64 / 46; grid.rotation.x = Math.PI / 2; grid.position.z = .05; G.add(grid);
    [[68, 1.6, 0, 23.8], [68, 1.6, 0, -23.8], [1.6, 49, -33.8, 0], [1.6, 49, 33.8, 0]].forEach(([w, h, x, y]) => part(w, h, 7, x, y, 3, 0x24404a, 0xffc94d));
    const hinge = new TH.Group(); hinge.position.set(-34.6, 0, 6.5); hinge.rotation.y = -2.5; G.add(hinge);
    part(68, 49, .6, 34, 0, 0, 0x1a323b, 0xffe14d, .8, hinge);
    // Rails, the main breaker and bus bar, a row of breakers, the relays (the cubes just built), the terminals and the ducts
    [15, 4, -10, -16.5].forEach(y => part(58, 1, .8, 0, y, .5, 0x4a5e64));
    part(8, 8, 4, -25, 15.5, 2, 0x1d3a42, 0x8feaff); part(1.8, 3, 1.4, -25, 16.5, 4.6, 0xff4f6d);
    part(46, 1.4, .8, 5, 19.3, 2.6, 0xd08a3a);
    const BX = T.range(0, 13).map(i => -26 + i * 4);
    BX.forEach(x => { part(3, 6, 3.4, x, 4, 1.7, 0x1d3a42, 0x8feaff); part(.7, 1.2, .8, x, 5, 3.8, 0xffc94d); part(.45, .45, .45, x, 2.2, 3.6, 0x5dffa8); });
    const gridTex = n => { const c = document.createElement("canvas"); c.width = c.height = 128; const x = c.getContext("2d"); x.fillStyle = "rgba(255,201,77,.78)"; x.fillRect(0, 0, 128, 128); x.strokeStyle = "rgba(255,240,190,.95)"; x.lineWidth = 4; x.strokeRect(2, 2, 124, 124); x.lineWidth = 2; for(let k = 1; k < n; k++){ const v = k * 128 / n; x.beginPath(); x.moveTo(v, 0); x.lineTo(v, 128); x.moveTo(0, v); x.lineTo(128, v); x.stroke(); } return new TH.CanvasTexture(c); };
    const roots = RELAYS.map(cubeRoot); let sz = roots.map(n => 1.5 + .55 * n), gap = 1.4, tot = sz.reduce((a, b) => a + b, 0) + gap * (sz.length - 1);
    const kk = Math.min(1, 52 / tot); sz = sz.map(s => s * kk); gap *= kk; tot *= kk;
    let rx = -tot / 2;
    const RX = roots.map((n, i) => {
      const s = sz[i], x = rx + s / 2; rx += s + gap;
      const m = new TH.Mesh(new TH.BoxGeometry(s, s, s), new TH.MeshBasicMaterial({ map: gridTex(n), transparent: true, color: 0xc4c4c4 }));
      m.position.set(x, -9.5 + s / 2, .3 + s / 2); G.add(m);
      return { x, s, top: -9.5 + s, bot: -9.5, m };
    });
    const TXs = T.range(0, 27).map(i => -27 + i * 2);
    TXs.forEach((x, i) => part(1.5, 3, 2, x, -16.5, 1, i % 5 === 4 ? 0x9ccf3a : i % 2 ? 0x4aa3ff : 0x8aa0a6));
    const DA = 9.5, DB = -1.5, DC = -12.8, DD = -20.5;
    [DA, DB, DC, DD].forEach(y => part(58, 2.2, 1.6, 0, y, .8, 0x10262c, 0x2c6e7a, .9));
    [-30.5, 30.5].forEach(x => part(2.6, 41, 1.6, x, -1, .8, 0x10262c, 0x2c6e7a, .9));
    // The wiring: every wire a run of straight segments along the ducts, in lanes so the bundles show
    const PAL = [[.44, .91, 1], [1, .79, .3], [1, .35, .43], [.36, 1, .66], [.87, .97, 1], [.29, .64, 1]];
    const Z = k => 2.2 + (k % 6) * .12, lane = (k, n = 9) => ((k % n) - (n - 1) / 2) * .22;
    const wires = [], add = (pts, c, s) => wires.push({ pts, c: PAL[c % PAL.length], s });
    BX.forEach((x, i) => add(x < -19 ? [V(x, 11.5, 3.1), V(x, 7.1, 3.1)] : [V(x, 18.6, 3.1), V(x, 7.1, 3.1)], 1, x < 0 ? 0 : 1));   // bus bar to breakers
    BX.forEach((x, i) => { const r = RX[i % RX.length], z = Z(i), y = DB + lane(i), xr = r.x + lane(i, 5) * r.s * .8; add([V(x, 1, z), V(x, y, z), V(xr, y, z), V(xr, r.top, z)], [0, 5, 4][i % 3], x < 0 ? 0 : 1); });   // breakers to relays
    for(let i = 0; i < 12; i++){ const x = BX[(i * 5) % BX.length], y = DA + lane(i), tx = -27.5 + (i % 4) * 1.6, z = Z(i + 3); add([V(x, 7.1, z), V(x, y, z), V(tx, y, z), V(tx, 11.5, z)], [2, 1, 4][i % 3], 0); }   // cross links to the main breaker
    RX.forEach((r, j) => [-1, 0, 1].forEach(k => {   // relays down to terminals
      const x0 = r.x + k * r.s * .3, i = j * 3 + k + 1, t = TXs[Math.max(0, Math.min(TXs.length - 1, Math.round((x0 + 27) / 2) + ((j * 7 + k * 3) % 9) - 4))], z = Z(i), y = DC + lane(i);
      add([V(x0, r.bot, z), V(x0, y, z), V(t, y, z), V(t, -15, z)], [1, 0, 3][k + 1], x0 < 0 ? 2 : 3);
    }));
    TXs.forEach((x, i) => { const sd = x < 0 ? -1 : 1, z = Z(i), y = DD + lane(i), sx = sd * (30.5 + lane(i, 7) * 2.4), top = 40 + (i % 4) * 2; add([V(x, -18, z), V(x, y, z), V(sx, y, z), V(sx, top, z)], [0, 4, 2, 3, 5][i % 5], sd < 0 ? 2 : 3); });   // out to the building
    for(let k = 0; k < 4; k++) add([V(-27.5 + k * 1.3, 42, 3), V(-27.5 + k * 1.3, 19.5, 3)], [2, 5, 1, 3][k], 0);   // the supply in
    const streams = [[], [], [], []];
    wires.forEach(w => { for(let k = 1; k < w.pts.length; k++) streams[w.s].push({ a: w.pts[k - 1], b: w.pts[k], c: w.c }); });
    // A tracer draws its segments in order at an even speed; the last one grows to the laser's tip (as the town map's lasers do)
    function tracer(list, k = 1, off = V(0, 0, 0)){
      const n = list.length, src = new Float32Array(n * 6), col = new Float32Array(n * 6), cum = [0];
      list.forEach((s, i) => { src.set([s.a.x + off.x, s.a.y + off.y, s.a.z + off.z, s.b.x + off.x, s.b.y + off.y, s.b.z + off.z], i * 6); col.set([...s.c, ...s.c].map(v => v * k), i * 6); cum.push(cum[i] + s.a.distanceTo(s.b)); });
      const geo = new TH.BufferGeometry(), pos = new TH.BufferAttribute(src.slice(), 3);
      geo.setAttribute("position", pos); geo.setAttribute("color", new TH.BufferAttribute(col, 3)); geo.setDrawRange(0, 0);
      const mat = new TH.LineBasicMaterial({ vertexColors: true, transparent: true, blending: TH.AdditiveBlending, depthWrite: false });
      const obj = new TH.LineSegments(geo, mat); obj.frustumCulled = false; G.add(obj);
      let cur = -1; const tip = V(0, 0, 0), total = cum[n];
      return { mat, set(p){
        if(p <= 0 || !n){ geo.setDrawRange(0, 0); return null; }
        const f = Math.min(1, p) * total; let i = Math.max(0, cur); while(i < n - 1 && cum[i + 1] <= f) i++;
        const fr = p >= 1 ? 1 : Math.min(1, (f - cum[i]) / Math.max(1e-6, cum[i + 1] - cum[i])), a = pos.array;
        for(let q = Math.max(0, cur); q < i; q++) for(let j = 3; j < 6; j++) a[q * 6 + j] = src[q * 6 + j];
        for(let j = 0; j < 3; j++) a[i * 6 + 3 + j] = src[i * 6 + j] + (src[i * 6 + 3 + j] - src[i * 6 + j]) * fr;
        cur = i; pos.needsUpdate = true; geo.setDrawRange(0, (i + 1) * 2);
        return p >= 1 ? null : tip.set(a[i * 6 + 3], a[i * 6 + 4], a[i * 6 + 5]);
      } };
    }
    const lines = streams.map(l => tracer(l)), halo = streams.map(l => tracer(l, .45, V(.07, -.07, .03)));   // the halo copy thickens each wire
    // The lasers: beams from four emitters out in front, each with a glowing tip
    const dot = (() => { const c = document.createElement("canvas"); c.width = c.height = 64; const x = c.getContext("2d"), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.25, "rgba(160,240,255,.8)"); gr.addColorStop(1, "rgba(111,232,255,0)"); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return new TH.CanvasTexture(c); })();
    const lasers = [[-46, 30, 34], [46, 30, 34], [-46, -30, 34], [46, -30, 34]].map(e => {
      const geo = new TH.BufferGeometry(); geo.setAttribute("position", new TH.Float32BufferAttribute([...e, ...e], 3));
      const beam = new TH.Line(geo, new TH.LineBasicMaterial({ color: 0xbff4ff, transparent: true, opacity: .7, blending: TH.AdditiveBlending, depthWrite: false })); beam.frustumCulled = false; G.add(beam);
      const tip = new TH.Sprite(new TH.SpriteMaterial({ map: dot, transparent: true, blending: TH.AdditiveBlending, depthWrite: false })); tip.scale.setScalar(2.6); G.add(tip);
      beam.visible = tip.visible = false; return { beam, tip };
    });
    // Camera: close on the relays, easing back to the whole cabinet as it's wired, then pulling right out
    const tanV = Math.tan(20 * Math.PI / 180), D = Math.max(27 / tanV, 38 / (tanV * cam.aspect)) + 6;
    const C0 = V(6, -3, 22), L0 = V(0, -5.5, 0), C1 = V(-7, 3, D), L1 = V(0, 0, 0), C2 = V(0, 8, D * 3.2), L2 = V(0, 2, 0);
    const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const DRAW = REDUCE ? 900 : 3600, HOLD = REDUCE ? 1100 : 900, OUT = REDUCE ? 500 : 1300;
    T.SND("scan"); setTimeout(() => T.SND("trickle"), 300 / sp());
    let held = false, out = false;
    await new Promise(res => {
      const t0 = performance.now();
      (function frame(now){
        const t = (now - t0) * sp(), p = Math.min(1, t / DRAW);
        const tips = lines.map(l => l.set(REDUCE ? 1 : p)); halo.forEach(l => l.set(REDUCE ? 1 : p));
        if(REDUCE) lines.concat(halo).forEach(l => { l.mat.opacity = p; });
        lasers.forEach((z, i) => { const q = tips[i], on = !!q && !REDUCE; z.beam.visible = z.tip.visible = on; if(on){ const a = z.beam.geometry.attributes.position; a.setXYZ(1, q.x, q.y, q.z); a.needsUpdate = true; z.tip.position.copy(q); } });
        $("fbStat").textContent = p < 1 ? `WIRING ${Math.floor(p * wires.length)} OF ${wires.length} CIRCUITS` : `${wires.length} CIRCUITS LIVE`;
        if(REDUCE){ cam.position.copy(C1); look.copy(L1); }
        else if(t < DRAW + HOLD){ const e = ease(p); cam.position.lerpVectors(C0, C1, e); look.lerpVectors(L0, L1, e); }
        if(t >= DRAW && !held){ held = true; T.SND("powerup"); $("fbDone").innerHTML = `ALL ${RELAYS.length} RELAYS WIRED`; $("fbDone").classList.add("on"); }
        if(held){ const e = Math.min(1, (t - DRAW) / HOLD); RX.forEach(r => r.m.material.color.setScalar(.77 + .23 * e)); }   // one slow swell as the current flows
        if(t >= DRAW + HOLD){
          const e = ease(Math.min(1, (t - DRAW - HOLD) / OUT));
          if(!out){ out = true; T.SND("whooshDown"); $("fbDone").classList.remove("on"); }
          if(!REDUCE){ cam.position.lerpVectors(C1, C2, e); look.lerpVectors(L1, L2, e); }
          $("fbDim").style.opacity = (e * .5).toFixed(3);
        }
        cam.lookAt(look); R3.render(S, cam);
        if(t >= DRAW + HOLD + OUT) return res();
        requestAnimationFrame(frame);
      })(t0);
    });
    window.removeEventListener("resize", size);
    end(true);
  }
  function end(ok){
    if(over) return;
    over = true; W.stage = ok ? "done" : "failed";
    const cv = $("cipher"); if(cv) cv.remove();
    if(!ok && !$("spot").hidden) tiles.forEach((t, i) => { if(t.row >= row && t.n === s2[t.row]) tileEl(i).classList.add("missed"); });
    T.finish({ ok, title: ok ? "RELAYS WIRED" : "RELAY ALARM", effect: ok ? "dark" : "",
      lines: [`Relays powered: <b>${found}</b> of ${RELAYS.length}`, `Cube numbers: <b>${[...new Set(RELAYS)].sort((a, b) => a - b).map(n => `${n} = ${cubeRoot(n)}³`).join(", ")}</b>`, "The relay code: blocks = wires × wires × wires."] });
    T.say(ok ? "Every relay's wired. Now we can cut their lights." : "Too many wrong relays. The lights stay on.");
  }
  $("total").textContent = RELAYS.length;
  const buildSkip = () => { if(window.PNTest) PNTest.skip("Solve this step", () => {
    if(!$("spot").hidden){ while(!over && !finishing && row < s2.length) stepOn(tiles.findIndex(t => t.row === row && t.n === s2[row])); return; }
    if(!cracking) M.skip();
  }); };
  // "Got the rule?" (Bertie: there from the start): straight on to the cipher
  $("ruleBtn").addEventListener("click", () => { if(over || cracking || !M || M.busy) return; T.SND("click"); crack(); });
  (async () => {
    if(MODE === "A"){
      await new Promise(r => { if(!T.briefOpen()) return r(); const f = () => { if(!T.briefOpen()){ window.removeEventListener("pn-brief", f); r(); } }; window.addEventListener("pn-brief", f); });
      await commsIntro(); if(over) return;
    }
    W.stage = "build";
    M = MODE === "B" ? modeB() : modeA();
    M.ask(); buildSkip();
  })();
})();
