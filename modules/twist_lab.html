<!doctype html>
<html lang="en" class="phase-hack">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIMENET · Twist Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;600;700;800&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/primenet.css">
<style>
  /* The bank heist's rotating tasks, each playable on its own at any level, away from the mission */
  .lab{ position:relative; z-index:1; width:min(1180px,100%); margin:0 auto; padding:22px 16px 48px; display:flex; flex-direction:column; gap:22px; }
  .top{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:12px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .top .eb{ font-family:var(--font-ui); font-size:12px; font-weight:700; letter-spacing:.22em; color:var(--warning); }
  h1{ margin:2px 0 6px; font-family:var(--font-ui); font-size:clamp(28px,4vw,40px); letter-spacing:.12em; }
  .lede{ margin:0; color:var(--text-muted); max-width:70ch; line-height:1.6; font-size:17px; }
  .point h2{ margin:0 0 2px; font-family:var(--font-ui); font-size:18px; letter-spacing:.14em; color:var(--warning); }
  .point > p{ margin:0 0 12px; color:var(--text-faint); font-size:15px; }
  .cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .card{ padding:14px; display:flex; flex-direction:column; gap:8px; border-left:3px solid var(--c, var(--line)); }
  .card .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; }
  .card h3{ margin:0; font-family:var(--font-ui); font-size:18px; letter-spacing:.06em; }
  .card p{ margin:0; font-size:15px; color:var(--text-muted); line-height:1.5; flex:1; }
  .card .m{ font-family:var(--font-mono); font-size:13px; color:var(--c); }
  .pill{ font-family:var(--font-mono); font-size:11px; padding:1px 7px; border:1px solid; white-space:nowrap; }
  .pill.new{ color:#ff9f6b; border-color:#ff9f6b; } .pill.old{ color:var(--ok); border-color:var(--ok); }
  .go{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .go a{ font-family:var(--font-ui); font-weight:700; font-size:13px; letter-spacing:.1em; text-decoration:none; color:var(--text-primary); border:1px solid var(--line-strong); padding:7px 12px; }
  .go a:hover{ border-color:var(--c, var(--accent)); color:var(--c, var(--accent)); }
  .go small{ font-size:12px; color:var(--text-faint); }
  .teach{ padding:12px 16px; display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; font-size:15px; color:var(--text-muted); }
  .teach b{ color:var(--warning); font-family:var(--font-ui); letter-spacing:.12em; font-size:13px; }
  .teach input{ width:110px; font-size:18px; letter-spacing:.3em; text-align:center; padding:6px 8px; }
  .teach .err{ color:var(--danger); }
</style>
</head>
<body>
<div class="lab">
  <header class="top">
    <div>
      <div class="eb">PRIMENET · BANK HEIST</div>
      <h1>TWIST LAB</h1>
      <p class="lede">Every rotating task from the bank heist map, playable on its own. Pick a level to jump straight in. These pages don't change a mission. Once they're right, the mission will pick one twist at each point.</p>
    </div>
    <a class="pn-btn small" href="../index.html" style="text-decoration:none">← Title screen</a>
  </header>
  <section class="pn-panel teach" id="teach"></section>
  <div id="points" style="display:flex;flex-direction:column;gap:30px"></div>
</div>

<script src="../shared/sound.js"></script>
<script src="../shared/primenet.js"></script>
<script>
(() => {
  "use strict";
  const C = { primes: "#2fbf8a", factors: "#4aa3ff", squares: "#f2c14e", cubes: "#ffd27a", multiples: "#ff9f6b", lcm: "#ff4fd8", pfact: "#6ee7ff" };
  const lv = (page, extra = () => "") => ["L1", "L2", "L3"].map(l => `<a href="${page}?level=${l}${extra(l)}">${l}</a>`).join("");
  const CORR = { L1: [12, 18, 20, 24], L2: [36, 40, 48, 60], L3: [72, 84, 90, 96] };
  const POINTS = [
    // Round 12: new versions that happen in the building (3D floor, the room, the door). Separate pages, so the main game is untouched.
    { name: "Prototypes (round 12)", when: "In the building, not on a grid. Try them here, or switch missions over to them with the switch at the top.", items: [
      { id: "corrupt", t: "Corrupted blueprint (replaces the fake floor)", d: "The stolen blueprint is corrupted on one floor. Drag the rooms (the factor pairs of N as arrays) onto the squared grid so they all fit. Tap a room to turn it. No 1 × N; lift and stairs block squares at L2 and L3. When it fits, the strongroom is found.", m: "factors", mn: "Factor pairs as arrays", page: "twist_corrupt.html", isNew: 1, other: 1 },
      { id: "cubes3d", t: "Ceiling relays in 3D", d: "Their own floor in 3D with its ceiling lights. Each cube sends electricity from the junction box to a room. When every relay is powered the floor goes black, and in a mission the whole blueprint goes dark.", m: "cubes", mn: "Cube numbers", page: "twist_cubes3d.html", isNew: 1, other: 1 },
      { id: "door2", t: "Key room door with keypad", d: "A big door with two bolts and a keypad, and why primes matter (card encryption). Split each number with a factor tree, then key its primes in, smallest first. L1: prime buttons on the first tree only; after that, type a pair (buttons unlock after a wrong try). L3 keys in powers.", m: "pfact", mn: "Prime factorisation", page: "twist_door2.html", isNew: 1, other: 1 },
      { id: "patrols3d", t: "Guard patrols in 3D", d: "Guards (dots) walk loops past the fire door on their floor, with a clock. L1 marks each timetable, then finds when they meet. L2 just finds the first time they meet (the LCM). L3 has three guards. Then you slip in behind them.", m: "lcm", mn: "Multiples and LCM", page: "twist_patrols3d.html", isNew: 1, other: 1 },
      { id: "walls3d", t: "Deposit-box room", d: "A laser-lit room in perspective with boxes down both sides. Fits or doesn't fit on the back wall. At the end each bank slides in, and the key box's drawer slides out, glowing.", m: "factors", mn: "Factor pairs", page: "twist_walls3d.html", isNew: 1, other: 1 },
      { id: "sieve2", t: "Motion-sensor sieve (v2)", d: "Opens with what a sieve is and why it finds primes. A corridor of sensors: you choose each prime yourself (no step line). The sensors switch off its multiples at L1; at L2/L3 you tap them. Say when only primes are left, and a path lights through them.", m: "primes", mn: "Primes and multiples", page: "twist_sieve2.html", isNew: 1, other: 1 },
      { id: "strongroom3d", t: "The strongroom, in the building", d: "Zooms in on the strongroom on their 3D floor. Stage 1 lays its square floor from the tiles delivered. Stage 2 puts the pressure plates in perspective: mark the square-numbered live plates, and the agent walks round them to the safe.", m: "squares", mn: "Square numbers", page: "twist_strongroom3d.html", isNew: 1, other: 1 },
    ] },
    { name: "Frequency Scan", when: "After the scan, before the vault", items: [
      { id: "sieve", t: "Motion-sensor sieve", d: "Knock out every number that isn't prime, a prime at a time. The last prime's multiples are found by hand.", m: "primes", mn: "Primes and multiples", page: "twist_sieve.html", isNew: 1 },
      { id: "jammer", t: "Jammer", d: "Already in every band of the Frequency Scan. In the rotation it will only appear in band 2.", m: "multiples", mn: "Multiples", link: `<a href="prime_frequency_scan.html">Open the scan</a><small>uses the title-screen level</small>` },
    ] },
    { name: "Factor Vault", when: "After floor 2 is mapped", items: [
      { id: "strongroom", t: "Square strongroom", d: "Step 1 builds the square room (L1 drag, L2 can it be square?, L3 side length). Step 2 finds the live pressure plates: the square numbers (L1 to 48, L2 to 150, L3 to 400). Replaces square channels.", m: "squares", mn: "Square numbers", page: "twist_strongroom.html", isNew: 1 },
      { id: "walls", t: "Deposit-box walls", d: "Which rectangles of boxes fit on the wall? The ones that fit slide in as deposit boxes and one glows gold: the key box. L1 lets you drag boxes out to experiment.", m: "factors", mn: "Factor pairs", page: "twist_walls.html", isNew: 1 },
    ] },
    { name: "Blueprint", when: "Once the building's lights come on", items: [
      { id: "cubes", t: "Ceiling relays (cubes)", d: "Power the relays in the target floor's ceiling. L1: build cubes with + and −. L2: draw each cube layer by layer. L3: give the cube root. Then find the cube numbers on the relay board; each one lights a circuit.", m: "cubes", mn: "Cube numbers", page: "twist_cubes.html", isNew: 1 },
    ] },
    { name: "Getting in", when: "New step between the Blueprint and Prime Hack", items: [
      { id: "patrols", t: "Guard patrols", d: "Mark each guard's timetable, find when both meet (the LCM), then open the door in a safe gap.", m: "lcm", mn: "Multiples and LCM", page: "twist_patrols.html", isNew: 1 },
      { id: "corridor", t: "Laser corridor", d: "Step only on the factors of N, in order.", m: "factors", mn: "Factors", corridor: 1 },
    ] },
    { name: "Prime Hack", when: "Before lock 3: the crew reach the key room", items: [
      { id: "factortree", t: "Factor-tree lock", d: "The key-room door on the weak floor. Split the number with one click per prime until every branch is prime; the door slides open. L3 writes the key with powers (2² × 3 × 5).", m: "pfact", mn: "Prime factorisation", page: "twist_factortree.html", isNew: 1 },
    ] },
    { name: "Finale", when: "How it ends", items: [
      { id: "blackout", t: "Server blackout", d: "Lights out: shut down the prime servers by torchlight. Opens Prime Hack with the blackout set as this run's finale; SKIP (teacher mode) cracks the locks fast.", m: "primes", mn: "Primes", link: `<a href="prime_hack.html?finale=blackout">Open Prime Hack</a><small>title-screen level</small>` },
      { id: "getaway", t: "Getaway chase", d: "The tracking-map getaway. Opens Prime Hack with the getaway as this run's finale.", m: "pfact", mn: "Story", link: `<a href="prime_hack.html?finale=getaway">Open Prime Hack</a><small>title-screen level</small>` },
    ] },
    { name: "Saved for other heists", when: "Not in the bank rotation", items: [
      { id: "primefloor", t: "Fake floor", d: "Parked (round 12). Four floor numbers: prove the real ones with a factor pair; the prime one is the fake. Its slot will become the corrupted-blueprint array puzzle.", m: "primes", mn: "Primes and factor pairs", page: "twist_primefloor.html", isNew: 1 },
      { id: "cluelock", t: "Product-and-clue lock", d: "The product of two primes plus a clue (their sum, difference or range).", m: "primes", mn: "Primes and products", page: "twist_cluelock.html", other: 1 },
    ] },
  ];
  // Teacher tools switch, so SKIP can be turned on from here
  const PN = window.Primenet, teach = document.getElementById("teach");
  function paintTeach(){
    if(PN && PN.isTeacher()){
      teach.innerHTML = `<b>TEACHER TOOLS ON</b><span>Every task shows TEST and SKIP ▸ buttons (bottom left). SKIP, or Ctrl + Shift + K, plays the current step for you.</span><button class="pn-btn small" type="button" id="tLock">Turn off</button>`;
      teach.querySelector("#tLock").addEventListener("click", () => { PN.lockTeacher(); paintTeach(); });
    } else {
      teach.innerHTML = `<b>TEACHER TOOLS</b><span>Enter the teacher PIN to show SKIP on every task.</span><form id="tForm" style="display:flex;gap:8px;align-items:center"><label for="tPin" style="position:absolute;left:-9999px">Teacher PIN</label><input class="pn-input" id="tPin" type="password" inputmode="numeric" maxlength="8"><button class="pn-btn small primary" type="submit">Unlock</button></form><span class="err" id="tErr" aria-live="polite"></span>`;
      teach.querySelector("#tForm").addEventListener("submit", e => { e.preventDefault(); if(PN && PN.unlockTeacher(teach.querySelector("#tPin").value)) paintTeach(); else teach.querySelector("#tErr").textContent = "That PIN isn't right."; });
    }
  }
  paintTeach();
  // Round 12: a switch to make missions use the prototypes (and add the corrupted blueprint to the rotation)
  if(PN && PN.setTwistProtos){
    const sw = document.createElement("label");
    sw.className = "pn-panel"; sw.style.cssText = "display:flex;gap:10px;align-items:center;padding:10px 14px;margin:0 0 14px;font-size:15px;cursor:pointer";
    sw.innerHTML = `<input type="checkbox" id="protoSw" ${PN.twistProtos() ? "checked" : ""} style="accent-color:var(--warning);width:18px;height:18px"> <span><b>Use the round 12 prototypes in missions.</b> Twists in a mission open the new versions, and the corrupted blueprint joins the Factor Vault rotation.</span>`;
    teach.after(sw);
    sw.querySelector("input").addEventListener("change", e => PN.setTwistProtos(e.target.checked));
  }
  const box = document.getElementById("points");
  POINTS.forEach(pt => {
    const sec = document.createElement("section"); sec.className = "point";
    sec.innerHTML = `<h2>${pt.name}</h2><p>${pt.when}</p><div class="cards"></div>`;
    pt.items.forEach(it => {
      const go = it.page ? lv(it.page) : it.corridor ? ["L1", "L2", "L3"].map(l => { const n = CORR[l][Math.floor(Math.random() * 4)]; return `<a href="laser_corridor.html?n=${n}">${l} · N=${n}</a>`; }).join("") : it.link;
      sec.querySelector(".cards").insertAdjacentHTML("beforeend", `<article class="pn-panel card" style="--c:${C[it.m]}">
        <div class="row"><h3>${it.t}</h3><span class="pill ${it.isNew ? "new" : "old"}">${it.isNew ? "NEW" : "IN THE GAME"}</span></div>${!it.other && PN && PN.twistOn && !PN.twistOn(it.id) ? '<span class="pill" style="color:#ff6b6b;border-color:#ff6b6b;align-self:flex-start">OFF IN TEACHER CONTROLS</span>' : ""}
        <p>${it.d}</p><span class="m">${it.mn}</span><div class="go">${go}</div></article>`);
    });
    box.appendChild(sec);
  });
})();
</script>
</body>
</html>
